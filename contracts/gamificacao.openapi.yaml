      - xp
      - nivel
      - xp_para_proximo
      - sequencia
      - cristais
      - missoes
      - celebracoes_pendentes
      type: object
    MissaoEmAndamento:
      properties:
        slug:
          type: string
        cadencia:
          enum:
          - diaria
          - semanal
          - dupla
          type: string
        categoria:
          enum:
          - criar
          - aprender
          - ajudar
          - polir
          - mostrar
          type: string
        progresso:
          type: integer
        meta:
          type: integer
        cumprida:
          type: boolean
      required:
      - slug
      - cadencia
      - categoria
      - progresso
      - meta
      - cumprida
      type: object
    Sequencia:
      properties:
        semanas:
          type: integer
        dias_da_semana:
          type: integer
        meta:
          type: integer
        escudos:
          type: integer
      required:
      - semanas
      - dias_da_semana
      - meta
      - escudos
      type: object
    InterruptorDaEconomia:
      properties:
        slug:
          type: string
        evento_gatilho:
          type: string
        beneficiario:
          enum:
          - ator
          - autor_do_alvo
          type: string
        pontos:
          type: integer
        cristais:
          type: integer
        acoes_cheias_por_dia:
          type: integer
        quarentena_horas:
          type: integer
        ativa:
          type: boolean
        versao:
          type: integer
        vigente_desde:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        impedimentos:
          items:
            enum:
            - sem-produtor
            - sem-credito
            - cristais-sem-efeito
            type: string
          type: array
      required:
      - slug
      - evento_gatilho
      - beneficiario
      - pontos
      - cristais
      - acoes_cheias_por_dia
      - quarentena_horas
      - ativa
      - versao
      - vigente_desde
      - impedimentos
      type: object
    PedidoDeInterruptor:
      properties:
        ativa:
          type: boolean
      required:
      - ativa
      type: object
    InterruptorDeConquista:
      properties:
        slug:
          type: string
        nome:
          type: string
        descricao:
          type: string
        classe:
          enum:
          - medalha
          - marco
          type: string
        familia:
          enum:
          - oficio
          - comunidade
          - epoca
          - secreta
          - carreira
          - espelho
          type: string
        pontos:
          type: integer
        cristais:
          type: integer
        envolve_dinheiro:
          type: boolean
        exige_validador_da_equipe:
          type: boolean
        ativa:
          type: boolean
        versao:
          type: integer
        impedimentos:
          items:
            enum:
            - sem-motor-de-criterio
            - sem-fato-que-alimenta
            - so-por-concessao-manual
            type: string
          type: array
      required:
      - slug
      - nome
      - descricao
      - classe
      - familia
      - pontos
      - cristais
      - envolve_dinheiro
      - exige_validador_da_equipe
      - ativa
      - versao
