# =============================================================================
# CONTRATO DA CÉLULA `gamificacao` — a porta de MÁQUINA do Sistema de Formação
# de Criadores (XP, níveis, Sequência, missões, Cristais, celebrações).
#
# CONGELADO EM 30/08/2026, na Sessão B (Rito de Contrato, RITOS.md §3), com o
# mantenedor presente. Mudar este arquivo é o mesmo rito: PR só de `contracts/`,
# etiqueta `contrato`, provedor primeiro, consumidores em PRs seguintes. O
# portão que faz valer é `ci/contract_freeze.py`.
#
# EMENDA DE 01/09/2026 (Rito de Contrato, com o mantenedor presente): entraram
# `listAchievementSwitches` e `setAchievementSwitch`, o segundo interruptor da
# tela dele. Crescimento puro — nenhuma operação, campo ou nome mudou, e por
# isso nenhum consumidor precisa migrar.
#
# EMENDA DE 02/09/2026 (Rito de Contrato, com o mantenedor presente): entraram
# `listLevelSwitches` e `setLevelSwitch`, o TERCEIRO interruptor da tela dele, e
# o único que não paga nada. Crescimento puro, como o anterior: nenhuma
# operação, campo ou nome mudou, e nenhum consumidor precisa migrar.
#
# EMENDA DE 03/09/2026 (Rito de Contrato, com o mantenedor presente): entrou
# `listStudentStandings`, o quadro de pontos que a tela nova em
# `/admin/escola/` desenha — a turma ordenada por XP, com nível, última
# atividade e as conquistas de cada aluno. Crescimento puro, como as três
# emendas anteriores: nenhuma operação, campo ou nome mudou.
#
# ESTA É A PRIMEIRA EMENDA QUE FURA UM INVARIANTE DOS TRÊS ORIGINAIS — o 2
# ("nunca sai XP bruto de outra pessoa"), e por escrito: a exceção é do MESMO
# formato já aceito para o invariante 3 nas três emendas anteriores (`nome` e
# `descricao` das conquistas e dos degraus). `listStudentStandings` serve só o
# bastidor do mantenedor — quem autoriza quem chega até ela é a célula `admin`,
# sobre a lista DELA, o mesmo desenho de `/economia/*`. A frase que continua
# verdadeira, e que a emenda não toca, é a que fala de ALUNO: nenhuma operação
# que um aluno alcança devolve XP de terceiro. Ver a descrição da própria
# operação, abaixo, para o argumento completo.
#
# O INVARIANTE 1 CONTINUA INTEIRO NESTA EMENDA, e por desenho: a operação nova
# devolve `pessoa_id` (id opaco), números e slugs de conquista — nunca e-mail,
# nunca o `titulo` nem o `nome` de uma conquista em português. Quem consome
# (a `admin`) já tem esse texto pronto de `listLevelSwitches` e
# `listAchievementSwitches`, que ela já chama para a tela de economia; casar
# número/slug com a frase em português é trabalho DELA, não desta porta — a
# mesma disciplina que evita o mesmo fato em dois lugares.
#
# COMO ELE NASCEU: em 01/09/2026 o mantenedor abriu `/conquistas` e leu, uma
# embaixo da outra, "Nível 1", "você chegou ao último degrau desta escada" e "0
# de experiência até aqui". O defeito da TELA foi corrigido (`armadilhas/271`),
# e o que sobrou foi a verdade: a escola nunca ligou degrau nenhum, e não havia
# por onde ligar. Havia botão para as regras e para as conquistas; para a
# escada, nada.
#
# AS DUAS PERGUNTAS QUE ESTE RITO RESPONDEU, as duas de produto:
#
#   1. *Ligar um degrau reconhece quem já tem o XP dele?* SIM, e aqui a resposta
#      é quase forçada pela natureza da coisa: degrau não paga, é a RÉGUA com
#      que o XP já existente é lido. Ligar o degrau 2 não cria um ponto sequer,
#      só passa a chamar de "Aprendiz de Ateliê" quem já tinha 50. Por isso,
#      como nas conquistas, não há `vigente_desde` nestas duas operações.
#   2. *Ligar um degrau recalcula o nível gravado de todo mundo?* NÃO.
#      `PerfilJogador.nivel` é desnormalizado e quem o reescreve é o motor, na
#      próxima vez que o XP daquela pessoa mexer. Varrer a escola num clique
#      mandaria uma chuva de cartas "você subiu de nível" para gente que não fez
#      nada naquele dia; o acerto em massa é `reconciliar_perfis`, que é comando
#      e não botão.
#
# `titulo` e `titulo_feminino` VIAJAM, pela mesma exceção declarada nas
# conquistas: estas operações servem a tela do MANTENEDOR, que é bastidor, e o
# título de um degrau é dado que ele edita. O que o ALUNO lê continua saindo de
# `getMyStatus` e da tela da própria célula.
#
# A PERGUNTA QUE O RITO RESPONDEU não foi a forma da porta (ela é gêmea da dos
# interruptores de regra), e sim uma de PRODUTO: *ligar uma conquista reconhece
# quem já cumpriu o critério antes?* A resposta dele foi SIM, com o custo dito
# na hora — no dia de ligar, um punhado de medalhas sai de uma vez, com os
# pontos delas. É por isso que estas duas operações não têm `vigente_desde`: nas
# regras de pontuação aquele carimbo impede pagar o passado; aqui ele impediria
# a "Primeira obra" de quem já fez a primeira obra, e ninguém faz duas estreias.
#
# LEI DO ASSUNTO: `docs/decisoes/DECISAO-gamificacao.md`.
# PLANO: `docs/decisoes/PLANO-CELULA-GAMIFICACAO.md` §4 (eventos e contrato).
#
# ORDEM DA ESCADA — leia antes de "consertar" alguma coisa aqui: este contrato
# foi congelado no PR 4 da escada do §6, e a IMPLEMENTAÇÃO dele é o PR 16 (a
# porta de máquina: `config/api.py`, `export_openapi`, testes de 401 em todas as
# operações). É contrato-primeiro deliberado: as duas operações abaixo são o que
# o fórum e o funil vão consumir, e escrevê-las antes do motor é o que impede a
# célula de nascer com uma superfície improvisada. Enquanto o PR 16 não chega, a
# linha desta célula em `ci/manifesto-de-contratos.json` guarda o motivo por
# escrito — ela não pode ser `freeze: required` antes de existir o que exportar.
#
# AS TRÊS INVARIANTES QUE ATRAVESSAM TODAS AS OPERAÇÕES:
#
#   1. NUNCA SAI E-MAIL, NUNCA SAI TEXTO DE PESSOA. Só id opaco, número e slug.
#      A razão escrita aqui já foi *"o público desta escola é majoritariamente
#      menor de idade"*, e ela MORREU em 30/08/2026: a escola é 18+
#      (`DECISAO-gamificacao.md` §9, emendado). A regra não mudou uma vírgula, e
#      a razão que fica é mais simples: e-mail é dado pessoal de adulto também, e
#      uma porta de máquina que o entrega o entrega para sempre. A frase saiu no
#      Rito de 31/08/2026, com o mantenedor presente — a dívida que o §9 da lei
#      deixou anotada de propósito. (A outra dívida da mesma emenda, o *"nunca em
#      horário escolar"* de `contracts/eventos/notificacao.devida.v1.json`, saiu
#      antes, no Rito que trouxe `jornada.passo`.) A MESMA frase morta continua
#      em `contracts/forum.openapi.yaml` e em
#      `contracts/eventos/forum.topico-criado.v1.json`: é dívida do `forum`, sai
#      no próximo Rito DELE, e não se corrige de carona daqui.
#   2. NUNCA SAI XP BRUTO DE OUTRA PESSOA — PARA UM ALUNO. `getPublicProfiles`
#      devolve nível e título; quem quiser XP vê o PRÓPRIO, em `getMyStatus`.
#      Placar de XP entre alunos não existe nesta plataforma, e a porta é onde
#      isso fica mecânico. `listStudentStandings` (Emenda de 03/09/2026) é
#      exceção declarada, do mesmo formato da do invariante 3 abaixo: serve só
#      o bastidor do mantenedor, nunca um aluno.
#   3. SLUG, NUNCA FRASE PRONTA. O site serve três idiomas: gravar ou transmitir
#      "Modelador" congela o idioma de quem escreveu. Quem lê traduz o slug — a
#      mesma lição que `contracts/eventos/notificacao.devida.v1.json` já carrega
#      ("os dados da frase, nunca a frase").
#
# DECISÃO B DA SESSÃO B — ESTÁ AQUI PARA VOCÊ NÃO "CONSERTAR":
# a etiqueta do aluno é visível para TODO MUNDO, inclusive visitante não logado.
# Por isso `getPublicProfiles` responde a chamador SEM SESSÃO DE PESSOA (o
# Bearer do par continua obrigatório — ele prova QUEM CHAMA, nunca quem é a
# pessoa). Hoje isso não expõe aluno nenhum, porque a única área pública do
# fórum é a de avisos e só a escola publica nela; a decisão existe para o dia em
# que houver área pública com post de aluno. Não é descuido, é decisão do
# mantenedor em 30/08/2026.
#
# OS INTERRUPTORES DA ECONOMIA (Rito de Contrato de 31/08/2026, com o mantenedor
# presente) — `listEconomySwitches` e `setEconomySwitch`.
#
# Elas existem para que o critério de morte nº 5 da lei NÃO aconteça: *"ajustar a
# economia passar a exigir PR de código"* obriga a parar e reabrir a decisão. A
# economia inteira nasce `ativa=False` (`semear_economia`), e até aqui ligar uma
# regra significava um agente editar o semeador e esperar um deploy — ou seja, a
# economia era código com aparência de dado. Estas duas operações são o que torna
# a §10.5 verdade: `UPDATE` + versão + data, pela tela do mantenedor.
#
# QUEM AUTORIZA NÃO É ESTA PORTA, e a distinção é invariante da plataforma. Esta
# célula não assina sessão ([INV-P12]) e o `papel` que a `identidade` devolve
# NUNCA autoriza rota ("reconhecer não é autorizar", `DECISAO-onde-mora-a-sessao`
# §4). Aqui fecha o Bearer do par; quem confere que é o mantenedor é a `admin`,
# sobre a lista DELA — o mesmo desenho de `/admin/menu/`, que lê e grava o menu
# no `catalogo` sem guardar cópia.
#
# `impedimentos` MERECE A LEITURA antes de alguém "simplificar" o schema: uma
# regra pode estar ligada e ainda assim não fazer número nenhum se mexer, e sem
# este campo a tela mostraria um zero que parece defeito dela. Os três motivos
# são fatos da célula, não opinião: `sem-produtor` (ninguém publica o assunto),
# `sem-credito` (chega, mas esta célula não sabe de quem é o ponto — hoje o quiz,
# que identifica por e-mail) e `cristais-sem-efeito` (a regra promete Cristais e
# o motor não os credita, porque `MovimentoDeCristais.Origem` é vocabulário
# FECHADO e mexer nele é mexer no que o [INV-GAM1] protege).
#
# ENDEREÇO — divergência conhecida, registrada de propósito: o §4 do plano (e o
# despacho da Sessão B) escreve as operações como `/api/gamificacao/perfis` e
# `/api/gamificacao/eu`, e é isso que está congelado abaixo (`servers` + `paths`,
# o mesmo formato de `alunos`, `catalogo` e `notificacoes`). O comentário de
# `services/gamificacao/config/urls.py`, escrito na gênese, previa a porta em
# `/interno/` (o formato de `identidade` e `forum`). Quem implementar o PR 16
# segue ESTE arquivo — mudar o endereço depois é Rito de Contrato, não
# preferência de sessão.
# =============================================================================
openapi: 3.1.0
info:
  title: Gamificacao — API interna
  version: 1.0.0
  description: 'Superficie de MAQUINA do Sistema de Formacao de Criadores.

    Existe para que o resto da plataforma dependa do CONTRATO e nunca do

    motor de XP: quem consome le nivel, titulo e sequencia por aqui, e o

    motor por baixo pode ser trocado sem ninguem do outro lado saber.


    Lei do assunto: docs/decisoes/DECISAO-gamificacao.md.


    NADA DE DADO PESSOAL SAI POR AQUI: nem e-mail, nem nome, nem texto

    escrito por aluno. So id opaco, numero e slug. E-mail e dado pessoal de

    adulto tambem, e uma porta de maquina que o entrega o entrega para

    sempre.


    E NADA DE XP DE TERCEIRO PARA UM ALUNO: `getPublicProfiles` devolve

    nivel e titulo; XP so aparece em `getMyStatus`, e so o proprio. Placar

    de XP entre alunos nao existe nesta plataforma. `listStudentStandings`

    e excecao declarada: serve so o bastidor do mantenedor, nunca um aluno.

    '
paths:
  /perfis:
    get:
      operationId: getPublicProfiles
      summary: A etiqueta publica de varios alunos de uma vez
      parameters:
      - in: query
        name: ids
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/PerfilPublico'
                type: object
      description: 'A etiqueta que o forum estampa ao lado do nome do autor: "Nv 7 ·

        Modelador". Decisao do mantenedor na Sessao B de 30/08/2026 — NIVEL +

        TITULO, e mais nada. Moldura NAO entra nesta porta (o plano previa; a

        Sessao B decidiu que nao), e XP bruto de outra pessoa nunca sai daqui.


        `ids` e uma lista separada por virgula de ids OPACOS de pessoa, ate 50

        por chamada. E lote porque uma pagina de forum decora N autores: uma

        chamada por autor faria a tela do forum depender da latencia desta

        celula N vezes.


        Id desconhecido e OMITIDO do mapa, nunca vira erro e nunca vira linha

        vazia. Quem chama trata ausencia como "sem etiqueta" e desenha a tela

        igual — a falha desta porta e ABERTA por contrato: pagina sem selo,

        nunca pagina quebrada.


        RESPONDE A CHAMADOR SEM SESSAO DE PESSOA, de proposito (decisao B da

        Sessao B): a etiqueta e visivel para todo mundo, inclusive visitante

        nao logado. O Bearer do par continua obrigatorio — ele prova QUEM

        CHAMA, nunca quem e a pessoa.'
  /eu:
    get:
      operationId: getMyStatus
      summary: 'O proprio painel do aluno: XP, nivel, sequencia, missoes'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeuStatus'
      description: 'O estado do DONO DA SESSAO — nunca de outra pessoa. Resolve o cookie

        opaco repassado pelo chamador, do mesmo jeito que `getSession` da

        identidade: o cookie nao aparece como parametro porque quem o le e a

        camada de sessao, nao a assinatura da operacao.


        200 SEMPRE, inclusive para visitante: `autenticado: false` com os

        numeros em null e as listas vazias. Visitante nao e erro — obrigar o

        consumidor a traduzir 401 em "ninguem logado" e como o widget da home

        acabaria mostrando tela de erro para quem so nao entrou ainda.


        XP e nivel sao os numeros DESNORMALIZADOS do perfil; a fonte da

        verdade e o ledger, e quem prova que a copia nao mentiu e o comando

        `reconciliar_perfis` da propria celula, nunca esta porta.'
  /economia/regras:
    get:
      operationId: listEconomySwitches
      summary: Todas as regras de pontuacao, ligadas e desligadas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InterruptorDaEconomia'
                type: array
      description: 'A lista que a tela do mantenedor desenha. Devolve TODAS as regras
        do

        site — ligadas e desligadas — porque a tela precisa mostrar o que ele

        PODE ligar, nao so o que ja esta valendo.


        `impedimentos` e o campo que evita uma frustracao concreta: uma regra

        pode estar perfeitamente ligada e ainda assim nao fazer numero nenhum

        se mexer. `sem-produtor` = ninguem publica esse acontecimento ainda;

        `sem-credito` = ele chega mas esta celula nao sabe de quem e o ponto;

        `cristais-sem-efeito` = a regra promete Cristais e o motor nao os

        credita (o vocabulario de origens e fechado, [INV-GAM1]). Lista vazia

        significa que ligar vai funcionar.


        SLUG, NUNCA FRASE PRONTA (invariante 3 desta porta): daqui saem slugs e

        numeros. Quem escreve a frase em portugues e a tela que mostra.'
  /economia/regras/{slug}:
    post:
      operationId: setEconomySwitch
      summary: Liga ou desliga UMA regra de pontuacao
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptorDaEconomia'
      description: 'O gesto que a lei §10.5 exige que exista: ajustar a economia e UPDATE

        mais versao, anunciado e nunca retroativo — nunca um PR de codigo.


        LIGAR faz TRES coisas de uma vez, e as tres importam: marca `ativa`,

        soma 1 na `versao` (o motor grava a versao dentro de cada lancamento,

        entao mudar a economia amanha nao reescreve o passado) e carimba

        `vigente_desde` com o instante de agora. Esse carimbo E o mecanismo do

        ''nunca retroativo'': o motor compara a data com o instante do FATO, e um

        evento antigo reentregue depois do clique nao paga.


        Ligar de novo REDEFINE a data — desligar e religar nao paga a janela em

        que a regra esteve desligada. Chamada que nao muda nada devolve a linha

        como esta, sem gastar versao: dois cliques no mesmo botao nao inflam o

        historico com mudancas que ninguem fez.


        Slug desconhecido responde 404. Aqui a falha e FECHADA, ao contrario

        das operacoes de leitura desta porta: inventar em silencio qual regra o

        mantenedor quis ligar seria pior que recusar.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeInterruptor'
        required: true
  /economia/conquistas:
    get:
      operationId: listAchievementSwitches
      summary: Todas as medalhas e marcos, ligados e desligados
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InterruptorDeConquista'
                type: array
      description: 'A segunda metade da tela do mantenedor. Devolve TODAS as conquistas
        do

        site, com os MARCOS primeiro: a hierarquia da lei e

        Realidade > Criacao > Maestria > Comunidade > XP, e uma tela que lista o

        andaime acima da espinha ensina a ordem errada a quem a le todo dia.


        `nome` e `descricao` VIAJAM AQUI, e isto e uma excecao declarada ao

        invariante 3 desta porta (''slug, nunca frase pronta''). A razao: estas

        duas operacoes servem a tela do MANTENEDOR, que e bastidor e nao

        vitrine, e o texto de uma conquista e dado que ele proprio edita, nao

        frase de interface que precise existir em tres idiomas. As operacoes

        que servem o ALUNO continuam devolvendo so slug e numero.


        `impedimentos` avisa antes do clique quando ligar nao vai adiantar:

        `sem-motor-de-criterio` = a conta automatica das medalhas ainda nao

        existe; `sem-fato-que-alimenta` = nada no site produz o numero que o

        criterio conta; `so-por-concessao-manual` = a medalha so sai pela mao da

        equipe. MARCO nunca tem impedimento: ele nao depende de conta, e sim de

        alguem mandar a prova e a equipe conferir.'
  /economia/conquistas/{slug}:
    post:
      operationId: setAchievementSwitch
      summary: Liga ou desliga UMA medalha ou marco
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptorDeConquista'
      description: 'Ligar um MARCO faz ele aparecer na trilha do aluno, que manda a
        prova e

        espera a equipe conferir. Ligar uma MEDALHA faz a escola passar a

        conceder sozinha quando a conta bater.


        NAO HA `vigente_desde` AQUI, e a ausencia e a decisao do mantenedor no

        Rito de 01/09/2026: ligar uma conquista RECONHECE quem ja cumpriu o

        criterio antes. O carimbo de data e o mecanismo do ''nunca retroativo''

        das regras de pontuacao, onde pagar o passado inflaria o placar de quem

        nao fez nada novo; aqui ele seria o mecanismo de negar a ''Primeira obra''

        a quem ja fez a primeira obra, e ninguem faz duas estreias.


        `versao` sobe quando algo muda, e chamada que nao muda nada devolve a

        linha como esta, sem gastar versao: dois cliques no mesmo botao nao

        inflam o historico com mudancas que ninguem fez.


        Slug desconhecido responde 404, como o interruptor das regras: inventar

        em silencio qual conquista o mantenedor quis ligar seria pior que

        recusar.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeInterruptor'
        required: true
  /economia/degraus:
    get:
      operationId: listLevelSwitches
      summary: Todos os degraus da escada, ligados e desligados
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InterruptorDeDegrau'
                type: array
      description: 'A terceira metade da tela do mantenedor, e a que faltava: sem
        nenhum

        degrau ligado a pagina do aluno nao tem escada para mostrar, e diz

        isso.


        Devolve TODOS os degraus do site, do primeiro ao ultimo, porque a tela

        precisa mostrar o que ele PODE ligar. `titulo` e `titulo_feminino`

        viajam pela mesma excecao declarada nas conquistas: eles servem a tela

        do MANTENEDOR, que e bastidor, e sao dado que ele edita. O que o ALUNO

        le continua saindo de `getMyStatus` e da tela da propria celula.


        `impedimentos` avisa antes do clique quando ligar nao vai adiantar:

        `escada-de-um-degrau-so` = com este degrau a escada teria menos de

        dois, e um degrau sozinho nao e escada (a tela do aluno diz que o

        seguinte ainda nao abriu); `sem-regra-que-paga` = nenhuma regra de

        pontuacao esta ligada neste site, entao a barra existe e nunca anda.'
  /economia/degraus/{nivel}:
    post:
      operationId: setLevelSwitch
      summary: Liga ou desliga UM degrau da escada
      parameters:
      - in: path
        name: nivel
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptorDeDegrau'
      description: 'Ligar um degrau faz a escola passar a chamar por ele quem ja tem
        o XP

        que ele pede. NENHUM ponto e criado: o degrau e a regua, nao o

        pagamento. Por isso nao ha `vigente_desde` aqui, pela mesma razao das

        conquistas.


        NAO RECALCULA PERFIL, e a ausencia e decisao: `PerfilJogador.nivel` e

        desnormalizado e quem o reescreve e o motor, na proxima vez que o XP

        daquela pessoa mexer. Varrer a escola num clique mandaria uma chuva de

        cartas ''voce subiu de nivel'' para quem nao fez nada hoje; o acerto em

        massa e o comando `reconciliar_perfis`.


        `versao` sobe quando algo muda, e chamada que nao muda nada devolve a

        linha como esta, sem gastar versao.


        Numero de degrau que nao existe responde 404, como os outros dois

        interruptores: inventar em silencio qual degrau o mantenedor quis

        ligar seria pior que recusar.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeInterruptor'
        required: true
  /quadro:
    get:
      operationId: listStudentStandings
      summary: 'A escola inteira, aluno por aluno: pontos, atividade e conquistas'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AlunoDoQuadro'
                type: array
      description: 'O quadro que a tela do mantenedor em /admin/escola/ desenha: a turma

        ordenada por XP, com nivel, ultima atividade e as conquistas de cada um.


        EXCECAO DECLARADA AO INVARIANTE 2 DESTA PORTA (''nunca sai XP bruto de

        outra pessoa''), do mesmo formato ja aceito nos tres interruptores da

        economia para o invariante 3: esta operacao serve SO o bastidor do

        mantenedor, e quem autoriza quem chega ate aqui e a celula admin, sobre a

        lista DELA — o Bearer do par prova so QUEM CHAMA. ''Placar de XP entre

        ALUNOS nao existe nesta plataforma'' continua verdade: nenhuma operacao

        que um aluno alcanca devolve isto.


        SO QUEM JA TEM PERFIL aparece na lista — PerfilJogador e preguicoso (Lei

        7) e nasce no primeiro XP. Aluno sem nenhum ponto simplesmente nao esta

        no mapa; quem chama trata ausencia como zero, nao como erro.


        Devolve TODOS os perfis do site, sem paginacao, como os tres

        interruptores da economia — e pelo mesmo motivo: a tela precisa da

        escola inteira para ordenar por pontos e apontar quem parou.


        NAO HA `titulo_slug` nem `nome` de conquista aqui, e a ausencia e

        decisao: o invariante 1 (''nunca sai e-mail, nunca sai texto de pessoa'')

        continua inteiro. A admin ja tem o texto em portugues de

        listLevelSwitches e listAchievementSwitches — casar `nivel`/`slug` com a

        frase e trabalho dela, nao desta porta.


        `concessoes` IGNORA `consentimento` de proposito: aquele campo governa

        exposicao ENTRE PARES (Meu Estudio, a turma), nao visibilidade para o

        operador da escola, que ja enxerga o aluno inteiro por outras portas.'
components:
  schemas:
    PerfilPublico:
      properties:
        nivel:
          type: integer
        titulo_slug:
          type: string
      required:
      - nivel
      - titulo_slug
      type: object
    CelebracaoPendente:
      properties:
        tipo:
          enum:
          - nivel-alcancado
          - conquista-concedida
          - marco-validado
          - destaque-da-semana
          type: string
        referencia:
          type: string
      required:
      - tipo
      - referencia
      type: object
    MeuStatus:
      properties:
        autenticado:
          type: boolean
        xp:
          anyOf:
          - type: integer
          - type: 'null'
        nivel:
          anyOf:
          - type: integer
          - type: 'null'
        xp_para_proximo:
          anyOf:
          - type: integer
          - type: 'null'
        sequencia:
          anyOf:
          - $ref: '#/components/schemas/Sequencia'
          - type: 'null'
        cristais:
          anyOf:
          - type: integer
          - type: 'null'
        missoes:
