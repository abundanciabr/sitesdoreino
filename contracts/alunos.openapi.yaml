openapi: 3.1.0
info:
  title: Alunos API
  version: 1.0.0
  description: |
    Matrícula e acesso. O caminho NORMAL de matrícula é o evento pagamento.aprovado.v1
    (consumer da célula). Esta API interna existe para reprocesso manual e consulta —
    e é idempotente pelas mesmas chaves do consumer (INV-P5).
servers:
  - url: http://alunos:8000/api/alunos
security:
  - bearerAuth: []
paths:
  /matriculas:
    get:
      operationId: listAllEnrollments
      summary: Quem ja e aluno — a lista, para o painel administrativo
      description: |
        A porta da GESTAO DE ALUNOS (`docs/decisoes/DECISAO-gestao-de-alunos.md`).
        Ate 28/08/2026 nao existia, em lugar nenhum, como listar quem e aluno: a
        celula so sabia responder sobre UM e-mail por vez. Era por isso que os
        contadores de alunos do painel mostravam traco.

        NAO devolve quem esta na fila (`aguardando`/`recusada`) — para esses
        existe `GET /pre-matriculas`. Duas perguntas diferentes, duas portas.

        `site_id` opcional: ausente = todas as escolas, e cada linha diz de qual
        veio. O painel do dono e plataforma-inteira (Lei 9).

        PII: devolve o WhatsApp, e continua sendo PORTA DE PAINEL — a mesma
        familia de `GET /pre-matriculas`. A lei da fila §5 diz que o numero sai
        "por uma porta so, a do painel administrativo"; estas duas SAO essa
        porta. Segue proibido em `GET /alunos/{email}/matriculas` e em evento.
      parameters:
        - name: site_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Ausente = todos os estados de gestao (nao os da fila).
          schema: { type: string, enum: [ativa, suspensa, encerrada, reembolsada] }
      responses:
        '200':
          description: Os alunos, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, site_id, email, nome_completo, whatsapp, turma, comprou_em, status, origem, criada_em]
                  properties:
                    id: { type: string }
                    site_id: { type: string }
                    email: { type: string, format: email }
                    nome_completo: { type: string }
                    whatsapp: { type: string }
                    turma: { type: [string, 'null'] }
                    comprou_em: { type: [string, 'null'], format: date }
                    status: { type: string, enum: [ativa, suspensa, encerrada, reembolsada] }
                    origem:
                      type: string
                      enum: [comprou, liberado]
                      description: |
                        DERIVADO da proveniencia da linha, nunca de um campo proprio:
                        `liberado` e quem entrou pela fila (o pedido sintetico `pre:`),
                        `comprou` e o resto. Sai como palavra e nao como o numero do
                        pedido — o numero e do provedor de pagamento e nao diz nada a
                        quem le a tela.
                    criada_em: { type: string, format: date-time }
                    virou_aluno_em:
                      type: [string, 'null']
                      format: date-time
                      description: |
                        Quando a pessoa VIROU ALUNA. Para quem entrou pela fila (`liberado`) e o
                        instante da liberacao; para quem comprou, o instante em que o pagamento
                        confirmou a matricula (`criada_em`). Nasceu em 03/09/2026, no Rito de
                        Contrato do placar do painel de gestao: a meta do mantenedor passou a ser
                        "quantas pessoas compraram neste mes", e a data que conta e ESTA, nunca
                        `comprou_em` (que a propria pessoa digita, opcional, pista de conferencia).
                        Nulo so quando a linha nao tem nenhuma das duas, o que hoje nao acontece.
    post:
      operationId: createEnrollment
      summary: Matrícula manual/reprocesso — idempotente por order_id (INV-P5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_id, order_id, product_id, customer]
              properties:
                site_id: { type: string }
                order_id: { type: string }
                product_id: { type: string }
                customer:
                  type: object
                  required: [email, name]
                  properties:
                    email: { type: string, format: email }
                    name: { type: string }
      responses:
        '201': { description: Matrícula criada }
        '200': { description: Replay idempotente — matrícula deste order_id já existia }
        '422': { description: Payload inválido }
  /alunos/{email}/matriculas:
    get:
      operationId: listEnrollments
      summary: Matrículas de um aluno (suporte/E2E)
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Lista de matrículas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [site_id, order_id, product_id, status, enrolled_at]
                  properties:
                    site_id: { type: string }
                    order_id: { type: string }
                    product_id: { type: string }
                    status:
                      type: string
                      enum: [ativa]
                      description: |
                        SO os status que VALEM como acesso, e hoje ha um so.
                        `suspensa` saiu em 28/08/2026 (DECISAO-gestao-de-alunos §2):
                        passou a significar "acesso pausado pelo mantenedor".
                        `reembolsada` saiu em 31/08/2026
                        (DECISAO-reembolso-tira-o-acesso), quando o mantenedor
                        REVERTEU a decisao dele de 24/08 ("quem ja foi aluno mantem
                        a voz"): reembolso passou a significar a compra desfeita, e
                        quem recebeu o dinheiro de volta nao entra mais em nada.

                        A LISTA ENCOLHEU, e o encolhimento e o ponto: um consumidor
                        que ja tratava `reembolsada` continua compilando e apenas
                        nunca mais recebe esse valor. Nenhum consumidor precisa
                        mudar por causa desta porta — mas quem DERIVAVA acesso dela
                        passa a excluir o reembolsado automaticamente, que e o
                        efeito desejado.

                        Status novo nasce FORA desta lista: ela e de PERMISSAO, e a
                        celula tem um guarda que reprova quem esquecer de decidir.
                    enrolled_at: { type: string, format: date-time }
        '404': { description: Aluno inexistente }
  /pre-matriculas:
    post:
      operationId: createPreEnrollment
      summary: Alguem pede entrada e fica AGUARDANDO decisao humana
      description: |
        A fila de liberacao (DECISAO-fila-de-liberacao.md). Cria uma Matricula
        com status `aguardando` — que NAO da acesso a nada ate alguem liberar.

        Porta SEPARADA de `POST /matriculas` de proposito: aquela significa
        "alguem pagou" e e chamada pelo fluxo de pagamento. Misturar deixaria o
        caminho do dinheiro capaz de criar linha em espera, e a fila capaz de
        criar matricula paga. Duas intencoes, duas portas.

        Idempotente por (site_id, email): reenviar atualiza os dados e devolve
        200. A pessoa que erra o telefone e reenvia nao vira duas linhas na fila.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_id, email, nome_completo, whatsapp]
              properties:
                site_id: { type: string }
                email: { type: string, format: email }
                nome_completo: { type: string, minLength: 1 }
                whatsapp:
                  type: string
                  description: |
                    Com DDD. PII: mora aqui e so a porta do admin o devolve —
                    nunca `GET /alunos/{email}/matriculas`, nunca evento. Mesma
                    disciplina que DECISAO-EVO-01 §3 deu ao e-mail, decidida
                    nominalmente pelo mantenedor em 27/08/2026.
                comprou_em:
                  type: [string, 'null']
                  format: date
                  description: OPCIONAL — pista de conferencia, nao dado de cadastro.
                turma:
                  type: [string, 'null']
                  description: OPCIONAL — pista de conferencia, nao dado de cadastro.
      responses:
        '201': { description: Entrou na fila }
        '200': { description: Ja estava na fila — dados atualizados }
        '409':
          description: |
            Este e-mail nao entra na fila. DUAS razoes, e elas sao diferentes:

            1. JA TEM matricula que vale — quem ja entra nao precisa de fila.
               A conferencia usa a MESMA consulta que decide acesso, para nao
               existir gente recusada aqui por "voce ja tem" que a Caixa nao
               deixa entrar.
            2. FOI REEMBOLSADO (31/08/2026, DECISAO-reembolso-tira-o-acesso).
               O mantenedor decidiu que quem recebeu o dinheiro de volta nao
               pede para voltar sozinho: quem quiser voltar compra de novo ou
               fala com a escola, e ele religa com um clique. A recusa mora
               AQUI, e nao so na tela que esconde o formulario — regra que so
               existe em HTML e promessa sem mecanismo.

            `encerrada` (ex-aluno) NAO barra, de proposito: ele PODE pedir para
            voltar desde 29/08 (DECISAO-a-ficha-nao-se-apaga §3). A diferenca
            entre os dois e a decisao, nao um descuido.
        '422': { description: Payload invalido }
    get:
      operationId: listPreEnrollments
      summary: A fila — porta do painel administrativo
      description: |
        A UNICA porta que devolve o `whatsapp` (§5 da lei). `esperando_ha_dias`
        vem calculado: uma enxurrada de spam nao pode esconder o aluno de
        verdade que espera ha uma semana.
      parameters:
        - name: site_id
          in: query
          required: false
          description: |
            OPCIONAL desde 28/08/2026 (DECISAO-categorias-de-usuario). Ausente
            = a fila de TODAS as escolas, e cada linha diz de qual veio.
            A plataforma e uma, as lojas sao N (Lei 9): o painel do dono e
            plataforma-inteira, e exigir que ele soubesse o codigo interno de
            uma escola para ver quem espera seria pedir que ele guardasse um
            identificador opaco. Passando o parametro, filtra — o comportamento
            de quem ja chamava assim nao muda.
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [aguardando, recusada], default: aguardando }
      responses:
        '200':
          description: Quem esta na fila
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, site_id, email, nome_completo, whatsapp, status, criada_em, esperando_ha_dias, ja_foi_aluno, passagens_anteriores, saiu_em]
                  properties:
                    id: { type: string }
                    site_id:
                      type: string
                      description: |
                        De qual escola veio este pedido. Passa a vir SEMPRE, e nao
                        so quando a busca e de todas: uma resposta com forma
                        diferente conforme o filtro obriga cada consumidor a
                        tratar dois casos, e o que esquecer trata o campo como
                        ausente em silencio.
                    email: { type: string, format: email }
                    nome_completo: { type: string }
                    whatsapp: { type: string }
                    comprou_em: { type: [string, 'null'], format: date }
                    turma: { type: [string, 'null'] }
                    status: { type: string, enum: [aguardando, recusada] }
                    criada_em: { type: string, format: date-time }
                    esperando_ha_dias: { type: integer, minimum: 0 }
                    motivo_recusa: { type: [string, 'null'] }
                    ja_foi_aluno:
                      type: boolean
                      description: |
                        A pessoa JA TEVE ficha nesta plataforma antes deste pedido
                        (`DECISAO-a-ficha-nao-se-apaga.md` §3). Nasce em 29/08/2026,
                        no dia em que ex-aluno voltou a poder pedir entrada.

                        CALCULADO pela celula, e nunca gravado: e a existencia de
                        outra ficha com o mesmo e-mail, olhada na hora. Um campo
                        gravado seria um segundo lugar guardando o que as fichas ja
                        dizem, e os dois discordariam no primeiro backfill.

                        Para que serve, em uma frase: sem ele, o mantenedor decide
                        sobre um ex-aluno achando que e gente nova — que e
                        exatamente o erro que a fila existe para nao cometer.
                    passagens_anteriores:
                      type: integer
                      minimum: 0
                      description: |
                        Quantas fichas anteriores esta pessoa tem (0 quando e a
                        primeira vez). Nao e o mesmo que `ja_foi_aluno`: alguem
                        recusado tres vezes tem passagens e nunca foi aluno.
                    saiu_em:
                      type: [string, 'null']
                      format: date-time
                      description: |
                        Quando a ficha anterior mais recente foi encerrada — `null`
                        se nao ha ficha anterior, ou se nenhuma foi encerrada. E a
                        pista que a tarja da tela mostra ("saiu em ..."), e ela vem
                        pronta pelo mesmo motivo de `esperando_ha_dias`: quem tem o
                        relogio e a linha e a celula.
  /pre-matriculas/{id}/decisao:
    post:
      operationId: decidePreEnrollment
      summary: Liberar ou recusar quem esta na fila
      description: |
        `liberar` muda o status para `ativa` — e a partir daí a pessoa entra na
        Caixa SEM nenhuma outra mudanca, porque a Caixa ja pergunta "tem
        matricula que vale?".

        `liberar` exige `product_id`, e essa e a mudanca de 06/09/2026
        (DECISAO-cursos-matriculas-e-alunos.md, [INV-ALU-C1]): ninguem e aluno
        do site, todo mundo e aluno de UM PRODUTO, e a matricula e o que diz
        qual. Um curso e um produto; um livro em PDF tambem. Sem o produto a
        resposta e 422, e nada muda. NAO existe valor padrao: um padrao faria
        a escolha errada parecer escolha, e o erro so apareceria quando o
        aluno abrisse a sala e encontrasse o curso errado.

        A lista de produtos e do `catalogo`, e esta celula guarda a REFERENCIA e
        nunca a copia. Duas listas divergiriam no primeiro produto novo.

        `recusar` exige `motivo`: sem ele a pessoa espera para sempre e o
        mantenedor nao consegue distinguir "ninguem olhou" de "foi negado". E nao
        pede produto: ninguem vira aluno de nada ao ser recusado.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisao, decidido_por]
              properties:
                decisao: { type: string, enum: [liberar, recusar] }
                decidido_por:
                  type: string
                  description: Id de plataforma de quem decidiu — a auditoria de quem liberou quem.
                motivo:
                  type: [string, 'null']
                  description: OBRIGATORIO quando decisao=recusar (422 sem ele).
                product_id:
                  type: [string, 'null']
                  description: >-
                    O produto em que esta pessoa esta matriculada: um curso, um livro, o que ela
                    comprou. OBRIGATORIO quando decisao=liberar (422 sem ele), e ignorado na recusa.
                    E o id do produto no catalogo, que e o dono da lista: esta celula guarda a
                    referencia, nunca uma copia. [INV-ALU-C1], DECISAO-cursos-matriculas-e-alunos.md.
      responses:
        '200': { description: Decidido }
        '404': { description: Nao ha linha na fila com este id }
        '409': { description: Esta linha ja foi decidida — decisao nao se refaz }
        '422': { description: "Payload invalido, recusa sem motivo, ou liberacao sem produto" }
  /pre-matriculas/{id}:
    delete:
      operationId: deleteRejectedPreEnrollment
      summary: Apagar de vez um pedido RECUSADO — nunca quem ja foi aluno
      description: |
        `docs/decisoes/DECISAO-apagar-recusado-definitivamente.md` (03/09/2026):
        reverte, SO para esta fatia, a `DECISAO-a-ficha-nao-se-apaga.md` de
        29/08/2026. O mantenedor decidiu que um pedido recusado — que nunca
        chegou a virar aluno — pode ser apagado de vez, pelo botao "Apagar de
        vez" na tela de recusados do painel.

        SO ALCANCA linhas da FILA (prefixo `pre:` no order_id) com
        `status = recusada`. Uma matricula REAL (sem esse prefixo) e 404 aqui,
        sempre — esta porta nao e `DELETE /matriculas/{id}`, que continua sem
        existir e continua sendo a lei de 29/08 intacta. Quem esta `aguardando`
        tambem nao se apaga por aqui: precisa ser recusado primeiro.

        IRREVERSIVEL. Depois de apagada, a linha nao existe mais em lugar
        nenhum — nem prontuario, nem historico. O caminho reversivel continua
        sendo `POST /pre-matriculas` (o botao "Aceitar mesmo assim" da mesma
        tela).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Apagada. A linha nao existe mais.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [apagada]
                properties:
                  apagada: { type: boolean, enum: [true] }
        '404': { description: Nao ha linha RECUSADA na fila com este id }
        '409': { description: "Esta linha esta na fila mas ainda nao foi recusada — decida por POST /pre-matriculas/{id}/decisao antes de apagar" }
  /alunos/{email}/situacao:
    get:
      operationId: getStudentStanding
      summary: Em que categoria esta pessoa esta — a resposta unica sobre "quem e aluno"
      description: |
        A porta das CINCO CATEGORIAS (`docs/decisoes/DECISAO-categorias-de-usuario.md`).
        Existe para que a home, a Caixa e o painel parem de adivinhar cada um do seu
        jeito o que uma pessoa e — hoje sao quatro respostas para a mesma pergunta, e
        tres delas erram em pelo menos um caso.

        RESPONDE 200 COM `cadastrado` PARA QUEM ELA NAO CONHECE — NUNCA 404. "Nao
        tenho linha para esta pessoa" E a resposta, nao um erro. A porta vizinha
        (`GET /alunos/{email}/matriculas`) devolve 404 nesse caso e esta certa no
        contexto dela; aqui um 404 obrigaria cada consumidor a traduzir "erro" em
        "cadastrado" por conta propria, e o primeiro que tratasse 404 como falha de
        rede mostraria a tela errada — fail-OPEN — para todo visitante novo do site.

        NAO DEVOLVE PII: sem WhatsApp, sem nome, sem eco do e-mail. E a §5 da
        `DECISAO-fila-de-liberacao.md` aplicada — o telefone sai por UMA porta so,
        `GET /pre-matriculas`, a do painel administrativo. Guarda de conjunto EXATO
        de chaves na resposta.

        `administrador` NAO E uma categoria possivel aqui, e a ausencia e a decisao:
        quem decide isso e a lista da celula `admin`, na hora. Se esta porta pudesse
        responder isso, a autorizacao da area administrativa passaria a depender de
        uma celula de produto (`DECISAO-onde-mora-a-sessao.md` §4).
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: A situacao da pessoa. Nao ha 404 — quem a celula nao conhece e `cadastrado`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categoria, na_fila]
                properties:
                  categoria:
                    type: string
                    enum: [cadastrado, na_fila, pausado, ex_aluno, reembolsado, aluno]
                    description: |
                      `aluno` sai da MESMA lista de status que decide acesso
                      (`STATUS_QUE_VALEM`) — uma segunda lista seriam duas verdades
                      sobre quem e aluno, e elas divergiriam no primeiro status novo.

                      `pausado` (ficha `suspensa`) e `ex_aluno` (ficha `encerrada`)
                      entraram em 28/08/2026
                      (`DECISAO-ex-aluno-e-a-porta-que-explica.md`). Ate entao os
                      dois voltavam como `cadastrado` — mentira sobre a pessoa, e a
                      causa de quem saiu da escola ver o formulario de pedir
                      entrada, como se nunca tivesse pedido nada.

                      `reembolsado` (ficha `reembolsada`) entrou em 31/08/2026
                      (`DECISAO-reembolso-tira-o-acesso.md`) pela MESMA razao, e e
                      ADICAO pura: nenhum consumidor quebra por ela existir. Sem
                      ela, o reembolsado cairia em `cadastrado`, que e o mesmo tipo
                      de mentira que os dois de cima nasceram para curar.

                      NENHUM dos tres da acesso, e a diferenca entre eles e a unica
                      coisa que a pessoa quer saber: pausado e temporario, ex-aluno
                      e o fim e pode pedir para voltar, reembolsado e a compra
                      desfeita e nao pede. Quem consome isto mostra telas
                      diferentes; quem autoriza continua olhando so `aluno`.
                  na_fila:
                    type: [object, 'null']
                    additionalProperties: false
                    description: Preenchido SO quando `categoria` = `na_fila`; `null` nos outros casos.
                    required: [estado, esperando_ha_dias, motivo_recusa]
                    properties:
                      estado: { type: string, enum: [aguardando, recusada] }
                      esperando_ha_dias:
                        type: [integer, 'null']
                        minimum: 0
                        description: |
                          Calculado PELA CELULA, nao a data crua: e ela que tem o
                          relogio e a linha. Consumidor que subtraisse datas erraria
                          de um jeito diferente em cada celula. `null` depois de
                          decidida — ninguem espera mais.
                      motivo_recusa:
                        type: [string, 'null']
                        description: |
                          Preenchido so quando `estado` = `recusada`. A pessoa precisa
                          ve-lo para poder pedir de novo: reenviar e o jeito previsto
                          de corrigir um dado errado (lei da fila, §7).
        '422': { description: E-mail invalido }
  /alunos/{email}/prontuario:
    get:
      operationId: getStudentRecord
      summary: O prontuario — a historia inteira de uma pessoa nesta escola
      description: |
        A porta do PRONTUARIO (`docs/decisoes/DECISAO-a-ficha-nao-se-apaga.md` §5).
        Nasce em 29/08/2026, no mesmo dia em que o apagar morreu e em que ex-aluno
        voltou a poder pedir entrada — e as tres coisas sao a mesma decisao.

        POR QUE ELA PRECISA EXISTIR: desde essa lei, quem sai e volta ganha uma
        FICHA NOVA a cada passagem (a antiga fica `encerrada`, com a data e o motivo
        da saida intactos). Isso preserva a historia, e o preco e que a mesma pessoa
        passa a ter mais de uma linha. Esta porta e a resposta a esse preco: ela
        agrupa por e-mail e devolve a trajetoria em ordem.

        DERIVADA DAS FICHAS, nunca de uma tabela de historico. Um historico gravado
        a parte discordaria das fichas no primeiro caso de borda, e as duas telas
        mostrariam pessoas diferentes — e a lei anti-duplicacao do `CLAUDE.md` existe
        para isso.

        NAO E `GET /alunos/{email}/situacao`, e as duas continuam. Aquela responde
        "esta pessoa pode entrar?" — sem PII, para o site inteiro consumir. Esta
        responde "quem e esta pessoa para a escola?" — com PII, para UMA tela. Fundir
        as duas obrigaria a porta publica a carregar telefone, que e o oposto da §5
        da lei da fila.

        200 COM LISTA VAZIA para quem a celula nao conhece — NUNCA 404, pela mesma
        razao da porta da situacao: um 404 obrigaria o consumidor a traduzir "erro"
        em "pessoa nova", e o primeiro que o tratasse como falha de rede mostraria a
        tela errada.

        PII: devolve o WhatsApp, e por isso e PORTA DE PAINEL — a mesma familia de
        `GET /pre-matriculas` e `GET /matriculas`, e sujeita a mesma regra: o
        telefone sai por essas portas e por nenhuma outra, nunca em evento.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: O prontuario. Sem ficha nenhuma, `passagens` vem vazio.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, categoria, nome_completo, whatsapp, turma, comprou_em, passagens]
                properties:
                  email: { type: string, format: email }
                  categoria:
                    type: string
                    enum: [cadastrado, na_fila, pausado, ex_aluno, reembolsado, aluno]
                    description: |
                      A situacao de AGORA, e ela vem da MESMA funcao que responde
                      `GET /alunos/{email}/situacao`. Duas contas para a mesma
                      pergunta divergiriam no primeiro status novo — e a tela do
                      prontuario mostraria uma coisa enquanto a porta da Caixa
                      mostra outra para a mesma pessoa.
                  nome_completo:
                    type: string
                    description: |
                      Da passagem MAIS RECENTE — e nao da primeira. Quem volta anos
                      depois pode ter mudado de nome, e o que o mantenedor precisa
                      ler e como a pessoa se chama hoje. String vazia quando nao ha
                      ficha nenhuma.
                  whatsapp: { type: string }
                  turma: { type: [string, 'null'] }
                  comprou_em: { type: [string, 'null'], format: date }
                  passagens:
                    type: array
                    description: |
                      Uma entrada por ficha, da MAIS ANTIGA para a mais nova — o
                      contrario das outras listas desta API, e de proposito: aqui o
                      que se le e uma historia, e historia se conta na ordem em que
                      aconteceu.
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, site_id, status, origem, nome_completo, whatsapp, turma, comprou_em, criada_em, decidido_em, decidido_por, motivo_recusa]
                      properties:
                        id: { type: string }
                        site_id: { type: string }
                        status:
                          type: string
                          enum: [ativa, suspensa, encerrada, reembolsada, aguardando, recusada]
                          description: |
                            TODOS os estados, inclusive os da fila — este e o unico
                            lugar da API onde as duas familias aparecem juntas. As
                            outras portas separam de proposito (uma decide entrada,
                            a outra administra quem entrou); um prontuario que
                            escondesse as passagens recusadas contaria a historia
                            pela metade.
                        origem: { type: string, enum: [comprou, liberado] }
                        nome_completo: { type: string }
                        whatsapp: { type: string }
                        turma: { type: [string, 'null'] }
                        comprou_em: { type: [string, 'null'], format: date }
                        criada_em: { type: string, format: date-time }
                        decidido_em:
                          type: [string, 'null']
                          format: date-time
                          description: |
                            Quando esta ficha foi decidida pela ultima vez —
                            liberada, recusada, pausada ou encerrada. `null` enquanto
                            ninguem decidiu nada.
                        decidido_por:
                          type: string
                          description: |
                            Id de plataforma de quem decidiu — nunca o e-mail dele.
                            E-mail muda de dono; o id, nao.
                        motivo_recusa: { type: string }
        '422': { description: E-mail invalido }
  /matriculas/{id}:
    # A operacao `delete` (deleteEnrollment) MORREU AQUI em 29/08/2026, e a
    # ausencia dela e a lei: `docs/decisoes/DECISAO-a-ficha-nao-se-apaga.md`.
    #
    # O mantenedor decidiu que o cadastro de um aluno NUNCA e apagado — quem sai
    # vira ex-aluno (`PATCH` com `status: encerrada`), a ficha fica, e quem quiser
    # voltar pede entrada de novo pela fila. A porta que apagava saiu junto com o
    # botao porque um botao removido volta com uma linha de template; uma porta
    # removida do contrato exige o Rito §3 e a etiqueta `contrato-remocao`.
    #
    # ISTO REVERTE a `DECISAO-administradores-e-apagar.md` §4, de 28/08/2026, que
    # criou a porta como "o direito da pessoa de sumir do sistema". Esse direito
    # continua existindo em lei (LGPD); o que deixa de existir e o caminho de UM
    # CLIQUE para exerce-lo. Pedido formal de exclusao passa a ser raro, manual e
    # com rito — e a lei nova escreve isso em vez de deixar a ausencia muda.
    #
    # Consumidor: so a celula `admin` chamava, e ela parou de chamar ANTES desta
    # remocao (PR #468) — consumidor primeiro, como manda o Rito §3.
    patch:
      operationId: updateEnrollment
      summary: Mudar o estado de um aluno, ou corrigir os dados dele
      description: |
        O formulario de gestao (`DECISAO-gestao-de-alunos.md` §3). Todo campo de
        dado e OPCIONAL: manda-se so o que muda.

        O QUE ESTA PORTA NAO DEIXA MUDAR, e a ausencia e a decisao:

        - `email` — e a IDENTIDADE da linha. Troca-lo moveria a matricula, em
          silencio, para outra pessoa, e e por e-mail que todo o resto do
          sistema pergunta quem e aluno.
        - `site_id`, `order_id`, `product_id` — vem do fato que criou a linha
          (uma compra, um pedido de entrada). Edita-los seria reescrever o que
          aconteceu.

        NAO decide sobre quem esta na FILA: linha `aguardando`/`recusada` responde
        409 aqui. Para essas existe `POST /pre-matriculas/{id}/decisao` — uma
        porta decide ENTRADA, a outra administra quem ja entrou.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decidido_por]
              properties:
                decidido_por:
                  type: string
                  description: Id de plataforma de quem mudou — a auditoria do lado de ca.
                status: { type: string, enum: [ativa, suspensa, encerrada, reembolsada] }
                nome_completo: { type: string, minLength: 1 }
                whatsapp: { type: string }
                turma: { type: [string, 'null'] }
                comprou_em: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Como a matricula ficou
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, site_id, email, nome_completo, whatsapp, turma, comprou_em, status, origem, criada_em]
                properties:
                  id: { type: string }
                  site_id: { type: string }
                  email: { type: string, format: email }
                  nome_completo: { type: string }
                  whatsapp: { type: string }
                  turma: { type: [string, 'null'] }
                  comprou_em: { type: [string, 'null'], format: date }
                  status: { type: string, enum: [ativa, suspensa, encerrada, reembolsada] }
                  origem:
                    type: string
                    enum: [comprou, liberado]
                    description: |
                      DERIVADO da proveniencia da linha, nunca de um campo proprio:
                      `liberado` e quem entrou pela fila (o pedido sintetico `pre:`),
                      `comprou` e o resto. Sai como palavra e nao como o numero do
                      pedido — o numero e do provedor de pagamento e nao diz nada a
                      quem le a tela.
                  criada_em: { type: string, format: date-time }
        '404': { description: Nao ha matricula com este id }
        '409': { description: "Esta linha esta na FILA — decida por POST /pre-matriculas/{id}/decisao" }
        '422': { description: "Payload invalido, ou nada para mudar" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
