openapi: 3.1.0
info:
  title: Notificações API
  version: 1.0.0
  description: |
    A porta de consulta da caixa central de avisos. Fase 4 do sininho (Rito de
    Contrato de 27/08/2026, docs/decisoes/DECISAO-fase-4-do-sininho.md). Serve
    dois consumidores: o `funil` (o sininho ao lado do nome, em toda página) e
    a própria `sugestoes` (a tela de avisos da Caixa, que aposenta a leitura
    local — DECISAO-fase-2-do-sininho.md §3).

    A notificação é DADO, nunca frase pronta (DECISAO-notificacoes §5.1): esta
    API devolve tipo + parâmetros, e quem lê monta a frase no idioma de quem
    está lendo. Nenhuma rota aqui devolve e-mail — o destinatário é sempre o id
    da PLATAFORMA (DECISAO-EVO-01 §3).

    Toda rota exige `site_id` (CONSTITUICAO.md Lei 9 — "site_id acompanha toda
    entidade pública"; decisão confirmada em 27/08/2026, na mesma sessão da
    Fase 4): os avisos de uma pessoa são sempre os do site de onde a chamada
    vem, nunca um apanhado de todo site que ela já tiver tocado. `notificacao.
    devida.v1` já carrega `site_id` no fato desde a Fase 2 — esta rota só
    passa a exigir, na leitura, o mesmo dado que a escrita já grava.
servers:
  - url: http://notificacoes:8000/api/notificacoes
security:
  - bearerAuth: []
paths:
  /resumo:
    get:
      operationId: obterResumo
      summary: Contagem de avisos não lidos de uma pessoa — o número do sininho
      description: |
        Contador O(1) (DECISAO-notificacoes §5.2) — nunca um COUNT(*) que
        cresce com o tempo. Devolve a contagem REAL, sem teto: um teto de
        exibição (ex.: "99+") é decisão da tela que consome, não do dado
        (Escolha 1, DECISAO-fase-4-do-sininho.md).
      parameters:
        - name: destinatario_id
          in: query
          required: true
          schema: { type: string }
          description: Id da PLATAFORMA da pessoa. Nunca e-mail (DECISAO-EVO-01 §3).
        - name: site_id
          in: query
          required: true
          schema: { type: string }
          description: Site (tenant) de onde a chamada vem (CONSTITUICAO.md Lei 9). Escopa a contagem — não soma avisos de outros sites.
      responses:
        '200':
          description: Resumo calculado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nao_lidas]
                properties:
                  nao_lidas: { type: integer, minimum: 0 }
        '422': { description: destinatario_id ou site_id ausente ou inválido }
  /avisos:
    get:
      operationId: listarAvisos
      summary: Lista paginada dos avisos de uma pessoa, mais novo primeiro
      description: |
        `parametros` guarda os dados da frase, não a frase pronta — quem lê
        monta o texto no idioma da leitura (DECISAO-notificacoes §5.1).
        `lido_em` distingue lido de não-lido; ausência de item não é o mesmo
        que falha em buscar — a chamada que falhar deve devolver erro HTTP,
        nunca uma lista vazia disfarçada de "zero avisos" (Escolha 2,
        DECISAO-fase-4-do-sininho.md).
      parameters:
        - name: destinatario_id
          in: query
          required: true
          schema: { type: string }
        - name: site_id
          in: query
          required: true
          schema: { type: string }
          description: Site (tenant) de onde a chamada vem (CONSTITUICAO.md Lei 9). Escopa a lista — não mistura avisos de outros sites.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Cursor devolvido pela página anterior. Ausente pede a primeira página.
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Uma página de avisos
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [itens, proximo_cursor]
                properties:
                  itens:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, assunto, parametros, ator_id, lido_em, criado_em]
                      properties:
                        id: { type: string }
                        assunto: { type: string }
                        parametros: { type: object }
                        ator_id:
                          anyOf: [{ type: string }, { type: "null" }]
                          description: Guardado sim, mostrado não — a tela sempre lê "a equipe" (DECISAO-fase-2-do-sininho.md §2).
                        lido_em:
                          anyOf: [{ type: string, format: date-time }, { type: "null" }]
                        criado_em: { type: string, format: date-time }
                  proximo_cursor:
                    anyOf: [{ type: string }, { type: "null" }]
                    description: null quando não há próxima página.
        '422': { description: destinatario_id ou site_id ausente ou inválido }
  /marcar-lida:
    post:
      operationId: marcarUmaComoLida
      summary: Marca UM aviso específico como lido — idempotente (marcar duas vezes é marcar uma)
      description: |
        A tela de origem (a Caixa) já tinha esta granularidade — marcar como
        lido ao abrir o detalhe de UM aviso, sem tocar nos outros. A porta de
        consulta não pode perder isso na migração. `id` é o valor opaco
        devolvido por `GET /avisos` (nunca um número puro — ver a descrição
        do campo `id` lá).

        404, nunca 403, quando `id` não existe ou não pertence a este
        `destinatario_id`/`site_id`: confirmar que um id pertence a outra
        pessoa vazaria a existência do aviso alheio a quem só chutou um
        valor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destinatario_id, site_id, id]
              properties:
                destinatario_id: { type: string }
                site_id: { type: string }
                id:
                  type: string
                  description: O valor opaco de `GET /avisos` (campo `id` de um item da lista).
      responses:
        '200':
          description: Marcado agora, ou já estava lido — os dois casos devolvem 200 (idempotente)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ja_estava_lido]
                properties:
                  ja_estava_lido: { type: boolean }
        '404': { description: "id inexistente, ou não pertence a este destinatario_id/site_id" }
        '422': { description: campo obrigatório ausente ou inválido }
  /marcar-lidas:
    post:
      operationId: marcarTodasComoLidas
      summary: Marca todos os avisos não lidos de uma pessoa como lidos, de uma vez
      description: |
        Escolha 3 da DECISAO-fase-4-do-sininho.md — entra na V1 por ser barato
        e imediatamente útil. "Silenciar um assunto" NÃO tem contrato ainda:
        fica para quando existir mais de um assunto de aviso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destinatario_id, site_id]
              properties:
                destinatario_id: { type: string }
                site_id:
                  type: string
                  description: Site (tenant) de onde a chamada vem (CONSTITUICAO.md Lei 9). Marca como lido só o que é daquele site.
      responses:
        '200':
          description: Marcados — devolve quantos avisos foram afetados (0 é uma resposta válida)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [marcados]
                properties:
                  marcados: { type: integer, minimum: 0 }
        '422': { description: destinatario_id ou site_id ausente ou inválido }
  /inscricoes-push:
    post:
      operationId: inscreverAparelhoParaPush
      summary: Guarda um aparelho para receber o aviso na tela, mesmo com o site fechado
      description: |
        O canal novo da Fase 7 (`docs/notificacoes/PLANO-MESTRE.md` — "e só
        então outros canais"), autorizado pelo mantenedor em 31/08/2026 depois
        de o site virar app instalável (PR #706). No iPhone a ordem é essa e
        não tem atalho: só um site instalado na tela de início pode receber
        aviso.

        **Uma linha por APARELHO, não por pessoa.** A mesma pessoa no celular e
        no tablet tem duas inscrições, e cada uma morre sozinha quando aquele
        aparelho desinstala o app. Reinscrever o mesmo `endpoint` é
        idempotente: o navegador reemite a inscrição de tempos em tempos, e
        cada reemissão não pode virar uma linha nova.

        **`endpoint` e as duas chaves vêm do NAVEGADOR, cruas.** São o
        endereço do servidor de push do fabricante (Google, Apple, Mozilla) e
        o material que cifra o conteúdo do aviso de ponta a ponta: nem esta
        célula nem o servidor de push conseguem ler o que foi enviado sem
        elas. Nada aqui é e-mail, e nada aqui identifica a pessoa fora desta
        plataforma: o destinatário continua sendo o id da PLATAFORMA
        (`DECISAO-EVO-01` §3).

        **O aviso enviado carrega DADO, nunca frase pronta**
        (`DECISAO-notificacoes` §5.1): assunto e parâmetros viajam, e a frase
        nasce no aparelho, no idioma de quem lê. Por isso não existe campo de
        idioma nesta inscrição: guardá-lo seria congelar o idioma de quem
        instalou, que é exatamente o erro que aquela lei proíbe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destinatario_id, site_id, endpoint, p256dh, auth]
              properties:
                destinatario_id: { type: string }
                site_id:
                  type: string
                  description: Site (tenant) de onde a chamada vem (CONSTITUICAO.md Lei 9). O aparelho recebe só os avisos daquele site.
                endpoint:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Endereço do servidor de push do fabricante, dado pelo navegador. Opaco para nós.
                p256dh:
                  type: string
                  maxLength: 256
                  description: Chave pública do aparelho (base64url), do navegador. Sem ela o conteúdo não pode ser cifrado.
                auth:
                  type: string
                  maxLength: 64
                  description: Segredo de autenticação do aparelho (base64url), do navegador.
      responses:
        '200':
          description: Inscrito agora, ou já estava inscrito — os dois devolvem 200 (idempotente)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ja_estava_inscrito]
                properties:
                  ja_estava_inscrito: { type: boolean }
        '422': { description: campo obrigatório ausente ou inválido }
    delete:
      operationId: cancelarInscricaoDeAparelho
      summary: Esquece um aparelho — a pessoa desligou os avisos, ou desinstalou o app
      description: |
        Idempotente e silencioso: apagar o que não existe devolve 200. A
        célula também apaga sozinha, sem ninguém pedir, a inscrição que o
        servidor de push recusar como morta (404/410 na entrega) — aparelho
        que sumiu não pode virar lixo eterno no banco.

        Não exige `destinatario_id`: quem tem o `endpoint` é o próprio
        aparelho, e ele é o único que precisa desligar os avisos dele. Pedir o
        dono junto faria a saída depender de uma sessão viva, e desinstalar
        acontece justamente quando não há mais sessão nenhuma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_id, endpoint]
              properties:
                site_id: { type: string }
                endpoint: { type: string, format: uri, maxLength: 2048 }
      responses:
        '200':
          description: Esquecido, ou já não existia
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [existia]
                properties:
                  existia: { type: boolean }
        '422': { description: campo obrigatório ausente ou inválido }
  /aviso-de-teste:
    post:
      operationId: enviarAvisoDeTeste
      summary: Manda um aviso de teste para os aparelhos de uma pessoa, a pedido dela
      description: |
        A porta que responde "o aviso saiu daqui, e para quantos aparelhos".
        Rito de Contrato de 03/09/2026, com o mantenedor presente.

        **Por que ela existe:** em 02/09/2026 o botão de ligar os avisos
        falhava no navegador do mantenedor e o servidor estava verde. Não havia
        como distinguir "o aviso não foi enviado" de "o aviso foi enviado e não
        chegou" sem alguém entrar na VPS, e o agente não entra (Lei 5). Um
        envio que a pessoa dispara na hora, e que devolve um número, encerra
        essa classe de dúvida sem SSH nenhum.

        **Por que HTTP e não um evento no fio, como todo o resto.** Não é
        atalho: é a única forma que responde. O fio é assíncrono por desenho e
        não devolve resposta a quem publicou, e o valor inteiro desta porta é a
        RESPOSTA — `aparelhos: 0` é o diagnóstico, e um evento publicado com
        sucesso não sabe dizer isso. Fora daqui, a regra continua de pé: carta
        de fato do projeto nasce de evento, sempre.

        **Ela cria carta no sininho**, como qualquer outro assunto (escolha do
        mantenedor neste rito, contra a alternativa de só piscar na tela).
        Assim um teste prova as DUAS metades de uma vez, e um aviso que não
        chega ao celular ainda deixa rastro de que saiu daqui — que é
        exatamente o rastro que faltou no caso que criou esta porta.

        **`destinatario_id` é sempre quem PEDIU o teste.** Esta célula não tem
        como saber isso, e por isso não promete: quem garante é a porta que
        chama, com a sessão na mão (hoje o admin, que manda o id de quem
        clicou). Uma porta que aceitasse qualquer id seria um jeito de fazer
        tocar o celular dos outros, e nenhum teste vale isso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_id, destinatario_id]
              properties:
                site_id:
                  type: string
                  maxLength: 64
                  description: Site (tenant) de onde a chamada vem (CONSTITUICAO.md Lei 9). O teste nunca atravessa sites.
                destinatario_id:
                  type: string
                  maxLength: 64
                  description: Id da PLATAFORMA de quem pediu o teste, e de quem vai receber. Nunca o e-mail (DECISAO-EVO-01 §3).
      responses:
        '200':
          description: A carta foi guardada e o envio aos aparelhos foi tentado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [aparelhos]
                properties:
                  aparelhos:
                    type: integer
                    minimum: 0
                    description: >-
                      Para quantos aparelhos o aviso saiu AGORA. Zero é
                      resposta legítima, e é o diagnóstico mais útil desta
                      porta, porque quer dizer que a pessoa ainda não ligou os
                      avisos em aparelho nenhum, e não que algo quebrou. A
                      carta no sininho é criada de todo jeito.
        '422': { description: campo obrigatório ausente ou inválido }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
