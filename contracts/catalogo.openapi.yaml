openapi: 3.1.0
info:
  title: Catalogo API
  version: 1.0.0
  description: |
    Fonte da verdade de SITES, produtos, ofertas e bumps. API INTERNA (rede Docker;
    sem rota pública no gateway). Consumida por funil, quiz, checkout e alunos via
    Bearer dedicado por par. Multissítio: o catálogo é o registro canônico de sites;
    as células públicas resolvem Host→Site aqui (middleware CONV-SITE, cache 60s).
servers:
  - url: http://catalogo:8000/api/catalogo
security:
  - bearerAuth: []
paths:
  /sites/by-host/{host}:
    get:
      operationId: getSiteByHost
      summary: Resolve um domínio para o Site correspondente (INV-P11)
      description: Host desconhecido ⇒ 404. Nunca devolve um site "padrão".
      parameters:
        - name: host
          in: path
          required: true
          schema: { type: string }
          description: Hostname em minúsculas, sem porta (ex. loja1.com.br)
      responses:
        '200':
          description: Site ativo deste domínio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '404': { description: Domínio não cadastrado ou site inativo }
  /sites/{site_id}/ofertas/{slug}:
    get:
      operationId: getOffer
      summary: Oferta publicada DE UM SITE, com produto, preço e bumps
      description: Slugs são únicos por site; a mesma oferta pode existir com preços distintos em sites distintos.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Oferta corrente (versão publicada) deste site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { description: Oferta inexistente/despublicada NESTE site (mesmo que exista em outro — INV-P11) }
  /produtos:
    get:
      operationId: listProducts
      summary: Os produtos ativos, para quem precisa ESCOLHER um
      description: |-
        Quem chama isto precisa MOSTRAR uma lista para alguém escolher.

        Só os ativos, porque a escolha existe para liberar acesso e ninguém deve
        ser liberado num produto aposentado. Quem já tem uma matrícula apontando
        para um produto aposentado continua vendo o nome dele por `getProduct`.
      parameters: []
      responses:
        '200':
          description: Os produtos ativos, em ordem de nome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Cadastra um produto (um curso é um produto), sem duplicar pelo apelido
      description: |-
        Cria o produto e responde 201 com ele. Chamar de novo com o MESMO apelido e o MESMO nome responde 200 com o produto que já existe, sem criar duplicata: é o que deixa a tela ser reenviada (dois cliques, recarregar a página) sem nascerem dois cursos iguais. Apelido que já existe com nome DIFERENTE responde 409 e NADA é alterado, dizendo qual nome está no lugar; trocar o nome de um produto é gesto de quem opera a máquina, pelo comando `manage.py criar_curso <apelido> '<nome>' --renomear`. Apelido fora da forma, ou nome vazio, respondem 422 e nada é gravado. O produto nasce ATIVO e com preço ZERO, e isso não se escolhe aqui: quem cobra é a oferta, que é por site, então zero significa "não está à venda por este produto", nunca "de graça".
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProduct' }
      responses:
        '200':
          description: Já existia com este mesmo nome; nada mudou
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '201':
          description: Produto criado, com preço zero e ativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '409': { description: Apelido já usado por um produto de OUTRO nome; nada foi alterado }
        '422': { description: Apelido fora da forma ou nome vazio; nada foi gravado }
  /produtos/{product_id}:
    get:
      operationId: getProduct
      summary: Produto por id (produtos são globais; ofertas é que são por site)
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { description: Inexistente }
  /sites/{site_id}/menu:
    get:
      operationId: getSiteMenu
      summary: O menu do topo de um site, para a tela que o configura
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: O menu deste site (vazio quando não há)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMenu'
        '404':
          description: Site inexistente
      description: 'Serve a configuração inteira do menu. Site sem menu responde 200 com um objeto vazio,
        e não 404: para quem vai configurar, ''ainda não tem menu'' é um estado normal, não um erro.'
    put:
      operationId: putSiteMenu
      summary: Grava o menu do topo de um site, inteiro
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: O menu como ficou gravado, na forma canônica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMenu'
        '404':
          description: Site inexistente
        '422':
          description: Configuração incoerente; nada foi gravado
      description: 'Substitui a configuração inteira do menu: versões, itens e regras por página de uma
        vez. Documento inteiro, e não remendo campo a campo, porque a coerência é do CONJUNTO: uma versão
        só pode sumir junto com as páginas que apontavam para ela. Configuração incoerente responde 422
        com o motivo em português, e NADA é gravado.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteMenu'
        required: true
  /sites/{site_id}/paginas/{slug}:
    get:
      operationId: getPage
      summary: A página publicada de um site, que é o que quem visita vê
      description: |-
        É esta operação que a célula `funil` lê para renderizar. Devolve a versão
        PUBLICADA, nunca o rascunho: o que está em edição não chega a quem visita.

        Página sem nenhuma versão publicada responde 404, e não 200 com seções vazias.
        Para quem renderiza, "ainda não existe" precisa levar a outro lugar, nunca a
        uma tela em branco servida como se fosse a oferta.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
          description: Apelido da página dentro do site (ex. oferta)
      responses:
        '200':
          description: A versão publicada corrente desta página
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPublicada' }
        '404': { description: 'Site inexistente, ou página sem nenhuma versão publicada' }
  /sites/{site_id}/paginas/{slug}/rascunho:
    get:
      operationId: getPageDraft
      summary: O rascunho em edição de uma página, para a tela que escreve
      description: |-
        Serve o que está em edição, que é outra coisa do que está no ar. Página que
        nunca foi editada responde 404: quem abre a tela precisa saber se começa de
        uma folha em branco ou de um texto que alguém já deixou pela metade.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: O rascunho corrente desta página
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RascunhoDaPagina' }
        '404': { description: 'Site inexistente, ou página sem rascunho nenhum' }
    put:
      operationId: putPageDraft
      summary: Grava o rascunho de uma página, inteiro
      description: |-
        Substitui as seções do rascunho de uma vez, e não remenda slot a slot, porque a
        coerência é do CONJUNTO: a ordem das seções e os slots de cada uma só fazem
        sentido juntos. É por aqui que a tela do `admin` salva o que o mantenedor
        escreve, e gravar rascunho não publica nada.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorpoDoRascunho' }
      responses:
        '200':
          description: O rascunho como ficou gravado, na forma canônica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RascunhoDaPagina' }
        '404': { description: 'Site inexistente' }
        '422': { description: 'Rascunho incoerente; nada foi gravado' }
  /sites/{site_id}/paginas/{slug}/publicar:
    post:
      operationId: publishPage
      summary: Publica o rascunho, criando a versão seguinte da página
      description: |-
        O rascunho vira uma versão publicada nova. Versão publicada não é editada:
        `version` cresce e a anterior continua existindo, porque é ela que a telemetria
        do funil já mediu. Sem isso, medir a página seria medir alvo móvel.

        Rascunho vazio responde 409 e nada é publicado. Publicar página sem nada seria
        pôr uma tela em branco no ar com a aparência de sucesso, e o caminho certo é
        escrever antes.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: A versão que acabou de ser publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPublicada' }
        '404': { description: 'Site inexistente' }
        '409': { description: 'Rascunho vazio; nada foi publicado' }
  /sites/{site_id}/paginas/{slug}/experimentos:
    post:
      operationId: createExperiment
      summary: Cria um experimento num slot da página, em rascunho
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      responses:
        '201':
          description: O experimento criado, em rascunho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentoDaPagina'
        '404':
          description: Site ou página inexistente
        '409':
          description: Página sem versão publicada, ou slot vazio nela
        '422':
          description: Seção ou slot fora do vocabulário, variantes incoerentes ou horizonte impossível;
            nada foi gravado
      description: O experimento nasce em rascunho, com o controle `a` carregando o texto publicado do slot
        e a amostra por braço já calculada. Nada vai ao ar até a mudança de estado para ativo.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoExperimento'
        required: true
    get:
      operationId: listExperiments
      summary: Os experimentos de uma página, do mais novo para o mais antigo
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Os experimentos da página, em qualquer estado
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ExperimentoDaPagina'
                type: array
        '404':
          description: Site ou página inexistente
  /sites/{site_id}/paginas/{slug}/experimentos/{experimento_id}:
    get:
      operationId: getExperiment
      summary: Um experimento de uma página
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: experimento_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: O experimento, com as variantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentoDaPagina'
        '404':
          description: Site, página ou experimento inexistente
  /sites/{site_id}/paginas/{slug}/experimentos/{experimento_id}/estado:
    post:
      operationId: changeExperimentState
      summary: Põe o experimento no ar ou o encerra
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: experimento_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: O experimento no estado pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentoDaPagina'
        '404':
          description: Site, página ou experimento inexistente
        '409':
          description: Transição inválida, outro experimento já ativo nesta página, ou encerramento repetido
            com outra decisão; nada mudou
        '422':
          description: Decisão ausente, ou vencedora que não é variante
      description: rascunho vai para ativo ou encerrado; ativo vai para encerrado. Pedir o estado em que
        o experimento já está responde 200 sem mudar nada. Ao entrar no ar, o controle `a` é conferido com
        o texto publicado de agora, e as variantes congelam. Ao encerrar, a decisão é obrigatória.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MudancaDeEstado'
        required: true
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Site:
      type: object
      required: [id, host, name, active]
      properties:
        id: { type: string }
        host: { type: string, description: "Domínio canônico do site, minúsculas" }
        name: { type: string }
        active: { type: boolean }
        theme:
          type: object
          additionalProperties: true
          description: Tokens de identidade visual (cores, logo) — opaco para quem consome
        default_offer_slug: { type: string, description: Oferta que a raiz do funil exibe }
        default_language:
          type: string
          description: >-
            Idioma padrão do site, BCP 47 em minúsculas, como aparece na URL
            (en, pt-br, es). AUSENTE ⇒ site monolíngue: nenhuma URL ganha
            prefixo de idioma e o comportamento herdado é preservado.
        languages:
          type: array
          description: >-
            Idiomas que este site serve. Ausente ou vazio ⇒ monolíngue. Quando
            presente, DEVE conter default_language. A ordem não é significativa.
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                description: BCP 47 em minúsculas, exatamente como aparece na URL
              indexable:
                type: boolean
                default: true
                description: >-
                  false ⇒ as páginas desse idioma saem com noindex e ficam fora
                  do hreflang e do sitemap. Serve para lançar um idioma antes de
                  querer tráfego nele.
        menu:
          description: 'O menu do topo deste site. Ausente: o site não tem menu configurado, e a resposta segue
            byte a byte igual à de antes desta fase.'
          properties:
            default_version:
              description: 'Apelido da versão usada por toda página sem regra própria. Vazio: página sem regra
                não mostra menu nenhum.'
              type: string
            versions:
              description: 'As versões do menu deste site (ex.: completo, enxuto).'
              items:
                properties:
                  slug:
                    description: Apelido único da versão; é o que as páginas apontam.
                    type: string
                  name:
                    description: Nome que o mantenedor lê na tela de configuração.
                    type: string
                  items:
                    description: As opções do menu, na ordem em que aparecem.
                    items:
                      properties:
                        url:
                          description: Caminho deste site começando com uma barra, ou endereço completo de um
                            site de fora.
                          type: string
                        labels:
                          additionalProperties:
                            type: string
                          description: Nome do item por idioma (BCP 47 minúsculo). Idioma sem rótulo cai no idioma
                            padrão do site.
                          type: object
                        localized:
                          default: false
                          description: 'true: quem serve a página põe o prefixo do idioma no caminho. Só vale
                            para rota da própria célula: link para outra célula segue cru (R12).'
                          type: boolean
                        audience:
                          default: everyone
                          description: "Para quem este item aparece. `staff` sai do campo `papel` da sessão (contrato da `identidade`, schema Session), que é de EXIBIÇÃO e não autoriza nada: quem desenha o menu esconde o item, e quem barra a entrada continua sendo a porta fail-closed da célula dona do recurso. Plateia que um consumidor NÃO reconhecer deve ser ESCONDIDA, nunca mostrada a todos. Sem isso, um valor novo aqui vazaria um atalho durante a janela em que um consumidor ainda não subiu."
                          enum:
                          - everyone
                          - logged_out
                          - logged_in
                          - staff
                          type: string
                        new_tab:
                          default: false
                          description: Abrir numa aba nova.
                          type: boolean
                      required:
                      - url
                      - labels
                      type: object
                    type: array
                required:
                - slug
                - name
                - items
                type: object
              type: array
            pages:
              description: Qual versão cada página usa. Página fora desta lista usa a default_version.
              items:
                properties:
                  page:
                    description: 'Chave da página na forma ''celula/rota'', a mesma dupla de services/admin/apps/core/mapa-do-site.json
                      (ex.: ''funil/'' ou ''funil/login'').'
                    type: string
                  version:
                    description: 'Apelido da versão. Vazio: esta página NÃO mostra menu.'
                    type: string
                required:
                - page
                - version
                type: object
              type: array
          type: object
    SiteMenu:
      description: O menu do topo de um site, no envelope que o contrato declara.
      properties:
        menu:
          description: 'O menu do topo deste site. Ausente: o site não tem menu configurado, e a resposta
            segue byte a byte igual à de antes desta fase.'
          properties:
            default_version:
              description: 'Apelido da versão usada por toda página sem regra própria. Vazio: página sem regra
                não mostra menu nenhum.'
              type: string
            versions:
              description: 'As versões do menu deste site (ex.: completo, enxuto).'
              items:
                properties:
                  slug:
                    description: Apelido único da versão; é o que as páginas apontam.
                    type: string
                  name:
                    description: Nome que o mantenedor lê na tela de configuração.
                    type: string
                  items:
                    description: As opções do menu, na ordem em que aparecem.
                    items:
                      properties:
                        url:
                          description: Caminho deste site começando com uma barra, ou endereço completo de
                            um site de fora.
                          type: string
                        labels:
                          additionalProperties:
                            type: string
                          description: Nome do item por idioma (BCP 47 minúsculo). Idioma sem rótulo cai no
                            idioma padrão do site.
                          type: object
                        localized:
                          default: false
                          description: 'true: quem serve a página põe o prefixo do idioma no caminho. Só vale
                            para rota da própria célula: link para outra célula segue cru (R12).'
                          type: boolean
                        audience:
                          default: everyone
                          description: "Para quem este item aparece. `staff` sai do campo `papel` da sessão (contrato da `identidade`, schema Session), que é de EXIBIÇÃO e não autoriza nada: quem desenha o menu esconde o item, e quem barra a entrada continua sendo a porta fail-closed da célula dona do recurso. Plateia que um consumidor NÃO reconhecer deve ser ESCONDIDA, nunca mostrada a todos. Sem isso, um valor novo aqui vazaria um atalho durante a janela em que um consumidor ainda não subiu."
                          enum:
                          - everyone
                          - logged_out
                          - logged_in
                          - staff
                          type: string
                        new_tab:
                          default: false
                          description: Abrir numa aba nova.
                          type: boolean
                      required:
                      - url
                      - labels
                      type: object
                    type: array
                required:
                - slug
                - name
                - items
                type: object
              type: array
            pages:
              description: Qual versão cada página usa. Página fora desta lista usa a default_version.
              items:
                properties:
                  page:
                    description: 'Chave da página na forma ''celula/rota'', a mesma dupla de services/admin/apps/core/mapa-do-site.json
                      (ex.: ''funil/'' ou ''funil/login'').'
                    type: string
                  version:
                    description: 'Apelido da versão. Vazio: esta página NÃO mostra menu.'
                    type: string
                required:
                - page
                - version
                type: object
              type: array
          type: object
      type: object
    Product:
      type: object
      required: [id, name, price_cents, active]
      properties:
        id: { type: string }
        name: { type: string }
        price_cents: { type: integer, minimum: 0 }
        active: { type: boolean }
    NewProduct:
      type: object
      description: 'O que basta para cadastrar um produto: o apelido e o nome.'
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
          description: 'Apelido do produto: minúsculas, números e hífen, até 64 caracteres. É a chave que faz o cadastro poder ser repetido sem criar duplicata, e por isso a forma é conferida aqui, não depois.'
        name:
          type: string
          minLength: 1
          description: O nome que a pessoa lê na lista de escolher. Os espaços das pontas são aparados antes de gravar.
    Offer:
      type: object
      required: [site_id, slug, version, product, price_cents]
      properties:
        site_id: { type: string }
        slug: { type: string }
        version: { type: integer, description: Ofertas publicadas não são editadas — mudanças criam nova versão }
        product:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        price_cents: { type: integer, minimum: 1 }
        bumps:
          type: array
          items:
            type: object
            required: [id, product_id, name, price_cents]
            properties:
              id: { type: string }
              product_id: { type: string }
              name: { type: string }
              price_cents: { type: integer, minimum: 0 }
              headline: { type: string }
    PaginaPublicada:
      type: object
      description: |-
        Uma versão publicada de uma página, que é o que quem visita vê e o que a
        telemetria do funil mede. Publicada não se edita: cada publicação nasce com
        `version` maior, e a anterior fica de pé porque os eventos já a citaram.
      required: [id, site_id, slug, version, published_at, secoes]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        slug: { type: string, description: 'Apelido da página dentro do site (ex. oferta); único por site' }
        tipo:
          description: 'Escolhe o vocabulário de seções da página. Ausente: oferta.'
          enum:
          - oferta
          - flp
          type: string
        version:
          type: integer
          minimum: 1
          description: Cresce a cada publicação e nunca é reescrita. É o número que os eventos do funil carregam para amarrar cada fato ao conteúdo exato que esteve na tela.
        offer_slug:
          type: string
          description: 'Apelido da oferta que esta página vende, para ligar a visita ao pedido. Vazio quando a página não vende nada.'
        published_at: { type: string, format: date-time }
        secoes:
          type: array
          items: { $ref: '#/components/schemas/Secao' }
        experimento_ativo:
          allOf:
          - $ref: '#/components/schemas/ExperimentoAtivo'
          description: 'O experimento que está no ar nesta página. Ausente quando não há nenhum: aí a página se
            mostra como foi publicada. Só aparece o experimento no estado `ativo`.'
    RascunhoDaPagina:
      type: object
      description: |-
        O que está em edição, que é outra coisa do que está no ar. Só a tela do `admin`
        lê e grava isto; quem visita nunca o alcança.
      required: [site_id, slug, base_version, secoes, atualizado_em]
      properties:
        site_id: { type: string, format: uuid }
        slug: { type: string }
        tipo:
          description: 'Escolhe o vocabulário de seções da página. Ausente: oferta.'
          enum:
          - oferta
          - flp
          type: string
        base_version:
          type: integer
          minimum: 0
          description: A versão publicada de onde este rascunho saiu. ZERO quando ainda não há nenhuma publicação, e é assim que a tela sabe que a página nunca esteve no ar.
        secoes:
          type: array
          items: { $ref: '#/components/schemas/Secao' }
        atualizado_em: { type: string, format: date-time }
    CorpoDoRascunho:
      type: object
      description: |-
        O que a tela do `admin` manda ao gravar: as seções inteiras, de uma vez.
        Existe como componente nomeado, e não solto dentro da operação, porque é
        assim que o provedor consegue emitir uma referência só em vez de referência
        e objeto ao mesmo tempo.
      required: [secoes]
      properties:
        tipo:
          description: 'Escolhe o vocabulário de seções da página. Ausente: oferta.'
          enum:
          - oferta
          - flp
          type: string
        secoes:
          type: array
          items: { $ref: '#/components/schemas/Secao' }
    Secao:
      type: object
      description: |-
        Um bloco da página: um nome, um lugar na ordem e os textos que o preenchem.
      required: [nome, ordem, slots]
      properties:
        nome:
          type: string
          description: |-
            Nome da seção. A ordem canônica da página de vendas é a das onze seções
            da ferramenta 73 de `documentos/ferramentas-do-projeto-meshcraft.md`:
            cubo, viloes, metodo, instrumentos, percurso, tempo, para_quem_nao_serve,
            se_eu_parar, oferta, carta e perguntas. É essa sequência que os eventos
            `funil.secao-vista` transformam numa escada de retenção.
        ordem:
          type: integer
          minimum: 0
          description: Posição desta seção na página, de cima para baixo.
        slots:
          type: object
          additionalProperties: { type: string }
          description: |-
            Os textos da seção, um por slot. O mapa é LIVRE aqui e o vocabulário é
            FECHADO dentro do `catalogo`, que recusa slot desconhecido na gravação.
            O mapa de slots permanece flexível no contrato; o provedor valida os
            nomes conhecidos e recusa slots desconhecidos.

            O vocabulário que o `catalogo` valida hoje, na ordem da ferramenta 73:

               1 cubo                 headline, subheadline, cta_texto, cta_destino, imagem
               2 viloes               headline, vilao_1, vilao_2, vilao_3, prova
               3 metodo               headline, texto, imagem, prova
               4 instrumentos         headline, texto, indice_de_estudios, prova
               5 percurso             headline, texto, prova
               6 tempo                headline, texto, prova
               7 para_quem_nao_serve  headline, recusa_1, recusa_2, recusa_3, recusa_4, recusa_5, recusa_6
               8 se_eu_parar          headline, texto
               9 oferta               headline, o_que_recebe, preco_texto, parcelamento, cta_texto
              10 carta                headline, texto, assinatura
              11 perguntas            headline, perguntas

            O slot `prova` existe em cinco seções porque a ferramenta 73 pede prova ao
            lado de cada afirmação. O PREÇO APARECE UMA VEZ, em `oferta.preco_texto`, e
            SEM ANCORAGEM: não há slot de valor riscado, e não haverá. Os padrões que a
            ferramenta 74 proíbe nesta página são contagem regressiva, "últimas vagas",
            valor riscado, promessa de renda ou de prazo e superlativo. Isto é
            documentação do contrato, não validação: quem recusa continua sendo o
            provedor, e a sentinela da ferramenta 74 mede a peça.

            O nome do slot é o que os eventos `funil.cta-clicado` carregam no campo
            `slot`. O texto muda a cada versão; o nome do slot não muda, e é por isso
            que ele serve de identificador e a copy não serve.
    ExperimentoAtivo:
      description: O experimento que está no ar nesta página, para quem renderiza sortear o braço.
      properties:
        id:
          format: uuid
          type: string
        secao:
          description: Seção da página cujo slot está em teste.
          type: string
        slot:
          description: Slot da seção cujo texto muda de uma variante para outra.
          type: string
        variantes:
          description: As variantes em ordem de `variante_id`, que é a do sorteio.
          items:
            $ref: '#/components/schemas/VarianteDoExperimento'
          type: array
      required:
      - id
      - secao
      - slot
      - variantes
      type: object
    VarianteDoExperimento:
      description: 'Um braço do experimento: a chave curta, o peso no sorteio e o texto do slot.'
      properties:
        variante_id:
          description: Chave curta da variante dentro do experimento. `a` é o controle, o texto que já estava
            publicado. É o valor que os eventos do funil carregam.
          pattern: ^[a-z][a-z0-9-]{0,31}$
          type: string
        peso:
          description: Parte dos visitantes que cai nesta variante, em pontos-base. As variantes de um experimento
            somam 10000 (metade para cada = 5000 e 5000).
          maximum: 10000
          minimum: 1
          type: integer
        valor:
          description: O texto do slot nesta variante, congelado quando o experimento sai do rascunho. Não
            muda nem se a página for publicada de novo.
          type: string
      required:
      - variante_id
      - peso
      - valor
      type: object
    ExperimentoDaPagina:
      description: Um experimento de uma página, do jeito que a tela do `admin` o lê.
      properties:
        id:
          format: uuid
          type: string
        site_id:
          format: uuid
          type: string
        slug:
          description: Apelido da página onde o experimento mora.
          type: string
        secao:
          type: string
        slot:
          type: string
        hipotese:
          type: string
        metrica_principal:
          type: string
        taxa_base:
          type: number
        mde:
          type: number
        n_por_braco_planejado:
          description: 'Expostos por braço calculados na criação: duas proporções, alfa 0,05 bicaudal, poder
            0,8. Braço abaixo disto no horizonte é resultado inconclusivo.'
          minimum: 1
          type: integer
        dias_planejados:
          type: integer
        estado:
          description: 'rascunho vai para ativo ou encerrado; ativo vai para encerrado; encerrado não sai
            mais. Não há pausa: retomar é criar outro.'
          enum:
          - rascunho
          - ativo
          - encerrado
          type: string
        decisao:
          anyOf:
          - enum:
            - promover
            - reverter
            - encerrar
            type: string
          - type: 'null'
          description: Guardada no encerramento. Nula antes dele.
        vencedora:
          anyOf:
          - type: string
          - type: 'null'
          description: '`variante_id` da vencedora, quando o encerramento aponta uma.'
        criado_em:
          format: date-time
          type: string
        iniciado_em:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Quando entrou no ar. Nulo enquanto é rascunho.
        fim_planejado:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'iniciado_em mais dias_planejados: o fim da janela em que o resultado se calcula. Nulo
            enquanto é rascunho.'
        encerrado_em:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        variantes:
          items:
            $ref: '#/components/schemas/VarianteDoExperimento'
          type: array
      required:
      - id
      - site_id
      - slug
      - secao
      - slot
      - hipotese
      - metrica_principal
      - taxa_base
      - mde
      - n_por_braco_planejado
      - dias_planejados
      - estado
      - decisao
      - vencedora
      - criado_em
      - iniciado_em
      - fim_planejado
      - encerrado_em
      - variantes
      type: object
    NovaVariante:
      description: Uma variante como a tela do `admin` a manda ao criar o experimento.
      properties:
        variante_id:
          description: Chave curta da variante. O controle `a` é obrigatório.
          pattern: ^[a-z][a-z0-9-]{0,31}$
          type: string
        peso:
          description: Pontos-base; as variantes do experimento somam 10000.
          maximum: 10000
          minimum: 1
          type: integer
        valor:
          description: 'O texto do slot nesta variante. No controle `a` pode ficar vazio: ele nasce com o
            texto publicado do slot, e um texto diferente é recusado.'
          type: string
      required:
      - variante_id
      - peso
      type: object
    NovoExperimento:
      description: 'O que a tela do `admin` manda para criar um experimento, que nasce em rascunho.


        O horizonte vem decidido de antemão: `taxa_base`, `mde` e `dias_planejados`

        entram aqui, e a amostra por braço é calculada pelo `catalogo`.'
      properties:
        secao:
          description: Seção da página, do vocabulário do tipo dela.
          type: string
        slot:
          description: Slot da seção cujo texto vai ser testado.
          type: string
        hipotese:
          description: O que se espera que aconteça, e por quê.
          minLength: 1
          type: string
        metrica_principal:
          description: 'O passo do funil que decide o experimento, com o nome que a leitura do funil usa (ex.
            cta_checkout: entrada no checkout por visitante).'
          maxLength: 100
          minLength: 1
          type: string
        taxa_base:
          description: Proporção atual da métrica principal, entre 0 e 1 (0,10 = 10%).
          exclusiveMaximum: 1
          exclusiveMinimum: 0
          type: number
        mde:
          description: Menor efeito que vale detectar, ABSOLUTO, em pontos de proporção (0,02 = de 10% para
            12%).
          exclusiveMaximum: 1
          exclusiveMinimum: 0
          type: number
        dias_planejados:
          description: Dias corridos de coleta, contados a partir do início.
          minimum: 1
          type: integer
        variantes:
          description: Pelo menos duas, e o controle `a` entre elas.
          items:
            $ref: '#/components/schemas/NovaVariante'
          minItems: 2
          type: array
      required:
      - secao
      - slot
      - hipotese
      - metrica_principal
      - taxa_base
      - mde
      - dias_planejados
      - variantes
      type: object
    MudancaDeEstado:
      description: O estado para onde o experimento vai, e no encerramento a decisão tomada.
      properties:
        estado:
          enum:
          - ativo
          - encerrado
          type: string
        decisao:
          anyOf:
          - enum:
            - promover
            - reverter
            - encerrar
            type: string
          - type: 'null'
          description: Obrigatória ao encerrar, e só ao encerrar.
        vencedora:
          anyOf:
          - type: string
          - type: 'null'
          description: '`variante_id` da vencedora. Obrigatória para promover; só vale ao encerrar.'
      required:
      - estado
      type: object
