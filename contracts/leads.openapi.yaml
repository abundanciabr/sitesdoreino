openapi: 3.1.0
info:
  title: Leads API
  version: 1.0.0
  description: |
    Pessoas antes do dinheiro: upsert de lead, tags e timeline. API INTERNA.
    Consumida pelo funil (captura) e alimentada por eventos (quiz, pedido, pagamento).
servers:
  - url: http://leads:8000/api/leads
security:
  - bearerAuth: []
paths:
  /leads:
    post:
      operationId: upsertLead
      summary: Cria ou atualiza lead (upsert por site_id+email; a mesma pessoa pode existir em vários sites)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_id, email]
              properties:
                site_id: { type: string }
                email: { type: string, format: email }
                name: { type: string }
                phone: { type: string }
                source: { type: string, description: "ex.: lp-certificacao, quiz-crivo" }
                utm:
                  type: object
                  additionalProperties: { type: string }
                tags:
                  type: array
                  items: { type: string }
                consent:
                  type: object
                  properties:
                    email_marketing: { type: boolean }
                    whatsapp: { type: boolean }
      responses:
        '200':
          description: Lead resultante (criado ou atualizado)
          content:
            application/json:
              schema:
                type: object
                required: [lead_id]
                properties:
                  lead_id: { type: string }
                  created: { type: boolean }
        '422': { description: Payload inválido }
  /leads/{lead_id}/tags:
    post:
      operationId: addTags
      summary: Acrescenta tags (nunca remove silenciosamente)
      parameters:
        - name: lead_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200': { description: Tags aplicadas }
        '404': { description: Lead inexistente }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
