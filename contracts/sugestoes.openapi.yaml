openapi: 3.1.0
info:
  title: Caixa de Sugestoes — API interna
  version: 1.0.0
  description: 'Superfície de MÁQUINA da Caixa, com duas metades.


    A primeira existe por uma razão só: o site (`funil`) precisa saber

    quem é a pessoa em qualquer página, e o cookie de sessão é assinado e

    resolvido AQUI (Lei 2, Lei 3 — o banco e o segredo não saem desta

    célula). Lei do assunto: docs/decisoes/DECISAO-onde-mora-a-sessao.md.


    A segunda é a GESTÃO das ideias, que desde 28/08/2026 mora em

    `/admin/caixa/` e não mais nas telas desta célula (decisão do

    mantenedor: uma porta só). O Admin pergunta e escreve por aqui porque

    pela Lei 3 nenhuma célula lê o banco de outra. A resposta carrega os

    FATOS de cada ideia — nunca colunas nem ordenação, que são da tela — e

    nunca o e-mail de quem sugeriu. Lei do assunto:

    docs/decisoes/DECISAO-a-gestao-da-caixa-mora-no-admin.md.


    Nenhuma resposta desta API AUTORIZA nada: autorização é fail-closed na

    célula dona do recurso — e a assinatura de obra continua sendo desta.

    '
paths:
  /sessao:
    get:
      operationId: getSession
      summary: Quem é o dono da sessão desta requisição
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
      description: 'Resolve o cookie de sessão repassado pelo chamador. Responde 200 sempre que o chamador
        estiver autorizado: `autenticado: false` significa que não há sessão (visitante), e NÃO é um erro.
        O e-mail nunca é devolvido.'
  /gestao/ideias:
    get:
      operationId: listManagementIdeas
      summary: Os fatos de cada ideia do quadro, para quem conduz
      parameters:
      - in: query
        name: por_email
        schema:
          default: ''
          type: string
        required: false
      - in: query
        name: incluir_arquivadas
        schema:
          default: false
          type: boolean
        required: false
      - in: query
        name: incluir_conversa
        schema:
          default: false
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadroEmGestao'
      description: 'Devolve o quadro inteiro com os fatos de cada ideia — votos, plateia, estado, datas,
        se tem avaliação interna e se tem ChangeSpec aprovado. NÃO devolve colunas, baldes nem ordenação:
        agrupar é do consumidor. O e-mail de quem sugeriu nunca viaja. Por padrão as arquivadas ficam de
        fora — `incluir_arquivadas=true` as traz de volta, para quem precisa achar uma ideia arquivada
        para desarquivar. O texto dos comentários também fica de fora por padrão: `incluir_conversa=true`
        o traz, e ele vem sem o nome de quem escreveu.'
  /gestao/ideias/{sugestao_id}:
    get:
      operationId: getManagementIdea
      summary: Uma ideia, com a história dela
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaComHistorico'
      description: 'A mesma ideia da lista, mais o histórico de mudanças de fase — cada linha com quando,
        de onde para onde, a nota escrita e o nome de quem moderou — e a ficha de cada ChangeSpec assinado:
        qual documento, quem aprovou, quando, e quem trouxe o fato para dentro da Caixa. Os dois são append-only
        na origem: uma correção é uma linha nova, nunca uma linha reescrita. Nenhum e-mail viaja.'
  /gestao/ideias/{sugestao_id}/status:
    post:
      operationId: setIdeaStatus
      summary: Move a ideia de fase, com histórico e avisos
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'Passa pelo mesmo caminho da tela antiga: o histórico nasce na MESMA transação, a plateia
        inteira recebe aviso, ''não planejado'' exige justificativa e ''planejado → em desenvolvimento''
        exige ChangeSpec aprovado registrado. Recusa 422 com a frase que ensina o caminho.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MudancaDeStatus'
        required: true
  /gestao/ideias/{sugestao_id}/avaliacao:
    post:
      operationId: setIdeaReview
      summary: Escreve a avaliação interna da equipe
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
      description: Impacto educacional, impacto comercial, esforço técnico, anotações e a decisão de produto.
        Nada disto é visível ao aluno (spec §8).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoEscrita'
        required: true
  /gestao/ideias/{sugestao_id}/changespec:
    post:
      operationId: registerApprovedChangeSpec
      summary: Registra o ChangeSpec aprovado que destrava a obra
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'O SEGUNDO portão da Caixa, e ele NÃO mudou de dono: só quem está em SUGESTOES_APROVADORES
        registra, e a lista vazia recusa todo mundo. Estar autorizado no Admin não basta — moderar e autorizar
        desenvolvimento são papéis diferentes.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSpecEscrito'
        required: true
  /gestao/ideias/{sugestao_id}/texto:
    post:
      operationId: fixIdeaText
      summary: Corrige o nome e o texto da ideia — o aluno não vê marca nenhuma
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: '`DECISAO-corrigir-o-texto-de-uma-ideia.md` (31/08/2026): existe para o erro de digitação do aluno,
        e a correção é CALADA — nenhuma marca na página que ele lê. O rastro fica inteiro do lado da equipe: cada
        campo alterado vira uma linha append-only com o texto anterior, o texto novo e quem corrigiu, e volta em `correcoes`
        na ideia individual. As mesmas réguas de quando o aluno escreveu (nome obrigatório e de até 140 caracteres,
        problema obrigatório). Recusa 422 se a ideia foi apagada definitivamente, se uma régua não passa, ou se o
        texto enviado é igual ao que já estava lá — este último para um formulário salvo sem alteração não responder
        “corrigido” tendo gravado nada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoCorrigido'
        required: true
  /gestao/ideias/{sugestao_id}/arquivar:
    post:
      operationId: archiveIdea
      summary: Arquiva a ideia — some do quadro do aluno, nada se perde
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: '`DECISAO-arquivar-ideia.md` (29/08/2026): não é um apagar de vez. A ideia, os votos,
        os comentários e o histórico continuam intactos no banco; ela só deixa de aparecer no quadro,
        na busca de duplicatas e em qualquer página que o aluno alcance. Desarquivar traz tudo de volta
        exatamente como estava. Recusa 422 se já estiver arquivada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArquivamentoEscrito'
        required: true
  /gestao/ideias/{sugestao_id}/desarquivar:
    post:
      operationId: unarchiveIdea
      summary: Desarquiva a ideia — volta a aparecer para o aluno
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'O inverso de arquivar, e simétrico: a ideia volta ao quadro exatamente como estava
        (mesmo status, mesmos votos, mesmo histórico). Recusa 422 se ela não estiver arquivada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuemAge'
        required: true
  /gestao/ideias/{sugestao_id}/apagar:
    post:
      operationId: deleteIdeaForever
      summary: Apaga a ideia definitivamente — sem volta, nem para quem criou
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: '`DECISAO-apagar-ideia.md` (29/08/2026). Título, texto e solução ficam vazios, votos
        e comentários são removidos — para sempre, de qualquer pessoa que tenha participado, não só do
        autor. NINGUÉM alcança este conteúdo de novo, nem pelo link direto, nem esta API. A LINHA continua
        existindo no banco (uma ideia apagada também vira arquivada), porque `HistoricoStatus`/`ChangeSpecAprovado`/`Aviso`
        são append-only e apontam para ela — apagar a linha quebraria essa trava. Recusa 422 se já tiver
        sido apagada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuemAge'
        required: true
  /gestao/fusoes/previas:
    post:
      operationId: previewIdeaMerges
      summary: Como ficariam estas junções, sem juntar nada
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviasDeFusao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'Só leitura: é o que a tela mostra antes de perguntar “tem certeza?”. Vários grupos numa
        chamada só porque a tela que a usa mostra a lista inteira de junções propostas de uma vez, e uma
        ida por grupo faria a página esperar o dobro. O número que importa é `votos_depois`, e ele quase
        nunca é a soma: quem votou em duas ideias juntadas continua sendo uma pessoa com um voto, e `votos_em_comum`
        diz quantas são. `impedimento` preenchido significa que esta junção não pode acontecer, com o motivo
        em português — a tela mostra o motivo em vez de esconder o botão.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviasPedidas'
        required: true
  /gestao/fusoes:
    post:
      operationId: mergeIdeas
      summary: Junta as ideias de verdade, numa transação só
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusaoFeita'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'Move os votos (quem votou em duas não vira dois votos: o repetido é descartado e ANOTADO,
        para o desfazer poder devolvê-lo), move os comentários, liga a ideia absorvida à que ficou de pé
        (a URL antiga continua resolvendo) e muda o status para `mesclado` pelo caminho que escreve histórico
        e avisa toda a plateia. Tudo ou nada. Recusa 422 com o motivo em português quando a junção não pode
        acontecer.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FusaoPedida'
        required: true
    get:
      operationId: listIdeaMerges
      summary: As junções que ainda valem, para poder desfazer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusoesEmVigor'
      description: 'Só as que estão em vigor: junção desfeita saiu do caminho e não volta à lista. É por
        aqui que a tela sabe o que oferecer para desfazer.'
  /gestao/fusoes/{fusao_id}/desfazer:
    post:
      operationId: undoIdeaMerge
      summary: 'Desfaz a junção inteira: votos, comentários e status voltam'
      parameters:
      - in: path
        name: fusao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusaoFeita'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'Devolve o que ainda existe, e nunca inventa: um voto que a pessoa TIROU depois da junção
        não volta, porque ressuscitá-lo seria votar no lugar dela. O voto que esta operação apagou (o de
        quem tinha votado nas duas) é recriado, esse sim: a pessoa não fez nada para perdê-lo. Recusa 422
        se a junção não existe ou já foi desfeita.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuemAge'
        required: true
components:
  schemas:
    Session:
      description: 'Quem é o dono da sessão; sem sessão, só `autenticado: false`.'
      properties:
        autenticado:
          type: boolean
        id:
          anyOf:
          - type: string
          - type: 'null'
        nome_exibido:
          anyOf:
          - type: string
          - type: 'null'
        papel:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - autenticado
      type: object
    AvaliacaoDaEquipe:
      description: As notas internas. Só o Admin as vê; o aluno nunca (spec §8).
      properties:
        impacto_educacional:
          type: integer
        impacto_comercial:
          type: integer
        esforco_tecnico:
          type: integer
        notas:
          type: string
        decisao_produto:
          type: string
      required:
      - impacto_educacional
      - impacto_comercial
      - esforco_tecnico
      - notas
      - decisao_produto
      type: object
    FalaNaIdeia:
      description: 'Um comentário, como ele foi escrito — o que a contagem `comentarios` não diz.


        **Sem quem escreveu, e isto é decisão, não esquecimento.** O histórico manda

        `por` porque a tela da moderação mostra quem moderou: ali o nome tem função.

        A conversa embaixo de uma ideia não tem tela nenhuma que a mostre — quem a

        pede é a exportação do Admin, cuja razão de existir é justamente o texto sair

        da área administrativa sem nome de aluno junto. Um campo com nome de pessoa

        e nenhum consumidor que precise dele é dado pessoal atravessando fronteira

        de graça, e a casa não faz isso (o e-mail nunca viaja; o nome exibido só vai

        onde uma tela o mostra).'
      properties:
        texto:
          type: string
        quando:
          type: string
      required:
      - texto
      - quando
      type: object
    IdeiaEmGestao:
      description: Os FATOS de uma ideia. Nenhuma coluna, nenhum balde, nenhuma ordem.
      properties:
        id:
          type: integer
        titulo:
          type: string
        problema:
          type: string
        solucao_proposta:
          type: string
        categoria:
          type: string
        status:
          type: string
        votos:
          type: integer
        comentarios:
          type: integer
        pessoas:
          type: integer
        autor:
          type: string
        criada_em:
          type: string
        parada_desde:
          type: string
        ja_ouviram:
          type: boolean
        tem_avaliacao:
          type: boolean
        tem_changespec:
          type: boolean
        motivo_da_saida:
          type: string
        avaliacao:
          anyOf:
          - $ref: '#/components/schemas/AvaliacaoDaEquipe'
          - type: 'null'
        arquivada:
          default: false
          type: boolean
        arquivada_em:
          default: ''
          type: string
        motivo_do_arquivamento:
          default: ''
          type: string
        apagada:
          default: false
          type: boolean
        conversa:
          default: []
          items:
            $ref: '#/components/schemas/FalaNaIdeia'
          type: array
      required:
      - id
      - titulo
      - problema
      - solucao_proposta
      - categoria
      - status
      - votos
      - comentarios
      - pessoas
      - autor
      - criada_em
      - parada_desde
      - ja_ouviram
      - tem_avaliacao
      - tem_changespec
      - motivo_da_saida
      type: object
    QuadroEmGestao:
      properties:
        quadro:
          type: string
        ideias:
          items:
            $ref: '#/components/schemas/IdeiaEmGestao'
          type: array
        pode_assinar:
          type: boolean
        pessoas_esperando:
          type: integer
        silencio_medio_em_dias:
          anyOf:
          - type: integer
          - type: 'null'
        pessoas_em_silencio_demais:
          default: 0
          type: integer
      required:
      - quadro
      - ideias
      - pode_assinar
      - pessoas_esperando
      type: object
    IdeiaComHistorico:
      description: 'A ideia inteira, com a história dela.


        Existe separada de `IdeiaEmGestao` porque o histórico só faz sentido quando

        se olha UMA ideia: carregá-lo na lista multiplicaria a resposta por algo que

        nenhuma tela de lista mostra — e cresceria com o uso, que é o pior tipo de

        custo, o que só aparece quando a Caixa dá certo.


        Ela nasce agora porque a gestão saiu da Caixa: sem esta operação, a história

        de cada ideia ficaria inalcançável no dia em que as telas antigas forem

        aposentadas. Descobrir isso ANTES de aposentá-las é a razão de esta emenda

        existir.


        `changespecs` entra pelo mesmo caminho e pelo mesmo motivo, uma emenda

        depois: era a ÚNICA das cinco telas antigas de `/moderacao` sem paridade

        nenhuma do lado do Admin — ele deixava ASSINAR e não deixava CONFERIR o que

        foi assinado. Lista, e não objeto: uma ideia pode ter vários ChangeSpecs

        (escopo que mudou nasce `-v2`, formato §4), e a tela antiga sempre os

        listou. Ordem: o mais recente primeiro, a mesma do model. Ela entra

        OPCIONAL: ausente é "esta ideia não tem assinatura nenhuma", o mesmo que a

        lista vazia — e é isso que faz o campo novo não quebrar quem já consome.'
      properties:
        id:
          type: integer
        titulo:
          type: string
        problema:
          type: string
        solucao_proposta:
          type: string
        categoria:
          type: string
        status:
          type: string
        votos:
          type: integer
        comentarios:
          type: integer
        pessoas:
          type: integer
        autor:
          type: string
        criada_em:
          type: string
        parada_desde:
          type: string
        ja_ouviram:
          type: boolean
        tem_avaliacao:
          type: boolean
        tem_changespec:
          type: boolean
        motivo_da_saida:
          type: string
        avaliacao:
          anyOf:
          - $ref: '#/components/schemas/AvaliacaoDaEquipe'
          - type: 'null'
        arquivada:
          default: false
          type: boolean
        arquivada_em:
          default: ''
          type: string
        motivo_do_arquivamento:
          default: ''
          type: string
        apagada:
          default: false
          type: boolean
        conversa:
          default: []
          items:
            $ref: '#/components/schemas/FalaNaIdeia'
          type: array
        historico:
          items:
            $ref: '#/components/schemas/LinhaDoHistorico'
          type: array
        changespecs:
          items:
            $ref: '#/components/schemas/ChangeSpecAssinado'
          type: array
        correcoes:
          items:
            $ref: '#/components/schemas/LinhaDaCorrecao'
          type: array
      required:
      - id
      - titulo
      - problema
      - solucao_proposta
      - categoria
      - status
      - votos
      - comentarios
      - pessoas
      - autor
      - criada_em
      - parada_desde
      - ja_ouviram
      - tem_avaliacao
      - tem_changespec
      - motivo_da_saida
      - historico
      type: object
    LinhaDoHistorico:
      description: 'Uma mudança de fase, como ela ficou registrada — append-only na origem.


        `por` é o nome exibido de quem moderou, nunca o e-mail: a regra do e-mail

        vale para QUALQUER pessoa que apareça na resposta, não só para o aluno que

        sugeriu.'
      properties:
        quando:
          type: string
        de:
          type: string
        para:
          type: string
        nota:
          type: string
        por:
          type: string
      required:
      - quando
      - de
      - para
      - nota
      - por
      type: object
    ChangeSpecAssinado:
      description: 'Uma assinatura de obra, como ela ficou registrada — a FICHA dela.


        `tem_changespec` responde "está assinada?"; esta ficha responde "assinada

        por quem, quando, com qual documento?". São perguntas diferentes, e só a

        segunda permite CONFERIR depois o que foi autorizado — que é a razão de o

        documento ser um endereço obrigatório desde o EVO-40.


        Ela viaja só em `IdeiaComHistorico`, pelo mesmo motivo do histórico: a lista

        do quadro não mostra ficha nenhuma, e carregá-la ali multiplicaria a

        resposta por algo que ninguém lê.


        `registrado_por` é o nome exibido, nunca o e-mail — a mesma regra do `por`

        do histórico, e vazio é resposta legítima: quem exibe decide o que escrever

        no lugar.'
      properties:
        change_id:
          type: string
        documento:
          type: string
        aprovado_por:
          type: string
        aprovado_em:
          type: string
        registrado_por:
          type: string
        registrado_em:
          type: string
      required:
      - change_id
      - documento
      - aprovado_por
      - aprovado_em
      - registrado_por
      - registrado_em
      type: object
    LinhaDaCorrecao:
      description: 'Uma correção de texto, como ela ficou registrada — append-only na origem.
    
    
        Só a EQUIPE vê isto. A correção é calada para o aluno (decisão do mantenedor
    
        em 31/08/2026), e calada só é aceitável porque o que estava escrito antes
    
        fica guardado inteiro em algum lugar, e este é o lugar.
    
    
        `por` é o nome exibido de quem corrigiu, nunca o e-mail: a mesma regra do
    
        histórico de fases.'
      properties:
        quando:
          type: string
        campo:
          type: string
        antes:
          type: string
        depois:
          type: string
        por:
          type: string
      required:
      - quando
      - campo
      - antes
      - depois
      - por
      type: object
    Recusa:
      description: Uma recusa que ENSINA o caminho — a frase é a mesma que a tela dizia.
      properties:
        erro:
          type: string
      required:
      - erro
      type: object
    MudancaDeStatus:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        status:
          type: string
        nota:
          default: ''
          type: string
      required:
      - por_email
      - status
      type: object
    AvaliacaoEscrita:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        impacto_educacional:
          default: 0
          type: integer
        impacto_comercial:
          default: 0
          type: integer
        esforco_tecnico:
          default: 0
          type: integer
        notas:
          default: ''
          type: string
        decisao_produto:
          default: ''
          type: string
      required:
      - por_email
      type: object
    ChangeSpecEscrito:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        change_id:
          type: string
        documento:
          type: string
        aprovado_por:
          type: string
        aprovado_em:
          format: date
          type: string
      required:
      - por_email
      - change_id
      - documento
      - aprovado_por
      - aprovado_em
      type: object
    ArquivamentoEscrito:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        motivo:
          default: ''
          type: string
      required:
      - por_email
      type: object
    TextoCorrigido:
      description: 'O texto inteiro como ele deve ficar, não só o pedaço que mudou.
    
    
        Os três campos viajam SEMPRE, com o valor final de cada um — inclusive os
    
        que não mudaram. É o que a tela tem na mão (um formulário preenchido com o
    
        texto atual), e é o que torna a operação idempotente: reenviar o mesmo corpo
    
        duas vezes não cria uma segunda correção, porque a segunda não muda nada e a
    
        Caixa a recusa dizendo isso.
    
    
        A alternativa — mandar só os campos alterados — obrigaria a distinguir "não
    
        mandei este campo" de "mandei este campo vazio", que num JSON são a mesma
    
        ausência para quem não declara `null` explicitamente. Apagar a solução
    
        proposta é uma correção legítima, e ela não pode depender dessa sutileza.
    
    
        `solucao_proposta` é a única com default: ela é opcional na ideia desde
    
        sempre, e omiti-la significa "esta ideia não tem solução proposta".'
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        titulo:
          type: string
        problema:
          type: string
        solucao_proposta:
          default: ''
          type: string
      required:
      - por_email
      - titulo
      - problema
      type: object
    QuemAge:
      description: 'Quem está agindo, vindo do Admin.


        O e-mail é o de quem abriu o Admin — resolvido lá pela `identidade`, que é

        quem tem esse direito. A Caixa o usa para duas coisas e nada mais: achar (ou

        cunhar) a linha local que o histórico exige como autor da mudança, e conferir

        a lista de aprovadores. Não é o e-mail de nenhum ALUNO: esse continua sem

        sair daqui.


        **`por_id_da_plataforma` não é enfeite, e não é opcional na prática.** Toda

        mudança de status vira uma carta endereçada, e [INV-SUG12] exige que quem

        moderou tenha o id que atravessa a plataforma — sem ele o fato não pode ser

        afirmado e a escrita é recusada com instrução (não com erro 500). O Admin já

        tem esse id: é o mesmo `SessionFull.id` que ele leu da `identidade` para

        abrir a própria porta. Ele entra como texto vazio-permitido só porque o

        contrato da `identidade` declara o campo nulável — e é justamente esse caso

        que a recusa legível existe para cobrir.'
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
      required:
      - por_email
      type: object
    PreviaDeFusao:
      properties:
        canonica:
          $ref: '#/components/schemas/RetratoDeIdeia'
        absorvidas:
          items:
            $ref: '#/components/schemas/RetratoDeIdeia'
          type: array
        votos_hoje:
          type: integer
        votos_depois:
          type: integer
        votos_em_comum:
          type: integer
        pessoas_depois:
          type: integer
        comentarios_depois:
          type: integer
        impedimento:
          default: ''
          type: string
      required:
      - canonica
      - absorvidas
      - votos_hoje
      - votos_depois
      - votos_em_comum
      - pessoas_depois
      - comentarios_depois
      type: object
    PreviasDeFusao:
      properties:
        previas:
          items:
            $ref: '#/components/schemas/PreviaDeFusao'
          type: array
      required:
      - previas
      type: object
    RetratoDeIdeia:
      properties:
        id:
          type: integer
        titulo:
          type: string
        votos:
          type: integer
        pessoas:
          type: integer
        comentarios:
          type: integer
      required:
      - id
      - titulo
      - votos
      - pessoas
      - comentarios
      type: object
    GrupoParaJuntar:
      properties:
        canonica:
          type: integer
        absorvidas:
          items:
            type: integer
          type: array
      required:
      - canonica
      - absorvidas
      type: object
    PreviasPedidas:
      properties:
        grupos:
          items:
            $ref: '#/components/schemas/GrupoParaJuntar'
          type: array
      required:
      - grupos
      type: object
    FusaoFeita:
