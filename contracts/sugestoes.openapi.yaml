            $ref: '#/components/schemas/IdeiaNaJuncao'
          type: array
        nota:
          default: ''
          type: string
        feita_em:
          type: string
        em_vigor:
          type: boolean
      required:
      - id
      - canonica
      - absorvidas
      - feita_em
      - em_vigor
      type: object
    IdeiaNaJuncao:
      properties:
        id:
          type: integer
        titulo:
          type: string
        votos_movidos:
          type: integer
        votos_descartados:
          type: integer
        comentarios_movidos:
          type: integer
      required:
      - id
      - titulo
      - votos_movidos
      - votos_descartados
      - comentarios_movidos
      type: object
    FusaoPedida:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        canonica:
          type: integer
        absorvidas:
          items:
            type: integer
          type: array
        nota:
          default: ''
          type: string
      required:
      - por_email
      - canonica
      - absorvidas
      type: object
    FusoesEmVigor:
      properties:
