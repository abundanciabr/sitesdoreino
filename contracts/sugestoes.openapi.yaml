openapi: 3.1.0
info:
  title: Caixa de Sugestoes — API interna
  version: 1.0.0
  description: 'Superfície de MÁQUINA da Caixa, com duas metades.


    A primeira existe por uma razão só: o site (`funil`) precisa saber

    quem é a pessoa em qualquer página, e o cookie de sessão é assinado e

    resolvido AQUI (Lei 2, Lei 3 — o banco e o segredo não saem desta

    célula). Lei do assunto: docs/decisoes/DECISAO-onde-mora-a-sessao.md.


    A segunda é a GESTÃO das ideias, que desde 28/08/2026 mora em

    `/admin/caixa/` e não mais nas telas desta célula (decisão do

    mantenedor: uma porta só). O Admin pergunta e escreve por aqui porque

    pela Lei 3 nenhuma célula lê o banco de outra. A resposta carrega os

    FATOS de cada ideia — nunca colunas nem ordenação, que são da tela — e

    nunca o e-mail de quem sugeriu. Lei do assunto:

    docs/decisoes/DECISAO-a-gestao-da-caixa-mora-no-admin.md.


    Nenhuma resposta desta API AUTORIZA nada: autorização é fail-closed na

    célula dona do recurso — e a assinatura de obra continua sendo desta.

    '
paths:
  /sessao:
    get:
      operationId: getSession
      summary: Quem é o dono da sessão desta requisição
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
      description: 'Resolve o cookie de sessão repassado pelo chamador. Responde 200 sempre que o chamador
        estiver autorizado: `autenticado: false` significa que não há sessão (visitante), e NÃO é um erro.
        O e-mail nunca é devolvido.'
  /gestao/ideias:
    get:
      operationId: listManagementIdeas
      summary: Os fatos de cada ideia do quadro, para quem conduz
      parameters:
      - in: query
        name: por_email
        schema:
          default: ''
          type: string
        required: false
      - in: query
        name: incluir_arquivadas
        schema:
          default: false
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadroEmGestao'
      description: 'Devolve o quadro inteiro com os fatos de cada ideia — votos, plateia, estado, datas,
        se tem avaliação interna e se tem ChangeSpec aprovado. NÃO devolve colunas, baldes nem ordenação:
        agrupar é do consumidor. O e-mail de quem sugeriu nunca viaja. Por padrão as arquivadas ficam de
        fora — `incluir_arquivadas=true` as traz de volta, para quem precisa achar uma ideia arquivada
        para desarquivar.'
  /gestao/ideias/{sugestao_id}:
    get:
      operationId: getManagementIdea
      summary: Uma ideia, com a história dela
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaComHistorico'
      description: 'A mesma ideia da lista, mais o histórico de mudanças de fase — cada linha com quando,
        de onde para onde, a nota escrita e o nome de quem moderou. O histórico é append-only na origem:
        uma correção é uma linha nova, nunca uma linha reescrita. Nenhum e-mail viaja.'
  /gestao/ideias/{sugestao_id}/status:
    post:
      operationId: setIdeaStatus
      summary: Move a ideia de fase, com histórico e avisos
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'Passa pelo mesmo caminho da tela antiga: o histórico nasce na MESMA transação, a plateia
        inteira recebe aviso, ''não planejado'' exige justificativa e ''planejado → em desenvolvimento''
        exige ChangeSpec aprovado registrado. Recusa 422 com a frase que ensina o caminho.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MudancaDeStatus'
        required: true
  /gestao/ideias/{sugestao_id}/avaliacao:
    post:
      operationId: setIdeaReview
      summary: Escreve a avaliação interna da equipe
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
      description: Impacto educacional, impacto comercial, esforço técnico, anotações e a decisão de produto.
        Nada disto é visível ao aluno (spec §8).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoEscrita'
        required: true
  /gestao/ideias/{sugestao_id}/changespec:
    post:
      operationId: registerApprovedChangeSpec
      summary: Registra o ChangeSpec aprovado que destrava a obra
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'O SEGUNDO portão da Caixa, e ele NÃO mudou de dono: só quem está em SUGESTOES_APROVADORES
        registra, e a lista vazia recusa todo mundo. Estar autorizado no Admin não basta — moderar e autorizar
        desenvolvimento são papéis diferentes.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSpecEscrito'
        required: true
  /gestao/ideias/{sugestao_id}/arquivar:
    post:
      operationId: archiveIdea
      summary: Arquiva a ideia — some do quadro do aluno, nada se perde
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: '`DECISAO-arquivar-ideia.md` (29/08/2026): não é um apagar de vez. A ideia, os votos,
        os comentários e o histórico continuam intactos no banco; ela só deixa de aparecer no quadro,
        na busca de duplicatas e em qualquer página que o aluno alcance. Desarquivar traz tudo de volta
        exatamente como estava. Recusa 422 se já estiver arquivada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArquivamentoEscrito'
        required: true
  /gestao/ideias/{sugestao_id}/desarquivar:
    post:
      operationId: unarchiveIdea
      summary: Desarquiva a ideia — volta a aparecer para o aluno
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: 'O inverso de arquivar, e simétrico: a ideia volta ao quadro exatamente como estava
        (mesmo status, mesmos votos, mesmo histórico). Recusa 422 se ela não estiver arquivada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuemAge'
        required: true
  /gestao/ideias/{sugestao_id}/apagar:
    post:
      operationId: deleteIdeaForever
      summary: Apaga a ideia definitivamente — sem volta, nem para quem criou
      parameters:
      - in: path
        name: sugestao_id
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaEmGestao'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recusa'
      description: '`DECISAO-apagar-ideia.md` (29/08/2026). Título, texto e solução ficam vazios, votos
        e comentários são removidos — para sempre, de qualquer pessoa que tenha participado, não só do
        autor. NINGUÉM alcança este conteúdo de novo, nem pelo link direto, nem esta API. A LINHA continua
        existindo no banco (uma ideia apagada também vira arquivada), porque `HistoricoStatus`/`ChangeSpecAprovado`/`Aviso`
        são append-only e apontam para ela — apagar a linha quebraria essa trava. Recusa 422 se já tiver
        sido apagada.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuemAge'
        required: true
components:
  schemas:
    Session:
      description: 'Quem é o dono da sessão; sem sessão, só `autenticado: false`.'
      properties:
        autenticado:
          type: boolean
        id:
          anyOf:
          - type: string
          - type: 'null'
        nome_exibido:
          anyOf:
          - type: string
          - type: 'null'
        papel:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - autenticado
      type: object
    AvaliacaoDaEquipe:
      description: As notas internas. Só o Admin as vê; o aluno nunca (spec §8).
      properties:
        impacto_educacional:
          type: integer
        impacto_comercial:
          type: integer
        esforco_tecnico:
          type: integer
        notas:
          type: string
        decisao_produto:
          type: string
      required:
      - impacto_educacional
      - impacto_comercial
      - esforco_tecnico
      - notas
      - decisao_produto
      type: object
    IdeiaEmGestao:
      description: Os FATOS de uma ideia. Nenhuma coluna, nenhum balde, nenhuma ordem.
      properties:
        id:
          type: integer
        titulo:
          type: string
        problema:
          type: string
        solucao_proposta:
          type: string
        categoria:
          type: string
        status:
          type: string
        votos:
          type: integer
        comentarios:
          type: integer
        pessoas:
          type: integer
        autor:
          type: string
        criada_em:
          type: string
        parada_desde:
          type: string
        ja_ouviram:
          type: boolean
        tem_avaliacao:
          type: boolean
        tem_changespec:
          type: boolean
        motivo_da_saida:
          type: string
        avaliacao:
          anyOf:
          - $ref: '#/components/schemas/AvaliacaoDaEquipe'
          - type: 'null'
        arquivada:
          default: false
          type: boolean
        arquivada_em:
          default: ''
          type: string
        motivo_do_arquivamento:
          default: ''
          type: string
        apagada:
          default: false
          type: boolean
      required:
      - id
      - titulo
      - problema
      - solucao_proposta
      - categoria
      - status
      - votos
      - comentarios
      - pessoas
      - autor
      - criada_em
      - parada_desde
      - ja_ouviram
      - tem_avaliacao
      - tem_changespec
      - motivo_da_saida
      type: object
    QuadroEmGestao:
      properties:
        quadro:
          type: string
        ideias:
          items:
            $ref: '#/components/schemas/IdeiaEmGestao'
          type: array
        pode_assinar:
          type: boolean
        pessoas_esperando:
          type: integer
        silencio_medio_em_dias:
          anyOf:
          - type: integer
          - type: 'null'
        pessoas_em_silencio_demais:
          default: 0
          type: integer
      required:
      - quadro
      - ideias
      - pode_assinar
      - pessoas_esperando
      type: object
    IdeiaComHistorico:
      description: 'A ideia inteira, com a história dela.


        Existe separada de `IdeiaEmGestao` porque o histórico só faz sentido quando

        se olha UMA ideia: carregá-lo na lista multiplicaria a resposta por algo que

        nenhuma tela de lista mostra — e cresceria com o uso, que é o pior tipo de

        custo, o que só aparece quando a Caixa dá certo.


        Ela nasce agora porque a gestão saiu da Caixa: sem esta operação, a história

        de cada ideia ficaria inalcançável no dia em que as telas antigas forem

        aposentadas. Descobrir isso ANTES de aposentá-las é a razão de esta emenda

        existir.'
      properties:
        id:
          type: integer
        titulo:
          type: string
        problema:
          type: string
        solucao_proposta:
          type: string
        categoria:
          type: string
        status:
          type: string
        votos:
          type: integer
        comentarios:
          type: integer
        pessoas:
          type: integer
        autor:
          type: string
        criada_em:
          type: string
        parada_desde:
          type: string
        ja_ouviram:
          type: boolean
        tem_avaliacao:
          type: boolean
        tem_changespec:
          type: boolean
        motivo_da_saida:
          type: string
        avaliacao:
          anyOf:
          - $ref: '#/components/schemas/AvaliacaoDaEquipe'
          - type: 'null'
        arquivada:
          default: false
          type: boolean
        arquivada_em:
          default: ''
          type: string
        motivo_do_arquivamento:
          default: ''
          type: string
        apagada:
          default: false
          type: boolean
        historico:
          items:
            $ref: '#/components/schemas/LinhaDoHistorico'
          type: array
      required:
      - id
      - titulo
      - problema
      - solucao_proposta
      - categoria
      - status
      - votos
      - comentarios
      - pessoas
      - autor
      - criada_em
      - parada_desde
      - ja_ouviram
      - tem_avaliacao
      - tem_changespec
      - motivo_da_saida
      - historico
      type: object
    LinhaDoHistorico:
      description: 'Uma mudança de fase, como ela ficou registrada — append-only na origem.


        `por` é o nome exibido de quem moderou, nunca o e-mail: a regra do e-mail

        vale para QUALQUER pessoa que apareça na resposta, não só para o aluno que

        sugeriu.'
      properties:
        quando:
          type: string
        de:
          type: string
        para:
          type: string
        nota:
          type: string
        por:
          type: string
      required:
      - quando
      - de
      - para
      - nota
      - por
      type: object
    Recusa:
      description: Uma recusa que ENSINA o caminho — a frase é a mesma que a tela dizia.
      properties:
        erro:
          type: string
      required:
      - erro
      type: object
    MudancaDeStatus:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        status:
          type: string
        nota:
          default: ''
          type: string
      required:
      - por_email
      - status
      type: object
    AvaliacaoEscrita:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        impacto_educacional:
          default: 0
          type: integer
        impacto_comercial:
          default: 0
          type: integer
        esforco_tecnico:
          default: 0
          type: integer
        notas:
          default: ''
          type: string
        decisao_produto:
          default: ''
          type: string
      required:
      - por_email
      type: object
    ChangeSpecEscrito:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        change_id:
          type: string
        documento:
          type: string
        aprovado_por:
          type: string
        aprovado_em:
          format: date
          type: string
      required:
      - por_email
      - change_id
      - documento
      - aprovado_por
      - aprovado_em
      type: object
    ArquivamentoEscrito:
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
        motivo:
          default: ''
          type: string
      required:
      - por_email
      type: object
    QuemAge:
      description: 'Quem está agindo, vindo do Admin.


        O e-mail é o de quem abriu o Admin — resolvido lá pela `identidade`, que é

        quem tem esse direito. A Caixa o usa para duas coisas e nada mais: achar (ou

        cunhar) a linha local que o histórico exige como autor da mudança, e conferir

        a lista de aprovadores. Não é o e-mail de nenhum ALUNO: esse continua sem

        sair daqui.


        **`por_id_da_plataforma` não é enfeite, e não é opcional na prática.** Toda

        mudança de status vira uma carta endereçada, e [INV-SUG12] exige que quem

        moderou tenha o id que atravessa a plataforma — sem ele o fato não pode ser

        afirmado e a escrita é recusada com instrução (não com erro 500). O Admin já

        tem esse id: é o mesmo `SessionFull.id` que ele leu da `identidade` para

        abrir a própria porta. Ele entra como texto vazio-permitido só porque o

        contrato da `identidade` declara o campo nulável — e é justamente esse caso

        que a recusa legível existe para cobrir.'
      properties:
        por_email:
          type: string
        por_nome:
          default: ''
          type: string
        por_id_da_plataforma:
          default: ''
          type: string
      required:
      - por_email
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
servers:
- url: http://sugestoes:8000/interno
security:
- bearerAuth: []
