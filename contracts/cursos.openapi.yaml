    InstrumentoParaGravarSchema:
      additionalProperties: false
      description: 'O corpo de `putInstrument`: a escala, os mínimos, a seção e os

        descritores. `nome_canonico` e `cartao` são da lei, não do editor: vêm no

        corpo, é 422.'
      properties:
        escala:
          additionalProperties: true
          type: object
        minimo_exercicio:
          maxLength: 200
          type: string
        minimo_contrato:
          maxLength: 200
          type: string
        secao_do_padrao:
          maxLength: 120
          type: string
        descritores:
          additionalProperties: true
          type: object
      required:
      - escala
      - minimo_exercicio
      - minimo_contrato
      - secao_do_padrao
      - descritores
      type: object
    ParteDoCurso:
      enum:
      - 1
      - 2
      - 3
      type: integer
    DefeitoSchema:
      description: 'Um defeito de coerência apontado por `checkLesson` (degrau 3.1).


        Os campos são os do `apps.cursos.coerencia.Defeito`, e a tradução para

        português JÁ VEM PRONTA daqui: `frase` diz o que está errado e

        `o_que_fazer` diz o conserto, as duas escritas para a professora ler. A

        tela do Admin as mostra verbatim, e isso é de propósito: reescrevê-las lá

        amarraria a tela à redação desta célula, que é a dona da regra. É o mesmo

        desenho do `value_error` que `putInstrument` já devolve.


        `peca` é o tipo da peça onde está o defeito, ou texto VAZIO quando ele é da

        aula inteira: o mesmo arquivo escrito com dois nomes não mora em peça

        nenhuma, mora entre elas. `alvo` é o pedaço de texto em falta, para quem

        for consertar poder procurá-lo.


        `impede_publicar` é verdadeiro só na remissão quebrada, que é o

        [INV-CUR-C1]. Ele viaja dentro do defeito, e não numa segunda lista de

        códigos que vetam, porque uma segunda lista divergiria da recusa de

        `publishLesson` no primeiro dia em que alguém mexesse numa das duas.'
      properties:
        codigo:
          type: string
        peca:
          type: string
        alvo:
          type: string
        frase:
          type: string
        o_que_fazer:
          type: string
        impede_publicar:
          type: boolean
      required:
      - codigo
      - peca
      - alvo
      - frase
      - o_que_fazer
      - impede_publicar
      type: object
    BlocoParaGravarSchema:
      additionalProperties: false
      description: 'O corpo de `putBlock`: o nome do bloco e o título do Boss dele.


        Letra, ordem e parte NÃO entram, pelo mesmo motivo que `cartao` não entra

        em `putInstrument`: são a estrutura do livro, o semeador é a fonte delas, e

        mandá-las é 422.


        Os dois campos vêm SEMPRE, e vazio é valor válido: é com ele que os doze

        blocos nascem, e quem digitou um nome errado precisa poder apagá-lo. É a

        diferença para o título da aula, onde ausente significa não mexer, porque

        lá existe uma segunda tela gravando o mesmo campo.'
      properties:
        nome:
          maxLength: 120
          type: string
        boss_titulo:
          maxLength: 120
          type: string
      required:
      - nome
      - boss_titulo
      type: object
    CursoSchema:
      description: 'O curso como a lista do Admin o mostra: a identidade (`slug`, `nome`),

        o estado, a regra de avanço, o produto do catálogo a que ele aponta (texto

        vazio enquanto ninguém apontar; curso sem produto fecha a sala) e as duas

        contagens que dizem se ele já tem o que mostrar a um aluno.


        `progressao` é o `TextChoices` do modelo, e o OpenAPI leva o `enum` com as

        duas palavras: nenhum nome escrito duas vezes.'
      properties:
        slug:
          type: string
        nome:
          type: string
        estado:
          type: string
        progressao:
          $ref: '#/components/schemas/Progressao'
        produto_id:
          type: string
        total_de_aulas:
          type: integer
        aulas_publicadas:
          type: integer
      required:
      - slug
      - nome
      - estado
      - progressao
      - produto_id
      - total_de_aulas
      - aulas_publicadas
      type: object
    Progressao:
      enum:
      - por_laudo
      - livre
      type: string
    CursoParaCriarSchema:
      additionalProperties: false
      description: 'O corpo de `createCourse`. `slug` é o apelido do endereço

        (`/cursos/<slug>/`), minúsculas, dígitos e hífen, e é o único campo que

        nunca muda depois: ele é a identidade do curso no par site+slug.

        `progressao` nasce `por_laudo` quando não vem; `produto_id` nasce vazio,

        que significa "ainda não apontado", e curso sem produto fecha a sala.'
      properties:
        slug:
          pattern: ^[a-z0-9-]{1,64}$
          type: string
        nome:
          maxLength: 120
          minLength: 1
          type: string
        progressao:
          allOf:
          - $ref: '#/components/schemas/Progressao'
          default: por_laudo
        produto_id:
          default: ''
          maxLength: 64
          type: string
      required:
      - slug
      - nome
      type: object
    CursoParaAlterarSchema:
      additionalProperties: false
      description: 'O corpo de `putCourse`: os três campos que mudam, todos opcionais, e

        AUSENTE OU NULO SIGNIFICA NÃO MEXER, a mesma regra do `titulo_exibido` em

        `putLesson`. `produto_id` vazio é valor válido e desaponta o produto (a

        sala fecha); é o mesmo gesto do comando `apontar_o_produto_do_curso`, pela

        porta. Nome vazio é 422: curso sem nome não é um estado do sistema.'
      properties:
        nome:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
        progressao:
          anyOf:
          - $ref: '#/components/schemas/Progressao'
          - type: 'null'
        produto_id:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
      type: object
    BlocoComAulasSchema:
      description: 'Um bloco com as aulas dele, na ordem: é como `putCourseStructure`

        devolve a estrutura que acabou de gravar. Cada aula sai no formato da

        listagem (`AulaDaListaSchema`), e por isso carrega o bloco de novo dentro

        de si: é o preço de um formato só para a aula em toda a porta.'
      properties:
        letra:
          type: string
        ordem:
          type: integer
        parte:
          type: integer
        nome:
          default: ''
          type: string
        boss_titulo:
          default: ''
          type: string
        aulas:
          items:
            $ref: '#/components/schemas/AulaDaListaSchema'
          type: array
      required:
      - letra
      - ordem
      - parte
      - aulas
      type: object
    EstruturaSchema:
      description: 'A resposta de `putCourseStructure`: a estrutura como ficou e as quatro

        contagens do que a reconciliação fez. `aulas_preservadas` conta as aulas

        que já existiam e ficaram: a obra delas está intacta, e só bloco, ordem,

        Boss e Banca foram conferidos.'
      properties:
        blocos:
          items:
            $ref: '#/components/schemas/BlocoComAulasSchema'
          type: array
        blocos_criados:
          type: integer
        aulas_criadas:
          type: integer
        aulas_preservadas:
          type: integer
        aulas_apagadas:
          type: integer
      required:
      - blocos
      - blocos_criados
      - aulas_criadas
      - aulas_preservadas
      - aulas_apagadas
      type: object
    AulaDaEstruturaSchema:
      additionalProperties: false
      description: 'Uma aula como a estrutura a declara: só o que é ESTRUTURA. `titulo` é a

        exceção aparente: ele só preenche o título de uma aula que ainda não tem

        um, e nunca sobrescreve o que a tela escreveu.'
      properties:
        numero:
          pattern: ^[A-Z0-9]{1,3}$
          type: string
        titulo:
          maxLength: 120
          minLength: 1
          type: string
        e_boss:
          default: false
          type: boolean
        banca_nivel:
          anyOf:
          - enum:
            - 1
            - 2
            - 3
            type: integer
          - type: 'null'
      required:
      - numero
      - titulo
      type: object
    BlocoDaEstruturaSchema:
      additionalProperties: false
      description: 'Um bloco como a estrutura o declara: a letra, a parte (o enum do

        contrato), as aulas na ordem, e os dois textos do bloco. A estrutura e a

        fonte do nome do bloco e do titulo do Boss, porque as letras sao

        posicionais: o bloco que hoje e o A pode virar o B na estrutura nova, e

        o nome tem de viajar com ele. Por isso os dois campos tem tres estados:

        ausente ou nulo NAO MEXE no que esta gravado; texto GRAVA aquele valor;

        texto vazio APAGA.'
      properties:
        letra:
          pattern: ^[A-Z]$
          type: string
        parte:
          $ref: '#/components/schemas/ParteDoCurso'
        nome:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          description: 'O nome do bloco. Ausente ou nulo: o nome gravado fica como esta. Texto: passa
            a ser este, mesmo que o bloco ja tivesse outro. Texto vazio: apaga o nome.'
        boss_titulo:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          description: 'O titulo do Boss do bloco. Ausente ou nulo: o titulo gravado fica como esta. Texto:
            passa a ser este, mesmo que o bloco ja tivesse outro. Texto vazio: apaga o titulo.'
        aulas:
          items:
            $ref: '#/components/schemas/AulaDaEstruturaSchema'
          type: array
      required:
      - letra
      - parte
      - aulas
      type: object
    EstruturaParaGravarSchema:
      additionalProperties: false
      description: 'O corpo de `putCourseStructure`: os blocos na ordem, cada um com as

        aulas na ordem. A ordem dos blocos é a posição na lista, de um; a das

        aulas é a posição no curso inteiro, do zero: exatamente a conta do

        semeador do livro.'
      properties:
        blocos:
          items:
            $ref: '#/components/schemas/BlocoDaEstruturaSchema'
          type: array
      required:
      - blocos
      type: object
    ModoDeConferencia:
      enum:
      - coerencia
      - fidelidade
      type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
servers:
- url: http://cursos:8000/api/cursos
security:
- bearerAuth: []
