        422 QUANDO A ENCOMENDA TEM REMISSAO QUEBRADA: uma peca que manda o

        aluno para uma encomenda `E[NN]` que nao existe neste curso impede

        publicar, e o `detail` diz quais numeros sao. E o invariante

