    TipoDePeca:
      description: 'As 16 peças da anatomia NA ORDEM CANÔNICA, as duas internas e a sob demanda.


        Mora no módulo, e não dentro de `Peca`, porque o corpo de uma `class Meta`

        aninhada não enxerga os nomes da classe que a contém, e a restrição do

        banco precisa deste vocabulário. `Peca.Tipo` é este mesmo objeto.'
      enum:
      - pedido
      - em_jogo
      - voce_vai_conseguir
      - recall
      - par_de_comparacao
      - erro_produtivo
      - eu_faco
      - nos_fazemos
      - voce_faz
      - drills
      - erros_classicos
      - regra_do_padrao
      - critica_de_atelier
      - checkpoint
      - pagina_do_portfolio
      - dicionario_cartao_respostas
      - roteiro
      - guia_do_mentor
      - videoaula_em_texto
      type: string
    AulaParaGravarSchema:
      additionalProperties: false
      description: 'O corpo de `putLesson`: o que se edita, e o título.


        O TÍTULO MUDOU DE LADO EM 06/09/2026 (TAR-221), e é o único dos sete que

        muda. Número, ordem, bloco, estado, versão e data de publicação continuam

        fora, e mandá-los é 422: são ESTRUTURA, fatos do livro, e quem os escreve é

        o semeador. O `titulo_exibido` estava nessa lista por parecer estrutura, e

        não é: ele é a frase que o cliente diz na encomenda, obra do mantenedor, e

        a primeira coisa que o aluno lê. Sem porta para ele, a encomenda ficava

        "Encomenda 22" onde o livro na mão do aluno diz outra coisa.


        ELE É OPCIONAL, E AUSENTE SIGNIFICA NÃO MEXER. O editor do Admin que já

        está no ar não manda este campo, e um `PUT` dele não pode apagar o título

        que a outra tela escreveu. Nulo diz o mesmo que ausente, de propósito:

        apagar título não é gesto que esta porta ofereça, e por isso título vazio

        é 422.'
      properties:
        titulo_exibido:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
        pedido:
          type: string
        cliente:
          maxLength: 120
          type: string
        instrumento:
          anyOf:
          - type: string
          - type: 'null'
        minimo:
          maxLength: 200
          type: string
        aceito_quando:
          items:
            type: string
          type: array
        quiz:
          items:
            $ref: '#/components/schemas/ItemDoQuizSchema'
          type: array
        video_url:
          maxLength: 500
          type: string
        e_boss:
          type: boolean
        banca_nivel:
          anyOf:
          - enum:
            - 1
            - 2
            - 3
            type: integer
          - type: 'null'
        pecas:
          items:
            $ref: '#/components/schemas/PecaSchema'
          type: array
        pausas:
          items:
            $ref: '#/components/schemas/PausaSchema'
          type: array
      required:
      - pedido
      - cliente
      - instrumento
      - minimo
      - aceito_quando
      - quiz
      - video_url
      - e_boss
      - banca_nivel
      - pecas
      - pausas
      type: object
    InstrumentoSchema:
      properties:
        slug:
          type: string
        nome_canonico:
          type: string
        cartao:
          type: integer
        escala:
          additionalProperties: true
          type: object
        minimo_exercicio:
          type: string
        minimo_contrato:
          type: string
        secao_do_padrao:
          type: string
        descritores:
          additionalProperties: true
          type: object
        versao:
