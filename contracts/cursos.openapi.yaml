      description: 'O bloco tem NOME e TITULO DO BOSS, e os dois sao obra do mantenedor:

        nascem vazios e so entram por aqui. O corpo leva os dois SEMPRE, e

        texto vazio e valor valido, porque quem digitou errado precisa poder

        apagar. Nao ha versao a subir: o bloco nao e versionado.


        E OPERACAO PROPRIA, e nao campo de `putLesson`, porque o bloco nao

        pertence a nenhuma aula: sao doze blocos para trinta e quatro

        encomendas, e tres aulas dividem o bloco A. Se o nome viajasse no

        corpo da aula, gravar duas aulas do mesmo bloco escreveria o nome duas

        vezes, a ultima ganharia, e um formulario aberto com o nome antigo

        apagaria o que a outra tela escreveu. Um bloco cujas aulas ninguem

        abriu tambem nao teria como ser nomeado.


        `letra` e a do bloco, de A a Z, e `curso` e o SLUG, resolvido pelo par

        site+slug como nas quatro operacoes de aula. Letra, ordem e parte NAO

        entram no corpo: sao estrutura, a fonte delas e o semeador (no curso

        do livro) ou `putCourseStructure` (em qualquer curso), e manda-las e

