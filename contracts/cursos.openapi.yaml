# =============================================================================
# CONTRATO DA CÉLULA `cursos` — a porta de MÁQUINA da sala de aula.
#
# CONGELADO. Mudar este arquivo é o Rito de Contrato (RITOS.md §3): PR só de
# `contracts/`, com a etiqueta `contrato`, provedor primeiro e consumidores em
# PRs seguintes. O portão que faz valer é `ci/contract_freeze.py`, que compara
# este arquivo com o que a célula EXPORTA de verdade — divergência reprova.
#
# POR QUE ESTE CONTRATO EXISTE: o texto das aulas é obra não lançada do
# mantenedor e mora SÓ no banco desta célula (o repositório é público,
# [INV-CUR-C2]). Quem escreve as aulas é o editor do Admin, e ele escreve por
# AQUI, nunca no banco e nunca guardando cópia. Este arquivo é o que deixa o
# editor nascer contra o mock (prism) sem nunca ler o código da cursos, e o
# que impede a porta de mudar "por acidente" debaixo dele.
#
# NASCEU DO EXPORT, não de cabeça: `python manage.py export_openapi` em
# services/cursos, no ramo do PR #1135.
#
# O QUE O RITO DE 05/09/2026 ACRESCENTOU, e por quê: decisão do mantenedor de
# que o endereço da sala de aula carrega o CURSO e a PARTE, com as palavras
# dele: "quero que ao compartilhar uma aula o link da mesma seja útil para o
# aluno entender exatamente em qual parte do curso ele está". Nasceram quatro
# operações em `/cursos/{curso}/aulas`, onde o curso é o SLUG (resolvido pelo
# par site+slug) e a `parte` é GUARDA, não filtro: parte que não casa com o
# bloco da aula recusa com 404 em vez de devolver a aula, porque um endereço
# que aponta certo para a aula errada é pior do que um endereço quebrado.
#
# AS QUATRO OPERAÇÕES ANTIGAS CONTINUAM VIVAS, e isso é retrocompatibilidade
# do Rito (provedor primeiro, consumidor depois): o editor do Admin que está
# no ar hoje as chama. Elas resolvem a aula só pelo site e por isso NÃO sabem
# de curso; os `operationId` delas passaram a dizer isso no nome
# (`listSiteLessons`, `getSiteLesson`, `putSiteLesson`, `publishSiteLesson`),
# porque `operationId` é chave única no OpenAPI e duas rotas não podem chamar
# `listLessons`. Nenhum consumidor chama por id: o Admin monta a URL à mão
# (`services/admin/apps/core/clients.py`).
#
# MEDIDO E DITO NA CARA: com DOIS cursos no mesmo site, o caminho antigo
# quebra — `getSiteLesson` devolve 500 (MultipleObjectsReturned) e
# `listSiteLessons` mistura as aulas dos dois. É comportamento que já existia,
# e consertá-lo seria escolher qual curso o caminho antigo serve, que é
# exatamente a ambiguidade que o caminho novo apaga. Enquanto houver um curso
# só, não aparece; o consumidor migra antes do segundo curso nascer.
#
# SEGURANÇA: as doze operações exigem Bearer por par (TOKENS_ACEITOS_<PAR>);
# a sonda de `ci/contract_freeze.py` confere isso NA FONTE, porque o
# django-ninja omite `security` de rota sem autenticação em vez de emitir [].
#
# O QUE O RITO DE 06/09/2026 ACRESCENTOU, e por quê: o mantenedor tem os
# textos das 34 encomendas escritos e precisava de por onde enviá-los. A
# tela que cola o sumário do livro já enchia as peças, mas duas coisas do
# sumário não tinham por onde entrar: o TÍTULO da encomenda (a frase que o
# cliente diz, e a primeira coisa que o aluno lê) e o NOME do bloco com o
# TÍTULO DO BOSS dele.
#
# O título saiu da lista dos sete campos que eram 422 no corpo de
# `putLesson`, e é o único que sai. Os outros seis (número, ordem, bloco,
# estado, versão e data de publicação) são ESTRUTURA, escrita pela
# instalação do curso; o título é OBRA do mantenedor. Ele é opcional, e
# ausente significa não mexer, para que a tela que não o conhece não apague
# o que a outra escreveu.
#
# `putBlock` nasce como operação PRÓPRIA, e não como campo de `putLesson`,
# porque doze blocos servem trinta e quatro encomendas e três aulas dividem
# o bloco A: se o nome viajasse no corpo da aula, gravar duas aulas do mesmo
# bloco escreveria o nome duas vezes com a última ganhando, e um bloco cujas
# aulas ninguém abriu nunca poderia ser nomeado. Não nasceu `getBlock`: o
# bloco já volta dentro de cada aula, agora com os dois campos.
#
# `nome` e `boss_titulo` NÃO entram em `required` no `BlocoSchema`, e isso é
# deliberado: campo obrigatório novo num schema que já existia quebra quem
# consome pelo contrato antigo, e `ci/contrato_aditivo.py` reprova o Rito por
# isso (`armadilhas/202`, medida aqui em 06/09/2026). O valor emitido não
# muda, porque o modelo sempre tem os dois; muda o que o contrato EXIGE de
# quem valida. No corpo de `putBlock` os dois SÃO obrigatórios, e ali pode:
# `BlocoParaGravarSchema` nasceu neste Rito e não tinha consumidor antes.
#
# NASCEU DO EXPORT: `manage.py export_openapi` no ramo do PR #1233, que é o
# provedor. O código dele fica VERMELHO no `contrato-check` até este arquivo
# entrar na main, e isso é o portão funcionando (`armadilhas/243`).
#
# O QUE O RITO DE 06/09/2026 (o segundo do dia) ACRESCENTOU: a peça
# `videoaula_em_texto`, pedida pelo mantenedor com estas palavras: "cada
# capítulo tem uma versão do mesmo capítulo no formato de verbatim de
# vídeo-aula, e quero um botão logo abaixo de cada capítulo para mostrar um
# modal na tela com o conteúdo da vídeo-aula".
#
# ELA NÃO É A DÉCIMA SÉTIMA PEÇA DA ANATOMIA, e isto é o que mais importa
# saber aqui. As 16 da anatomia são lei (`docs/decisoes/PLANO-CELULA-CURSOS.md`)
# e continuam 16, com teste-guarda afirmando o número. Esta é uma TERCEIRA
# categoria, ao lado das 16 que o aluno lê em sequência e das 2 internas que
# ele nunca vê: o aluno vê esta, mas fora da sequência, por um botão. No
# código a tupla se chama `TIPOS_SOB_DEMANDA`.
#
# Por isso o corpo das aulas passa de 18 para 19 peças, e a nova vai por
# último. É mudança ADITIVA: quem consome pelo contrato anterior continua
# lendo as 18 que já lia.
#
# NASCEU DO EXPORT: `manage.py export_openapi` no ramo do PR #1239, que é o
# provedor. O código dele fica VERMELHO no `contrato-check` até este arquivo
# entrar na main (`armadilhas/243`).
# =============================================================================
openapi: 3.1.0
info:
  title: "Cursos \u2014 API interna"
  version: 1.0.0
  description: 'Superficie de MAQUINA da sala de aula da Meshcraft.


    Existe para que o conteudo do curso tenha UM lugar, o banco desta

    celula, e para que o editor do Admin leia e grave por aqui, nunca no

    banco e nunca guardando copia (a lei anti-duplicacao). Sao doze

    operacoes: as quatro que sabem de CURSO e de PARTE (`listLessons`,

    `getLesson`, `putLesson`, `publishLesson`), as quatro antigas que

    resolvem a aula so pelo site (`listSiteLessons`, `getSiteLesson`,

    `putSiteLesson`, `publishSiteLesson`, vivas porque o editor que ja

    esta no ar as chama), as tres de instrumento (`listInstruments`,

    `getInstrument`, `putInstrument`) e a do bloco (`putBlock`). Os

    verificadores (checkLesson) nascem no degrau 3.1; o placar da fila

    (getReviewQueue) e o progresso do aluno (getStudentProgress), no 2.1.


    Lei do assunto: docs/decisoes/PLANO-CELULA-CURSOS.md (secoes 4 e 5).


    O TEXTO DAS AULAS E OBRA NAO LANCADA DO MANTENEDOR: entra por esta

    porta e so por ela; nunca por migracao, nunca por arquivo no

    repositorio, que e publico.


    O TITULO DA ENCOMENDA E O BLOCO ENTRAM DESDE 06/09/2026. Ate essa

    data, sete campos eram 422 no corpo de `putLesson`: numero, ordem,

    titulo, bloco, estado, versao e data de publicacao. O titulo saiu

    dessa lista, e e o unico que sai, porque e o unico dos sete que e OBRA

    e nao ESTRUTURA: os outros seis sao fatos publicos do livro, escritos

    pela instalacao do curso, e o titulo e a frase que o cliente diz na

    encomenda e a primeira coisa que o aluno le. Ele e opcional, e ausente

    significa nao mexer, para que a tela que nao o conhece nao apague o

    que a outra escreveu. O nome do bloco e o titulo do Boss dele entram

    por `putBlock`, que e operacao propria porque doze blocos servem

    trinta e quatro encomendas e nenhum deles e de uma aula so.


    O `site_id` e obrigatorio em toda operacao de aula (uma fabrica, N

    lojas): esta celula nao tem middleware de site, e a porta nao adivinha

    de qual escola e a encomenda. Os instrumentos sao de plataforma

    inteira, de proposito: os 13 cartoes sao os mesmos em toda escola.


    O CURSO E O SLUG, e a PARTE e conferida (05/09/2026): o endereco da

    sala de aula carrega os dois para que o aluno saiba onde esta. Nas

    quatro operacoes de `/cursos/{curso}/aulas`, o curso sai do par

    site+slug (nunca `o primeiro curso do site`) e `parte` que nao casa

    com o bloco da aula RECUSA com 404 em vez de devolver a aula: um

    endereco que aponta certo para a aula errada e pior do que um

    endereco quebrado.


    A VIDEO-AULA EM TEXTO ENTRA DESDE 06/09/2026, e ela e a decima nona

    peca, nunca a decima setima. Cada encomenda passou a ter um segundo

    texto, a mesma aula contada como numa video-aula, e o aluno chega nele

    por um botao embaixo do capitulo, num modal. Vem e vai como PECA

    (`videoaula_em_texto`) para herdar o editor, o historico de versoes, a

    restricao de uma por aula e a renderizacao em Markdown que as outras ja

    tem. Ela fica FORA da sequencia das 16 da anatomia, que e lei da celula

    e nao cresce: quem consome esta porta mostra as 16 em ordem e esta uma

    so a pedido, e NAO desenha botao quando o texto dela vem vazio.

    '
paths:
  /aulas:
    get:
      operationId: listSiteLessons
      summary: As aulas do curso de um site, na ordem em que o aluno as encontra
      parameters:
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AulaDaListaSchema'
                type: array
      description: 'A lista que o editor mostra como indice: numero, ordem, titulo

        exibido, o bloco (letra, ordem, parte, nome e titulo do Boss), estado,

        versao, data de publicacao, se e Boss e o nivel de Banca. NENHUM texto

        de peca sai aqui: e listagem, e o texto vem em `getLesson`.


        `site_id` e obrigatorio. Site sem curso responde lista vazia, nao

        erro: nao ter curso ainda e um estado, nao uma falha.


        ESTE CAMINHO NAO SABE DE CURSO: ele lista as aulas de TODOS os cursos

        do site, e existe porque o editor que ja esta no ar o chama. Quem sabe

        de curso e de parte e `listLessons`, em /cursos/{curso}/aulas.'
  /aulas/{numero}:
    get:
      operationId: getSiteLesson
      summary: 'Uma aula inteira: os campos, o instrumento, as pecas e as pausas'
      parameters:
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaSchema'
      description: 'Tudo o que o editor precisa para desenhar o formulario de uma

        encomenda. As pecas vem SEMPRE as 19, na ordem canonica das 16 da

        anatomia, depois as duas internas (`roteiro`, `guia_do_mentor`) e por

        ultimo `videoaula_em_texto`, com texto vazio na que ainda nao foi

        escrita. As pausas vem na ordem. `instrumento` e o slug do cartao, ou

        null.


        `videoaula_em_texto` NAO E A DECIMA SETIMA PECA DA ANATOMIA: e a mesma

        encomenda contada como numa video-aula, e o aluno chega nela por um

        botao embaixo do capitulo, num modal, fora da sequencia das 16. Quem a

        recebe vazia nao deve desenhar botao nenhum.


        404 se a aula nao existe nesse site.


        ESTE CAMINHO NAO SABE DE CURSO: procura a aula pelo numero dentro do

        site inteiro. Quem sabe de curso e de parte e `getLesson`, em

        /cursos/{curso}/aulas/{numero}.'
    put:
      operationId: putSiteLesson
      summary: 'Grava uma aula inteira: substitui as pecas e as pausas, sobe a versao'
      parameters:
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaSchema'
      description: 'O corpo e a aula completa, e so o que se edita: pedido, cliente,

        instrumento (slug ou null), minimo, aceito_quando (lista de frases),

        quiz (lista de {pergunta, resposta_modelo}), video_url, e_boss,

        banca_nivel (1, 2, 3 ou null), pecas [{tipo, texto}] e pausas

        [{ordem, segundo, tipo, pede, campos}]. Mais o titulo_exibido, que e

        OPCIONAL, e a regra dele esta em `putLesson`, palavra por palavra.


        As pecas e as pausas da aula sao SUBSTITUIDAS pelas do corpo, numa

        transacao unica: ou entra tudo, ou nao entra nada. A versao sobe 1.

        O estado e a data de publicacao NAO mudam: publicar e outro gesto

        (`publishLesson`), e editar uma aula publicada a mantem publicada.


        422 se: tipo de peca fora do vocabulario, peca repetida, pausa com

        ordem repetida, item do quiz sem pergunta ou sem resposta_modelo,

        aceito_quando que nao seja lista de textos, instrumento inexistente,

        banca_nivel fora de 1..3, titulo_exibido vazio ou com mais de 120

        letras, ou qualquer chave que este corpo nao conheca (numero, estado,

        versao...). 404 se a aula nao existe.


        Devolve a aula como ficou, no mesmo formato de `getSiteLesson`.


        ESTE CAMINHO NAO SABE DE CURSO: procura a aula pelo numero dentro do

        site inteiro. Quem sabe de curso e de parte e `putLesson`, em

        /cursos/{curso}/aulas/{numero}.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AulaParaGravarSchema'
        required: true
  /instrumentos:
    get:
      operationId: listInstruments
      summary: Os 13 instrumentos, na ordem dos cartoes, com escala e descritores
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InstrumentoSchema'
                type: array
      description: 'A lista que o editor usa para escolher o instrumento cabivel de
        uma

        aula e para abrir a tela de cada cartao. Os instrumentos sao de

        plataforma inteira, por isso nao ha `site_id`. Vem na ordem do cartao

        (1 a 13), inteiros: slug, nome canonico, cartao, escala, minimos,

        secao do Padrao, descritores e versao.'
  /instrumentos/{slug}:
    get:
      operationId: getInstrument
      summary: Um instrumento inteiro, pelo slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentoSchema'
      description: 'O que `putInstrument` grava, lido de volta: escala, minimos, secao
        do

        Padrao, descritores e a versao vigente. 404 se o slug nao existe.'
    put:
      operationId: putInstrument
      summary: Grava a escala, os minimos, a secao do padrao e os descritores de um
        instrumento
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentoSchema'
      description: 'Os instrumentos sao de plataforma inteira (os 13 cartoes sao os
        mesmos

        em toda escola), por isso nao ha `site_id` aqui. O corpo leva escala

        (criterios, minimo e maximo por criterio), minimo_exercicio,

        minimo_contrato, secao_do_padrao e descritores (o 5/3/1). A versao

        sobe 1: avaliacao em andamento guarda a versao em que comecou.


        `nome_canonico` e `cartao` sao da lei e NAO mudam pela porta: vem no

        corpo, e 422. 404 se o slug nao existe.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentoParaGravarSchema'
        required: true
  /aulas/{numero}/publicar:
    post:
      operationId: publishSiteLesson
      summary: 'Publica uma aula: estado publicada, data de agora, versao inalterada'
      parameters:
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaDaListaSchema'
      description: 'O gesto que abre a aula para a sala de aula (degrau 1.8). Muda
        o

        estado para `publicada` e carimba `publicada_em` com o instante de

        agora; a versao NAO muda, porque publicar nao edita.


        Idempotente: publicar o que ja esta publicado devolve a aula como

        esta, sem mexer na data. 404 se a aula nao existe.


        ESTE CAMINHO NAO SABE DE CURSO: procura a aula pelo numero dentro do

        site inteiro. Quem sabe de curso e de parte e `publishLesson`, em

        /cursos/{curso}/aulas/{numero}/publicar.'
  /cursos/{curso}/aulas:
    get:
      operationId: listLessons
      summary: As aulas de um curso, pelo slug, na ordem em que o aluno as encontra
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      - in: query
        name: parte
        schema:
          anyOf:
          - $ref: '#/components/schemas/ParteDoCurso'
          - type: 'null'
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AulaDaListaSchema'
                type: array
      description: 'A lista que o editor mostra como indice e que a sala de aula percorre:

        numero, ordem, titulo exibido, o bloco (letra, ordem, parte, nome e

        titulo do Boss), estado, versao, data de publicacao, se e Boss e o

        nivel de Banca. NENHUM texto de peca sai aqui: e listagem, e o texto

        vem em `getLesson`.


        `curso` e o SLUG, resolvido pelo par site+slug, que e a unicidade do

        banco. `site_id` continua obrigatorio (uma fabrica, N lojas). Slug que

        nao existe naquele site e 404 dizendo quais existem, nunca o primeiro

        curso do site como consolo.


        `parte` (1, 2 ou 3) e opcional e filtra pelos blocos daquela parte: e

        o mesmo numero que viaja no endereco da sala de aula. Sem `parte`, vem

        o curso inteiro. Curso sem aula responde lista vazia, nao erro.'
  /cursos/{curso}/aulas/{numero}:
    get:
      operationId: getLesson
      summary: Uma aula de um curso, inteira, conferida contra a parte do endereco
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      - in: query
        name: parte
        schema:
          anyOf:
          - $ref: '#/components/schemas/ParteDoCurso'
          - type: 'null'
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaSchema'
      description: 'Tudo o que o editor e a sala de aula precisam de uma encomenda.
        As

        pecas vem SEMPRE as 19, na ordem canonica das 16 da anatomia, depois

        as duas internas (`roteiro`, `guia_do_mentor`) e por ultimo

        `videoaula_em_texto`, com texto vazio na que ainda nao foi escrita. As

        pausas vem na ordem. `instrumento` e o slug do cartao, ou null.


        `videoaula_em_texto` NAO E A DECIMA SETIMA PECA DA ANATOMIA: e a mesma

        encomenda contada como numa video-aula, e o aluno chega nela por um

        botao embaixo do capitulo, num modal, fora da sequencia das 16. Quem a

        recebe vazia nao deve desenhar botao nenhum.


        `parte` e opcional e NAO e filtro: e GUARDA. Quando ela vem e nao casa

        com a parte do bloco desta aula, a resposta e 404 dizendo em que parte

        a aula realmente esta, e nunca a aula. Um endereco que aponta certo

        para a aula errada e pior do que um endereco quebrado, e o endereco da

        sala de aula carrega a parte justamente para o aluno se localizar.


        404 tambem se o curso nao existe naquele site, ou se a aula nao existe

        naquele curso.'
    put:
      operationId: putLesson
      summary: 'Grava uma aula de um curso: substitui as pecas e as pausas, sobe a
        versao'
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      - in: query
        name: parte
        schema:
          anyOf:
          - $ref: '#/components/schemas/ParteDoCurso'
          - type: 'null'
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaSchema'
      description: 'O corpo, o que ele recusa e o que ele NAO toca sao exatamente
        os de

        `putSiteLesson`: pedido, cliente, instrumento (slug ou null), minimo,

        aceito_quando, quiz, video_url, e_boss, banca_nivel, pecas e pausas;

        as pecas e as pausas sao SUBSTITUIDAS numa transacao unica; a versao

        sobe 1; estado e data de publicacao nao mudam. E o mesmo codigo, com a

        aula resolvida pelo curso.


        O TITULO DA ENCOMENDA ENTRA POR AQUI, e ele e o unico dos sete campos

        de fora que passou a entrar. Numero, ordem, bloco, estado, versao e

        data de publicacao continuam sendo 422: sao ESTRUTURA, fatos publicos

        do livro, e quem os escreve e a instalacao do curso. O titulo e OBRA:

        e a frase que o cliente diz na encomenda e a primeira coisa que o

        aluno le, e sem porta para ele a aula ficava com o nome de esqueleto

        (`Encomenda 22`) enquanto o livro na mao do aluno dizia outra coisa.


        `titulo_exibido` e OPCIONAL, e ausente significa NAO MEXER, nunca

        esvaziar: ha mais de uma tela gravando esta aula, e a que nao conhece

        o campo nao pode apagar o que a outra escreveu. Nulo diz o mesmo que

        ausente. Titulo vazio e 422, porque apagar o titulo nao e gesto que

        esta porta ofereca: encomenda sem nome nao e um estado do sistema.

        O NOME DO BLOCO e o TITULO DO BOSS nao entram aqui; sao `putBlock`.


        `parte` e o mesmo GUARDA de `getLesson`: parte que nao casa com o

        bloco da aula recusa com 404 ANTES de gravar qualquer coisa, e nada e

        escrito. 404 tambem se o curso ou a aula nao existem.


        Devolve a aula como ficou, no mesmo formato de `getLesson`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AulaParaGravarSchema'
        required: true
  /cursos/{curso}/aulas/{numero}/publicar:
    post:
      operationId: publishLesson
      summary: 'Publica uma aula de um curso: estado publicada, data de agora, versao
        inalterada'
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      - in: query
        name: parte
        schema:
          anyOf:
          - $ref: '#/components/schemas/ParteDoCurso'
          - type: 'null'
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaDaListaSchema'
      description: 'O gesto que abre a aula para a sala de aula. Muda o estado para

        `publicada` e carimba `publicada_em` com o instante de agora; a versao

        NAO muda, porque publicar nao edita. Idempotente: publicar o que ja

        esta publicado devolve a aula como esta, sem mexer na data.


        `parte` e o mesmo GUARDA de `getLesson`: parte que nao casa com o

        bloco da aula recusa com 404 e a aula continua como estava. 404

        tambem se o curso ou a aula nao existem.'
  /cursos/{curso}/blocos/{letra}:
    put:
      operationId: putBlock
      summary: Grava o nome de um bloco e o titulo do Boss dele
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: path
        name: letra
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocoSchema'
      description: 'O bloco tem NOME e TITULO DO BOSS, e os dois sao obra do mantenedor:

        nascem vazios e so entram por aqui. O corpo leva os dois SEMPRE, e

        texto vazio e valor valido, porque quem digitou errado precisa poder

        apagar. Nao ha versao a subir: o bloco nao e versionado.


        E OPERACAO PROPRIA, e nao campo de `putLesson`, porque o bloco nao

        pertence a nenhuma aula: sao doze blocos para trinta e quatro

        encomendas, e tres aulas dividem o bloco A. Se o nome viajasse no

        corpo da aula, gravar duas aulas do mesmo bloco escreveria o nome duas

        vezes, a ultima ganharia, e um formulario aberto com o nome antigo

        apagaria o que a outra tela escreveu. Um bloco cujas aulas ninguem

        abriu tambem nao teria como ser nomeado.


        `letra` e a do bloco, de A a L, e `curso` e o SLUG, resolvido pelo par

        site+slug como nas quatro operacoes de aula. Letra, ordem e parte NAO

        entram no corpo: sao a estrutura do livro, o semeador e a fonte delas,

        e manda-las e 422, do mesmo jeito que `cartao` em `putInstrument`.


        404 se o curso nao existe naquele site, ou se aquela letra nao existe

        naquele curso. Devolve o bloco como ficou, no mesmo formato em que ele

        ja viaja dentro de cada aula: e por ai que quem grava le de volta o

        que gravou, sem uma operacao de leitura so para isso.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocoParaGravarSchema'
        required: true
components:
  schemas:
    AulaDaListaSchema:
      description: "A linha da listagem: o que o editor mostra no \xEDndice, sem texto\
        \ de pe\xE7a."
      properties:
        numero:
          type: string
        ordem:
          type: integer
        titulo_exibido:
          type: string
        bloco:
          $ref: '#/components/schemas/BlocoSchema'
        estado:
          type: string
        versao:
          type: integer
        publicada_em:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        e_boss:
          type: boolean
        banca_nivel:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - numero
      - ordem
      - titulo_exibido
      - bloco
      - estado
      - versao
      - publicada_em
      - e_boss
      - banca_nivel
      type: object
    BlocoSchema:
      description: "O bloco como ele viaja dentro de toda aula: a estrutura do livro\n\
        (`letra`, `ordem`, `parte`) e o que o mantenedor escreve nele (`nome` e\n\
        `boss_titulo`, vazios at\xE9 algu\xE9m os escrever por `putBlock`).\n\nOs\
        \ dois de obra entraram aqui em 06/09/2026, e \xE9 isto que faz `putBlock`\n\
        dispensar uma opera\xE7\xE3o de leitura pr\xF3pria: quem grava um bloco o\
        \ l\xEA de\nvolta na primeira aula dele. Gravar sem poder ler de volta foi\
        \ o defeito\nque o degrau 1.3b teve de curar nos instrumentos, com um PR a\
        \ mais.\n\nOS DOIS NOVOS CARREGAM DEFAULT, E ISSO N\xC3O \xC9 DESCUIDO NEM\
        \ ENFEITE: sem\nele o campo nasce em `required` no documento congelado, e\n\
        `ci/contrato_aditivo.py` reprova o PR do Rito, porque campo obrigat\xF3rio\n\
        novo quebra quem consome pelo contrato antigo (`armadilhas/202`, medida\n\
        aqui em 06/09/2026). O valor emitido N\xC3O muda: o modelo sempre tem os\n\
        dois, com `default=\"\"` no banco. Muda s\xF3 o que o contrato EXIGE de quem\n\
        valida. N\xE3o tire os defaults para \"deixar igual aos outros tr\xEAs\":\
        \ os\noutros tr\xEAs nasceram com o contrato, estes chegaram depois."
      properties:
        letra:
          type: string
        ordem:
          type: integer
        parte:
          type: integer
        nome:
          default: ''
          type: string
        boss_titulo:
          default: ''
          type: string
      required:
      - letra
      - ordem
      - parte
      type: object
    AulaSchema:
      description: 'A aula inteira: a linha da listagem mais o que se edita.'
      properties:
        numero:
          type: string
        ordem:
          type: integer
        titulo_exibido:
          type: string
        bloco:
          $ref: '#/components/schemas/BlocoSchema'
        estado:
          type: string
        versao:
          type: integer
        publicada_em:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        e_boss:
          type: boolean
        banca_nivel:
          anyOf:
          - type: integer
          - type: 'null'
        pedido:
          type: string
        cliente:
          type: string
        instrumento:
          anyOf:
          - type: string
          - type: 'null'
        minimo:
          type: string
        aceito_quando:
          items:
            type: string
          type: array
        quiz:
          items:
            $ref: '#/components/schemas/ItemDoQuizSchema'
          type: array
        video_url:
          type: string
        pecas:
          items:
            $ref: '#/components/schemas/PecaSchema'
          type: array
        pausas:
          items:
            $ref: '#/components/schemas/PausaSchema'
          type: array
      required:
      - numero
      - ordem
      - titulo_exibido
      - bloco
      - estado
      - versao
      - publicada_em
      - e_boss
      - banca_nivel
      - pedido
      - cliente
      - instrumento
      - minimo
      - aceito_quando
      - quiz
      - video_url
      - pecas
      - pausas
      type: object
    ItemDoQuizSchema:
      properties:
        pergunta:
          minLength: 1
          type: string
        resposta_modelo:
          minLength: 1
          type: string
      required:
      - pergunta
      - resposta_modelo
      type: object
    PausaSchema:
      properties:
        ordem:
          maximum: 32767
          minimum: 0
          type: integer
        segundo:
          maximum: 2147483647
          minimum: 0
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoDePausa'
        pede:
          type: string
        campos:
          items:
            type: string
          type: array
      required:
      - ordem
      - segundo
      - tipo
      - pede
      - campos
      type: object
    PecaSchema:
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDePeca'
        texto:
          type: string
      required:
      - tipo
      - texto
      type: object
    TipoDePausa:
      enum:
      - erro_produtivo
      - faca_agora
      - cerimonia
      type: string
    TipoDePeca:
      description: "As 16 pe\xE7as da anatomia NA ORDEM CAN\xD4NICA, as duas internas\
        \ e a sob demanda.\n\nMora no m\xF3dulo, e n\xE3o dentro de `Peca`, porque\
        \ o corpo de uma `class Meta`\naninhada n\xE3o enxerga os nomes da classe\
        \ que a cont\xE9m, e a restri\xE7\xE3o do\nbanco precisa deste vocabul\xE1\
        rio. `Peca.Tipo` \xE9 este mesmo objeto."
      enum:
      - pedido
      - em_jogo
      - voce_vai_conseguir
      - recall
      - par_de_comparacao
      - erro_produtivo
      - eu_faco
      - nos_fazemos
      - voce_faz
      - drills
      - erros_classicos
      - regra_do_padrao
      - critica_de_atelier
      - checkpoint
      - pagina_do_portfolio
      - dicionario_cartao_respostas
      - roteiro
      - guia_do_mentor
      - videoaula_em_texto
      type: string
    AulaParaGravarSchema:
      additionalProperties: false
      description: "O corpo de `putLesson`: o que se edita, e o t\xEDtulo.\n\nO T\xCD\
        TULO MUDOU DE LADO EM 06/09/2026 (TAR-221), e \xE9 o \xFAnico dos sete que\n\
        muda. N\xFAmero, ordem, bloco, estado, vers\xE3o e data de publica\xE7\xE3\
        o continuam\nfora, e mand\xE1-los \xE9 422: s\xE3o ESTRUTURA, fatos do livro,\
        \ e quem os escreve \xE9\no semeador. O `titulo_exibido` estava nessa lista\
        \ por parecer estrutura, e\nn\xE3o \xE9: ele \xE9 a frase que o cliente diz\
        \ na encomenda, obra do mantenedor, e\na primeira coisa que o aluno l\xEA\
        . Sem porta para ele, a encomenda ficava\n\"Encomenda 22\" onde o livro na\
        \ m\xE3o do aluno diz outra coisa.\n\nELE \xC9 OPCIONAL, E AUSENTE SIGNIFICA\
        \ N\xC3O MEXER. O editor do Admin que j\xE1\nest\xE1 no ar n\xE3o manda este\
        \ campo, e um `PUT` dele n\xE3o pode apagar o t\xEDtulo\nque a outra tela\
        \ escreveu. Nulo diz o mesmo que ausente, de prop\xF3sito:\napagar t\xEDtulo\
        \ n\xE3o \xE9 gesto que esta porta ofere\xE7a, e por isso t\xEDtulo vazio\n\
        \xE9 422."
      properties:
        titulo_exibido:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
        pedido:
          type: string
        cliente:
          maxLength: 120
          type: string
        instrumento:
          anyOf:
          - type: string
          - type: 'null'
        minimo:
          maxLength: 200
          type: string
        aceito_quando:
          items:
            type: string
          type: array
        quiz:
          items:
            $ref: '#/components/schemas/ItemDoQuizSchema'
          type: array
        video_url:
          maxLength: 500
          type: string
        e_boss:
          type: boolean
        banca_nivel:
          anyOf:
          - enum:
            - 1
            - 2
            - 3
            type: integer
          - type: 'null'
        pecas:
          items:
            $ref: '#/components/schemas/PecaSchema'
          type: array
        pausas:
          items:
            $ref: '#/components/schemas/PausaSchema'
          type: array
      required:
      - pedido
      - cliente
      - instrumento
      - minimo
      - aceito_quando
      - quiz
      - video_url
      - e_boss
      - banca_nivel
      - pecas
      - pausas
      type: object
    InstrumentoSchema:
      properties:
        slug:
          type: string
        nome_canonico:
          type: string
        cartao:
          type: integer
        escala:
          additionalProperties: true
          type: object
        minimo_exercicio:
          type: string
        minimo_contrato:
          type: string
        secao_do_padrao:
          type: string
        descritores:
          additionalProperties: true
          type: object
        versao:
          type: integer
      required:
      - slug
      - nome_canonico
      - cartao
      - escala
      - minimo_exercicio
      - minimo_contrato
      - secao_do_padrao
      - descritores
      - versao
      type: object
    InstrumentoParaGravarSchema:
      additionalProperties: false
      description: "O corpo de `putInstrument`: a escala, os m\xEDnimos, a se\xE7\xE3\
        o e os\ndescritores. `nome_canonico` e `cartao` s\xE3o da lei, n\xE3o do editor:\
        \ v\xEAm no\ncorpo, \xE9 422."
      properties:
        escala:
          additionalProperties: true
          type: object
        minimo_exercicio:
          maxLength: 200
          type: string
        minimo_contrato:
          maxLength: 200
          type: string
        secao_do_padrao:
          maxLength: 120
          type: string
        descritores:
          additionalProperties: true
          type: object
      required:
      - escala
      - minimo_exercicio
      - minimo_contrato
      - secao_do_padrao
      - descritores
      type: object
    ParteDoCurso:
      enum:
      - 1
      - 2
      - 3
      type: integer
    BlocoParaGravarSchema:
      additionalProperties: false
      description: "O corpo de `putBlock`: o nome do bloco e o t\xEDtulo do Boss dele.\n\
        \nLetra, ordem e parte N\xC3O entram, pelo mesmo motivo que `cartao` n\xE3\
        o entra\nem `putInstrument`: s\xE3o a estrutura do livro, o semeador \xE9\
        \ a fonte delas, e\nmand\xE1-las \xE9 422.\n\nOs dois campos v\xEAm SEMPRE,\
        \ e vazio \xE9 valor v\xE1lido: \xE9 com ele que os doze\nblocos nascem, e\
        \ quem digitou um nome errado precisa poder apag\xE1-lo. \xC9 a\ndiferen\xE7\
        a para o t\xEDtulo da aula, onde ausente significa n\xE3o mexer, porque\n\
        l\xE1 existe uma segunda tela gravando o mesmo campo."
      properties:
        nome:
          maxLength: 120
          type: string
        boss_titulo:
          maxLength: 120
          type: string
      required:
      - nome
      - boss_titulo
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
servers:
- url: http://cursos:8000/api/cursos
security:
- bearerAuth: []
