                $ref: '#/components/schemas/CursoSchema'
      description: 'Os tres campos que mudam depois de o curso nascer, todos opcionais:

        AUSENTE OU NULO SIGNIFICA NAO MEXER, a mesma regra do `titulo_exibido`

        em `putLesson`. Corpo vazio devolve o curso como esta, sem gravar.


        `nome` vazio e 422. `progressao` e `por_laudo` ou `livre`, e trocar a

        regra de um curso muda como a proxima aula abre para TODOS os alunos

        dele. `produto_id` e o elo com a matricula: troca-lo troca QUEM ENTRA

        no curso, e texto vazio desaponta o produto e fecha a sala. E o mesmo

        gesto do comando `apontar_o_produto_do_curso`, pela porta; o comando

        continua existindo.


        O apelido, o estado e a versao NAO entram, e manda-los e 422: o apelido

        e a identidade do curso, e o estado e a versao sao da publicacao.

        404 se o curso nao existe naquele site. Devolve o curso como ficou.'
