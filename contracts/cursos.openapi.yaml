        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoParaAlterarSchema'
        required: true
  /cursos/{curso}/estrutura:
    put:
      operationId: putCourseStructure
      summary: 'Grava a estrutura de um curso: os blocos e as aulas, reconciliando com o que existe'
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstruturaSchema'
      description: 'O gesto Importar da tela de estrutura do Admin. O corpo e a lista de

        blocos na ordem, cada um com letra (A a Z), parte (1, 2 ou 3), as

        aulas na ordem e, se quiser, o nome do bloco e o titulo do Boss; cada

        aula leva numero (de 1 a 3 letras maiusculas ou digitos), titulo, se e

        Boss e o nivel de Banca. A ordem dos blocos e a posicao na lista, de

        um; a das aulas e a posicao no curso inteiro, do zero.


        RECONCILIA COMO O SEMEADOR DO LIVRO, e a fronteira e a mesma. Cria o

        bloco e a aula que faltam; corrige bloco, ordem, parte, Boss e Banca

        do que ja existe; e NUNCA toca obra: pedido, cliente, pecas, pausas,

        quiz, video, estado e versao ficam como estao. As aulas casam pelo

        NUMERO, que e estavel: o titulo da aula so entra onde esta VAZIO, o

        que a tela ja escreveu nao se sobrescreve, e `aulas_preservadas` diz

        quantas aulas ja existiam e ficaram com a obra intacta.


        OS BLOCOS CASAM PELA LETRA, QUE E POSICIONAL, e por isso a estrutura

        e a fonte do nome do bloco e do titulo do Boss: quando nasce um bloco

        na frente, o que era o B vira o C, e o nome tem de vir na estrutura

        nova para acompanha-lo. Cada um dos dois campos tem tres estados.

        Ausente ou nulo: o que esta gravado fica como esta. Texto: passa a

        ser este, mesmo que o bloco ja tivesse outro. Texto vazio: apaga.

        Mande sempre o nome que a tela mostra, e nenhum bloco perde o nome

        quando muda de letra.


        Aula que sumiu da estrutura nova e APAGADA so se nenhum aluno passou

        por ela (sem progresso, sem envio, sem registro de pausa). A

        conferencia acontece DENTRO da transacao que apaga, com essas aulas

        trancadas: um aluno gravando rastro nelas no mesmo instante e visto,

        e nenhuma aula por onde alguem passou e apagada. Se algum passou, e

        422 nomeando as aulas, e NADA e gravado: a transacao e uma so. Bloco

        que sumiu e apagado depois que as aulas dele mudaram de bloco ou

        foram apagadas.


        422 tambem, dizendo a linha do problema: letra de bloco repetida,

        numero de aula repetido, estrutura sem bloco, bloco sem aula, parte

        fora de 1..3, numero fora do padrao, titulo vazio, chave desconhecida.

        404 se o curso nao existe naquele site.


        Devolve a estrutura como ficou (os blocos com as aulas, cada aula no

        formato da listagem) e as contagens: blocos_criados, aulas_criadas,

        aulas_preservadas e aulas_apagadas.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstruturaParaGravarSchema'
        required: true
components:
  schemas:
    AulaAvulsaSchema:
      description: 'A aula avulsa que o Admin lista e que a pagina compartilhada mostra.


        `slug` e o endereco final salvo pelo servico. Ele nasce do titulo na criacao

        e pode mudar na edicao quando o Admin envia um slug valido. Se o endereco

        pedido estiver ocupado no mesmo site, o servico acrescenta um sufixo numerico

        e devolve aqui o endereco efetivamente salvo. `estado` sempre e `publicada`:

        esta porta nao oferece rascunho nem uma segunda publicacao.'
      properties:
        titulo:
          type: string
        slug:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        video_url:
          type: string
        descricao:
          type: string
        estado:
          const: publicada
          type: string
        publicada_em:
          format: date-time
          type: string
      required:
      - titulo
      - slug
      - video_url
      - descricao
      - estado
      - publicada_em
      type: object
    AulaAvulsaParaCriarSchema:
      additionalProperties: false
      description: 'O unico corpo que cria uma aula avulsa. O Admin oferece os tres

        campos ao mantenedor, mas so o servico gera o endereco pelo titulo.

        Descricao aceita texto vazio, para uma explicacao curta que so precisa

        do titulo e do video, mas o campo sempre viaja no corpo.'
      properties:
        titulo:
          maxLength: 120
          minLength: 1
          type: string
        video_url:
          maxLength: 500
          minLength: 1
          type: string
        descricao:
          maxLength: 5000
          type: string
      required:
      - titulo
      - video_url
      - descricao
      type: object
    AulaAvulsaParaEditarSchema:
      additionalProperties: false
      description: 'O corpo que edita uma aula avulsa. Os tres campos de conteudo

        continuam obrigatorios. `slug` e opcional: ausente, conserva o endereco;

        presente, pede um novo endereco no formato ASCII minusculo com hifens.

        Em colisao com outra aula, o servico reserva atomicamente o menor sufixo

        numerico livre e devolve o slug final salvo na resposta. O slug da propria

        aula nao conta como colisao.'
      properties:
        titulo:
          maxLength: 120
          minLength: 1
          type: string
        slug:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        video_url:
          maxLength: 500
          minLength: 1
          type: string
        descricao:
          maxLength: 5000
          type: string
      required:
      - titulo
      - video_url
      - descricao
      type: object
    AulaDaListaSchema:
      description: 'A linha da listagem: o que o editor mostra no índice, sem texto de peça.'
      properties:
        numero:
          type: string
        ordem:
          type: integer
        titulo_exibido:
          type: string
        bloco:
          $ref: '#/components/schemas/BlocoSchema'
        estado:
          type: string
        versao:
          type: integer
        publicada_em:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        e_boss:
          type: boolean
        banca_nivel:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - numero
      - ordem
      - titulo_exibido
      - bloco
      - estado
      - versao
      - publicada_em
      - e_boss
      - banca_nivel
      type: object
    BlocoSchema:
      description: 'O bloco como ele viaja dentro de toda aula: a estrutura do livro

        (`letra`, `ordem`, `parte`) e o que o mantenedor escreve nele (`nome` e

        `boss_titulo`, vazios até alguém os escrever por `putBlock`).


        Os dois de obra entraram aqui em 06/09/2026, e é isto que faz `putBlock`

        dispensar uma operação de leitura própria: quem grava um bloco o lê de

        volta na primeira aula dele. Gravar sem poder ler de volta foi o defeito

        que o degrau 1.3b teve de curar nos instrumentos, com um PR a mais.


        OS DOIS NOVOS CARREGAM DEFAULT, E ISSO NÃO É DESCUIDO NEM ENFEITE: sem

        ele o campo nasce em `required` no documento congelado, e

        `ci/contrato_aditivo.py` reprova o PR do Rito, porque campo obrigatório

        novo quebra quem consome pelo contrato antigo (`armadilhas/202`, medida

        aqui em 06/09/2026). O valor emitido NÃO muda: o modelo sempre tem os

        dois, com `default=""` no banco. Muda só o que o contrato EXIGE de quem

        valida. Não tire os defaults para "deixar igual aos outros três": os

        outros três nasceram com o contrato, estes chegaram depois.'
      properties:
        letra:
          type: string
        ordem:
          type: integer
        parte:
          type: integer
        nome:
          default: ''
          type: string
        boss_titulo:
          default: ''
          type: string
      required:
      - letra
      - ordem
      - parte
      type: object
    AulaSchema:
      description: 'A aula inteira: a linha da listagem mais o que se edita.'
      properties:
        numero:
          type: string
        ordem:
          type: integer
        titulo_exibido:
          type: string
        bloco:
