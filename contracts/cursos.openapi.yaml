        `parte` e o mesmo GUARDA de `getLesson`: parte que nao casa com o

        bloco da aula recusa com 404 e a aula continua como estava. 404

        tambem se o curso ou a aula nao existem.'
  /cursos/{curso}/aulas/{numero}/conferir:
    get:
      operationId: checkLesson
      summary: Confere a coerencia de uma aula e devolve os defeitos, sem gravar nada
      parameters:
      - in: path
        name: curso
        schema:
          type: string
        required: true
      - in: path
        name: numero
        schema:
          type: string
        required: true
      - in: query
        name: site_id
        schema:
          type: string
        required: true
      - in: query
        name: parte
        schema:
          anyOf:
          - $ref: '#/components/schemas/ParteDoCurso'
          - type: 'null'
        required: false
      - in: query
        name: modo
        schema:
          allOf:
          - enum:
            - coerencia
            - fidelidade
            type: string
          default: coerencia
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DefeitoSchema'
                type: array
      description: 'O Revisor de coerencia: CODIGO, e nao inteligencia artificial. Ele

        aponta e nunca corrige, nao grava nada e nao sobe versao.


        As SEIS conferencias sao as do plano da celula: remissao `E[NN]` para

        aula que existe no curso; instrumento e defeito citados pelo nome

        canonico; o mesmo arquivo escrito igual em todas as pecas; a mesma

        contagem com o mesmo numero; o `Aceito quando` da peca `Voce faz`

        igual a lista do checkpoint; e nenhum numero de plataforma no que o

        aluno le.


        Cada defeito traz `codigo` (o vocabulario fechado das seis),

        `peca` (o tipo da peca, ou vazio quando o defeito e da aula inteira),

        `alvo` (o pedaco de texto em falta), `frase` e `o_que_fazer`, as duas

        ja em portugues, escritas para quem edita a aula ler direto na tela.


        `impede_publicar` e verdadeiro SO na remissao quebrada, que e o

        [INV-CUR-C1]: e o unico defeito que `publishLesson` recusa com 422.

        Os outros cinco sao aviso.


        Aula sem defeito responde lista vazia, e nao erro. `parte` e o mesmo

        GUARDA de `getLesson`. 404 se o curso ou a aula nao existem.


        O `modo` ESCOLHE A REGUA, e o padrao e `coerencia`, identico ao que

        esta operacao respondia antes do degrau 3.2.


        Em `modo=fidelidade` responde o GUARDIAO DE FIDELIDADE, que e IA, e

        nao codigo. Ele compara cada peca DERIVADA com a FONTE de que ela

        deriva e aponta onde o sentido mudou: o `roteiro` e a

        `videoaula_em_texto` contra as 16 pecas canonicas, o `guia_do_mentor`

        contra o `Aceito quando` mais as pecas `voce_faz` e `checkpoint`, e a

        peca `dicionario_cartao_respostas` (onde mora o Cartao de 1 pagina)

        contra as outras 15. Peca derivada sem texto nao e comparada.


        O `codigo` de cada defeito de fidelidade vem de OUTRO vocabulario

        fechado, o dos sete desvios da ficha: `invencao`,

        `regra_virou_sugestao`, `nome_trocado`, `omissao`,

        `sentido_alterado`, `decisao_simplificada` e

        `comparacao_entre_pessoas`. `peca` e a peca DERIVADA, `alvo` e o

        trecho dela, e `frase` traz o trecho da fonte ao lado do trecho da

        saida. `impede_publicar` e SEMPRE falso neste modo: o Guardiao

        aponta, e nunca veta.


        422 em `modo=fidelidade` quando a encomenda nao tem nenhuma peca

        derivada escrita, e quando um dos textos passa do teto desta

        conferencia; o `detail` diz o que fazer, em portugues. 503 quando a

        IA nao produziu resposta (chave ausente, chave recusada, limite,

        queda, formato ilegivel), tambem com a frase em portugues. Nada e

        gravado em nenhum dos dois casos.'
  /cursos/{curso}/blocos/{letra}:
