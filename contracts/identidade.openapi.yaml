openapi: 3.1.0
info:
  title: Identidade — API interna
  version: 1.0.0
  description: |
    Superfície de MÁQUINA da identidade do site. Existe por uma razão só:
    qualquer célula precisa saber quem é a pessoa em qualquer página, e o
    cookie de sessão é assinado e resolvido AQUI (Lei 2, Lei 3 — o banco e
    o segredo não saem desta célula).

    Lei do assunto: docs/decisoes/DECISAO-celula-de-identidade.md. A
    resposta desta API RECONHECE uma pessoa; ela nunca AUTORIZA nada —
    autorização é fail-closed na célula dona do recurso.
servers:
  - url: http://identidade:8000/interno
security:
  - bearerAuth: []
paths:
  /sessao:
    get:
      operationId: getSession
      summary: Quem é o dono da sessão desta requisição
      description: >-
        Resolve o cookie de sessão repassado pelo chamador. Responde 200 sempre que o chamador
        estiver autorizado: `autenticado: false` significa que não há sessão (visitante), e NÃO é um erro.
        O e-mail nunca é devolvido.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessao/completa:
    get:
      operationId: getSessionFull
      summary: Quem é o dono da sessão, com e-mail — par autorizado apenas
      description: >-
        Como getSession, acrescentando o e-mail — o dado que uma célula dona de recurso precisa
        para conferir as PRÓPRIAS listas (matrícula, staff). Exige que o token do par esteja
        também em TOKENS_COMPLETOS_*; sem esse degrau a resposta é 403, mesmo com Bearer válido.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFull'
  /pessoas/por-email:
    post:
      operationId: findPersonByEmail
      summary: Qual o id de plataforma de quem tem este e-mail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PessoaPorEmail'
      description: 'Traduz um e-mail no id OPACO da pessoa — o mesmo `id` que getSession devolve.
        Existe por uma razão só: uma célula que conhece as pessoas por E-MAIL precisa endereçar
        uma carta para a caixa de avisos, que entrega por ID DE PLATAFORMA. POST e não GET com o
        e-mail no caminho: caminho de URL entra em log de servidor, em histórico de proxy e em rastro
        de erro; corpo, não. Entra e-mail, sai id — esta porta nunca devolve e-mail nem nome. Exige
        TOKENS_COMPLETOS_*, o mesmo degrau de getSessionFull, porque quem manda um e-mail para ela
        descobre se ele existe. `id: null` é RESPOSTA, não erro.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPedido'
        required: true
components:
  schemas:
    EmailPedido:
      description: O e-mail de quem se procura. Comparado em minúsculas, sem espaços.
      properties:
        email:
          type: string
      required:
      - email
      type: object
    PessoaPorEmail:
      description: O id opaco de quem tem aquele e-mail, ou `null` — nunca o e-mail de volta.
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
      type: object
    Session:
      description: 'Quem é o dono da sessão; sem sessão, só `autenticado: false`.'
      type: object
      required: [autenticado]
      properties:
        autenticado: { type: boolean }
        id:
          anyOf:
            - type: string
            - type: 'null'
        nome_exibido:
          anyOf:
            - type: string
            - type: 'null'
        papel:
          anyOf:
            - type: string
            - type: 'null'
    SessionFull:
      description: Como Session, com o e-mail — só para par autorizado em TOKENS_COMPLETOS.
      type: object
      required: [autenticado]
      properties:
        autenticado: { type: boolean }
        id:
          anyOf:
            - type: string
            - type: 'null'
        nome_exibido:
          anyOf:
            - type: string
            - type: 'null'
        papel:
          anyOf:
            - type: string
            - type: 'null'
        email:
          anyOf:
            - type: string
            - type: 'null'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
