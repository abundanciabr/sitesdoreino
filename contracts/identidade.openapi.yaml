openapi: 3.1.0
info:
  title: Identidade — API interna
  version: 1.0.0
  description: |
    Superfície de MÁQUINA da identidade do site. Existe por uma razão só:
    qualquer célula precisa saber quem é a pessoa em qualquer página, e o
    cookie de sessão é assinado e resolvido AQUI (Lei 2, Lei 3 — o banco e
    o segredo não saem desta célula).

    Lei do assunto: docs/decisoes/DECISAO-celula-de-identidade.md. A
    resposta desta API RECONHECE uma pessoa; ela nunca AUTORIZA nada —
    autorização é fail-closed na célula dona do recurso.
servers:
  - url: http://identidade:8000/interno
security:
  - bearerAuth: []
paths:
  /sessao:
    get:
      operationId: getSession
      summary: Quem é o dono da sessão desta requisição
      description: >-
        Resolve o cookie de sessão repassado pelo chamador. Responde 200 sempre que o chamador
        estiver autorizado: `autenticado: false` significa que não há sessão (visitante), e NÃO é um erro.
        O e-mail nunca é devolvido.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessao/completa:
    get:
      operationId: getSessionFull
      summary: Quem é o dono da sessão, com e-mail — par autorizado apenas
      description: >-
        Como getSession, acrescentando o e-mail — o dado que uma célula dona de recurso precisa
        para conferir as PRÓPRIAS listas (matrícula, staff). Exige que o token do par esteja
        também em TOKENS_COMPLETOS_*; sem esse degrau a resposta é 403, mesmo com Bearer válido.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFull'
  /pessoas/por-email:
    post:
      operationId: findPersonByEmail
      summary: Qual o id de plataforma de quem tem este e-mail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PessoaPorEmail'
      description: 'Traduz um e-mail no id OPACO da pessoa — o mesmo `id` que getSession devolve.
        Existe por uma razão só: uma célula que conhece as pessoas por E-MAIL precisa endereçar
        uma carta para a caixa de avisos, que entrega por ID DE PLATAFORMA. POST e não GET com o
        e-mail no caminho: caminho de URL entra em log de servidor, em histórico de proxy e em rastro
        de erro; corpo, não. Entra e-mail, sai id — esta porta nunca devolve e-mail nem nome. Exige
        TOKENS_COMPLETOS_*, o mesmo degrau de getSessionFull, porque quem manda um e-mail para ela
        descobre se ele existe. `id: null` é RESPOSTA, não erro.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPedido'
        required: true
  /tokens-de-entrada:
    post:
      operationId: issueLoginToken
      summary: Um token efêmero para provar, no POST de /entrar/senha, que o pedido veio do site
      description: >-
        Login por senha (DECISAO-login-por-senha.md) é um POST que CRIA sessão — ao contrário de
        /entrar/sair, que só destrói, o padrão de origem (Origin/Referer) não basta aqui (LICOES.md
        da célula já registra isso por escrito). Como quem RENDERIZA o formulário de senha é o
        `funil`, não esta célula, e um CSRF token do funil nunca validaria aqui (segredos
        diferentes), a prova é este token assinado (TimestampSigner, expira em minutos) — o mesmo
        princípio do `state` que o fluxo do Google já usa, só que emitido para outra célula em vez
        de guardado na própria sessão. Qualquer par aceito pode pedir; o token não carrega e-mail
        nem senha nenhuma, só prova "isto foi pedido a este site, agora".
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDeEntrada'
  /pessoas/definir-senha:
    post:
      operationId: setPassword
      summary: Cria ou atualiza a senha de uma pessoa (cadastro sem conta do Google)
      description: >-
        Upsert por e-mail — mesma forma de cunhar_ou_recuperar (o caminho do Google): se a
        Identidade não existir, nasce aqui; se existir, só a senha é atualizada. `criada: true`
        só na primeira vez, mesma semântica do resto da célula. Exige o grau TOKENS_SENHA_* além
        do par aceito — gravar senha alheia é mais que "perguntar quem é alguém", e por isso não
        reusa TOKENS_COMPLETOS_* (esse grau é sobre LER e-mail, não sobre ESCREVER senha).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PessoaComSenha'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinirSenhaPedido'
        required: true
  /pessoas/resetar-senha:
    post:
      operationId: resetPassword
      summary: Gera uma senha nova para um e-mail que já existe, e a devolve em texto puro UMA vez
      description: >-
        Para o caminho de recuperação manual (DECISAO-login-por-senha.md §1): o mantenedor confirma
        quem é a pessoa pelo WhatsApp que ela já deixou no cadastro, aciona esta porta pelo admin, e
        repassa a senha nova por fora — esta célula nunca manda mensagem nenhuma. A senha em texto
        puro sai UMA vez nesta resposta e não é gravada em lugar nenhum (só o hash fica). 404 se o
        e-mail não tiver Identidade nenhuma (nada a resetar). Mesmo grau de setPassword.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PessoaComSenhaNova'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPedido'
        required: true
components:
  schemas:
    EmailPedido:
      description: O e-mail de quem se procura. Comparado em minúsculas, sem espaços.
      properties:
        email:
          type: string
      required:
      - email
      type: object
    PessoaPorEmail:
      description: O id opaco de quem tem aquele e-mail, ou `null` — nunca o e-mail de volta.
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
      type: object
    Session:
      description: 'Quem é o dono da sessão; sem sessão, só `autenticado: false`.'
      type: object
      required: [autenticado]
      properties:
        autenticado: { type: boolean }
        id:
          anyOf:
            - type: string
            - type: 'null'
        nome_exibido:
          anyOf:
            - type: string
            - type: 'null'
        papel:
          anyOf:
            - type: string
            - type: 'null'
    SessionFull:
      description: Como Session, com o e-mail — só para par autorizado em TOKENS_COMPLETOS.
      type: object
      required: [autenticado]
      properties:
        autenticado: { type: boolean }
        id:
          anyOf:
            - type: string
            - type: 'null'
        nome_exibido:
          anyOf:
            - type: string
            - type: 'null'
        papel:
          anyOf:
            - type: string
            - type: 'null'
        email:
          anyOf:
            - type: string
            - type: 'null'
    TokenDeEntrada:
      description: O token efêmero a embutir no POST de /entrar/senha. Opaco para quem o recebe.
      type: object
      required: [token]
      properties:
        token: { type: string }
    DefinirSenhaPedido:
      description: >-
        O e-mail e a senha em texto puro (transporte é HTTPS interno, nunca fica em log — o hash
        nasce do lado da identidade, nunca do lado de quem chama). nome/site_id só valem na
        primeira vez (cunhagem); numa Identidade que já existe, são ignorados.
      type: object
      required: [email, senha]
      properties:
        email: { type: string }
        senha: { type: string }
        nome:
          anyOf:
            - type: string
            - type: 'null'
        site_id:
          anyOf:
            - type: string
            - type: 'null'
    PessoaComSenha:
      description: Confirma que a senha foi gravada. Nunca ecoa a senha nem o hash.
      type: object
      required: [id, criada]
      properties:
        id: { type: string }
        criada: { type: boolean }
    PessoaComSenhaNova:
      description: >-
        A senha nova, em texto puro, para o mantenedor repassar por fora (WhatsApp). Sai UMA vez
        nesta resposta; a célula não a grava em lugar nenhum além do hash.
      type: object
      required: [id, senha_nova]
      properties:
        id: { type: string }
        senha_nova: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
