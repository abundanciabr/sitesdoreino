openapi: 3.1.0
info:
  title: Identidade — API interna
  version: 1.0.0
  description: |
    Superfície de MÁQUINA da identidade do site. Existe por uma razão só:
    qualquer célula precisa saber quem é a pessoa em qualquer página, e o
    cookie de sessão é assinado e resolvido AQUI (Lei 2, Lei 3 — o banco e
    o segredo não saem desta célula).

    Lei do assunto: docs/decisoes/DECISAO-celula-de-identidade.md. A
    resposta desta API RECONHECE uma pessoa; ela nunca AUTORIZA nada —
    autorização é fail-closed na célula dona do recurso.
servers:
  - url: http://identidade:8000/interno
security:
  - bearerAuth: []
paths:
  /sessao:
    get:
      operationId: getSession
      summary: Quem é o dono da sessão desta requisição
      description: >-
        Resolve o cookie de sessão repassado pelo chamador. Responde 200 sempre que o chamador
        estiver autorizado: `autenticado: false` significa que não há sessão (visitante), e NÃO é um erro.
        O e-mail nunca é devolvido.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessao/completa:
    get:
      operationId: getSessionFull
      summary: Quem é o dono da sessão, com e-mail — par autorizado apenas
      description: >-
        Como getSession, acrescentando o e-mail — o dado que uma célula dona de recurso precisa
        para conferir as PRÓPRIAS listas (matrícula, staff). Exige que o token do par esteja
        também em TOKENS_COMPLETOS_*; sem esse degrau a resposta é 403, mesmo com Bearer válido.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFull'
  /pessoas/por-email:
    post:
      operationId: findPersonByEmail
      summary: Qual o id de plataforma de quem tem este e-mail
      description: |-
        Traduz um e-mail no id OPACO da pessoa — o mesmo `id` que `getSession`
        devolve. Existe por uma razao so, e ela e o aviso: uma celula que
        conhece as pessoas por E-MAIL (a `alunos`) precisa enderecar uma carta
        para uma caixa de avisos que entrega por ID DE PLATAFORMA. Ninguem, ate
        29/08/2026, sabia traduzir um no outro — e sem essa traducao a promessa
        "voce e avisado quando a sua situacao muda" nao tem como existir.

        Decisao do mantenedor em 29/08/2026, escolhida entre duas opcoes: a
        traducao mora AQUI, em quem sabe, e nao numa copia do id gravada na
        ficha do aluno. A copia resolveria so as fichas novas — as antigas e as
        que o painel cria a mao ficariam para sempre sem aviso.

        POST e nao GET com o e-mail no caminho, e a escolha e de privacidade:
        caminho de URL entra em log de servidor, em historico de proxy e em
        rastro de erro. O corpo, nao. Nenhuma resposta desta porta devolve o
        e-mail de volta (DECISAO-EVO-01 §3): entra e-mail, sai id opaco.

        Exige o token do par em TOKENS_COMPLETOS_*, o mesmo degrau de
        `getSessionFull` — e pelo mesmo motivo: quem manda um e-mail para esta
        porta descobre se ele existe, e existencia e informacao sobre uma
        pessoa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: >-
                    Comparado em minusculas e sem espacos nas pontas, do lado de
                    ca. Quem chama nao precisa saber a forma canonica.
      responses:
        '200':
          description: >-
            Respondi. `id: null` significa "nao conheco esta pessoa" — ela nunca
            entrou com o Google — e e uma RESPOSTA, nao um erro: quem chama
            precisa poder tratar isso sem traduzir excecao em tela.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PessoaPorEmail'
        '403':
          description: O token do par nao esta em TOKENS_COMPLETOS_*
        '422':
          description: Corpo invalido (sem `email`, ou campo a mais)
components:
  schemas:
    PessoaPorEmail:
      description: >-
        O id opaco de quem tem aquele e-mail, ou `null`. NUNCA devolve o e-mail
        nem o nome — entra e-mail, sai id.
      type: object
      required: [id]
      properties:
        id:
          anyOf:
            - type: string
            - type: 'null'
    Session:
      description: 'Quem é o dono da sessão; sem sessão, só `autenticado: false`.'
      type: object
      required: [autenticado]
      properties:
        autenticado: { type: boolean }
        id:
          anyOf:
            - type: string
            - type: 'null'
        nome_exibido:
          anyOf:
            - type: string
            - type: 'null'
        papel:
          anyOf:
            - type: string
            - type: 'null'
    SessionFull:
      description: Como Session, com o e-mail — só para par autorizado em TOKENS_COMPLETOS.
      type: object
      required: [autenticado]
      properties:
        autenticado: { type: boolean }
        id:
          anyOf:
            - type: string
            - type: 'null'
        nome_exibido:
          anyOf:
            - type: string
            - type: 'null'
        papel:
          anyOf:
            - type: string
            - type: 'null'
        email:
          anyOf:
            - type: string
            - type: 'null'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
