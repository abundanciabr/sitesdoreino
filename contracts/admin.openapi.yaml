        coorte:
          type: string
        chave:
          type: string
        celula:
          type: string
        epoca:
          type: integer
        concessao:
          type: integer
        candidato:
          type: string
        manifesto:
          additionalProperties: true
          type: object
        estado_anterior:
          additionalProperties: true
          type: object
        aceitacao:
          $ref: '#/components/schemas/ReciboReceptor'
      required:
      - operacao
      - coorte
      - chave
      - celula
      - epoca
      - concessao
      - candidato
      - manifesto
      - estado_anterior
      - aceitacao
      type: object
    Coordenacao_candidato:
      additionalProperties: false
      properties:
        operacao:
          const: candidato
          type: string
        coorte:
          type: string
        chave:
          type: string
        tarefa:
          type: string
        epoca:
          type: integer
        versao:
          type: integer
        concessao:
          type: integer
        candidato:
          type: string
      required:
      - operacao
      - coorte
      - chave
      - tarefa
      - epoca
      - versao
      - concessao
      - candidato
      type: object
    Coordenacao_checkpoint:
      additionalProperties: false
      properties:
        operacao:
          const: checkpoint
          type: string
        coorte:
          type: string
        chave:
          type: string
        tarefa:
          type: string
        epoca:
          type: integer
        versao:
          type: integer
        concessao:
          type: integer
        checkpoint:
          additionalProperties: true
          type: object
      required:
      - operacao
      - coorte
      - chave
      - tarefa
      - epoca
      - versao
      - concessao
      - checkpoint
      type: object
    Coordenacao_conferir_publicacao:
      additionalProperties: false
      properties:
        operacao:
          const: conferir_publicacao
          type: string
        coorte:
          type: string
        celula:
          type: string
        epoca:
          type: integer
        concessao:
          type: integer
        publicacao:
          type: string
        estado_anterior:
          additionalProperties: true
          type: object
      required:
      - operacao
      - coorte
      - celula
      - epoca
      - concessao
      - publicacao
