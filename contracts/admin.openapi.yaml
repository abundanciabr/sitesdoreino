      type: object
    Coordenacao_confirmar_publicacao:
      additionalProperties: false
      properties:
        operacao:
          const: confirmar_publicacao
          type: string
        coorte:
          type: string
        chave:
          type: string
        celula:
          type: string
        epoca:
