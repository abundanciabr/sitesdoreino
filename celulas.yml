# =============================================================================
# O MAPA DAS CÉLULAS — quem é quem, o que é de quem, e quem consome quem.
#
# Onda 5 do `docs/decisoes/PLANO-MESTRE-ROBOS-SEM-COLISAO.md` (o Cartógrafo).
# É este arquivo que substitui a cerca "1 PR = 1 célula": em vez de RECUSAR um
# PR por largura, o CI passa a DERIVAR do diff o que precisa rodar. Restringir
# largura para comprar exclusividade cobra o pedágio na moeda errada — e a
# cerca não teria evitado o pior incidente já medido aqui (Opus-2, P1 e P2).
#
# ---------------------------------------------------------------------------
# DUAS COISAS MORAM AQUI, E SÓ ESTAS DUAS
#
#   caminhos:  que pedaços do repositório PERTENCEM a esta célula. É o mapa que
#              responde "o que este PR toca?" — e existia em DOIS lugares
#              (`ci/ci.py::celulas_tocadas` e `ci/cerca-de-celula.sh`), que já
#              discordavam sobre `painel/`. Fato do projeto não mora em dois
#              lugares (CLAUDE.md); agora mora aqui.
#
#   consome:   de quais OUTRAS células esta lê API. É o que decide a ordem de
#              publicação (provedor antes de consumidor) e o que torna visível
#              uma dependência nova.
#
# ---------------------------------------------------------------------------
# O QUE IMPEDE ESTE MAPA DE MENTIR
#
# Um mapa mantido à mão envelhece em silêncio — é a Classe 8 (mapa velho), a
# doença que este plano inteiro existe para curar, e que já cobrou caro aqui.
# Por isso ele tem um VARREDOR: `ci/mapa_de_celulas.py --verificar` compara o
# que está escrito com o que o código faz, nos DOIS sentidos:
#
#   consumo no código e não declarado aqui  -> FAIL (dependência escondida)
#   declarado aqui e ausente do código      -> FAIL (declaração órfã)
#   célula no manifesto e ausente daqui     -> FAIL (e vice-versa)
#
# Ele roda na muralha de todo PR. Declarar é barato; declarar errado, não passa.
#
# A medição do consumo é a convenção que as 13 células já seguem: quem consome
# a `alunos` lê `ALUNOS_API_URL`. Trocar essa convenção sem ensinar o varredor
# deixa o mapa cego — e é por isso que o teste-guarda mede contra o código real.
# =============================================================================
celulas:

  admin:
    # `painel/` entra na imagem da `admin` no build (deploy-celula.yml embute a
    # pasta), então mexer no livro de ocorrências É mexer nesta célula: sem esta
    # linha, um registro novo mergearia sem disparar deploy e o painel online
    # congelaria em silêncio.
    # `fila/` idem, desde 29/08/2026: a aba "Os robôs" da gestão da Caixa é
    # calculada da fila embutida — evento novo na fila É quadro novo na admin.
    # `documentos/` entra pela MESMA razão de `painel/` e `fila/`: a área de
    # documentos do site (`DECISAO-a-area-de-documentos.md`) é servida por esta
    # célula, e a pasta entra na imagem no build. Documento novo é página nova —
    # sem esta linha, mexer num documento mergearia sem disparar deploy e o site
    # continuaria publicando o texto antigo, em silêncio.
    # `docs/decisoes/` desde 31/08/2026, pela MESMA razao das tres acima: a
    # area `/mapa-ia/planos/` serve esses arquivos e a pasta entra na imagem
    # no build. Plano corrigido e pagina corrigida — sem esta linha, mexer
    # num plano mergearia sem disparar deploy e o site continuaria servindo
    # o texto antigo, em silencio.
    caminhos: [services/admin, painel, fila, documentos, docs/decisoes]
    # `catalogo` desde 31/08/2026: o menu do topo do site e DADO DO SITE, e
    # dado de site mora no catalogo. A tela /admin/menu/ le e grava la, pela
    # porta de maquina — nunca no banco dele, e nunca guardando uma copia
    # aqui (seria o mesmo fato em dois lugares).
    # `gamificacao` desde 31/08/2026: a economia da escola (quanto vale cada
    # coisa) e DADO da gamificacao, e mora la. A tela /admin/economia/ le e liga
    # as regras pela porta de maquina — nunca no banco dela, e nunca guardando
    # uma copia aqui (seria o mesmo fato em dois lugares). Ela existe porque a
    # lei da gamificacao chama de criterio de morte o dia em que ajustar a
    # economia passar a exigir PR de codigo (§10.5).
    #
    # E e AQUI que a autorizacao mora: a gamificacao nao assina sessao
    # ([INV-P12]) e o papel da identidade nunca autoriza rota. O cracha que vale
    # e o desta area; o Bearer do par prova so quem CHAMA.
    # `notificacoes` desde 03/09/2026: a tela /admin/avisos/ manda um aviso de
    # teste pela porta de maquina (POST /aviso-de-teste, Rito de Contrato de
    # 03/09/2026), para o mantenedor saber se o canal de avisos do celular esta
    # funcionando sem precisar entrar na VPS (Lei 5). Nao guarda nada aqui: le a
    # resposta e mostra.
    # `mensageria` desde 04/09/2026: as SEQUENCIAS de mensagens da escola sao
    # dado da mensageria e moram la. A tela /admin/escola/jornadas/ le os
    # passos, quem esta dentro e o que foi BARRADO pela porta de maquina, e
    # escreve por ela duas coisas: liga/desliga uma sequencia, e publica versao
    # nova de um texto. Nunca no banco dela, e nunca guardando copia aqui: seria
    # o mesmo fato em dois lugares, e no dia em que os dois discordassem esta
    # tela mostraria um texto e o aluno receberia outro.
    #
    # O contrato congelou no Rito de 04/09/2026, com o mantenedor presente
    # (registro 20260904-070). Sao DOIS graus do mesmo par (leitura e
    # publicacao), e o de publicacao ja contem o de leitura.
    # `metricas` desde 04/09/2026: a HISTORIA dos numeros da escola mora la (o
    # livro de fatos, PLANO-PAINEL-DE-GESTAO §6.2). Todo o resto do placar conta
    # ao vivo, e por isso so sabe dizer como as coisas estao AGORA; a linha de
    # confianca do cabecalho pergunta a medicao quanto ja foi guardado, de que
    # assuntos, e o que PAROU de chegar. Le pela porta de maquina, com o par que
    # o mantenedor provisionou, e nao guarda copia de nada aqui.
    # `cursos` desde 05/09/2026: o TEXTO das aulas do curso e obra nao lancada
    # do mantenedor e mora SO no banco da cursos (o repositorio e publico,
    # INV-CUR-C2). O editor /admin/escola/aulas/ le e grava pela porta de
    # maquina dela, pelo contrato congelado no Rito de 05/09/2026 (PR #1061),
    # e nunca guarda copia de uma linha aqui.
    consome:
      [
        alunos,
        catalogo,
        cursos,
        gamificacao,
        identidade,
        mensageria,
        metricas,
        notificacoes,
        sugestoes,
      ]

  alunos:
    caminhos: [services/alunos]
    # Ganhou a primeira em 29/08/2026, e ela existe por uma razão só: para
    # endereçar a carta de liberação é preciso o id de plataforma de quem vai
    # recebê-la, e só a `identidade` sabe traduzir e-mail em id. Fail-ABERTO —
    # a `identidade` fora do ar custa o aviso, nunca a liberação.
    consome: [identidade]

  catalogo:
    caminhos: [services/catalogo]
    consome: []

  checkout:
    caminhos: [services/checkout]
    consome: [catalogo, pagamentos]

  cursos:
    caminhos: [services/cursos]
    # Os três pares entraram JUNTOS com os clientes que os leem (degrau 1.8, a
    # sala do aluno, `apps/core/clients.py`), e não antes (`armadilhas/224`):
    # - alunos: a matrícula ativa decide quem vê a aula (`getStudentStanding`,
    #   fail-closed; `ALUNOS_API_URL`).
    # - catalogo: o menu do topo é dado do site (`getSiteByHost`, fail-open;
    #   `CATALOGO_API_URL`).
    # - identidade: quem é a pessoa, COM e-mail, porque a matrícula se pergunta
    #   por e-mail (`getSessionFull`; `IDENTIDADE_API_URL`).
    consome: [alunos, catalogo, identidade]

  encomendas:
    caminhos: [services/encomendas]
    # NASCE SEM CONSUMIR NINGUÉM, e a lista vazia é a declaração honesta —
    # não um esquecimento. A lei prevê `consome: [alunos, identidade]`
    # (`DECISAO-fila-do-primeiro-dolar.md` §4), e essas linhas entram no
    # degrau 2.7 da escada, junto com os clientes que leem
    # `IDENTIDADE_API_URL` e `ALUNOS_API_URL`. Declará-las HOJE seria
    # declaração órfã, e o varredor reprova por isso, com razão
    # (`armadilhas/224`): um mapa que promete a mais é tão mentiroso quanto
    # um que promete a menos. Quem escrever os clientes volta aqui no mesmo
    # PR — e se esquecer, o varredor cobra pelo outro lado.
    consome: []

  forum:
    caminhos: [services/forum]
    # `catalogo` desde 31/08/2026: o menu do topo e DADO DO SITE, e o forum
    # mostra o MESMO menu que o site. Ele NAO tem o CONV-SITE inteiro (isso
    # mexeria em toda a identidade da celula) — pergunta so o menu do host da
    # requisicao, com cache, e cai para "sem menu" em qualquer tropeco.
    #
    # `gamificacao` desde 01/09/2026: a etiqueta "Nv 7 · Modelador" ao lado de
    # quem escreve (`apps/core/etiquetas.py`). O forum le NIVEL e TITULO por
    # `getPublicProfiles`, em lote, uma consulta por pagina — e nunca XP, que
    # por contrato nao sai dessa porta. Cai para "sem etiqueta" em qualquer
    # tropeco, do mesmo jeito que o menu cai para "sem menu".
    consome: [alunos, catalogo, gamificacao, identidade]

  funil:
    caminhos: [services/funil]
    # `gamificacao` desde 01/09/2026: a home e a primeira tela depois do login, e
    # ela passou a mostrar o degrau da pessoa na trilha da escola (o quadrinho de
    # progresso, degrau 20 do PLANO-CELULA-GAMIFICACAO). O progresso e DADO DA
    # GAMIFICACAO e mora la: o funil le `getMyStatus` pela porta de maquina, sem
    # copia nenhuma deste lado. Fail-ABERTO como os outros pares desta celula, a
    # gamificacao fora do ar custa o quadrinho, nunca a home.
    consome: [alunos, catalogo, gamificacao, identidade, leads, notificacoes]

  gamificacao:
    caminhos: [services/gamificacao]
    # A gênese declarou `consome: []` e escreveu aqui que a linha entraria
    # "no PR 7 da escada, junto com o cliente que lê IDENTIDADE_API_URL".
    # O cliente chegou ANTES: quem o escreveu foi a porta de máquina (o PR
    # que a escada chamava de 16, antecipado porque o contrato congelou sem
    # porta e travava toda a célula). É `getMyStatus` quem pergunta "quem é
    # esta pessoa?" — `services/gamificacao/apps/core/sessao.py`.
    #
    # `alunos` NÃO entra: a gamificação não confere matrícula. Quem decide o
    # que pode é quem serve a tela; esta porta só diz de quem é o XP.
    #
    # `forum` desde 02/09/2026, e o sentido é o INVERSO do par que já existia:
    # até aqui o fórum perguntava a etiqueta de nível à gamificação; agora a
    # gamificação pergunta TÍTULOS ao fórum (`listRecentTopics`,
    # `apps/core/forum.py`). É a fundação dos Destaques da semana: título não
    # viaja em evento, porque `forum.topico-criado.v1` tem
    # `additionalProperties: false` e carrega só ids opacos — quem vai escolher
    # um trabalho precisa perguntar na hora de MOSTRAR. Fail-ABERTO como os
    # outros pares desta célula: fórum fora do ar custa a lista, nunca a tela.
    #
    # São DOIS pares e DOIS tokens. Reusar um valor faria a rotação de um
    # derrubar o outro em silêncio; quem instala este é
    # `infra/provisionar-par-da-gamificacao-com-o-forum.sh`.
    #
    # `catalogo` desde 02/09/2026, pelo MESMO motivo do fórum e da Caixa: o menu
    # do topo é DADO DO SITE, e esta célula mostra o MESMO menu que o site. Ela
    # não ganhou o CONV-SITE inteiro (isso mexeria em toda a identidade daqui, e
    # o contrato congelado não tem `site_id` em operação nenhuma) — pergunta só
    # o menu do host da requisição, com cache de 60s, e cai para "sem menu" em
    # qualquer tropeço.
    #
    # É o par que faltava quando o mantenedor abriu `/conquistas/` e viu a única
    # área do site sem menu e sem rodapé (`armadilhas/286`). Quem o instala é
    # `infra/provisionar-par-do-menu.sh`, o mesmo que já ligou o Admin, o fórum
    # e a Caixa: o quinto degrau dele nasceu junto com esta linha.
    consome: [catalogo, forum, identidade]

  identidade:
    caminhos: [services/identidade]
    consome: []

  leads:
    caminhos: [services/leads]
    consome: []

  mensageria:
    caminhos: [services/mensageria]
    consome: []

  metricas:
    caminhos: [services/metricas]
    # NASCE SEM CONSUMIR NINGUÉM, e aqui a lista vazia não é um degrau da
    # escada: é o DESENHO da célula. A `metricas` é o livro de fatos da
    # plataforma (`PLANO-PAINEL-DE-GESTAO.md` §6.2) e é consumidora de
    # EVENTOS, nunca de API — ela recebe o que as outras publicam por
    # contrato (`contracts/eventos/*.json`) e responde por porta própria.
    # `consome` neste mapa mede leitura de API de outra célula (a convenção
    # é ler `<CELULA>_API_URL`), e esta célula não fará isso nem quando
    # estiver completa. Quem vai consumi-la é a `admin`, e é o mapa DELA que
    # ganha `metricas` no degrau 7.4 — no mesmo PR do cliente, senão o
    # varredor reprova por declaração órfã, com razão (`armadilhas/224`).
    consome: []

  notificacoes:
    caminhos: [services/notificacoes]
    consome: []

  pagamentos:
    caminhos: [services/pagamentos]
    consome: []

  pages:
    caminhos: [services/pages]
    # AS DUAS LINHAS ENTRARAM NO DEGRAU 06 (05/09/2026), no MESMO PR do código
    # que as consome, e não antes: a gênese declarou `consome: []` de propósito,
    # porque declaração escrita antes do cliente é declaração órfã e o varredor
    # reprova por isso, com razão (`armadilhas/224`). Um mapa que promete a mais
    # é tão mentiroso quanto um que promete a menos.
    #
    # `identidade`: quem é a pessoa do outro lado do cookie. A casa REPASSA o
    # cookie e pergunta; nunca o lê e nunca o assina ([INV-P12]).
    # `alunos`: se essa pessoa tem matrícula ativa. É esta resposta, e só ela,
    # que abre a Prancheta, e não conseguir perguntar FECHA a porta.
    #
    # Quem lê `IDENTIDADE_API_URL` e `ALUNOS_API_URL` é
    # `services/pages/apps/core/clients.py`, e a decisão que elas alimentam mora
    # em `services/pages/apps/core/porta.py`.
    #
    # `catalogo` entrou logo depois, no mesmo degrau 06 e pela mesma regra: o
    # MENU DO TOPO é dado do site, mora no `catalogo`, e a casa das Páginas
    # mostra o MESMO menu que o fórum, a Caixa e as Conquistas. Ela NÃO ganhou o
    # CONV-SITE inteiro: pergunta só o menu do host da requisição, com cache, e
    # cai para "sem menu" em qualquer tropeço, porque um menu é enfeite de
    # navegação e derrubar a Prancheta por causa dele seria a troca errada. Quem
    # lê `CATALOGO_API_URL` é `services/pages/apps/core/menu.py`.
    consome: [alunos, catalogo, identidade]

  quiz:
    # `services/quiz/LICOES.md` MENCIONA `CATALOGO_API_URL`, mas o código não a
    # lê — o varredor não olha `.md` de propósito: documento não é dependência,
    # e tratar prosa como consumo inventaria uma ordem de publicação que o
    # mundo real não pede. (Este mapa nasceu declarando o consumo, e foi o
    # próprio varredor que corrigiu a mão que o escreveu.)
    caminhos: [services/quiz]
    consome: []

  sugestoes:
    caminhos: [services/sugestoes]
    # `catalogo` desde 31/08/2026, pela MESMA razao do forum: o menu do topo e
    # DADO DO SITE, e a Caixa mostra o MESMO menu. Ela NAO ganhou o CONV-SITE
    # inteiro — pergunta so o menu do host da requisicao, com cache, e cai para
    # "sem menu" em qualquer tropeco.
    consome: [alunos, catalogo, identidade, notificacoes]
