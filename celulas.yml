# =============================================================================
# O MAPA DAS CÉLULAS: que pedaços do repositório pertencem a que célula.
#
#   caminhos:  que pedaços do repositório PERTENCEM a esta célula. É o que
#              responde "o que este push toca?" e decide o que publicar.
#
#   consome:   de quais OUTRAS células esta lê API ([] = nenhuma).
#
# Quem lê: `ci/mapa_de_celulas.py`, usado por `infra/publicar.py`. Hoje há uma
# só célula publicada, a `aplicacao`: todo o código do produto vai ao ar junto.
# =============================================================================
celulas:

  aplicacao:
    caminhos: [services, packages, documentos]
    consome: []
