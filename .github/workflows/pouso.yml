# =============================================================================
# A PISTA DE POUSO — Onda 4 do PLANO-MESTRE-ROBOS-SEM-COLISAO.md
#
# O PROBLEMA, medido em 28/08/2026: um PR de 4 arquivos e nenhuma linha de
# código levou OITO tentativas para entrar. Três coisas verdadeiras ao mesmo
# tempo (armadilhas/156): PR que toca `painel/` regenerava arquivos de linha
# única e colidia sempre; a política estrita exige estar em dia com a `main` no
# INSTANTE do merge; e a `main` anda ~100 vezes por dia. O agente perde a
# corrida contra o relógio dos checks, e não adianta ser mais rápido.
#
# A CURA: tirar o merge da corrida. O agente para de tentar; ele PEDE POUSO
# (`python ci/mergear.py <N> --pousar`) e vai embora. Esta pista atende um PR
# por vez — o `concurrency` garante isso — atualiza, confere e mergeia. Se a
# `main` andar no meio, o problema é da pista, que tem paciência e não tem
# franquia para gastar.
#
# Desde 29/08/2026 ela é O caminho, não um atalho: `ci/mergear.py` RECUSA
# mergear para quem não é a pista (decisão do mantenedor, registro
# `20260829-006`; Lei 4 emendada).
#
# ---------------------------------------------------------------------------
# QUATRO DECISÕES QUE NÃO SÃO ÓBVIAS, E O PORQUÊ DE CADA UMA
#
# 1. USA `PISTA_TOKEN`, NÃO O `GITHUB_TOKEN`.
#    Documentação oficial: "Events triggered by the GITHUB_TOKEN will not create
#    a new workflow run". Um merge feito com o token padrão NÃO dispararia o
#    `deploy-celula` — e a plataforma congelaria em silêncio, sem ninguém
#    perceber até abrir o site e ver conteúdo velho. A chave é do mantenedor,
#    criada em 28/08/2026 exatamente para isto.
#
# 2. O JUIZ É A DEFINIÇÃO DA `main`, NUNCA A DO PR.
#    Em `pull_request`, os workflows rodam a partir do código DO PR — ou seja,
#    um PR que altere `.github/workflows/` altera o juiz que vai julgá-lo. Aqui
#    o gatilho é `workflow_dispatch`/`schedule`, que sempre roda a definição da
#    `main`, e o checkout é da `main`. Buraco apontado por uma das cinco
#    consultorias e fechado por construção.
#
# 3. NÃO ESPERA OS CHECKS DE UM PR — devolve e volta depois.
#    Ficar em laço esperando check gastaria minuto de runner e travaria a fila
#    atrás de um PR lento. Quando o PR está atrasado ou ainda sendo medido, a
#    pista sai; a passagem seguinte encontra os checks prontos.
#
# 4. A FILA ANDA DENTRO DA MESMA EXECUÇÃO, e não por auto-chamada.
#    Até 29/08/2026 a pista terminava chamando a si mesma
#    (`gh workflow run pouso.yml`) para atender o próximo da fila. Isso exige a
#    permissão `actions: write` no token — que a `PISTA_TOKEN` não tem:
#
#        could not create workflow dispatch event:
#        HTTP 403: Resource not accessible by personal access token
#
#    O merge acontecia e o run terminava VERMELHO, toda vez. Um vermelho
#    permanente é pior que um defeito visível: ele ensina a ignorar vermelho, e
#    esta casa inteira depende de vermelho significar alguma coisa. Foi o
#    mantenedor quem viu, olhando a lista de execuções.
#
#    A cura foi tirar a dependência, não pedir a permissão: o laço abaixo
#    atende até `MAX_POUSOS` PRs na mesma execução. Cada volta é um PR
#    DIFERENTE, com checks já concluídos — não é espera, é fila andando. O
#    `schedule` continua como rede: o que sobrar entra na próxima passagem.
# =============================================================================
name: pouso
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Número do PR (vazio = o mais antigo com a etiqueta pousar)'
        required: false
        type: string
  schedule:
    # Rede de segurança: nenhum pedido de pouso espera mais que isto.
    - cron: '*/15 * * * *'

# Um pouso por vez. `cancel-in-progress: false` porque cancelar um pouso no meio
# deixaria um PR atualizado e não mergeado — estado pior que não ter começado.
concurrency:
  group: pouso
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pousar:
    name: pousar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A `main`, sempre. Ver decisão 2 no cabeçalho.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências dos portões
        run: python -m pip install --quiet pytest pyyaml

      - name: Atender a fila de pouso
        env:
          GH_TOKEN: ${{ secrets.PISTA_TOKEN }}
          PEDIDO: ${{ inputs.pr }}
          # A pista se identifica: desde 29/08/2026 o `ci/mergear.py` recusa
          # mergear para quem não é ela. Esta variável existe num lugar só —
          # aqui. Guarda: ci/tests/test_mergear.py.
          MERGEAR_SOU_A_PISTA: 'sim'
        run: |
          set -euo pipefail

          # Quantos PRs uma passagem atende. Não é medo de laço infinito (a fila
          # é finita): é limite de duração da execução. O que sobrar espera a
          # próxima passagem, no máximo 15 minutos depois.
          MAX_POUSOS=5
          pousados=0

          for volta in $(seq 1 "$MAX_POUSOS"); do
            if [ "$volta" = "1" ] && [ -n "${PEDIDO:-}" ]; then
              alvo="$PEDIDO"
            else
              # O mais antigo primeiro: quem pediu antes pousa antes.
              alvo=$(gh pr list --state open --label pousar \
                       --json number,createdAt \
                       --jq 'sort_by(.createdAt) | .[0].number // empty')
            fi

            if [ -z "${alvo:-}" ]; then
              echo "Fila vazia. Pousos nesta passagem: $pousados."
              break
            fi

            echo "--- PR #$alvo (volta $volta de $MAX_POUSOS) ---"

            # `if` em vez de `set +e`: dentro da condição o shell não aborta, e
            # o código continua sendo lido e ROTEADO (0 mergeia, 1 devolve, 2
            # espera). É o oposto de esconder o erro — e por isso passa no
            # guarda que proíbe `set +e` em workflow.
            if python ci/mergear.py "$alvo" --conferir > veredito.txt 2>&1; then
              codigo=0
            else
              codigo=$?
            fi
            cat veredito.txt

            # ATRASADO não é reprovado: é só velho. Atualiza e SAI da fila desta
            # passagem — os checks precisam rodar de novo contra o mundo novo, e
            # esperar por eles aqui travaria a fila atrás dele.
            if grep -q "ATRÁS da main (BEHIND)" veredito.txt; then
              gh pr update-branch "$alvo"
              gh pr comment "$alvo" --body \
                "🛬 **pista de pouso** — a base tinha envelhecido; atualizei este PR e devolvi para a fila. A próxima passagem tenta de novo, com os checks já medidos contra a \`main\` de agora. Você não precisa fazer nada."
              echo "PR #$alvo estava atrasado: atualizado e devolvido à fila."
              break
            fi

            # AINDA NÃO DÁ PARA SABER (exit 2 = ERROR): checks rodando, ou o
            # GitHub ainda calculando. Isto NÃO é reprovação — tratar como
            # reprovação tiraria a etiqueta de um PR são só porque ele chegou
            # cedo demais.
            if [ "$codigo" = "2" ]; then
              echo "PR #$alvo ainda está sendo medido. A pista volta na próxima passagem."
              break
            fi

            # REPROVADO DE VERDADE (exit 1 = FAIL): devolve ao autor com o
            # veredito cru e TIRA a etiqueta — senão a pista tentaria o mesmo PR
            # para sempre e a fila entupiria atrás dele.
            if [ "$codigo" = "1" ]; then
              gh pr edit "$alvo" --remove-label pousar
              {
                echo "🛬 **pista de pouso** — não pousei, e tirei a etiqueta \`pousar\` para não travar a fila atrás deste PR."
                echo
                echo "Conserte e peça pouso de novo: \`python ci/mergear.py $alvo --pousar\`."
                echo
                echo '```'
                cat veredito.txt
                echo '```'
              } > recado.md
              gh pr comment "$alvo" --body-file recado.md
              echo "PR #$alvo reprovou; devolvido ao autor. Seguindo para o próximo."
              continue
            fi

            # VERDE: mergeia pelo MESMO portão que o agente usa — a pista não
            # pode ser mais permissiva que a catraca. `--confirmo` repete o
            # número de propósito (a defesa de identidade: o erro real da
            # história foi mergear o PR errado, não mergear sem querer).
            python ci/mergear.py "$alvo" --confirmo "$alvo"
            pousados=$((pousados + 1))
            echo "PR #$alvo POUSOU."
          done

          echo "Passagem encerrada: $pousados PR(s) pousado(s)."
          restam=$(gh pr list --state open --label pousar --json number --jq 'length')
          if [ "$restam" -gt 0 ]; then
            echo "Ainda há $restam PR(s) pedindo pouso — a passagem agendada"
            echo "(a cada 15 min) pega o resto. Ninguém precisa fazer nada."
          fi
