name: pouso
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci-celula, muralhas]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  schedule:
    - cron: '*/15 * * * *'
concurrency:
  group: pouso
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pousar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências dos portões
        run: python -m pip install --quiet -r requirements-ci.txt
      - name: Integrar entregas verificadas
        env:
          GH_TOKEN: ${{ secrets.PISTA_TOKEN }}
        run: python ci/mergear.py --automatico
