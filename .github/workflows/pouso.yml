# =============================================================================
# A PISTA DE POUSO — Onda 4 do PLANO-MESTRE-ROBOS-SEM-COLISAO.md
#
# O PROBLEMA, medido em 28/08/2026: um PR de 4 arquivos e nenhuma linha de
# código levou OITO tentativas para entrar. Três coisas verdadeiras ao mesmo
# tempo (armadilhas/156): PR que toca `painel/` regenerava arquivos de linha
# única e colidia sempre; a política estrita exige estar em dia com a `main` no
# INSTANTE do merge; e a `main` anda ~100 vezes por dia. O agente perde a
# corrida contra o relógio dos checks, e não adianta ser mais rápido.
#
# A CURA: tirar o merge da corrida. O agente para de tentar; ele PEDE POUSO
# (`python ci/mergear.py <N> --pousar`) e vai embora. Esta pista atende um PR
# por vez — o `concurrency` garante isso — atualiza, confere e mergeia. Se a
# `main` andar no meio, o problema é da pista, que tem paciência e não tem
# franquia para gastar.
#
# Desde 29/08/2026 ela é O caminho, não um atalho: `ci/mergear.py` RECUSA
# mergear para quem não é a pista (decisão do mantenedor, registro
# `20260829-006`; Lei 4 emendada).
#
# ---------------------------------------------------------------------------
# QUATRO DECISÕES QUE NÃO SÃO ÓBVIAS, E O PORQUÊ DE CADA UMA
#
# 1. USA `PISTA_TOKEN`, NÃO O `GITHUB_TOKEN`.
#    Documentação oficial: "Events triggered by the GITHUB_TOKEN will not create
#    a new workflow run". Um merge feito com o token padrão NÃO dispararia o
#    `deploy-celula` — e a plataforma congelaria em silêncio, sem ninguém
#    perceber até abrir o site e ver conteúdo velho. A chave é do mantenedor,
#    criada em 28/08/2026 exatamente para isto.
#
# 2. O JUIZ É A DEFINIÇÃO DA `main`, NUNCA A DO PR.
#    Em `pull_request`, os workflows rodam a partir do código DO PR — ou seja,
#    um PR que altere `.github/workflows/` altera o juiz que vai julgá-lo. Aqui
#    o gatilho é `workflow_dispatch`/`schedule`, que sempre roda a definição da
#    `main`, e o checkout é da `main`. Buraco apontado por uma das cinco
#    consultorias e fechado por construção.
#
# 3. NÃO ESPERA OS CHECKS DE UM PR — devolve e volta depois.
#    Ficar em laço esperando check gastaria minuto de runner e travaria a fila
#    atrás de um PR lento. Quando o PR está atrasado ou ainda sendo medido, a
#    pista sai; a passagem seguinte encontra os checks prontos.
#
# 4. A FILA ANDA DENTRO DA MESMA EXECUÇÃO, e não por auto-chamada.
#    Até 29/08/2026 a pista terminava chamando a si mesma
#    (`gh workflow run pouso.yml`) para atender o próximo da fila. Isso exige a
#    permissão `actions: write` no token — que a `PISTA_TOKEN` não tem:
#
#        could not create workflow dispatch event:
#        HTTP 403: Resource not accessible by personal access token
#
#    O merge acontecia e o run terminava VERMELHO, toda vez. Um vermelho
#    permanente é pior que um defeito visível: ele ensina a ignorar vermelho, e
#    esta casa inteira depende de vermelho significar alguma coisa. Foi o
#    mantenedor quem viu, olhando a lista de execuções.
#
#    A cura foi tirar a dependência, não pedir a permissão: o laço abaixo
#    atende até `MAX_POUSOS` PRs na mesma execução. Cada volta é um PR
#    DIFERENTE, com checks já concluídos — não é espera, é fila andando. O
#    `schedule` continua como rede: o que sobrar entra na próxima passagem.
# =============================================================================
name: pouso
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Número do PR (vazio = o mais antigo com a etiqueta pousar)'
        required: false
        type: string
  # A PISTA ACORDA NO EVENTO, não no relógio (29/08/2026 — pergunta do
  # mantenedor: "esse agendamento resolve algum problema concreto ou causa
  # mais demora desnecessária?"). Resposta medida: as duas coisas. Ele resolve
  # o problema real de ninguém ficar esquecido — mas, como ÚNICO despertador,
  # cobrava até ~13 min de espera num PR cujos checks terminam em ~2. O gesto
  # da casa é "peça pouso e vá embora": a espera cheia caía justamente em quem
  # seguia a regra.
  #
  # Agora a pista acorda quando os checks de QUALQUER PR concluem. O evento
  # `workflow_run` roda sempre a definição da `main` (a decisão 2 continua de
  # pé) e dispara também para conclusão em falha — de propósito: acordar num
  # PR vermelho faz a pista DEVOLVÊ-LO na hora, com o veredito, em vez de
  # deixá-lo iludido na fila por um quarto de hora.
  #
  # Passagens com fila vazia saem em segundos, e o repositório é público
  # (executor não consome franquia). O `concurrency` abaixo colapsa acordadas
  # simultâneas numa só.
  workflow_run:
    workflows: [ci-celula, muralhas]
    types: [completed]
  # E acorda também QUANDO A ETIQUETA É POSTA (29/08/2026, mesma tarde). O
  # buraco que sobrava era exatamente o fluxo padrão da casa: `mergear.py
  # --pousar` etiqueta DEPOIS dos checks verdes — então nenhum `workflow_run`
  # vem depois, e quem seguia a regra esperava a rede de 15 min. É
  # `pull_request_target`, não `pull_request`, de propósito: o _target roda a
  # definição da MAIN (a decisão 2 do cabeçalho continua de pé — um PR não
  # consegue alterar o juiz que vai julgá-lo), e o job nunca faz checkout do
  # código do PR (o checkout é `ref: main`, logo abaixo). Etiquetar exige
  # permissão de triagem no repositório — o evento não pode ser forjado por
  # um fork.
  pull_request_target:
    types: [labeled]
  schedule:
    # De despertador único a REDE: pega o que os eventos perderem (um workflow
    # renomeado, uma acordada colapsada pelo concurrency com a fila ainda
    # cheia, uma etiqueta posta por caminho que não emite evento).
    - cron: '*/15 * * * *'

# Um pouso por vez. `cancel-in-progress: false` porque cancelar um pouso no meio
# deixaria um PR atualizado e não mergeado — estado pior que não ter começado.
concurrency:
  group: pouso
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pousar:
    name: pousar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A `main`, sempre. Ver decisão 2 no cabeçalho.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências dos portões
        run: python -m pip install --quiet pytest pyyaml

      - name: Atender a fila de pouso
        env:
          GH_TOKEN: ${{ secrets.PISTA_TOKEN }}
          PEDIDO: ${{ inputs.pr }}
          # A pista se identifica: desde 29/08/2026 o `ci/mergear.py` recusa
          # mergear para quem não é ela. Esta variável existe num lugar só —
          # aqui. Guarda: ci/tests/test_mergear.py.
          MERGEAR_SOU_A_PISTA: 'sim'
        run: |
          set -euo pipefail

          # Quantos PRs uma passagem atende. Não é medo de laço infinito (a fila
          # é finita): é limite de duração da execução. O que sobrar espera a
          # próxima passagem, no máximo 15 minutos depois.
          MAX_POUSOS=5
          pousados=0
          # Merges que a passagem TENTOU e não completou. Ela segue atendendo os
          # outros da fila e termina vermelha no fim — ver o `exit` lá embaixo.
          falhas=0
          # Quem esta passagem já atendeu. Existe porque o GitHub continua
          # listando um PR como aberto por alguns segundos DEPOIS do merge:
          # medido em 29/08/2026, a volta seguinte pegou o mesmo PR que acabara
          # de pousar. Naquele run o portão respondeu ERROR e a pista saiu
          # quieta — mas se tivesse respondido FAIL, ela teria tirado a etiqueta
          # e comentado "não pousei" num PR que ENTROU. Comentário mentiroso no
          # PR é pior que volta perdida: ele vira a memória do projeto.
          ja_vistos=""

          for volta in $(seq 1 "$MAX_POUSOS"); do
            if [ "$volta" = "1" ] && [ -n "${PEDIDO:-}" ]; then
              alvo="$PEDIDO"
            else
              # O mais antigo primeiro — mas PULANDO quem esta passagem já
              # atendeu. Até 29/08/2026 a escolha era só `.[0]`, e com ela a
              # fila não andava: quem estava na frente e precisava esperar era
              # reescolhido na volta seguinte, e a passagem morria ali.
              # Auditoria das Ondas 3 a 6, simulado com dois PRs na fila: o
              # segundo, verde e pronto, não foi nem examinado.
              alvo=""
              for candidato in $(gh pr list --state open --label pousar \
                                   --json number,createdAt \
                                   --jq 'sort_by(.createdAt) | .[].number'); do
                case " $ja_vistos " in
                  *" $candidato "*) continue ;;
                esac
                alvo="$candidato"
                break
              done
            fi

            if [ -z "${alvo:-}" ]; then
              echo "Fila vazia (ou só com PRs já atendidos nesta passagem)."
              echo "Pousos nesta passagem: $pousados."
              break
            fi

            # Cinto e suspensório: a seleção acima já pula os atendidos, e este
            # `case` cobre o caminho do PEDIDO manual, que não passa por ela.
            # O GitHub continua listando um PR como aberto por alguns segundos
            # DEPOIS do merge — medido em 29/08/2026, quando a volta seguinte
            # pegou o mesmo PR que acabara de pousar. Naquele run o portão
            # respondeu ERROR e a pista saiu quieta; se tivesse respondido FAIL,
            # ela teria tirado a etiqueta e comentado "não pousei" num PR que
            # ENTROU. Comentário mentiroso no PR é pior que volta perdida: ele
            # vira a memória do projeto.
            case " $ja_vistos " in
              *" $alvo "*)
                echo "O PR #$alvo já foi atendido nesta passagem. Encerrando."
                break ;;
            esac
            ja_vistos="$ja_vistos $alvo"

            echo "--- PR #$alvo (volta $volta de $MAX_POUSOS) ---"

            # `if` em vez de `set +e`: dentro da condição o shell não aborta, e
            # o código continua sendo lido e ROTEADO (0 mergeia, 1 devolve, 2
            # espera). É o oposto de esconder o erro — e por isso passa no
            # guarda que proíbe `set +e` em workflow.
            if python ci/mergear.py "$alvo" --conferir > veredito.txt 2>&1; then
              codigo=0
            else
              codigo=$?
            fi
            cat veredito.txt

            # ATRASADO não é reprovado: é só velho. Atualiza, devolve à fila e
            # SEGUE PARA O PRÓXIMO — os checks dele precisam rodar de novo
            # contra o mundo novo, e esperar por eles aqui travaria a fila.
            #
            # `continue`, não `break`: este era o entupimento. Encerrar a
            # passagem inteira porque o PRIMEIRO da fila envelheceu deixava
            # todos os outros sem atendimento — e, como a fila é sempre "o mais
            # antigo primeiro", a passagem seguinte reescolhia o mesmo. Num dia
            # movimentado (a `main` anda ~100 vezes por dia) o mesmo PR podia
            # envelhecer a cada passagem e segurar a fila indefinidamente, sem
            # nada ficar vermelho para avisar.
            if grep -q "ATRÁS da main (BEHIND)" veredito.txt; then
              # A atualização pode falhar (conflito que apareceu agora, por
              # exemplo). Isso não pode derrubar a passagem: seria um PR
              # travando os outros por outro caminho. Fica registrado, o PR
              # mantém a etiqueta, e a próxima passagem tenta de novo.
              if gh pr update-branch "$alvo"; then
                gh pr comment "$alvo" --body \
                  "🛬 **pista de pouso** — a base tinha envelhecido; atualizei este PR e devolvi para a fila. A próxima passagem tenta de novo, com os checks já medidos contra a \`main\` de agora. Você não precisa fazer nada."
                echo "PR #$alvo estava atrasado: atualizado e devolvido à fila."
              else
                echo "PR #$alvo está atrasado e NÃO consegui atualizá-lo (conflito?)."
                echo "Ele fica na fila com a etiqueta; seguindo para o próximo."
              fi
              continue
            fi

            # AINDA NÃO DÁ PARA SABER (exit 2 = ERROR): checks rodando, ou o
            # GitHub ainda calculando. Isto NÃO é reprovação — tratar como
            # reprovação tiraria a etiqueta de um PR são só porque ele chegou
            # cedo demais.
            # `continue` pelo mesmo motivo do BEHIND: um PR cujos checks ainda
            # não concluíram (ou cujo estado o GitHub ainda calcula) não pode
            # impedir que os outros da fila sejam atendidos.
            if [ "$codigo" = "2" ]; then
              echo "PR #$alvo ainda está sendo medido. Seguindo para o próximo;"
              echo "ele continua na fila e a pista volta nele depois."
              continue
            fi

            # REPROVADO DE VERDADE (exit 1 = FAIL): devolve ao autor com o
            # veredito cru e TIRA a etiqueta — senão a pista tentaria o mesmo PR
            # para sempre e a fila entupiria atrás dele.
            if [ "$codigo" = "1" ]; then
              gh pr edit "$alvo" --remove-label pousar
              {
                echo "🛬 **pista de pouso** — não pousei, e tirei a etiqueta \`pousar\` para não travar a fila atrás deste PR."
                echo
                echo "Conserte e peça pouso de novo: \`python ci/mergear.py $alvo --pousar\`."
                echo
                echo '```'
                cat veredito.txt
                echo '```'
              } > recado.md
              gh pr comment "$alvo" --body-file recado.md
              echo "PR #$alvo reprovou; devolvido ao autor. Seguindo para o próximo."
              continue
            fi

            # VERDE: mergeia pelo MESMO portão que o agente usa — a pista não
            # pode ser mais permissiva que a catraca. `--confirmo` repete o
            # número de propósito (a defesa de identidade: o erro real da
            # história foi mergear o PR errado, não mergear sem querer).
            #
            # O `if` existe para que UM merge que falha não derrube a passagem
            # inteira e deixe a fila parada atrás dele. Mas a falha NÃO some: ela
            # é contada e a passagem termina VERMELHA lá embaixo. Engolir aqui
            # seria trocar um entupimento por um falso-verde, que nesta casa é
            # pior (RETROSPECTIVA-FASE-D, padrão 1).
            if python ci/mergear.py "$alvo" --confirmo "$alvo"; then
              pousados=$((pousados + 1))
              echo "PR #$alvo POUSOU."
            else
              falhas=$((falhas + 1))
              echo "PR #$alvo: o merge NÃO se completou. Seguindo para o próximo;"
              echo "esta passagem vai terminar vermelha por causa disto."
            fi
          done

          echo "Passagem encerrada: $pousados PR(s) pousado(s)."
          restam=$(gh pr list --state open --label pousar --json number --jq 'length')
          if [ "$restam" -gt 0 ]; then
            echo "Ainda há $restam PR(s) pedindo pouso — a passagem agendada"
            echo "(a cada 15 min) pega o resto. Ninguém precisa fazer nada."
          fi

          if [ "$falhas" -gt 0 ]; then
            echo "::error::$falhas merge(s) foram tentados e não se completaram."
            echo "A passagem atendeu o resto da fila de propósito, mas isto NÃO é verde."
            exit 1
          fi
