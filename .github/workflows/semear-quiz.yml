# =============================================================================
# SEMEAR O CRIVO — publica na produção o quiz de um site, pelo pipeline, sem o
# mantenedor colar nada em terminal nenhum.
#
# POR QUE ELE EXISTE
# ------------------
# A célula `quiz` está de pé em produção desde a Fase D (o serviço `quiz` e o
# worker `quiz-relay` em `infra/docker-compose.yml`) e nunca houve um único quiz
# publicado. Medido em 02/09/2026: `/quiz/healthz` responde 200 e o endereço do
# Crivo responde 404. Toda célula que precisa de conteúdo em produção já tinha
# o seu semeador; o quiz era a única sem, e o `seed_quiz` existia sem nunca ter
# sido chamado por script ou workflow nenhum.
#
# O HOST É ESCOLHIDO NO DISPARO porque a plataforma é multissítio (Lei 9):
# meshcraft.top e basileiatoutheou.org hoje, outros depois. Semear um site não
# toca no outro — o script filtra tudo que lê e escreve pelo número do site.
#
# POR QUE workflow_dispatch É SEGURO AQUI
# ----------------------------------------
# Não ENTREGA código: roda um script versionado que só sabe fazer uma coisa, e
# essa coisa é idempotente por construção (`get_or_create` no site, no quiz, em
# cada pergunta, em cada opção e em cada faixa). Disparar duas vezes não duplica
# nada e não apaga resposta nenhuma.
#
# O HOST VIAJA POR `envs:`, NUNCA COSTURADO NO CORPO DO SCRIPT: `${{ inputs.* }}`
# dentro de `script:` é substituição de texto feita antes de o shell existir, ou
# seja, injeção de comando na VPS. O script lê `HOST_QUIZ` do
# ambiente.
#
# O HOST É O ÚNICO INPUT, DE PROPÓSITO. O PR #1768 dá ao `seed_quiz` um
# `--destino-do-botao` obrigatório: para onde vai quem termina o quiz. Esse
# destino NÃO é um campo a preencher aqui, porque ele já é dado do site: o
# catálogo guarda a oferta padrão de cada host, e o script monta
# `/checkout/<oferta>/` na mesma consulta que já traz o número do site. Um campo
# a mais seria uma segunda verdade, livre para divergir da primeira.
#
# GRUPO PRÓPRIO, e isto foi aprendido caro:
# `cancel-in-progress: false` NÃO faz fila ilimitada — o GitHub guarda UM run
# pendente por grupo, e o próximo CANCELA o pendente. Num repositório com ~100
# entregas por dia, um disparo manual no grupo `deploy` morre antes de começar.
#
# NÃO toca env, não escreve segredo, não reinicia serviço, não faz deploy.
# =============================================================================
name: semear-quiz
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host do site que recebe o quiz (ex.: meshcraft.top). Precisa estar ATIVO no catálogo.'
        required: true
        type: string
        default: meshcraft.top
permissions:
  contents: read
concurrency:
  group: semear-quiz
  cancel-in-progress: false
jobs:
  semear:
    name: publicar o Crivo na producao
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # a ssh-action com `script_path` apontando para arquivo
      # inexistente AVISA e IGNORA, saindo com sucesso — falso-verde conhecido.
      - name: Conferir que o script existe antes de abrir conexão
        run: |
          set -euo pipefail
          if [ ! -f infra/semear-quiz.sh ]; then
            echo "::error::PAROU POR SEGURANÇA — infra/semear-quiz.sh não existe neste commit."
            exit 1
          fi
          bash -n infra/semear-quiz.sh
          echo "✅ script presente e sintaticamente válido"

      - name: Semear na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: HOST_QUIZ
          command_timeout: 10m
          script_path: infra/semear-quiz.sh
        env:
          HOST_QUIZ: ${{ inputs.host }}
