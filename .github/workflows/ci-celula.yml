# =============================================================================
# CI DAS CÉLULAS — deriva do diff QUAIS células o PR toca e roda o `make ci` de
# CADA UMA. Required check na branch protection de main.
#
# Até 29/08/2026 este workflow testava UMA célula (`head -1` da lista): dava
# certo porque a cerca "1 PR = 1 célula" proibia o resto. A Onda 5 do
# `docs/decisoes/PLANO-MESTRE-ROBOS-SEM-COLISAO.md` inverte a moeda — em vez de
# RECUSAR um PR por largura, o CI DERIVA do diff o que precisa rodar. É esta
# peça que precisa estar verde e medida ANTES de a cerca cair; enquanto ela não
# cai, este job simplesmente nunca vê mais de uma célula.
#
# Quem responde "este arquivo é de quem" é `celulas.yml` (o mapa), verificado
# contra o código pelo varredor em toda muralha.
# =============================================================================
name: ci-celula
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      # A LISTA, em JSON — é ela que vira a matriz. `celula` (singular) saiu:
      # ele era o `head -1` que fazia o escopo caber numa célula só.
      celulas: ${{ steps.d.outputs.celulas }}
      n: ${{ steps.d.outputs.n }}
      # [INV-CI01] Carimbo de que a detecção CONCLUIU. Sem ele, o `gate` não
      # sabe distinguir "nenhuma célula tocada" de "não consegui descobrir".
      deteccao: ${{ steps.d.outputs.deteccao }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # O mapa das células (`celulas.yml`, Onda 5) é YAML, e quem responde
      # "este arquivo é de quem" o lê. Sem o leitor, a detecção não conclui — e
      # ela FALHA ALTO em vez de dizer "nenhuma célula", que seria suíte pulada
      # com gate verde. Medido no run 33251639130, dez minutos depois de o mapa
      # nascer.
      - name: Leitor do mapa das células
        run: python -m pip install --quiet pyyaml
      - id: d
        name: Detectar célula tocada (via runner canônico)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          # A semântica de detecção vive em ci/ci.py — a mesma que o agente roda
          # localmente. O YAML só faz wiring. O `| head -1 || true` que morava
          # aqui mascarava falha de git como "nenhuma célula": ver INV-CI01.
          if ! CELULAS="$(python ci/ci.py --detectar-celulas --base "$BASE")"; then
            echo "::error::ERROR — a detecção de célula não concluiu (BASE='$BASE')."
            echo "A CI não soube o que deveria testar. Isto NÃO é 'nenhuma célula'."
            exit 1
          fi
          if [[ -z "$CELULAS" ]]; then N=0; else N=$(printf '%s\n' "$CELULAS" | wc -l); fi
          # A LISTA em json — é ela que vira a matriz do job seguinte. O
          # `head -1` que morava aqui era o que fazia o escopo caber numa célula
          # só, e ele existia porque a cerca proibia o resto (Onda 5).
          #
          # `jq -R | jq -sc` transforma linha a linha em array; entrada vazia
          # vira `[]`, que é resposta legítima ("o PR não toca célula nenhuma") e
          # NÃO se confunde com falha — a falha já saiu no `if` acima.
          JSON="$(printf '%s' "$CELULAS" | jq -R . | jq -sc 'map(select(length>0))')"
          {
            echo "celulas=$JSON"
            echo "n=$N"
            echo "deteccao=ok"
          } >> "$GITHUB_OUTPUT"
          echo "Células tocadas ($N): ${CELULAS:-nenhuma}"

  rodar:
    name: ci-celula
    needs: detectar
    # Defesa em profundidade: além de haver célula, a detecção precisa ter
    # carimbado sucesso. (Se `detectar` falha, o GitHub já pula este job.)
    if: needs.detectar.outputs.celulas != '[]' && needs.detectar.outputs.deteccao == 'ok'
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false` de propósito: com duas células tocadas, quero ver o
      # veredito das DUAS. Parar na primeira falha esconderia a segunda e
      # transformaria uma rodada de conserto em duas.
      fail-fast: false
      matrix:
        celula: ${{ fromJSON(needs.detectar.outputs.celulas) }}
    env:
      CELULA: ${{ matrix.celula }}
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_db
      REDIS_STREAMS_URL: redis://localhost:6379/0
      HUEY_REDIS_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-apenas-nunca-em-producao
      # [INV-P8] fake, formato TEST- — só pagamentos lê isto; CI nunca vê APP_USR-.
      MP_ACCESS_TOKEN: TEST-ci-0000000000000000-000000-fake000000000000000000000000000-000000000
      # [INV-P10] fail-hard em config/settings.py — precisa existir pro `type` (mypy
      # importa config.settings) e pro `test` (guarda de assinatura) passarem no CI.
      MP_WEBHOOK_SECRET: ci-apenas-nunca-em-producao-webhook-secret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências da célula
        run: pip install -r "services/$CELULA/requirements.txt"
      - name: CI da célula (lint + import-linter + type + testes + freeze de contrato)
        run: make -C "services/$CELULA" ci
      - name: Cross-smoke Pix↔Cartão (só na fortaleza)
        if: matrix.celula == 'pagamentos'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: bash ci/cross-smoke.sh

  # Job terminal que SEMPRE conclui — é ele que a branch protection exige como
  # required check. Um PR que não toca célula alguma (ex.: um PR só de `ci/`)
  # não trava a proteção com um check "skipped".
  #
  # [INV-CI01] Uma versão antiga aceitava QUALQUER `skipped` como verde. Isso
  # abria um bypass completo: git falha -> lista vazia -> `rodar` pulado -> gate
  # verde -> merge liberado sem um único teste ter rodado. Aqui `skipped` só é
  # verde quando a detecção CONCLUIU e concluiu que não há célula.
  #
  # MUDOU NA ONDA 5: o `rodar` virou MATRIZ, e o gate deixou de reprovar o PR
  # que toca mais de uma célula. Ele não precisa mais: com a matriz, todas as
  # células tocadas rodam, e `needs.rodar.result` é o pior veredito entre elas —
  # o escopo COMPLETO passou a ser verificado, que era exatamente o que a
  # antiga regra "n > 1 reprova" comprava por proibição.
  gate:
    name: ci-celula-gate
    needs: [detectar, rodar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar resultado
        shell: bash
        env:
          D_RESULT: ${{ needs.detectar.result }}
          D_STATUS: ${{ needs.detectar.outputs.deteccao }}
          CELULAS: ${{ needs.detectar.outputs.celulas }}
          N: ${{ needs.detectar.outputs.n }}
          R: ${{ needs.rodar.result }}
        run: |
          set -uo pipefail
          echo "detectar=$D_RESULT deteccao='${D_STATUS:-}' celulas='${CELULAS:-}' n='${N:-}' rodar=$R"

          # 1. A detecção precisa ter concluído. Sem escopo conhecido não há
          #    veredito possível — nem PASS, nem SKIP.
          if [ "$D_RESULT" != "success" ]; then
            echo "::error::ERROR — a detecção de células não concluiu (detectar=$D_RESULT)."
            echo "A CI não soube o que deveria testar. Este resultado NÃO é um PASS."
            exit 1
          fi
          if [ "${D_STATUS:-}" != "ok" ]; then
            echo "::error::ERROR — 'detectar' terminou sem carimbar deteccao=ok."
            echo "O job saiu com sucesso sem provar que mediu. Fail-closed."
            exit 1
          fi

          # 2. A contagem precisa ser um número, e precisa BATER com a lista.
          #    Duas medidas da mesma coisa que discordam é instrumento quebrado
          #    — e aqui elas alimentam decisões diferentes (a matriz sai da
          #    lista; a leitura humana, da contagem).
          case "${N:-}" in
            ''|*[!0-9]*)
              echo "::error::ERROR — contagem de células ausente ou inválida (n='${N:-}')."
              echo "Sem saber quantas células o diff toca, não há como afirmar escopo completo."
              exit 1 ;;
          esac
          # Contagem em bash puro, sem `jq`: este é o check TERMINAL, o que a
          # proteção da branch exige. Quanto menos ferramenta ele precisa, menos
          # jeito ele tem de falhar por motivo que não é o dele — e o teste da
          # tabela-verdade roda com um PATH mínimo justamente para provar isso.
          # Nome de célula nunca tem vírgula (o mapa valida), então contar
          # vírgulas + 1 é exato.
          SEM_BORDAS="${CELULAS:-[]}"
          SEM_BORDAS="${SEM_BORDAS#[}"
          SEM_BORDAS="${SEM_BORDAS%]}"
          SEM_BORDAS="$(printf '%s' "$SEM_BORDAS" | tr -d ' \"')"
          if [ -z "$SEM_BORDAS" ]; then
            DA_LISTA=0
          else
            DA_LISTA=$(( $(printf '%s' "$SEM_BORDAS" | tr -cd ',' | wc -c) + 1 ))
          fi
          if [ "$DA_LISTA" != "$N" ]; then
            echo "::error::ERROR — a lista traz $DA_LISTA célula(s) e a contagem diz $N."
            echo "Duas medidas da mesma coisa discordando é instrumento quebrado."
            exit 1
          fi

          # 3. Veredito das células. Com a matriz, `success` significa que TODAS
          #    passaram e `failure` que ao menos uma reprovou — o escopo inteiro,
          #    e não mais "a primeira da lista".
          case "$R" in
            failure)
              echo "::error::FAIL — ao menos uma célula reprovou (tocadas: $CELULAS)."; exit 1 ;;
            cancelled)
              echo "::error::ERROR — a matriz foi cancelada; nada foi provado."; exit 1 ;;
            success)
              if [ "$N" -eq 0 ]; then
                echo "::error::ERROR — 'rodar' concluiu sem célula detectada (estado incoerente)."
                exit 1
              fi
              echo "PASS — $N célula(s) verde(s): $CELULAS" ;;
            skipped)
              if [ "$N" -ne 0 ]; then
                echo "::error::ERROR — $N célula(s) detectada(s) e a matriz não rodou."
                echo "Skip por falha de instrumentação NÃO é skip permitido."
                exit 1
              fi
              echo "SKIP — a detecção concluiu e nenhuma célula foi tocada." ;;
            *)
              echo "::error::ERROR — estado desconhecido de 'rodar': '$R'."; exit 1 ;;
          esac
