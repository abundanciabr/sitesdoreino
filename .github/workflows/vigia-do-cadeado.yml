# =============================================================================
# VIGIA DO CADEADO — o único workflow deste repositório que acorda pelo RELÓGIO.
#
# POR QUE ELE PRECISA DE UM RELÓGIO, e os outros não:
# todo o resto aqui acorda em EVENTO (push, PR, conclusão de check) — foi
# decisão medida, e a pista de pouso até PERDEU o agendamento dela em
# 29/08/2026 porque o relógio a fazia esperar 13 min por algo que levava 2.
#
# Um certificado é o caso oposto, e é o único: ele não vence porque alguém
# mexeu no código. Ele vence no calendário, sozinho, num dia em que talvez
# ninguém encoste no repositório. Evento nenhum avisa isso.
#
# O QUE ELE NÃO É: um portão. Ele não impede nada e não roda em PR — avisa
# depois, como o `alarme-main`. O modo de falha dele é "não avisou", nunca
# "aprovou o que não devia" (INV-CI01).
#
# CONTEXTO — por que ele existe (armadilhas/018 + /177):
# a renovação do certificado JÁ é automática (o Traefik pede um novo ~30 dias
# antes de vencer, e o `acme.json` vive num volume que sobrevive às entregas).
# O que faltava era alguém CONFERIR se ela aconteceu: se o ACME falhar, o
# Traefik serve o `TRAEFIK DEFAULT CERT` indefinidamente e não avisa ninguém —
# o site cai na tela vermelha e quem descobre é um visitante. "Renova sozinho"
# sem medição é garantia sem mecanismo. Este arquivo é o mecanismo.
# =============================================================================
name: vigia-do-cadeado
on:
  schedule:
    # 11:00 UTC = 08:00 no horário de Brasília, todo dia. De manhã de propósito:
    # se abrir chamado, há o dia inteiro pela frente para consertar — e sobram
    # 21 dias de folga na régua, então nunca é corrida.
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Grupo PRÓPRIO, nunca o `deploy`: naquele grupo o GitHub guarda um único run
# pendente e CANCELA o anterior quando chega outro (armadilhas/173) — um vigia
# cancelado em silêncio é pior que vigia nenhum, porque parece que rodou.
concurrency:
  group: vigia-do-cadeado
  cancel-in-progress: false
jobs:
  medir:
    name: medir o cadeado de cada site, de fora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Sem dependências: o vigia usa só a biblioteca padrão do Python. Foi
      # escolha, não acaso — um vigia que depende de `pip install` ganha um
      # modo de falha novo (o registro de pacotes fora do ar) justamente no dia
      # em que ele precisa funcionar.
      - name: Vigia do cadeado
        run: python ci/vigia_do_cadeado.py

  alarme:
    name: alarme do cadeado
    needs: medir
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir (ou atualizar) a issue do cadeado
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          CORPO="$(cat <<EOF
          O vigia diário mediu o certificado dos sites **de fora** e algo está errado.

          - execução (a medição crua, host a host): $RUN_URL

          ## O que isto significa

          Um dos endereços do projeto está — ou vai ficar — sem cadeado válido.
          Para o visitante isso é a tela vermelha \`NET::ERR_CERT_AUTHORITY_INVALID\`,
          o pior primeiro contato possível com um site. Abra a execução acima: cada
          host tem uma linha dizendo quantos dias faltam, ou o que impediu a medição.

          ## Os três motivos possíveis, e o que fazer em cada um

          1. **\`TRAEFIK DEFAULT CERT\`** — a emissão do Let's Encrypt falhou e o
             Traefik voltou ao crachá de fábrica. Ele **não** re-tenta a cada acesso:
             só ao recarregar a config (\`armadilhas/018\`). O empurrão é qualquer diff
             em \`infra/traefik/**\` — até um comentário — que faz o \`deploy-infra\`
             recriar o container e tentar na hora.
          2. **Vence em poucos dias** — a renovação automática teve mais de uma semana
             (o Traefik começa aos 30 dias) e não aconteceu. Mesmo conserto do item 1;
             confira depois se o \`acme.json\` ainda está no volume \`letsencrypt\`.
          3. **Não consegui medir** — DNS, porta 443 ou o servidor fora do ar. Aqui o
             cadeado pode estar bom e o problema ser outro, maior. O vigia já insistiu
             3 vezes antes de gritar, então não é blip de rede.

          ## Como conferir na mão

          \`\`\`
          python ci/vigia_do_cadeado.py
          \`\`\`

          Feche esta issue quando o vigia voltar ao verde.
          EOF
          )"

          # Não empilhar issue: se já existe uma aberta, comenta nela. Um vigia
          # diário que abre um chamado por dia vira ruído, e ruído se ignora —
          # que é o mesmo que não avisar.
          EXISTENTE="$(gh issue list --label cadeado-vermelho --state open \
            --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTENTE" ]; then
            echo "Issue #$EXISTENTE já aberta — comentando nela."
            gh issue comment "$EXISTENTE" --body "$CORPO"
          else
            # A label pode não existir ainda. `|| true` aqui esconderia "não
            # consegui criar" junto com "já existe", então distingo os dois.
            if ! gh label list --json name --jq '.[].name' | grep -qx cadeado-vermelho; then
              gh label create cadeado-vermelho \
                --color B60205 \
                --description "O certificado de um endereço do projeto está (ou vai ficar) inválido"
            fi
            gh issue create \
              --label cadeado-vermelho \
              --title "Cadeado vermelho: um endereço do projeto está sem certificado válido" \
              --body "$CORPO"
          fi
