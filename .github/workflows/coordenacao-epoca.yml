name: coordenacao-epoca
on:
  workflow_dispatch:
    inputs:
      coorte:
        description: 'Coorte da transição pausada'
        required: true
        type: string
      transicao:
        description: 'Identificador da transição'
        required: true
        type: string
      fase:
        description: 'Fase a testemunhar'
        required: true
        type: choice
        options:
          - preparada
          - ativa
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: coordenacao-epoca
  cancel-in-progress: false
  queue: max
jobs:
  assinar:
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recusar ref que nao seja main
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::O testemunho só usa o workflow integrado na main. Dispare com --ref main.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validar entrada e preparar consulta fixa
        id: preparar
        env:
          COORTE: ${{ inputs.coorte }}
          TRANSICAO: ${{ inputs.transicao }}
          FASE: ${{ inputs.fase }}
        run: python ci/testemunho_epoca.py preparar-consulta
      - name: Consultar PG sob trava comum na VPS
        id: remoto
        env:
          COORTE: ${{ inputs.coorte }}
          TRANSICAO: ${{ inputs.transicao }}
          FASE: ${{ inputs.fase }}
          NONCE: ${{ steps.preparar.outputs.nonce }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COORTE,TRANSICAO,FASE,NONCE
          capture_stdout: true
          command_timeout: 2m
          script_path: ${{ steps.preparar.outputs.script }}
      - name: Validar resposta PG e construir registro canonico
        env:
          COORTE: ${{ inputs.coorte }}
          TRANSICAO: ${{ inputs.transicao }}
          FASE: ${{ inputs.fase }}
          NONCE: ${{ steps.preparar.outputs.nonce }}
          GH_TOKEN: ${{ github.token }}
          SAIDA_PG: ${{ steps.remoto.outputs.stdout }}
        run: python ci/testemunho_epoca.py construir-registro
      - name: Assinar os bytes canonicos do registro
        id: atestar
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/registro.json
      - name: Entregar registro e bundle para verificacao apos o run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testemunho-epoca-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/registro.json
            ${{ steps.atestar.outputs.bundle-path }}



