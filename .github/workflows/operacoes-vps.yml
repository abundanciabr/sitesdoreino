name: operacoes-vps
on:
  workflow_dispatch:
    inputs:
      operacao:
        description: 'Operação somente de leitura, sem comandos livres'
        required: true
        type: choice
        options:
          - estado-servico
          - estado-infra
          - espaco-disco
          - versao-compose
          - appmax-pix
          - appmax-pix-pedido
          - appmax-pix-aviso
          - appmax-inbox-latencia
          - appmax-observacao
          - appmax-estorno
          - appmax-pendentes
          - quiz-configuracao
          - coordenacao-db
      servico:
        description: 'Nome exato do serviço no Compose; para coordenacao-db use postgres; para estado-infra e espaco-disco use plataforma. Nunca informe dados pessoais ou segredos.'
        required: true
        type: string
      referencia:
        description: 'SHA-256 da chave idempotente: obrigatório em appmax-pix-pedido e appmax-pix-aviso, opcional em appmax-pix e appmax-inbox-latencia para descoberta histórica e em appmax-estorno; nunca informe o ID original.'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: operacoes-vps
  cancel-in-progress: false
  queue: max
jobs:
  medir:
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar leitor do catálogo
        run: python -m pip install PyYAML==6.0.2
      - name: Validar operação e preparar código deste SHA
        id: conferir
        env:
          OPERACAO: ${{ inputs.operacao }}
          SERVICO: ${{ inputs.servico }}
        run: |
          set -euo pipefail
          python ci/operacoes_vps.py preparar
          SCRIPT="$RUNNER_TEMP/operacao-vps.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo '::error::O coletor não gerou o script. Corrija a preparação por PR antes de executar.'
            exit 1
          fi
          bash -n "$SCRIPT"
      - name: Medir na VPS com saída sanitizada na origem
        id: remoto
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          # Chave pública ECDSA da VPS já confiada no known_hosts do mantenedor (25/09/2026).
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          capture_stdout: true
          command_timeout: 2m
          script_path: ${{ steps.conferir.outputs.script }}
      - name: Conferir evidência e publicar resumo
        if: always() && steps.remoto.outcome != 'skipped'
        env:
          SAIDA: ${{ steps.remoto.outputs.stdout }}
          OPERACAO: ${{ inputs.operacao }}
          SERVICO: ${{ inputs.servico }}
        run: python ci/operacoes_vps.py conferir
