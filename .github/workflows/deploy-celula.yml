name: deploy-celula
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Inicializar aprovação da imagem já em uso
        type: choice
        options: [inicializar]
        default: inicializar
        required: true
      celula:
        description: Célula já em uso
        required: true
        type: string
      sha:
        description: SHA de 40 caracteres da imagem já em uso
        required: true
        type: string
  push:
    branches: [main]
    paths: ['services/**', 'documentos/**', 'infra/deploy-celula-na-vps.sh', 'infra/publicacao-local.py', '.github/workflows/deploy-celula.yml']
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max
jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      celulas: ${{ steps.d.outputs.celulas }}
      celulas_imagem: ${{ steps.d.outputs.celulas_imagem }}
      n: ${{ steps.d.outputs.n }}
      n_imagem: ${{ steps.d.outputs.n_imagem }}
      deteccao: ${{ steps.d.outputs.deteccao }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leitor do mapa das células
        run: python -m pip install --quiet pyyaml
      - id: d
        name: Detectar células tocadas (runner canônico, base = event.before)
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          MODO: ${{ inputs.modo }}
          CELULA_INICIAL: ${{ inputs.celula }}
          SHA_INICIAL: ${{ inputs.sha }}
        run: |
          set -eu
          if [ "$EVENTO" = workflow_dispatch ]; then
            python - <<'PY'
          import json, os, re
          from pathlib import Path
          celula = os.environ['CELULA_INICIAL']
          if os.environ['MODO'] != 'inicializar':
              raise SystemExit('Modo de inicialização inválido.')
          if not re.fullmatch(r'[a-z][a-z0-9_]*', celula) or not Path('services', celula, 'Dockerfile').is_file():
              raise SystemExit('Célula desconhecida ou inválida.')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['SHA_INICIAL']):
              raise SystemExit('Informe o SHA imutável de 40 caracteres da imagem em uso.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as destino:
              lista = json.dumps([celula])
              destino.write(f'celulas={lista}\ncelulas_imagem={lista}\nn=1\nn_imagem=1\ndeteccao=ok\n')
          PY
            exit 0
          fi
          BASE='${{ github.event.before }}'
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              echo "ERROR: github.event.before inutilizável ('$BASE')." >&2
              exit 1;;
          esac
          CEL="$(python ci/detectar_celulas.py --base "$BASE")"
          JSON="$(printf '%s' "$CEL" | jq -R . | jq -sc 'map(select(length>0))')"
          JSON="$(python ci/ordem_de_publicacao.py "$JSON")"
          echo "celulas=$JSON" >> "$GITHUB_OUTPUT"
          echo "celulas_imagem=$JSON" >> "$GITHUB_OUTPUT"
          echo "n=$(jq -n --argjson c "$JSON" '$c|length')" >> "$GITHUB_OUTPUT"
          echo "n_imagem=$(jq -n --argjson c "$JSON" '$c|length')" >> "$GITHUB_OUTPUT"
          echo "deteccao=ok" >> "$GITHUB_OUTPUT"
          echo "Células tocadas: $JSON"
          echo "Células com imagem: $JSON"

  deploy:
    needs: detectar
    if: >-
      needs.detectar.result == 'success' &&
      needs.detectar.outputs.deteccao == 'ok' &&
      needs.detectar.outputs.celulas_imagem != '[]'
    environment: vps
    runs-on: ubuntu-latest
    env:
      TAG_IMAGEM: ${{ inputs.sha || github.sha }}
      FONTE_PROVA: ${{ github.event_name == 'workflow_dispatch' && format('{0}/fonte-prova', github.workspace) || github.workspace }}
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        celula: ${{ fromJSON(needs.detectar.outputs.celulas_imagem) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Embutir os documentos do site no contexto do build (só a célula admin)
        if: github.event_name == 'push' && matrix.celula == 'admin'
        run: |
          set -eu
          test -d documentos || { echo "PAROU: documentos/ nao existe"; exit 1; }
          rm -rf services/admin/documentos_embutidos
          cp -R documentos services/admin/documentos_embutidos
          echo "documentos embutidos: $(ls services/admin/documentos_embutidos/*.md | wc -l) arquivos"
      - name: Build da imagem da célula
        if: github.event_name == 'push'
        run: |
          IMG=ghcr.io/abundanciabr/plataforma-${{ matrix.celula }}
          docker build -t "$IMG:${{ github.sha }}" "services/${{ matrix.celula }}"

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.sha }}
          path: fonte-prova
      - name: Baixar a imagem em uso para prova inicial
        if: github.event_name == 'workflow_dispatch'
        env:
          CELULA: ${{ matrix.celula }}
        run: docker pull "ghcr.io/abundanciabr/plataforma-$CELULA:$TAG_IMAGEM"

      - name: Provar o produto na própria imagem candidata com banco isolado
        env:
          CELULA: ${{ matrix.celula }}
        run: |
          set -euo pipefail
          IMG=ghcr.io/abundanciabr/plataforma-$CELULA:$TAG_IMAGEM
          docker run --rm --network host --entrypoint sh \
            -e CELULA -e DATABASE_URL=postgres://ci:ci@localhost:5432/ci_db \
            -e REDIS_STREAMS_URL=redis://localhost:6379/0 \
            -e HUEY_REDIS_URL=redis://localhost:6379/1 \
            -e DJANGO_SECRET_KEY=teste-isolado \
            -e MP_ACCESS_TOKEN=TEST-ci-sem-credencial-real \
            -e MP_WEBHOOK_SECRET=teste-isolado \
            -v "$FONTE_PROVA:/fonte:ro" -v "$GITHUB_WORKSPACE:/corte:ro" "$IMG" -c '
              set -eu
              mkdir /tmp/prova
              cp -a /fonte/. /tmp/prova/
              rm -rf "/tmp/prova/services/$CELULA"
              mkdir -p "/tmp/prova/services/$CELULA"
              cp -a /app/. "/tmp/prova/services/$CELULA/"
              cd "/tmp/prova/services/$CELULA"
              for teste in tests/test_*.py; do
                [ -f "$teste" ] || continue
                [ -f "/corte/services/$CELULA/$teste" ] || rm "$teste"
              done
              if [ "$CELULA" = cursos ]; then
                cp /corte/services/cursos/tests/test_ciclo_do_desafio_da_comunidade.py tests/
                cp /corte/services/cursos/tests/test_regua_no_laudo.py tests/
              fi
              if [ "$CELULA" = gamificacao ]; then
                cp /corte/services/gamificacao/tests/test_quadro_de_contribuicoes.py tests/
                cp /corte/services/gamificacao/tests/test_tela_de_medalhas.py tests/
              fi
              if [ "$CELULA" = checkout ] || [ "$CELULA" = funil ]; then
                apt-get update -qq
                if [ "$CELULA" = checkout ]; then PACOTE=nodejs; else PACOTE=git; fi
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$PACOTE" >/dev/null
                if [ "$CELULA" = funil ]; then git config --global --add safe.directory /tmp/prova; fi
              fi
              if [ "$CELULA" = admin ]; then
                python -m pytest -q -k 'not test_central_identifica_as_duas_publicacoes_sem_trocar_a_selecao and not test_vinculos_nao_seguem_diretorio_redirecionado'
              elif [ "$CELULA" = funil ]; then
                python -m pytest -q -k 'not test_validador_da_celula_real_passa'
              else
                python -m pytest -q
              fi
            '

      - name: Enviar a imagem ao registro (até 3 tentativas)
        if: github.event_name == 'push'
        run: |
          IMG=ghcr.io/abundanciabr/plataforma-${{ matrix.celula }}
          python3 ci/enviar_a_imagem.py "$IMG:${{ github.sha }}"
      - name: Enviar o receptor de aprovação para a VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          source: infra/publicacao-local.py
          target: /opt/plataforma
          strip_components: 1

      - name: Inicializar a aprovação da imagem em uso
        id: inicializar
        if: github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          envs: MODO,CELULA,TAG,PROVA_IMAGEM_SHA,ENDERECO_PROVA,COMPATIBILIDADE_DADOS,COMPATIBILIDADE_CONFIGURACAO
          capture_stdout: true
          command_timeout: 10m
          script_path: infra/deploy-celula-na-vps.sh
        env:
          MODO: inicializar
          CELULA: ${{ matrix.celula }}
          TAG: ${{ inputs.sha }}
          PROVA_IMAGEM_SHA: ${{ inputs.sha }}
          ENDERECO_PROVA: ${{ fromJSON(vars.PUBLICACAO_ENDERECOS || '{}')[matrix.celula] }}
          COMPATIBILIDADE_DADOS: ${{ fromJSON(vars.PUBLICACAO_COMPATIBILIDADE_DADOS || '{}')[matrix.celula] }}
          COMPATIBILIDADE_CONFIGURACAO: ${{ fromJSON(vars.PUBLICACAO_COMPATIBILIDADE_CONFIGURACAO || '{}')[matrix.celula] }}

      - name: Conferir aprovação inicial concluída
        if: github.event_name == 'workflow_dispatch'
        env:
          SAIDA: ${{ steps.inicializar.outputs.stdout }}
          CELULA: ${{ matrix.celula }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SAIDA" | grep -Fx "INICIALIZACAO-CONCLUIDA: $CELULA:$TAG_IMAGEM"
          echo 'Imagem em uso aprovada após testes isolados, identidade e endereço HTTPS.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar captura da aplicação sem perder o estado na falha
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          fonte = Path('infra/deploy-celula-na-vps.sh')
          script = fonte.read_text()
          delimitador = 'FIM_DEPLOY_COM_RESULTADO'
          if delimitador in script:
              raise SystemExit('Delimitador presente no receptor.')
          fonte.write_text(
              'set -u\nSCRIPT=$(cat <<\'' + delimitador + '\'\n' + script +
              '\n' + delimitador + '\n)\n' +
              'if bash -c "$SCRIPT" </dev/null; then CODIGO=0; else CODIGO=$?; fi\n' +
              'printf "DEPLOY-STATUS:%s\\n" "$CODIGO"\n'
          )
          PY
          bash -n infra/deploy-celula-na-vps.sh

      - name: Aplicar a candidata e provar o endereço
        id: aplicar
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          envs: CELULA,TAG,PROVA_IMAGEM_SHA,PEDIDO_EM,ENDERECO_PROVA,COMPATIBILIDADE_DADOS,COMPATIBILIDADE_CONFIGURACAO
          capture_stdout: true
          command_timeout: 30m
          script_path: infra/deploy-celula-na-vps.sh
        env:
          CELULA: ${{ matrix.celula }}
          TAG: ${{ github.sha }}
          PROVA_IMAGEM_SHA: ${{ github.sha }}
          PEDIDO_EM: ${{ github.event.head_commit.timestamp }}
          ENDERECO_PROVA: ${{ fromJSON(vars.PUBLICACAO_ENDERECOS || '{}')[matrix.celula] }}
          COMPATIBILIDADE_DADOS: ${{ fromJSON(vars.PUBLICACAO_COMPATIBILIDADE_DADOS || '{}')[matrix.celula] }}
          COMPATIBILIDADE_CONFIGURACAO: ${{ fromJSON(vars.PUBLICACAO_COMPATIBILIDADE_CONFIGURACAO || '{}')[matrix.celula] }}

      - name: Classificar publicação e preservar o estado para recuperação
        id: resultado
        if: ${{ !cancelled() && steps.aplicar.outcome != 'skipped' }}
        env:
          SAIDA: ${{ steps.aplicar.outputs.stdout }}
        run: |
          python - <<'PY'
          import json, os, re
          saida = os.environ['SAIDA']
          estados = re.findall(r'^ESTADO-PUBLICACAO: (.+)$', saida, re.M)
          status = re.findall(r'^DEPLOY-STATUS:([0-9]+)$', saida, re.M)
          sucesso = status == ['0'] and 'ENTREGA-CONCLUIDA:' in saida
          aplicada = bool(re.search(r'^CANDIDATA-APLICADA:', saida, re.M))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as destino:
              destino.write(f"sucesso={'true' if sucesso else 'false'}\n")
              destino.write(f"recuperar={'true' if aplicada and not sucesso and len(estados) == 1 else 'false'}\n")
          if len(estados) == 1:
              estado = json.loads(estados[0])
              with open(os.environ['GITHUB_OUTPUT'], 'a') as destino:
                  destino.write('estado=' + json.dumps(estado, separators=(',', ':')) + '\n')
          if not sucesso:
              print('A candidata não foi aprovada; confira aplicação, backup e resposta remota.')
          PY

      - name: Escolher destino com aprovação e compatibilidade comprovadas
        id: alvo
        if: steps.resultado.outputs.recuperar == 'true'
        env:
          REVERSAO_CELULA: ${{ matrix.celula }}
          REVERSAO_ATUAL: ${{ github.sha }}
          REVERSAO_ESTADO_PUBLICACAO: ${{ steps.resultado.outputs.estado }}
        run: python ci/reversao.py

      - name: Recuperar uma única vez e provar novamente
        id: recuperar
        if: steps.alvo.outputs.tag != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          envs: CELULA,VAR_TAG,TAG,ATUAL_ESPERADA,COMPATIBILIDADE_DADOS,COMPATIBILIDADE_CONFIGURACAO
          capture_stdout: true
          command_timeout: 30m
          script_path: infra/reverter-celula-na-vps.sh
        env:
          CELULA: ${{ matrix.celula }}
          VAR_TAG: ${{ steps.alvo.outputs.var_tag }}
          TAG: ${{ steps.alvo.outputs.tag }}
          ATUAL_ESPERADA: ${{ steps.alvo.outputs.atual }}
          COMPATIBILIDADE_DADOS: ${{ steps.alvo.outputs.dados }}
          COMPATIBILIDADE_CONFIGURACAO: ${{ steps.alvo.outputs.configuracao }}

      - name: Exigir aprovação da candidata e registrar o resultado
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          SUCESSO: ${{ steps.resultado.outputs.sucesso }}
          RECUPERACAO: ${{ steps.recuperar.outcome }}
          SAIDA: ${{ steps.aplicar.outputs.stdout }}
        run: |
          set -eu
          printf '%s\n' "$SAIDA" | grep '^PUBLICACAO-MEDICAO:' >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$SUCESSO" != true ]; then
            echo "A candidata falhou. Recuperação: ${RECUPERACAO:-não iniciada}. Confira o estado remoto antes de repetir." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Candidata aprovada após testes da imagem e prova do endereço.' >> "$GITHUB_STEP_SUMMARY"
