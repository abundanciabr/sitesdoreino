name: vigia-do-site
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: vigia-do-site
  cancel-in-progress: false
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      estado: ${{ steps.vigia.outputs.estado }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: vigia
        name: Medir disponibilidade externa
        continue-on-error: true
        run: python ci/vigia_do_site.py

  recuperar:
    needs: medir
    if: needs.medir.outputs.estado == 'indisponivel'
    uses: ./.github/workflows/rollback.yml
    with:
      modo: recuperar-auto
      motivo: 'Vigia detectou indisponibilidade pela internet pública'
    secrets: inherit

  conferir:
    needs: [medir, recuperar]
    if: always() && needs.recuperar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir o endereço depois da recuperação
        run: python ci/vigia_do_site.py

  alarme:
    needs: [medir, recuperar, conferir]
    if: >-
      always() &&
      (needs.medir.result != 'success' ||
       needs.medir.outputs.estado == 'erro' ||
       needs.medir.outputs.estado == '' ||
       (needs.medir.outputs.estado == 'indisponivel' &&
        (needs.recuperar.result != 'success' || needs.conferir.result != 'success')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Informar falha terminal sem repetir tentativa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEDICAO: ${{ needs.medir.outputs.estado }}
          RECUPERACAO: ${{ needs.recuperar.result }}
          CONFERENCIA: ${{ needs.conferir.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Vigia encerrou: medição=$MEDICAO recuperação=$RECUPERACAO conferência=$CONFERENCIA. Diagnóstico: $RUN_URL"
          EXISTENTE="$(gh issue list --label site-fora-do-ar --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTENTE" ]; then
            echo "Incidente #$EXISTENTE já aberto. Esta execução não repete aviso."
            exit 1
          fi
          if ! gh label list --json name --jq '.[].name' | grep -qx site-fora-do-ar; then
            gh label create site-fora-do-ar --color B60205 --description "Indisponibilidade ou falha na recuperação do site"
          fi
          cat > /tmp/incidente-site.txt <<EOF
          O site não passou na medição ou na prova depois da recuperação.
          Execução com hosts e diagnóstico: $RUN_URL
          Medição: $MEDICAO. Recuperação: $RECUPERACAO. Conferência: $CONFERENCIA.
          A tentativa automática terminou. O journal bloqueia novas tentativas para a mesma publicação.
          Confira rede, TLS, serviços, disco, credenciais e o destino aprovado no journal da VPS.
          Se não houver destino único e seguro, estabeleça uma versão recuperável com prova de aprovação.
          Nenhum banco foi restaurado. Restauração exige diagnóstico e autorização do mantenedor.
          Feche este incidente depois de comprovar o endereço respondendo novamente.
          EOF
          gh issue create --label site-fora-do-ar --title "Site indisponível: recuperação automática encerrada" --body-file /tmp/incidente-site.txt
          exit 1
