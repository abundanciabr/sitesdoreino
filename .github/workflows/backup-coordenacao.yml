name: backup-coordenacao
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-coordenacao
  cancel-in-progress: false
jobs:
  copiar:
    if: github.ref == 'refs/heads/main'
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Cifrar na origem e transferir pelo host fixado
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$VPS_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo '::error::Credencial ou host da VPS ausente no ambiente vps; confira secrets antes de repetir.'
            exit 1
          fi
          KEY="$RUNNER_TEMP/coordenacao-ssh-key"
          trap 'rm -f "$KEY"' EXIT
          HOSTS="$RUNNER_TEMP/coordenacao-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          unset DEPLOY_SSH_KEY
          ssh-keyscan -T 10 -t ecdsa "$VPS_HOST" > "$HOSTS" 2>/dev/null
          FINGERPRINT="$(ssh-keygen -lf "$HOSTS" -E sha256 | awk '{print $2}')"
          if [ "$FINGERPRINT" != 'SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ' ]; then
            echo '::error::Identidade da VPS divergiu; confira o pin pelo canal confiável.'
            exit 1
          fi
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ecdsa-sha2-nistp256 -o UserKnownHostsFile="$HOSTS" -i "$KEY" "deploy@$VPS_HOST")
          "${SSH[@]}" "cd /opt/plataforma && python3 - $RUN_ID" < infra/backup-coordenacao.py > "$RUNNER_TEMP/resumo-coordenacao.json"
          "${SSH[@]}" "cat /opt/plataforma/backups-coordenacao/$RUN_ID.p7m" > "$RUNNER_TEMP/$RUN_ID.p7m"
          python ci/backup_coordenacao.py "$RUNNER_TEMP/resumo-coordenacao.json" "$RUNNER_TEMP/$RUN_ID.p7m"
      - name: Guardar cópia cifrada fora da VPS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordenacao-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ github.run_id }}.p7m
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
