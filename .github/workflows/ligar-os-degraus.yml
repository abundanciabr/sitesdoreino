# =============================================================================
# LIGAR A ESCADA DE DEGRAUS — põe de pé, na produção, a escada de níveis da
# escola, pelo pipeline, sem o mantenedor colar nada em terminal nenhum.
#
# POR QUE ELE EXISTE
# ------------------
# `/admin/economia/` tem interruptor para as REGRAS de pontuação e para as
# CONQUISTAS, e nenhum para os DEGRAUS. Enquanto não houver, a página do aluno
# não tem escada para mostrar — e é isso que ela diz, desde os PRs #838 e #840
#: "a sua escada está sendo montada".
#
# Decisão do mantenedor em 01/09/2026: ligar agora por aqui, e ganhar o botão na
# tela em seguida. Este workflow é a primeira metade; a segunda é o interruptor
# em `/admin/economia/`, e é lá que DESLIGAR vai morar — gesto reversível
# pertence a uma tela, não a um disparo de agente.
#
# POR QUE workflow_dispatch É SEGURO AQUI
# ----------------------------------------
# Não ENTREGA código: roda um script versionado que só sabe fazer uma coisa, e
# essa coisa é estreita por construção. `ligar_degraus` liga `NivelDefinicao` e
# NADA MAIS — regra de pontuação, missão, conquista, liga e cosmético não são
# tocados, há teste afirmando isso, e o script CONFERE de fora depois de rodar.
# Degrau não paga nada: é a régua com que o XP é lido. Quanto a escola paga
# continua sendo decisão de uma tela, uma regra por vez, com data.
#
# É IDEMPOTENTE: rodar duas vezes liga zero na segunda e diz isso. Não toca env,
# não escreve segredo, não reinicia serviço, não faz deploy.
#
# GRUPO PRÓPRIO: `cancel-in-progress: false` NÃO faz fila
# ilimitada — o GitHub guarda UM run pendente por grupo e o próximo CANCELA o
# pendente. Num repositório com ~100 entregas por dia, um disparo manual no
# grupo `deploy` morre antes de começar.
# =============================================================================
name: ligar-os-degraus
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ligar-os-degraus
  cancel-in-progress: false
jobs:
  ligar:
    name: por a escada de degraus de pe na producao
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # a ssh-action com `script_path` apontando para arquivo
      # inexistente AVISA e IGNORA, saindo com sucesso — falso-verde conhecido.
      - name: Conferir que o script existe antes de abrir conexão
        run: |
          set -euo pipefail
          if [ ! -f infra/ligar-os-degraus.sh ]; then
            echo "::error::PAROU POR SEGURANÇA — infra/ligar-os-degraus.sh não existe neste commit."
            exit 1
          fi
          bash -n infra/ligar-os-degraus.sh
          echo "✅ script presente e sintaticamente válido"

      - name: Ligar na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script_path: infra/ligar-os-degraus.sh
