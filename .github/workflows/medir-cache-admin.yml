name: Medir cache externo do admin

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: medir-cache-admin
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      total_s: ${{ steps.total.outputs.segundos }}
      upload_s: ${{ steps.tempo.outputs.segundos }}
      artifact_id: ${{ steps.enviar.outputs.artifact-id }}
    steps:
      - run: date +%s%N > "$RUNNER_TEMP/job-inicio"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar contexto da receita oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML==6.0.2
          python ci/preparar_dados_admin.py painel --saida services/admin/painel_embutido --sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}"
          python ci/preparar_dados_admin.py fila --saida services/admin/fila_embutida --sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}"
          test -d documentos
          rm -rf services/admin/documentos_embutidos
          cp -R documentos services/admin/documentos_embutidos
          test -d docs/decisoes
          rm -rf services/admin/planos_embutidos
          cp -R docs/decisoes services/admin/planos_embutidos
          docker pull python:3.12-slim
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          python ci/medir_cache_admin.py preparar --contexto services/admin --base "$base" --revisao "${{ github.sha }}" --saida medicao/contexto
      - run: date +%s%N > "$RUNNER_TEMP/inicio"
      - id: enviar
        uses: actions/upload-artifact@v4
        with:
          name: pme1003-contexto-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/contexto/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - id: tempo
        run: |
          inicio=$(cat "$RUNNER_TEMP/inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - id: total
        run: |
          inicio=$(cat "$RUNNER_TEMP/job-inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"

  frio:
    needs: preparar
    runs-on: ubuntu-latest
    outputs:
      total_s: ${{ steps.total.outputs.segundos }}
      download_s: ${{ steps.tempo.outputs.segundos }}
    steps:
      - run: date +%s%N > "$RUNNER_TEMP/job-inicio"
      - uses: actions/checkout@v4
      - run: date +%s%N > "$RUNNER_TEMP/inicio"
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-contexto-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/contexto
      - id: tempo
        run: |
          inicio=$(cat "$RUNNER_TEMP/inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - run: python ci/medir_cache_admin.py construir --modo frio --contexto medicao/contexto/contexto.tar --identidade medicao/contexto/identidade.json --saida medicao/frio
      - id: total
        run: |
          inicio=$(cat "$RUNNER_TEMP/job-inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pme1003-frio-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/frio/
          retention-days: 2
          if-no-files-found: ignore

  exportar:
    needs: preparar
    runs-on: ubuntu-latest
    outputs:
      download_s: ${{ steps.tempo.outputs.segundos }}
      total_s: ${{ steps.total.outputs.segundos }}
      cache_upload_s: ${{ steps.cache_tempo.outputs.segundos }}
      cache_id: ${{ steps.enviar_cache.outputs.artifact-id }}
    steps:
      - run: date +%s%N > "$RUNNER_TEMP/job-inicio"
      - uses: actions/checkout@v4
      - run: date +%s%N > "$RUNNER_TEMP/inicio"
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-contexto-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/contexto
      - id: tempo
        run: |
          inicio=$(cat "$RUNNER_TEMP/inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - run: python ci/medir_cache_admin.py construir --modo exportar --contexto medicao/contexto/contexto.tar --identidade medicao/contexto/identidade.json --saida medicao/exportar
      - run: date +%s%N > "$RUNNER_TEMP/cache-inicio"
      - id: enviar_cache
        uses: actions/upload-artifact@v4
        with:
          name: pme1003-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/exportar/cache.tar
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - id: cache_tempo
        run: |
          inicio=$(cat "$RUNNER_TEMP/cache-inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - id: total
        run: |
          inicio=$(cat "$RUNNER_TEMP/job-inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pme1003-exportar-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            medicao/exportar/resultado.json
            medicao/exportar/metadados.json
            medicao/exportar/build.log
          retention-days: 2
          if-no-files-found: ignore

  importar:
    needs: [preparar, exportar]
    runs-on: ubuntu-latest
    outputs:
      contexto_download_s: ${{ steps.contexto_tempo.outputs.segundos }}
      total_s: ${{ steps.total.outputs.segundos }}
      cache_download_s: ${{ steps.cache_tempo.outputs.segundos }}
    steps:
      - run: date +%s%N > "$RUNNER_TEMP/job-inicio"
      - uses: actions/checkout@v4
      - run: date +%s%N > "$RUNNER_TEMP/inicio"
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-contexto-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/contexto
      - id: contexto_tempo
        run: |
          inicio=$(cat "$RUNNER_TEMP/inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - run: date +%s%N > "$RUNNER_TEMP/cache-inicio"
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/cache
      - id: cache_tempo
        run: |
          inicio=$(cat "$RUNNER_TEMP/cache-inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - run: python ci/medir_cache_admin.py construir --modo importar --contexto medicao/contexto/contexto.tar --identidade medicao/contexto/identidade.json --cache medicao/cache/cache.tar --saida medicao/importar
      - id: total
        run: |
          inicio=$(cat "$RUNNER_TEMP/job-inicio")
          fim=$(date +%s%N)
          echo "segundos=$(awk "BEGIN {print ($fim-$inicio)/1000000000}")" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pme1003-importar-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/importar/
          retention-days: 2
          if-no-files-found: ignore

  comparar:
    needs: [preparar, frio, exportar, importar]
    runs-on: ubuntu-latest
    steps:
      - run: date +%s%N > "$RUNNER_TEMP/job-inicio"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-frio-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/frio
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-exportar-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/exportar
      - uses: actions/download-artifact@v4
        with:
          name: pme1003-importar-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/importar
      - name: Validar identidade, bytes e custo total
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARAR_TOTAL_S: ${{ needs.preparar.outputs.total_s }}
          FRIO_TOTAL_S: ${{ needs.frio.outputs.total_s }}
          EXPORTAR_TOTAL_S: ${{ needs.exportar.outputs.total_s }}
          IMPORTAR_TOTAL_S: ${{ needs.importar.outputs.total_s }}
          CONTEXTO_ID: ${{ needs.preparar.outputs.artifact_id }}
          CACHE_ID: ${{ needs.exportar.outputs.cache_id }}
          CONTEXTO_UPLOAD_S: ${{ needs.preparar.outputs.upload_s }}
          FRIO_DOWNLOAD_S: ${{ needs.frio.outputs.download_s }}
          EXPORTAR_DOWNLOAD_S: ${{ needs.exportar.outputs.download_s }}
          CACHE_UPLOAD_S: ${{ needs.exportar.outputs.cache_upload_s }}
          IMPORTAR_CONTEXTO_DOWNLOAD_S: ${{ needs.importar.outputs.contexto_download_s }}
          CACHE_DOWNLOAD_S: ${{ needs.importar.outputs.cache_download_s }}
        run: |
          set -euo pipefail
          contexto_bytes=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTEXTO_ID" --jq '.size_in_bytes')
          cache_bytes=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CACHE_ID" --jq '.size_in_bytes')
          python ci/medir_cache_admin.py comparar \
            --frio medicao/frio/resultado.json --exportar medicao/exportar/resultado.json \
            --importar medicao/importar/resultado.json --saida medicao/resultado.json \
            --preparar-total-s "$PREPARAR_TOTAL_S" --frio-total-s "$FRIO_TOTAL_S" \
            --exportar-total-s "$EXPORTAR_TOTAL_S" --importar-total-s "$IMPORTAR_TOTAL_S" \
            --contexto-upload-s "$CONTEXTO_UPLOAD_S" --frio-download-s "$FRIO_DOWNLOAD_S" \
            --exportar-download-s "$EXPORTAR_DOWNLOAD_S" --cache-upload-s "$CACHE_UPLOAD_S" \
            --importar-contexto-download-s "$IMPORTAR_CONTEXTO_DOWNLOAD_S" \
            --cache-download-s "$CACHE_DOWNLOAD_S" \
            --contexto-artifact-bytes "$contexto_bytes" --cache-artifact-bytes "$cache_bytes"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pme1003-resultado-${{ github.run_id }}-${{ github.run_attempt }}
          path: medicao/resultado.json
          retention-days: 2
          if-no-files-found: ignore



