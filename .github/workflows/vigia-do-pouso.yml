# =============================================================================
# VIGIA DO POUSO — PR verde parado além da paciência, com remediação automática.
#
# O DEFEITO (TAR-167, medido em 05/09/2026): o PR #741 passou cinco dias aberto
# e verde sem integrar. Hoje a pista mergeia sozinha (`pouso.yml` +
# `ci/mergear.py --automatico`, decisão de 13/09/2026). Este workflow varre,
# TENTA integrar o que couber, varre de novo e só então abre ou atualiza a issue
# com o que SOBROU (falha da esteira ou PR que precisa de conserto/fechamento).
#
# Não é portão de PR e não substitui `pouso.yml`: é rede de segurança no relógio
# para ausência de merge quando os checks já fecharam verdes.
# =============================================================================
name: vigia-do-pouso
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Grupo próprio, nunca o `deploy`: lá o GitHub cancela o run anterior
# (armadilhas/173). Vigia cancelado em silêncio parece vigia que rodou.
concurrency:
  group: vigia-do-pouso
  cancel-in-progress: false
jobs:
  vigiar:
    name: varrer, remediar pela pista e denunciar o que sobrou
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Varrer, remediar e abrir ou atualizar a issue
        env:
          # Dois tokens, dois papéis. Nunca `secrets.PISTA_TOKEN || github.token`:
          # o `||` faz o PAT sombrear o token do job (armadilhas/279).
          GH_TOKEN: ${{ github.token }}
          PISTA_TOKEN: ${{ secrets.PISTA_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          CODIGO=0
          python ci/vigia_do_pouso.py --repo "$REPO" --corpo denuncia.md || CODIGO=$?

          if [ "$CODIGO" = "3" ]; then
            if [ -z "${PISTA_TOKEN:-}" ]; then
              echo "PAROU: há PR verde parado e o PISTA_TOKEN não está no job."
              echo "Sem o token da pista esta passagem não integra, e a issue não vai dizer que integrou."
              exit 2
            fi
            python -m pip install --quiet -r requirements-ci.txt
            set +e
            GH_TOKEN="$PISTA_TOKEN" python ci/mergear.py --automatico
            PISTA=$?
            set -e
            if [ "$PISTA" -ne 0 ]; then
              echo "PAROU: mergear --automatico saiu $PISTA."
              echo "A issue não foi publicada, porque ela diria que a pista rodou."
              exit "$PISTA"
            fi
            CODIGO=0
            python ci/vigia_do_pouso.py --repo "$REPO" --corpo denuncia.md || CODIGO=$?
          fi

          EXISTENTE="$(gh issue list --label pouso-esquecido --state open \
            --json number --jq '.[0].number // empty')"

          case "$CODIGO" in
            0)
              if [ -n "$EXISTENTE" ]; then
                gh issue close "$EXISTENTE" --comment \
                  "Nenhum PR verde parado além da paciência. Esta issue é quadro, não diário: ela se fecha sozinha quando o quadro esvazia."
                echo "Issue #$EXISTENTE fechada — a fila voltou a andar."
              else
                echo "Nenhum PR esquecido, nenhuma issue aberta. Nada a fazer."
              fi
              ;;
            3)
              if [ -n "$EXISTENTE" ]; then
                ATUAL="$(gh issue view "$EXISTENTE" --json body --jq .body | tr -d '\r')"
                NOVO="$(cat denuncia.md)"
                if [ "$ATUAL" = "$NOVO" ]; then
                  echo "Issue #$EXISTENTE já diz exatamente isto — não reescrevo."
                else
                  gh issue edit "$EXISTENTE" --body-file denuncia.md
                  echo "Issue #$EXISTENTE atualizada com o quadro de agora."
                fi
              else
                if ! gh label list --json name --jq '.[].name' | grep -qx pouso-esquecido; then
                  gh label create pouso-esquecido \
                    --color FBCA04 \
                    --description "PR verde há horas e a integração automática não concluiu"
                fi
                gh issue create \
                  --label pouso-esquecido \
                  --title "Integração parada: PR verde há horas sem merge" \
                  --body-file denuncia.md
              fi
              ;;
            *)
              echo "🧱 PAROU POR SEGURANÇA: o vigia não conseguiu varrer os PRs (exit $CODIGO)."
              echo "   Isto NÃO é 'nenhum PR esquecido' — é 'não consegui olhar'."
              echo "   A saída acima diz o que impediu a medição. Reproduza com:"
              echo "     python ci/vigia_do_pouso.py --repo $REPO"
              exit "$CODIGO"
              ;;
          esac
