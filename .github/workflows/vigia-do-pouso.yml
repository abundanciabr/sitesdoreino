# =============================================================================
# VIGIA DO POUSO — quem percebe que ninguém pediu pouso.
#
# O DEFEITO QUE ELE FECHA (TAR-167, medido em 05/09/2026): o PR #741 passou
# CINCO DIAS aberto e verde, com zero comentários da pista. Não foi a pista que
# falhou — ela nunca foi chamada. Ninguém pediu pouso, e ninguém percebeu que
# ninguém tinha pedido. O raciocínio inteiro, e a régua de cada dispensa, moram
# em `ci/vigia_do_pouso.py`.
#
# POR QUE ELE PRECISA DE UM RELÓGIO. É o segundo workflow desta casa a acordar
# pelo tempo, e pelo mesmo motivo do primeiro: o evento que ele vigia é uma
# AUSÊNCIA. Um PR que ninguém pediu para pousar não dispara nada — o silêncio
# não tem gatilho. Todo o resto aqui acorda em push, PR ou conclusão de check,
# e nenhum desses eventos acontece quando a doença é justamente não acontecer
# nada.
#
# DE DUAS EM DUAS HORAS, e não uma vez por dia como o vigia do cadeado: lá a
# régua tem 21 dias de folga; aqui o custo medido foi de cinco dias, e o
# despacho pede "algumas horas, não dias". Com a paciência em 6 h, um PR
# esquecido é denunciado em 6 a 8 h depois de ficar verde.
#
# O QUE ELE FAZ: não substitui o portão. Ele mede PRs não rascunho, marca os que
# estão verdes e parados e dispara a pista. O portão continua decidindo checks,
# base, recibo e mandato. Assim a ausência de uma sessão não cria PR órfão.
#
# VERMELHO AQUI SIGNIFICA UMA COISA SÓ: **o vigia ficou cego.** Achar PRs
# esquecidos é o trabalho dele, não uma falha dele — ele encaminha a pista. Se
# ele concluísse `failure` toda vez que achasse alguém, a aba
# Actions ganharia doze vermelhos por dia numa condição rotineira, e vermelho
# rotineiro é vermelho que se aprende a ignorar. Fica vermelho quando não
# consegue VARRER.
# =============================================================================
name: vigia-do-pouso
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pull-requests: write
# Grupo PRÓPRIO, nunca o `deploy`: naquele grupo o GitHub guarda um único run
# pendente e CANCELA o anterior quando chega outro (armadilhas/173) — um vigia
# cancelado em silêncio é pior que vigia nenhum, porque parece que rodou.
concurrency:
  group: vigia-do-pouso
  cancel-in-progress: false
jobs:
  vigiar:
    name: varrer os PRs abertos e acionar a pista automaticamente
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Sem `pip install`: o vigia usa só a biblioteca padrão e o `gh` que já
      # vem no runner. Foi escolha, não acaso — um vigia que depende do
      # registro de pacotes ganha um modo de falha novo justamente no dia em
      # que ele precisa funcionar.
      - name: Varrer e acionar a pista
        env:
          # O token do job basta para etiquetar o PR e disparar a pista. O
          # workflow de pouso usa o segredo próprio para a operação protegida.
          GH_TOKEN: ${{ github.token }}
          PISTA_TOKEN: ${{ secrets.PISTA_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # O veredito vem do EXIT do vigia, capturado direto — nunca do exit
          # de um cano, que é sempre o do último comando da linha.
          CODIGO=0
          python ci/vigia_do_pouso.py --repo "$REPO" > vigia.log 2>&1 || CODIGO=$?
          cat vigia.log

          case "$CODIGO" in
            0)
              echo "Nenhum PR esquecido. Nada a acionar."
              ;;
            3)
              while IFS= read -r linha; do
                PR="${linha#AUTORIZAR_POUSO=}"
                gh pr edit "$PR" --repo "$REPO" --add-label pousar
                echo "PR #$PR encaminhado à pista automaticamente."
              done < <(grep '^AUTORIZAR_POUSO=' vigia.log)
              GH_TOKEN="$PISTA_TOKEN" gh workflow run pouso.yml --repo "$REPO" --ref main
              echo "Pista disparada para todos os PRs medidos como esquecidos."
              ;;
            *)
              echo "🧱 PAROU POR SEGURANÇA: o vigia não conseguiu medir os PRs (exit $CODIGO)."
              echo "   Nenhum PR foi encaminhado. O log acima diz o que impediu a medição."
              exit "$CODIGO"
              ;;
          esac
