# =============================================================================
# AS MURALHAS — rodam em TODO PR. Required check na branch protection de main.
# =============================================================================
name: muralhas
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  muralhas:
    name: muralhas
    runs-on: ubuntu-latest
    env:
      BASE_REF: origin/${{ github.base_ref }}
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências dos portões
        run: python -m pip install --quiet pytest pytest-xdist pyyaml
      # UMA fonte de verdade para quais muralhas rodam e o que cada estado
      # significa: ci/ci.py. O YAML cuida de checkout, Python e env — não de
      # decidir PASS/FAIL. Antes, este workflow listava os três scripts à mão,
      # e a lista podia divergir da que o agente roda localmente sem ninguém
      # perceber. `python ci/ci.py --apenas muralhas` é literalmente o mesmo
      # comando dos dois lados.
      # O rótulo lista as muralhas que ci.py roda HOJE. Ele ficou para trás
      # quando a muralha do painel entrou (26/08/2026) e anunciava três de
      # quatro: nome de step que mente sobre o que rodou foi exatamente o
      # buraco do "lint + import-linter + type + testes" (guarda_dos_guardas).
      - name: Muralhas (cerca de célula · orçamento · guarda de segredos · painel)
        run: python ci/ci.py --apenas muralhas
      # [INV-CI01] Testar o testador: a suíte adversarial prova que os portões
      # REPROVAM quando devem — inclusive quando a ferramenta de medição é
      # quebrada de propósito, e inclusive a tabela-verdade do gate terminal de
      # ci-celula. Sem isto, um portão poderia voltar a ficar verde por não
      # conseguir medir, exatamente como já aconteceu.
      - name: Testar o testador (suíte adversarial dos portões)
        run: python ci/ci.py --apenas testador

  # ===========================================================================
  # O ESPELHO DA MAIN — o que vai rodar DEPOIS do merge, rodando ANTES dele.
  #
  # O BURACO, medido em 30/08/2026 (TAR-025). É tentador dizer que a suíte
  # `ci/tests/` "não roda em PR": ela roda, no step acima, e é required check.
  # O defeito é mais fino e por isso passou: **o job `muralhas` mede uma árvore
  # que ele mesmo acabou de modificar.** `ci/ci.py --apenas muralhas` chama
  # `ci/muralha-do-indice.sh`, que MATERIALIZA `armadilhas/INDICE.md`,
  # `GUARDAS.json` e `SINAIS.json`; o step seguinte roda a suíte com os três já
  # no disco. O `alarme-main`, depois do merge, roda a MESMA suíte num checkout
  # cru, onde eles não existem. Mesma suíte, dois mundos — e o mundo do PR é
  # sempre o mais rico. Nenhum check de PR conseguia, por construção, ver esta
  # classe de quebra.
  #
  # A MEDIÇÃO, na árvore exata do commit `caaeb2e8` (PR #580, o que apagou a
  # `main`), com `pytest ci/tests`:
  #
  #     árvore crua, como o runner do alarme a viu ......... 29 reprovas
  #     depois de a muralha materializar de passagem ....... 24 reprovas
  #
  # As 5 de diferença são exatamente as que derrubaram a `main` — entre elas
  # `test_o_sinal_do_repositorio_real_e_lido_pelo_sino`, que morria em
  # `JSONDecodeError: Expecting value: line 1 column 1 (char 0)`. (As 24 comuns
  # vêm da árvore sintética da reprodução — um `git archive` + `git init`, sem
  # `origin` e sem os gerados do painel — e são idênticas nos dois lados, logo
  # se cancelam. O número que decide é a DIFERENÇA. Na árvore de verdade, com o
  # conserto, a suíte fecha em 0 reprovas.)
  #
  # A CURA: este job. Ele é o `guardas-do-repositorio` do `alarme-main.yml`
  # copiado passo a passo, num checkout limpo, rodando no evento
  # `pull_request`. O que ele mede é literalmente "como a `main` vai ficar" —
  # RETROSPECTIVA-FASE-D §3, a prova vem de fora. E a cópia não se degrada em
  # silêncio: `ci/tests/test_espelho_do_alarme_em_pr.py` compara os dois jobs
  # passo a passo e REPROVA se alguém acrescentar um step lá e esquecer aqui.
  #
  # POR QUE UM JOB SEPARADO, e não reordenar os steps do `muralhas`: (a) rodar
  # a suíte antes da muralha consertaria este caso e deixaria a garantia
  # dependendo de uma ORDEM que ninguém enxerga no diff; (b) o `muralhas` é
  # required check no conjunto de regras da `main` — tirar a suíte de dentro
  # dele enfraqueceria o único caminho que o botão do site respeita. Aqui as
  # duas medições coexistem porque são medições DIFERENTES.
  #
  # CUSTO, medido no run 33315506488: o job `muralhas` leva 71 s (59 s só de
  # suíte) e o `painel-no-navegador`, em paralelo, 49 s. Este espelho roda em
  # paralelo com os dois e fica na mesma faixa — o relógio do PR não muda.
  #
  # O QUE O ESPELHO ESPELHA DESDE 05/09/2026 (alavanca 2 das alavancas de 10x
  # da fábrica, liberada pelo mantenedor): SÓ a guarda de segredos, repo-wide,
  # num checkout cru. A suíte `ci/tests/` saiu daqui e do `alarme-main` no
  # mesmo PR: ela rodava quatro vezes por PR sobre o mesmo conteúdo, e a `main`
  # tem política estrita, então o que o alarme media depois do merge era o que
  # o job `muralhas` acima já tinha medido. O espelho continua sendo a cópia
  # passo a passo do job `guardas-do-repositorio` do alarme, e
  # `ci/tests/test_espelho_do_alarme_em_pr.py` continua comparando os dois.
  # ===========================================================================
  espelho-da-main:
    name: espelho-da-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências dos portões
        run: python -m pip install --quiet pytest pytest-xdist pyyaml
      - name: Muralha repo-wide — guarda de segredos (INV-P8)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/guarda-de-segredos.sh ]; then
            echo "❌ ERROR: ci/guarda-de-segredos.sh não existe."
            echo "   Portão ausente não é portão satisfeito. [INV-CI01]"
            exit 2
          fi
          # O script já separa os três estados: 0 OK · 1 segredo achado (FAIL) ·
          # 2 `git grep` não conseguiu varrer (ERROR). `set -e` propaga o exit
          # tal e qual, para o log distinguir "achei" de "não consegui olhar".
          bash ci/guarda-de-segredos.sh

  # ===========================================================================
  # O PAINEL NUM NAVEGADOR DE VERDADE.
  #
  # Job SEPARADO, e de propósito: ele instala um Chromium e leva minutos, então
  # não pode pendurar o `muralhas`, que é rápido e roda em todo PR. Correndo em
  # paralelo, os dois fecham juntos — e `ci/mergear.py` avalia TODOS os checks
  # do rollup, não uma lista fixa, então este aqui bloqueia o merge do mesmo
  # jeito. (O botão de merge do site não é caminho para ninguém — CLAUDE.md.)
  #
  # POR QUE UM NAVEGADOR, e não mais um teste em Python: o test client do Django
  # NÃO executa JavaScript. Desde 27/08/2026 o painel busca o histórico por mês
  # injetando a tag de script em tempo de execução — algo que nasce e morre
  # dentro do navegador. O guarda que protege "abrir o painel não cresce com o
  # livro" era CEGO justamente para a regressão que ele existe para impedir.
  #
  # Provado que morde, em 28/08/2026: com a página voltando a carregar todos os
  # meses ao abrir, este job devolve exit 1 com 18 casos vermelhos, nomeando o
  # arquivo que não deveria ter sido buscado. Nenhum outro guarda do repositório
  # o via.
  # ===========================================================================
  painel-no-navegador:
    name: painel-no-navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Versão PINADA, como toda dependência desta casa (`armadilhas/071`):
      # quatro versões da mesma biblioteca para o mesmo padrão são quatro
      # comportamentos a depurar. `--no-save` porque o repositório não tem
      # package.json e não vai ganhar um por causa de um teste.
      - name: Instalar o navegador
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: O painel num navegador de verdade (orçamento de amplificação)
        run: node e2e/painel_no_navegador.js

  # ===========================================================================
  # A MESMA SUÍTE, NO SISTEMA ONDE OS ROBÔS REALMENTE RODAM.
  #
  # O BURACO: até 04/09/2026 os 33 jobs deste repositório rodavam em
  # `ubuntu-latest`, e nenhum outro. Mas os robôs desta casa trabalham na
  # máquina Windows do mantenedor. Toda diferença entre os dois sistemas era,
  # por construção, invisível para a CI — e diferença de codepage não grita:
  # ela devolve `False` numa comparação de texto e segue em frente.
  #
  # MEDIDO, e é o motivo deste job existir. A remedição do ERROR do portão de
  # pouso (`ci/esperar.py`) foi construída em 03/09/2026 porque dois PRs do
  # mesmo lote, #954 e #956, morreram sem ela. No Windows ela nasceu INERTE: o
  # `python` filho escreve "assíncrona" em cp1252, o pai lê utf-8, o `í` chega
  # como U+FFFD e a frase que decidia remedir nunca casava. Dois testes de
  # `ci/tests/test_espera.py` reprovavam aqui desde o primeiro dia, verdes na
  # CI o tempo todo. A cura só chegou porque um humano rodou a suíte na mão.
  #
  # E não foi surpresa: a `armadilhas/138` escreveu esta previsão, com todas as
  # letras, em 27/08/2026 — "o required check `muralhas` roda em ubuntu-latest,
  # não Windows" — e nada foi construído. É a terceira reincidência da mesma
  # classe (`armadilhas/003`, 138, 328). Catálogo cura o caso; só mecanismo
  # cura a classe (RETROSPECTIVA-FASE-D §2).
  #
  # POR QUE UM JOB, e não `strategy.matrix` no `muralhas`: matriz tornaria o
  # required check dependente de duas máquinas, e uma indisponibilidade de
  # runner Windows passaria a travar TODO merge da casa. Como job separado ele
  # bloqueia o pouso do mesmo jeito — `ci/mergear.py` avalia todos os checks do
  # rollup, não uma lista fixa — sem virar ponto único de parada.
  #
  # CUSTO EM DINHEIRO: zero (repositório público, runner padrão do GitHub).
  #
  # CUSTO EM RELÓGIO: este job É o relógio do PR, e a primeira versão deste
  # comentário afirmava o contrário. Medido no run 33913502340, minutos depois
  # de ele entrar: os outros três jobs fecharam em 2min15s e este levou 9min11s,
  # empurrando a espera do PR de 1min36s (mediana de 44 casos) para 14min17s.
  # Rodar em paralelo não ajuda quando o paralelo é mais lento que o serial
  # inteiro — o relógio de um PR é o job mais demorado, não a soma.
  #
  # E o conserto NÃO foi cortar a proteção. A suíte gastava o tempo dela ABRINDO
  # OUTROS PROGRAMAS (119 fronteiras de subprocesso; os doze testes mais lentos
  # levam de 10 a 24 s cada um só nisso), e criar processo no Windows custa
  # perto de dez vezes o que custa no Linux. Rodando em paralelo (`-n auto`,
  # ligado em `ci/ci.py::_em_paralelo`), AQUI, neste runner (run 33917004520):
  #
  #     este job, em série ....... 9min11s   (suíte: 8min50s)
  #     este job, em paralelo .... 4min53s   (suíte: 4min26s)
  #     espera do PR inteiro ..... 14min17s → 5min12s
  #
  # A medição na máquina do mantenedor dá 8min55s → 3min31s com 4 processos; o
  # runner do GitHub tem núcleo mais lento e entrega 4min26s. Os dois números
  # estão aqui de propósito: a primeira versão deste bloco trazia só o da
  # máquina local, rotulado "= este runner", e errava por quase um minuto. Este
  # PR inteiro nasceu de uma frase que dizia mais do que tinha sido medido; não
  # custava repetir o erro em letra menor.
  #
  # Antes de escolher entre proteger e ser rápido, meça: quase sempre não é um
  # trade-off, é uma fila indiana (`armadilhas/332`). O mesmo `-n auto` acelera
  # os jobs Linux (`muralhas` caiu de 2min15s para 1min20s) e a suíte local de
  # todo agente, que caiu de 9 para 3 minutos.
  #
  # Ele NÃO substitui reproduzir o perigo em teste: quem consegue transformar
  # "só quebra no Windows" em uma linha de fita (como
  # `test_a_remedicao_sobrevive_ao_portao_que_escreve_em_cp1252` faz, mandando
  # o dublê escrever cp1252) deve fazê-lo — isso pega o defeito em 9 segundos
  # no Linux, não em 12 minutos aqui. Este job é a rede para o que ninguém
  # pensou em reproduzir.
  # ===========================================================================
  windows-a-maquina-dos-robos:
    name: windows-a-maquina-dos-robos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências dos portões
        run: python -m pip install --quiet pytest pytest-xdist pyyaml
      # SEM forçar codepage nem `PYTHONUTF8` aqui: o console cru é exatamente a
      # condição que se quer medir. Quem precisa de UTF-8 pede em código, na
      # porta da casa (`_nucleo.configurar_saida`) — e é essa garantia que este
      # job existe para exercitar de verdade, num sistema de verdade.
      - name: Testar o testador (na codepage do Windows)
        run: python ci/ci.py --apenas testador
