# =============================================================================
# AS MURALHAS — rodam em TODO PR. Required check na branch protection de main.
# =============================================================================
name: muralhas
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  muralhas:
    name: muralhas
    runs-on: ubuntu-latest
    env:
      BASE_REF: origin/${{ github.base_ref }}
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cerca de célula (1 PR = 1 célula; contrato só com rito)
        run: bash ci/cerca-de-celula.sh
      - name: Orçamento de mudança (>15 arquivos exige label 'arquitetural')
        run: bash ci/orcamento-de-mudanca.sh
      - name: Guarda de segredos (INV-P8 — APP_USR- e chaves privadas)
        run: bash ci/guarda-de-segredos.sh
      # [INV-CI01] Testar o testador: a suíte adversarial prova que o freeze de
      # contrato REPROVA quando deve — inclusive quando a ferramenta de medição
      # é quebrada de propósito. Sem isto, um portão poderia voltar a ficar
      # verde por não conseguir medir, exatamente como já aconteceu.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências dos portões
        run: python -m pip install --quiet pytest pyyaml
      - name: Testar o testador (suíte adversarial dos portões)
        run: python ci/ci.py --apenas testador
