name: autoridade-das-fontes
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: autoridade-das-fontes-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  analisar:
    runs-on: ubuntu-latest
    outputs:
      estado: ${{ steps.prova.outputs.estado }}
      revisao_necessaria: ${{ steps.prova.outputs.revisao_necessaria }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: prova
        name: Conferir HEAD, fontes e recibo com a implementação da base
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_MANDATE_SHA256: ${{ vars.AUTH_MANDATE_SHA256 }}
        run: >-
          python -I base/ci/autoridade_das_fontes.py analisar
          --pr ${{ github.event.pull_request.number }}
          --head ${{ github.event.pull_request.head.sha }}
          --candidato candidate
  mandato:
    needs: analisar
    if: needs.analisar.outputs.estado == 'PASS' && needs.analisar.outputs.revisao_necessaria == 'true'
    runs-on: ubuntu-latest
    environment: mandato-protegido
    steps:
      - run: echo 'Mandato nominal conferido; ambiente protegido liberado para esta revisão.'
  emitir:
    needs: [analisar, mandato]
    if: always()
    runs-on: ubuntu-latest
    environment: autoridade-app
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Emitir check do App no SHA do PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          ESTADO_ANALISE: ${{ needs.analisar.outputs.estado }}
          REVISAO_NECESSARIA: ${{ needs.analisar.outputs.revisao_necessaria }}
          RESULTADO_ANALISE: ${{ needs.analisar.result }}
          REVISAO_PROTEGIDA: ${{ needs.mandato.result }}
        run: >-
          python -I base/ci/autoridade_das_fontes.py emitir
          --pr ${{ github.event.pull_request.number }}
          --head ${{ github.event.pull_request.head.sha }}
