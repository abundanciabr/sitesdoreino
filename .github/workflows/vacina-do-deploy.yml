# =============================================================================
# A VACINA DO DEPLOY, COM GATILHO — TAR-029 (30/08/2026)
#
# O PROBLEMA, medido três vezes em dois dias por robôs diferentes: o
# `deploy-celula` e o `deploy-infra` dividem o grupo de concorrência `deploy`,
# que guarda UM único run pendente. Quando dois merges chegam perto, o pendente
# anterior é EXPULSO e termina `cancelled`. O merge fica na `main` sem estar em
# produção — e `cancelled` não é `failure`: o `alarme-main` não dispara, nada
# fica vermelho, nenhuma issue nasce. O deploy some em silêncio.
#
# E não é azar: TODO PR deste projeto carrega um registro obrigatório em
# `painel/registros/`, que casa o `paths:` do `deploy-celula`. Ou seja, todo PR
# de infraestrutura dispara os DOIS deploys, e eles brigam pela mesma vaga.
# Quanto mais robôs em paralelo, mais vezes por dia.
#
# O QUE JÁ EXISTIA E NÃO BASTAVA: `ci/rerun_de_deploy.py` sabe decidir o caso
# desde a TAR-017 — mede a ancestralidade e diz se repetir avança ou seria
# rollback. Mas era um COMANDO, e alguém precisava notar o cinza no histórico e
# rodá-lo. Classe 2 da RETROSPECTIVA-FASE-D (garantia sem mecanismo): a cura
# existia, escrita e testada; o gatilho não. Este arquivo é o gatilho.
#
# -----------------------------------------------------------------------------
# POR QUE `workflow_run`, E NÃO UM RELÓGIO
#
# A pergunta é "este run terminou cancelado?", e o Actions já a responde no
# instante exato. Um `schedule` teria de varrer o histórico atrás de cinzas, e
# ainda erraria a janela: entre a varredura e o cancelamento, a `main` anda.
# `workflow_run` custa zero minuto enquanto nada é cancelado.
#
# Limite conhecido e declarado: um workflow `workflow_run` só dispara a partir
# da definição que está no ramo PADRÃO. Ou seja, este arquivo não faz efeito
# nenhum enquanto vive num ramo de trabalho — a primeira prova real dele só
# existe depois do merge. É por isso que a decisão inteira é provada sem rede em
# `ci/tests/test_rerun_de_deploy.py` e a fiação, aqui, em
# `ci/tests/test_vacina_do_deploy_automatica.py`.
#
# -----------------------------------------------------------------------------
# GRUPO DE CONCORRÊNCIA PRÓPRIO — e este é o ponto mais fácil de errar
#
# Este workflow NÃO pode entrar no grupo `deploy`. Ele é exatamente o caso da
# `armadilhas/173`: um workflow que não mexe no `docker compose` da VPS, posto
# na fila mais disputada do projeto, é expulso da vaga de pendente e morre em
# `cancelled` sem uma linha de log. A vacina contra o cancelamento morrendo de
# cancelamento seria a piada que a 173 já contou uma vez.
#
# A chave é o ID DO RUN doente: duas curas do MESMO run se enfileiram (nunca se
# atropelam), e curas de runs diferentes correm em paralelo, porque não disputam
# recurso nenhum — quem disputa a VPS é o deploy que elas repetem, e esse já tem
# a fila dele.
#
# -----------------------------------------------------------------------------
# ESTE JOB TERMINA VERDE MESMO QUANDO NÃO CURA — de propósito (armadilhas/180)
#
# `ci/portao_de_deploy.py::vermelhos_nao_previstos` barra o deploy se qualquer
# workflow fora da lista `conhecidos` estiver vermelho NAQUELE SHA. Este
# workflow roda no mesmo SHA do deploy que ele tenta curar: se ficasse vermelho
# ao não conseguir curar, ele trancaria a porta por dentro — o rerun que ele
# mesmo pediu seria barrado pelo seu próprio vermelho. Por isso:
#
#   1. o passo captura o código de saída em vez de deixá-lo derrubar o job; e
#   2. o workflow está DECLARADO em `conhecidos` (e fora de `exigidos`) em
#      `ci/portao_de_deploy.py`, com o par de testes que a 180 exige.
#
# Quem grita quando não há cura é a ISSUE — o mesmo desenho do `alarme-main`,
# reusado e não reinventado. Ficar vermelho aqui não avisaria ninguém melhor:
# só somaria um bloqueio.
#
# -----------------------------------------------------------------------------
# POR QUE A ISSUE NÃO NASCE EM TODO CANCELAMENTO
#
# Porque o cancelamento CURADO não precisa de ninguém. Uma issue por cadeira
# musical, num repositório que recebe da ordem de 100 entregas por dia, é o
# alarme que se aprende a ignorar — e aí ele deixa de servir para o caso em que
# importa (é o argumento que o próprio `alarme-main` escreve sobre as muralhas
# de diff). O sinal aqui é fiel ao que o mantenedor precisa saber:
#
#   vacina saiu 0  → ou já estava no ar, ou o rerun subiu. Ninguém precisa vir.
#   vacina saiu 1  → PAROU por regra (divergiu ⇒ repetir seria rollback; ou a
#                    regra de parada estourou). Só mão humana resolve. ISSUE.
#   vacina saiu 2  → NÃO CONSEGUIU MEDIR. "Não medi" nunca vira "deu certo"
#                    (INV-CI01), e ninguém mais vai olhar. ISSUE.
#
# -----------------------------------------------------------------------------
# DOIS TOKENS, EM ESCADA — E POR QUE UM SÓ NÃO BASTAVA (TAR-051, 02/09/2026)
#
# A preferência pelo `PISTA_TOKEN` nasceu de um cuidado legítimo: um rerun
# pedido pelo `GITHUB_TOKEN` cai perto da regra que o `pouso.yml` documenta
# ("events triggered by the GITHUB_TOKEN will not create a new workflow run"),
# e se o rerun não gerasse o `workflow_run` seguinte a segunda volta da cura
# não aconteceria, em silêncio.
#
# O cuidado estava certo e a escolha estava errada, porque o `PISTA_TOKEN` é o
# único dos dois tokens que NÃO PODE redisparar run — e isso já estava medido e
# escrito no `pouso.yml` desde 29/08/2026, com a mesma mensagem crua:
# *"permissão `actions: write` no token, que a `PISTA_TOKEN` não tem"*. Em
# 30/08/2026, às 23:20, a vacina decidiu certo e não teve braço:
#
#     run 33341511607 cannot be rerun;
#     Resource not accessible by personal access token
#
# O `Actions: write` abaixo estava concedido o tempo todo (o `Set up job`
# daquele run o imprime). Quem anulou a permissão certa foi o `||`: o PAT
# SOMBREAVA o `github.token`, que era o único capaz.
#
# Desde a TAR-051 os dois viajam. `ci/rerun_de_deploy.py::pedir_o_rerun` tenta
# o principal e, se for recusado, DESCE para o do próprio job, dizendo no log
# qual caiu. Se os dois falharem, o desfecho é o de sempre: ERROR e issue —
# degradar calado é o que esta casa não faz. A medição dos três casos e o
# motivo de ser uma escada, e não uma troca seca, estão no comentário de
# `pedir_o_rerun`.
# =============================================================================
name: vacina-do-deploy
on:
  workflow_run:
    workflows: [deploy-celula, deploy-infra]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: vacina-do-deploy-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  curar:
    name: cuidar do deploy que não chegou ao ar
    # ---------------------------------------------------------------------
    # AS DUAS CONCLUSÕES DOENTES — e por que a segunda entrou (TAR-041)
    #
    # Até 30/08/2026 esta linha dizia `cancelled` e só ele, com a justificativa
    # escrita ao lado: *"`failure` na `main` já tem dono — o agente que mergeou,
    # avisado pelo vermelho"*. Ela caiu na medição do próprio dia:
    #
    #   · 14 dos 41 deploys vermelhos dos últimos 30 dias morreram no timeout da
    #     porta 22 (`armadilhas/127`), 13 deles nos últimos 7 — e TRÊS num único
    #     dia (PRs #610, #622 e #635). É a régua que a 127 declara: dois
    #     episódios em 24h ainda são blip, três viram estrutura.
    #   · A escada de 3 tentativas DENTRO do deploy quase não salva: das 18
    #     vezes em que a VPS recusou a 1ª conexão, 17 chegaram à 3ª e as 17
    #     morreram. A janela ruim dura mais que os 105 s de pausa do workflow.
    #   · O `gh run rerun --failed` curou em todas. Ou seja: o "dono" existia, e
    #     o trabalho dele era apertar um botão que uma máquina pode apertar.
    #
    # `success` continua fora: não tem doença. `main` porque é a única linha que
    # vai para produção.
    #
    # O QUE PROTEGE O `failure` DE VIRAR ESTRAGO: a vacina não repete nada sem
    # atravessar o portão da `armadilhas/188` — só repete se o que está
    # publicado for ancestral do SHA daquele run (repetir só AVANÇA), PARA se as
    # linhas divergiram (seria rollback silencioso), recusa disparo que não seja
    # `push`, e conta as tentativas pelo `attempt` do run, que sobrevive ao fim
    # do processo (`armadilhas/220`). Guardas em `ci/tests/test_rerun_de_deploy.py`.
    # ---------------------------------------------------------------------
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write   # `gh run rerun` — é a cura inteira
      issues: write    # o sinal, quando não há cura
    steps:
      # `fetch-depth: 0` NÃO é exagero: a decisão inteira é
      # `git merge-base --is-ancestor` entre o que está publicado e o SHA deste
      # run. Num clone raso o Git responde 128 ("não consegui medir"), a vacina
      # devolve ERROR e a cura vira uma issue inútil (armadilhas/159).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # O MAPA DAS CÉLULAS É YAML (TAR-210). Desde a `armadilhas/359` a vacina
      # pergunta a `celulas.yml` quais células o push doente precisava publicar,
      # e sem o leitor essa medição não conclui — o que é fail-closed e correto
      # (ERROR, issue), mas seria uma issue por cancelamento, todo dia, sobre um
      # `pip install` que falta. É a mesma linha que o `deploy-celula` já tem
      # antes do job `detectar`, pela mesma razão.
      - name: Leitor do mapa das células
        run: python -m pip install --quiet pyyaml
      - name: A vacina decide e, se for o caso, repete
        id: vacina
        env:
          GH_TOKEN: ${{ secrets.PISTA_TOKEN || github.token }}
          # O SEGUNDO BRAÇO (TAR-051). Quando o principal é o PAT, este é o
          # único dos dois que consegue `gh run rerun` — e sem ele a vacina
          # decide certo e não alcança nada. Quando não há PAT, os dois são o
          # mesmo valor e `bracos_do_rerun` descarta o repetido, em vez de
          # tentar duas vezes a mesma coisa e chamar isso de plano B.
          GH_TOKEN_RESERVA: ${{ github.token }}
          RUN_DOENTE: ${{ github.event.workflow_run.id }}
          ESTEIRA: ${{ github.event.workflow_run.name }}
          # A PERGUNTA, e não o segredo: interpolar `secrets.PISTA_TOKEN` dentro
          # da linha de comando para testá-lo poria a chave no `argv` do
          # processo. O booleano responde a mesma coisa sem carregar nada.
          TEM_PISTA: ${{ secrets.PISTA_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEM_PISTA" = "true" ]; then
            echo "Há PISTA_TOKEN: ele é o primeiro braço, e o github.token"
            echo "fica de reserva — o PAT não pôde redisparar run em 30/08."
          else
            echo "AVISO: sem PISTA_TOKEN — pedindo o rerun com o token padrão."
            echo "Se a segunda volta da cura não acontecer, é aqui que se olha."
          fi
          echo "Esteira doente: $ESTEIRA · run: $RUN_DOENTE"
          # O CÓDIGO DE SAÍDA DA VACINA É O VEREDITO (0 PASS · 1 FAIL · 2 ERROR),
          # não um acidente — e ele precisa chegar inteiro ao passo seguinte, que
          # decide se abre a issue.
          #
          # `|| CODIGO=$?` CAPTURA a falha; `set +e` e `|| true` a ESCONDERIAM, e
          # os dois são proibidos aqui por
          # `ci/tests/test_contract_freeze.py::test_workflows_nao_escondem_erro`
          # (o bypass do `ci-celula` nasceu de um `|| true` dentro de um YAML).
          # A diferença não é de estilo: com `||` a falha vira um valor que
          # alguém lê; sem ele, vira silêncio.
          #
          # Sem pipe, também de propósito: `vacina | tee` faria o `$?` ser o do
          # `tee`, que sai 0 sempre (ARMADILHAS §5.10 / armadilhas/045). A saída
          # vai para arquivo e é impressa na linha seguinte — o log do run
          # continua mostrando tudo, e o `-e` não derruba o passo, porque a falha
          # está tratada.
          CODIGO=0
          python ci/rerun_de_deploy.py --run "$RUN_DOENTE" \
            > saida-da-vacina.txt 2>&1 || CODIGO=$?
          cat saida-da-vacina.txt
          # A VACINA ESCREVE `acao`, `codigo` e `alarmar` NELA MESMA, direto no
          # `$GITHUB_OUTPUT` (TAR-041) — o mesmo canal que `ci/sonda_da_vps.py`
          # já usa. Esta linha continua existindo como REDE: se o script morrer
          # antes de escrever (um `kill`, um estouro do runner), o passo
          # seguinte ainda enxerga um código, e ele é o do processo.
          if ! grep -q '^codigo=' "$GITHUB_OUTPUT"; then
            echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
            echo "alarmar=$([ "$CODIGO" -eq 0 ] && echo false || echo true)" \
              >> "$GITHUB_OUTPUT"
            echo "(a vacina não escreveu a saída dela — usando o código do processo)"
          fi
          echo "--- a vacina saiu com $CODIGO ---"
          if [ "$CODIGO" -eq 0 ]; then
            echo "Nada a alarmar: ou o commit já estava no ar, ou o rerun subiu."
          fi
      # ---------------------------------------------------------------------
      # O SINAL — mesmo desenho do `alarme-main`: uma issue por vez, com label,
      # e comentário nela se já estiver aberta. Reusar em vez de inventar um
      # segundo mecanismo de alarme foi pedido nominalmente pelo despacho.
      #
      # A CONDIÇÃO É `alarmar`, NÃO `codigo != 0` (TAR-041). Elas eram a mesma
      # coisa enquanto o gatilho só via cancelamento: todo cancelado não-curado
      # é um merge invisível fora do ar. Com o `failure` no gatilho deixam de
      # ser — 27 dos 41 deploys vermelhos dos últimos 30 dias são defeito de
      # código, que já está VERMELHO, já tem dono e já acorda o `alarme-main`.
      # Uma issue por cada um afogaria as 14 que interessam, e um alarme que se
      # aprende a ignorar deixa de servir justamente no caso em que importa —
      # é o argumento que este mesmo arquivo já escreve sobre não gritar em
      # todo cancelamento.
      #
      # Quem responde "isto precisa acordar alguém?" é a TABELA DE DECISÃO
      # (`Decisao.precisa_de_alarme`), onde o motivo mora ao lado do desfecho, e
      # não uma condição de YAML que ninguém consegue testar. O padrão dela é
      # ALARMAR: ramo novo nasce barulhento, e o silêncio se escreve à mão.
      # ---------------------------------------------------------------------
      - name: Abrir (ou atualizar) a issue de deploy fora do ar
        if: steps.vacina.outputs.alarmar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DOENTE: ${{ github.event.workflow_run.id }}
          ESTEIRA: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TITULO_DO_MERGE: ${{ github.event.workflow_run.display_title }}
          URL_DOENTE: ${{ github.event.workflow_run.html_url }}
          URL_DESTA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODIGO: ${{ steps.vacina.outputs.codigo }}
          CONCLUSAO: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          SAIDA="$(head -c 3000 saida-da-vacina.txt 2>/dev/null || echo '(a vacina não deixou saída)')"
          # A DOENÇA TEM DUAS CARAS DESDE A TAR-041, e a issue precisa dizer QUAL.
          # Chamar de "cancelado" um run que RODOU e morreu no SSH mandaria quem
          # abrisse a issue procurar a cadeira musical em vez do timeout de rede.
          if [ "$CONCLUSAO" = "cancelled" ]; then
            MANCHETE="Um deploy foi CANCELADO e a vacina não conseguiu curá-lo sozinha."
            ROTULO_DO_RUN="run cancelado"
            PORQUE="Isto acontece porque \`deploy-celula\` e \`deploy-infra\` dividem uma única
          vaga de espera (\`concurrency: deploy\`): quando dois merges chegam perto,
          o que estava esperando é expulso (\`armadilhas/173\`, \`/183\`, \`/188\`)."
          else
            MANCHETE="Um deploy FALHOU e a vacina não conseguiu curá-lo sozinha."
            ROTULO_DO_RUN="run vermelho"
            PORQUE="A causa mais comum aqui é o timeout da porta 22 (\`armadilhas/127\`): a
          rede entre o runner do GitHub e a VPS engasga, o deploy não consegue abrir
          a conexão e morre — com a VPS viva o tempo todo. Se a vacina não curou, a
          saída dela abaixo diz por quê, e é sempre uma destas duas: ou repetir faria
          voltar uma versão mais velha, ou faltou uma medição para decidir."
          fi
          CORPO="$(cat <<EOF
          🟠 **$MANCHETE**

          - esteira: \`$ESTEIRA\`
          - $ROTULO_DO_RUN: $URL_DOENTE
          - commit: \`$SHA\` — $TITULO_DO_MERGE
          - tentativa de cura: $URL_DESTA (a vacina saiu **$CODIGO**)

          ## O que isto significa, em português

          O merge está na \`main\` e **não está em produção**. Ninguém ficou fora do
          ar: o site segue servindo a versão anterior. Mas o que aquele merge
          entregou não chegou ao site, e não vai chegar sozinho.

          $PORQUE

          ## Por que a cura automática parou

          \`\`\`
          $SAIDA
          \`\`\`

          Os dois motivos possíveis, e os dois são de propósito:

          - **PAROU (saída 1)** — repetir aquele run publicaria um mundo mais VELHO
            que o que está no ar (rollback silencioso), ou a regra de parada de três
            tentativas estourou. Nos dois casos, insistir seria pior que parar.
          - **NÃO MEDI (saída 2)** — faltou uma medição para decidir, e "não medi"
            nunca vira "pode repetir" ([INV-CI01]).

          ## O que fazer

          1. Diagnóstico, sem mexer em nada:
             \`python ci/rerun_de_deploy.py --run $RUN_DOENTE --so-diagnosticar\`
          2. Leia a \`armadilhas/188\` — ela ensina as três medidas (o que está
             publicado é ancestral? o que fica de fora? algum desses commits tem
             deploy próprio?).
          3. Se a medida disser que republicar só avança, \`gh run rerun $RUN_DOENTE\`.
             Se disser que divergiu, o caminho é um merge NOVO que toque os mesmos
             \`paths:\` — nunca um rerun de um commit mais velho.

          Feche esta issue quando o que aquele merge entregou estiver no ar.
          EOF
          )"

          EXISTENTE="$(gh issue list --label deploy-fora-do-ar --state open \
            --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTENTE" ]; then
            echo "Issue #$EXISTENTE já aberta — comentando nela."
            gh issue comment "$EXISTENTE" --body "$CORPO"
          else
            # `|| true` aqui seria a preguiça que o INV-CI01 combate: esconderia
            # "não consegui criar a label" junto com "ela já existe".
            if ! gh label list --json name --jq '.[].name' | grep -qx deploy-fora-do-ar; then
              gh label create deploy-fora-do-ar \
                --description "Um merge está na main e não chegou à produção" \
                --color d93f0b
            fi
            gh issue create \
              --title "deploy fora do ar: $ESTEIRA ${CONCLUSAO} em ${SHA:0:8}" \
              --label deploy-fora-do-ar \
              --body "$CORPO"
          fi
  # =========================================================================
  # A MEDIÇÃO — Fase 6 do laço de melhoria contínua.
  #
  # O gatilho terminal lá em cima já era o certo, e não precisou mudar: o
  # `workflow_run`/`completed` responde no instante em que o deploy acaba e é a
  # única fonte que enxerga a casa inteira. O que faltava era um SEGUNDO
  # consumidor dele.
  #
  # POR QUE É UM JOB À PARTE, E NÃO UM PASSO DA CURA
  #
  # Porque as duas perguntas discordam justamente no verde. A cura só acorda no
  # `cancelled` e no `failure`, e aquele `if:` não pode ser afrouxado: abri-lo
  # para o `success` acordaria a vacina em cada um dos ~100 deploys saudáveis
  # do dia para responder "nada a fazer". A medição precisa do contrário — é o
  # VERDE que FECHA a janela de indisponibilidade de uma célula. Um termômetro
  # que só visse doença mediria o começo de toda queda e o fim de nenhuma, o
  # que é pior que não medir, porque parece medido.
  #
  # POR QUE NÃO TEM `needs`
  #
  # `needs: curar` faria a medição esperar um job que, no caso mais comum (o
  # deploy verde), nem roda — e um job cujo `needs` não roda é PULADO. Ou seja,
  # o `needs` apagaria exatamente a conclusão que esta medição existe para ver.
  # No sentido inverso vale o mesmo: a cura não pode passar a depender da
  # medição, senão o rerun de um deploy fora do ar ficaria atrás de um
  # relatório. São irmãos, não uma fila.
  #
  # POR QUE NÃO PODE REPROVAR (`continue-on-error: true`)
  #
  # A medição roda no MESMO `head_sha` do deploy que ela mede. Vermelha, ela
  # cairia em `ci/portao_de_deploy.py::vermelhos_nao_previstos` e passaria a
  # barrar deploys por defeito do instrumento — o termômetro teria voto sobre o
  # que ele observa. O que o `continue-on-error` tira é o VOTO, não a VOZ: o
  # passo termina em `exit "$CODIGO"` e o resumo diz o número, porque um job
  # que não pode reprovar e também não conta que falhou é falso-verde puro
  # (`armadilhas/211`): ninguém descobriria que a casa parou de ser medida.
  #
  # O QUE NÃO MORA AQUI: classificar o run (reconhecido, ambíguo, desconhecido)
  # e DECIDIR abrir tarefa. Um `grep` de log em YAML seria uma segunda regra
  # sobre a mesma pergunta, sem teste sem rede, e é o instrumento mais rápido
  # para confundir "não casei" com "não há problema". Guardas em
  # `ci/tests/test_vacina_do_deploy_automatica.py`.
  #
  # O QUE MORA AQUI, e é coisa diferente: LEVAR ao PR dela a tarefa que o
  # instrumento já criou. Decidir e materializar são dois verbos, e só o
  # segundo precisa de um runner com git, com ramo e com token.
  # =========================================================================
  medir:
    name: medir esta conclusão de deploy
    # SEM `if:`, de propósito. `types: [completed]` já entrega as três
    # conclusões terminais (`success`, `failure`, `cancelled`), e qualquer
    # condição aqui só poderia SUBTRAIR uma delas — a primeira a se perder
    # seria o `success`, que é o que fecha a janela.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      # A medição LÊ o run e ESCREVE só a tarefa que nasceu dele: `contents`
      # empurra o ramo próprio (a `main` continua protegida, então esta escrita
      # não alcança linha publicada) e `pull-requests` abre o único PR dela.
      # `issues` fica fora de propósito: alarme aqui seria um por deploy.
      contents: write
      pull-requests: write
      actions: read   # ler runs, jobs e logs do deploy que está sendo medido
    steps:
      # `fetch-depth: 0` pela mesma razão da cura (`armadilhas/159`): fechar a
      # janela de uma célula é perguntar ao Git se o deploy verde CARREGA o
      # commit que caiu, e num clone raso `git merge-base --is-ancestor`
      # responde 128, que é "não consegui medir".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: O termômetro lê este run e diz o código dele
        id: termometro
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TERMINAL: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          # A BASE DA MEDIÇÃO tem de existir como ref antes de medir: o
          # termômetro fixa `origin/main` num SHA e lê o catálogo DELE, nunca
          # da árvore de trabalho (INV-R01). O `checkout` traz a ref do evento,
          # e depender de ela por acaso ser `origin/main` deixaria a medição
          # inteira nas mãos de um detalhe do runner.
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main
          # `|| CODIGO=$?` CAPTURA; `set +e`, `|| true` e `| tee` ESCONDERIAM
          # (os dois primeiros são proibidos em YAML por
          # `test_contract_freeze.py::test_workflows_nao_escondem_erro`, e o
          # terceiro faria o `$?` ser o do `tee`, que sai 0 sempre).
          CODIGO=0
          python ci/termometro.py --run "$RUN_TERMINAL" \
            > medicao.txt 2>&1 || CODIGO=$?
          cat medicao.txt
          {
            echo "### Termômetro do run $RUN_TERMINAL"
            echo ""
            echo '```'
            head -c 3000 medicao.txt
            echo '```'
            echo ""
            echo "O termômetro saiu **$CODIGO**."
          } >> "$GITHUB_STEP_SUMMARY"
          # O código é DITO. O `continue-on-error` do job impede que ele
          # alcance o veredito do deploy; sem esta linha, ele não alcançaria
          # ninguém.
          exit "$CODIGO"
      # ---------------------------------------------------------------------
      # A MATERIALIZAÇÃO, que é a outra metade do gatilho (seção 11 do
      # relatório do laço).
      #
      # O instrumento cria a tarefa no disco de um runner efêmero. Sem este
      # passo, o arquivo que nasceu em `fila/` vive alguns minutos e some com a
      # máquina: a medição ficaria escrita num log que ninguém abre, e a tarefa
      # continuaria dependendo de alguém lembrar de criá-la. É a Classe 2 da
      # retrospectiva (garantia sem mecanismo) um andar acima, e é exatamente o
      # defeito que este arquivo inteiro existe para fechar.
      #
      # O GESTO É O DA CASA, e não um atalho: ramo próprio, commit só do que
      # nasceu, UM PR, e a integração de sempre decidindo. Escrever direto na
      # `main` seria uma medição publicando sem ninguém medir a medição.
      #
      # POR QUE O PR NÃO NASCE DUAS VEZES. A primeira trava é a origem, no
      # balcão da fila, onde ela tem teste sem rede. A segunda é o ramo, aqui:
      # entre medir e abrir o PR existe uma janela em que dois runs podem estar
      # de pé (dois deploys vermelhos seguidos da mesma célula), e o balcão
      # protege o arquivo, não o PR.
      #
      # O TOKEN É O DO PRÓPRIO JOB, com o limite dito em voz alta: um PR aberto
      # por ele não acorda os checks sozinho, então quem integra pode precisar
      # acordar a esteira. Trocar por um PAT daria a uma medição um alcance
      # maior que o da cura ao lado, e isso pede decisão do dono, não deste job.
      # ---------------------------------------------------------------------
      - name: A tarefa que nasceu desta medição vai para o PR dela
        id: materializar
        env:
          GH_TOKEN: ${{ github.token }}
          URL_DESTA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # A LINHA DECLARADA é o contrato inteiro entre os dois lados: ela
          # existe quando, e somente quando, uma tarefa nasceu. Ler o código de
          # saída no lugar dela confundiria "medi e não havia nada" com "medi e
          # abri tarefa", que são desfechos opostos com o mesmo 0.
          NASCIDA="$(sed -n 's/^TAREFA: //p' medicao.txt)"
          if [ -z "$NASCIDA" ]; then
            echo "Nenhuma tarefa nasceu desta medição: nada a levar a PR."
            exit 0
          fi
          NUMERO="${NASCIDA%% *}"
          RAMO="agent/ci/$NUMERO"
          # `--state all`, e não `--state open`: um PR já fechado ou já mergeado
          # também responde "esta tarefa já teve o PR dela". Procurar só entre
          # os abertos abriria o segundo no dia seguinte ao merge do primeiro.
          JA="$(gh pr list --state all --head "$RAMO" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$JA" ]; then
            echo "$NUMERO já tem o PR #$JA no ramo $RAMO. Um por tarefa."
            exit 0
          fi
          git config user.name "pista de pouso"
          git config user.email "pista@sitesdoreino.invalid"
          git switch -c "$RAMO"
          # `fila/` E NADA MAIS. O workspace de um runner tem sujeira por
          # natureza (o relatório desta medição, o que uma ação deixou para
          # trás), e o portão do livro isenta este PR justamente por ele só
          # escriturar: um arquivo surpresa transformaria a isenção estreita
          # num buraco.
          git add fila/
          git commit -m "tarefa: $NUMERO, nascida da medição de um deploy"
          git push origin "$RAMO"
          CORPO="$(cat <<EOF
          **Uma tarefa nasceu da medição de um deploy, e este é o PR dela.**

          - tarefa: \`$NUMERO\`
          - medição que a criou: $URL_DESTA

          ## O que este PR muda

          Só o que nasceu em \`fila/\`: o arquivo da tarefa e a escrituração
          dela. Nenhum outro caminho do repositório foi tocado e nada foi
          publicado.

          ## De onde ela veio

          O termômetro leu o run terminal deste deploy, mediu a reincidência
          campeã e abriu uma tarefa só. A tarefa é idempotente pela origem e o
          ramo é idempotente pelo número: um segundo deploy sobre o mesmo fato
          não gera outra tarefa nem outro PR.

          ## O que fazer

          Leia a tarefa como leria qualquer outra da fila. Se ela estiver certa,
          o pouso é o de sempre. Se estiver errada, feche este PR: a medição que
          a criou continua no log acima, e é lá que se descobre por quê.
          EOF
          )"
          gh pr create \
            --base main --head "$RAMO" \
            --title "tarefa: $NUMERO, nascida da medição de um deploy" \
            --body "$CORPO"
