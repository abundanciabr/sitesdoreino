# =============================================================================
# SONDA PIX PÚBLICA: o Pix de meshcraft.top está vivo? (TAR-803)
#
# Roda e2e/sonda_pix_publica.js num runner de fora, como um comprador: cria UM
# pedido Pix sintético, sem pagar, e confere o QR e o código copiável. Serve
# para medir antes e depois de cada mudança do cartão Appmax (canário, drill
# de rollback); o log do run, com o JSON sanitizado, é a evidência pública.
#
# Só por disparo manual: cada execução cria um pedido pendente real em
# produção, então relógio e gatilho de PR estão fora de propósito. Sem
# segredo: a sonda usa só a página pública. Grupo próprio sem cancelamento,
# para duas execuções nunca correrem juntas nem uma sumir em silêncio.
# =============================================================================
name: sonda-pix-publica
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonda-pix-publica
  cancel-in-progress: false
jobs:
  sonda:
    name: pedir um Pix como comprador e conferir o QR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar o navegador
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Sonda Pix pública
        run: node e2e/sonda_pix_publica.js
