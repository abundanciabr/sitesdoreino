# =============================================================================
# SEMEAR EXPERIMENTO: liga (iniciar-aa), desliga (encerrar) ou mede (medir) o
# A/A técnico da página de oferta de meshcraft.top, pelo pipeline, sem
# navegador e sem o mantenedor.
#
# POR QUE ELE EXISTE
# ------------------
# O ensaio do sistema de experimentos precisa de um A/A ativo no espaço
# `cubo.headline` da oferta, e até aqui só a tela logada da área administrativa
# criava e iniciava um experimento. O mantenedor decidiu em 27/09/2026 que o
# robô faz isso sozinho. O script roda `manage.py semear_experimento` no
# contêiner `admin`, que usa as mesmas funções, recusas e auditoria das telas.
#
# UM SITE SÓ, SEM INPUT DE HOST: a área administrativa só tem rota em
# meshcraft.top (`infra/traefik/dynamic/plataforma.yml`) e basileiatoutheou.org
# está congelado (`docs/decisoes/DECISAO-foco-em-meshcraft.md`).
#
# POR QUE workflow_dispatch É SEGURO AQUI
# ----------------------------------------
# Não ENTREGA código: roda um script versionado que só sabe fazer três coisas,
# todas idempotentes (medir só lê), e que só toca o experimento com a
# assinatura do A/A.
# Outro experimento ativo na página faz o comando parar sem mexer em nada.
#
# O INPUT VIAJA POR `envs:`, NUNCA COSTURADO NO CORPO DO SCRIPT:
# `${{ inputs.* }}` dentro de `script:` é substituição de texto feita antes de o
# shell existir, ou seja, injeção de comando na VPS.
#
# GRUPO PRÓPRIO: no grupo de outro workflow, o próximo disparo
# cancelaria o pendente antes de ele começar.
#
# NÃO toca env, não escreve segredo, não reinicia serviço, não faz deploy.
# =============================================================================
name: semear-experimento
on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'iniciar-aa liga o A/A da oferta de meshcraft.top; encerrar desliga só o A/A, com a decisão encerrar; medir lê a contagem por braço, sem mudar nada.'
        required: true
        type: choice
        options:
          - iniciar-aa
          - encerrar
          - medir
permissions:
  contents: read
concurrency:
  group: semear-experimento
  cancel-in-progress: false
jobs:
  semear:
    name: ligar, desligar ou medir o A/A da oferta
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # a ssh-action com `script_path` apontando para arquivo
      # inexistente AVISA e IGNORA, saindo com sucesso.
      - name: Conferir que o script existe antes de abrir conexao
        run: |
          set -euo pipefail
          if [ ! -f infra/semear-experimento.sh ]; then
            echo "::error::PAROU POR SEGURANCA: infra/semear-experimento.sh nao existe neste commit."
            exit 1
          fi
          bash -n infra/semear-experimento.sh
          echo "script presente e sintaticamente valido"

      - name: Ligar, desligar ou medir na VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          # Chave pública ECDSA da VPS já confiada no known_hosts do mantenedor (25/09/2026).
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ACAO_EXPERIMENTO
          command_timeout: 5m
          script_path: infra/semear-experimento.sh
        env:
          ACAO_EXPERIMENTO: ${{ inputs.acao }}
