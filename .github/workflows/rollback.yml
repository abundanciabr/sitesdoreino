name: rollback
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Recuperar célula ou selecionar a última publicação
        type: choice
        options: [recuperar, recuperar-auto]
        default: recuperar
      celula:
        description: Célula (vazio no modo recuperar-auto)
        required: false
        type: string
      motivo:
        description: Motivo da recuperação
        required: true
        type: string
  workflow_call:
    inputs:
      modo:
        type: string
        default: recuperar
      celula:
        type: string
        default: ''
      motivo:
        type: string
        required: true
    secrets:
      VPS_HOST:
        required: true
      DEPLOY_SSH_KEY:
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      celula: ${{ steps.v.outputs.celula }}
      modo: ${{ steps.v.outputs.modo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: v
        env:
          ROLLBACK_CELULA: ${{ inputs.celula }}
          ROLLBACK_MODO: ${{ inputs.modo }}
          ROLLBACK_MOTIVO: ${{ inputs.motivo }}
        run: python ci/rollback.py validar-celula
  aplicar:
    needs: validar
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Consultar publicações comprovadas na VPS
        id: estado
        uses: appleboy/ssh-action@v1
        env:
          CELULA: ${{ needs.validar.outputs.celula }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          envs: CELULA
          capture_stdout: true
          script: |
            set -eu
            cd /opt/plataforma
            python3 - <<'PY'
            import glob, json, os
            from pathlib import Path
            celula = os.environ.get('CELULA', '')
            caminhos = [f'publicacoes/{celula}.json'] if celula else sorted(glob.glob('publicacoes/*.json'))
            caminhos = [p for p in caminhos if Path(p).name not in {'imagens.json', 'recuperacao-terminal.json'}]
            try:
                publicacoes = [json.loads(Path(p).read_text()) for p in caminhos if Path(p).is_file()]
            except (OSError, ValueError):
                publicacoes = None
            print(json.dumps({'publicacoes': publicacoes, 'recuperacao_global': Path('publicacoes/recuperacao-terminal.json').exists()}))
            PY
      - name: Escolher uma única versão aprovada compatível
        id: alvo
        env:
          ROLLBACK_CELULA: ${{ needs.validar.outputs.celula }}
          ROLLBACK_MODO: ${{ needs.validar.outputs.modo }}
          ROLLBACK_MOTIVO: ${{ inputs.motivo }}
          REVERSAO_ESTADO_PUBLICACAO: ${{ steps.estado.outputs.stdout }}
        run: python ci/rollback.py
      - name: Encerrar tentativa quando a seleção não encontrou destino
        if: ${{ failure() && steps.alvo.outcome == 'failure' && steps.alvo.outputs.celula != '' && steps.alvo.outputs.atual != '' }}
        uses: appleboy/ssh-action@v1
        env:
          CELULA: ${{ steps.alvo.outputs.celula }}
          ATUAL_ESPERADA: ${{ steps.alvo.outputs.atual }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          envs: CELULA,ATUAL_ESPERADA
          script: |
            set -eu
            cd /opt/plataforma
            exec 8<.publicacao.lock
            flock --exclusive 8
            python3 publicacao-local.py encerrar-recuperacao
      - name: Encerrar tentativa automática sem célula identificável
        if: ${{ failure() && steps.alvo.outcome == 'failure' && inputs.modo == 'recuperar-auto' && steps.alvo.outputs.celula == '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          script: |
            set -eu
            cd /opt/plataforma
            exec 8<.publicacao.lock
            flock --exclusive 8
            CELULA='' python3 publicacao-local.py encerrar-recuperacao
      - name: Aplicar recuperação e repetir a prova
        id: recuperar
        uses: appleboy/ssh-action@v1
        env:
          CELULA: ${{ steps.alvo.outputs.celula }}
          VAR_TAG: ${{ steps.alvo.outputs.var_tag }}
          TAG: ${{ steps.alvo.outputs.tag }}
          ATUAL_ESPERADA: ${{ steps.alvo.outputs.atual }}
          COMPATIBILIDADE_DADOS: ${{ steps.alvo.outputs.dados }}
          COMPATIBILIDADE_CONFIGURACAO: ${{ steps.alvo.outputs.configuracao }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:1sXVo53i+wBlaaYi8x5gQizOdg5Ig3emJ4b06gQjEOQ
          envs: CELULA,VAR_TAG,TAG,ATUAL_ESPERADA,COMPATIBILIDADE_DADOS,COMPATIBILIDADE_CONFIGURACAO
          capture_stdout: true
          script_path: infra/reverter-celula-na-vps.sh
      - name: Conferir conclusão da recuperação
        env:
          SAIDA: ${{ steps.recuperar.outputs.stdout }}
          CELULA: ${{ steps.alvo.outputs.celula }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -eu
          printf '%s\n' "$SAIDA" | grep -Fx "REVERSAO-CONCLUIDA: $CELULA -> $TAG"
      - name: Informar falha terminal
        if: failure()
        run: |
          echo '::error::Recuperação interrompida. Consulte journal publicacoes/CELULA.json, alvo, compatibilidade e saída da prova. Nenhuma segunda tentativa ou restauração do banco será executada automaticamente.'
