<style>
  :root{--j-ink:#18203a;--j-muted:#52617a;--j-paper:#f5f7fc;--j-line:#dae0ed;--j-brand:#6040be;--j-tint:#f0eaff}
  body{background:var(--j-paper);color:var(--j-ink)} main{max-width:70rem;padding:2.5rem 1.5rem 5rem} .faixa{background:white}
  .j-topo{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:2rem}.j-topo a{color:var(--j-brand)}
  .j-hero{padding:clamp(1.5rem,4vw,3.5rem);border:1px solid var(--j-line);border-radius:1.5rem;background:linear-gradient(115deg,#fff 30%,#eee7ff);margin-bottom:2rem}
  .j-kicker{font-size:.78rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--j-brand)} .j-hero h1{font-size:clamp(2rem,5vw,3.3rem);max-width:19ch;line-height:1.1;letter-spacing:-.045em;margin:1rem 0 1.25rem}.j-hero p{max-width:45rem}.j-lead{font-size:1.15rem;color:var(--j-muted)}
  .j-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:1rem;margin:1.5rem 0}.j-card{border:1px solid var(--j-line);border-radius:1rem;background:white;padding:1.4rem;min-width:0}.j-card h2,.j-card h3{margin:.6rem 0;font-size:1.25rem;line-height:1.3}.j-card p{color:var(--j-muted)}.j-card img{width:100%;height:11rem;object-fit:contain;border-radius:.7rem;background:#f4f3fa}.j-number{font-size:.85rem;font-weight:700;color:var(--j-brand)}
  .j-btn,button.j-btn{display:inline-block;cursor:pointer;text-decoration:none;font:inherit;font-weight:650;line-height:1.4;padding:.8rem 1.2rem;border:1px solid var(--j-brand);border-radius:.65rem;background:var(--j-brand);color:white}.j-btn.secundario{background:white;color:var(--j-brand)} .j-actions{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin:1.5rem 0}.j-actions form{margin:0}
  .j-note{padding:1rem 1.25rem;border-radius:.8rem;background:#e9f5ef;color:#174a38;margin:1rem 0}.j-muted{color:var(--j-muted)}.j-section{margin:2.5rem 0}.j-section>h2{font-size:1.65rem;letter-spacing:-.02em}.j-form{max-width:48rem}.j-form label{display:block;font-weight:650;margin:1rem 0 .4rem}.j-form input:not([type]),.j-form input[type=text],.j-form input[type=url],.j-form input[type=email],.j-form input[type=number],.j-form textarea,.j-form select{box-sizing:border-box;width:100%;font:inherit;color:var(--j-ink);background:white;border:1px solid #abb6ca;border-radius:.55rem;padding:.8rem}.j-form textarea{min-height:6rem;resize:vertical}.j-form fieldset{border:0;padding:0;margin:1.25rem 0}.j-form legend{font-weight:700;margin-bottom:.5rem}.j-choice{display:flex!important;align-items:flex-start;gap:.7rem;padding:1rem;background:white;border:1px solid var(--j-line);border-radius:.7rem;cursor:pointer;margin:.5rem 0!important;font-weight:500!important}.j-choice input{margin-top:.4rem;accent-color:var(--j-brand)}.j-choice:has(input:checked){border-color:var(--j-brand);background:var(--j-tint)}.j-choice small{display:block;color:var(--j-muted);font-weight:400}.j-path{display:flex;gap:.8rem;flex-wrap:wrap;padding:0;list-style:none;color:var(--j-muted);font-size:.9rem}.j-path li+li::before{content:'→';margin-right:.8rem}.j-definition dt{font-weight:650;margin-top:.8rem}.j-definition dd{margin:.2rem 0 1rem;color:var(--j-muted);white-space:pre-line}.j-feedback{border-left:3px solid #5d9d82;padding:1rem 1.5rem;background:white;margin:1rem 0}.j-feedback h3{margin:0 0 .6rem}.j-preview{padding:1.5rem;background:white;border:1px solid var(--j-line);border-radius:1rem}.j-form details{margin:1rem 0}.j-form summary{cursor:pointer;font-weight:650}.j-alert{padding:1rem;border:1px solid #b74747;background:#fff0ef;border-radius:.6rem;color:#77332a}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b47b00;outline-offset:3px}
  @media(prefers-color-scheme:dark){:root{--j-ink:#edf0ff;--j-muted:#b6c0d4;--j-paper:#151824;--j-line:#363e54;--j-brand:#b6a0fa;--j-tint:#342851}.j-hero{background:linear-gradient(115deg,#202536,#30254a)}.j-card,.faixa,.j-preview,.j-feedback,.j-choice,.j-form input:not([type]),.j-form input[type=text],.j-form input[type=url],.j-form input[type=email],.j-form input[type=number],.j-form textarea,.j-form select{background:#202536}.j-btn,button.j-btn{color:#17122b}.j-btn.secundario{background:#202536}.j-note{background:#17372e;color:#bce4d2}}
</style>
