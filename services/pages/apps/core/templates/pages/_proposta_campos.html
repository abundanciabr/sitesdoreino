{% for chave, rotulo, valor in campos_proposta %}<p><label for="proposta-{{ chave }}">{{ rotulo }}</label>{% if chave == 'titulo' %}<input type="text" id="proposta-{{ chave }}" name="{{ chave }}" maxlength="200" value="{{ valor }}" placeholder="Dê um nome ao seu projeto" required>{% else %}<textarea id="proposta-{{ chave }}" name="{{ chave }}" maxlength="3000" rows="2">{{ valor }}</textarea>{% endif %}</p>{% endfor %}
