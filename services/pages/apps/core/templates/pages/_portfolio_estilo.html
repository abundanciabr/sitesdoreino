<style>
.pp{--pp-ink:#102b27;--pp-soft:#606d6a;--pp-line:#dfe5df;--pp-green:#075c45;color:var(--pp-ink);background:#fafbf8;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
.pp *{box-sizing:border-box}.pp a{color:inherit}.pp a:focus-visible{outline:3px solid #bd7736;outline-offset:3px}.pp-wrap{width:min(100% - 3rem,1240px);margin-inline:auto}.pp-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
