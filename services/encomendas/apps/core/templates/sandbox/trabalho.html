{% extends 'sandbox/base.html' %}{% load sandbox_moeda sandbox_texto tz %}{% block title %}{{ trabalho.termos.titulo }}{% endblock %}{% block body %}{% include "sandbox/trabalho_conteudo.html" %}<script>
const entradaArquivo=document.getElementById('arquivo');if(entradaArquivo){entradaArquivo.addEventListener('change',()=>{const permitidos=entradaArquivo.accept.split(',');const nome=entradaArquivo.files[0]?.name.toLowerCase()||'';entradaArquivo.setCustomValidity(nome&&!permitidos.some(ext=>nome.endsWith(ext))?'Envie .glb ou .blend para o modelo e PNG, JPG ou WebP para as imagens do briefing.':'');});}
setInterval(async()=>{if(document.hidden)return;try{const response=await fetch(location.pathname,{credentials:'same-origin'});if(!response.ok)return;const doc=new DOMParser().parseFromString(await response.text(),'text/html');const timer=document.getElementById('tempo-restante'),freshTimer=doc.getElementById('tempo-restante');if(timer&&freshTimer){timer.dataset.estado=freshTimer.dataset.estado;timer.dataset.situacaoAnalise=freshTimer.dataset.situacaoAnalise;}for(const selector of ['[data-analise]','#falas-pratica','#historico-conversa','#respostas-pratica']){for(const node of document.querySelectorAll(selector)){const fresh=selector==='[data-analise]'?doc.querySelector('[data-analise="'+node.dataset.analise+'"]'):doc.querySelector(selector);if(fresh){const opened=[...node.querySelectorAll('details')].map(d=>d.open);node.innerHTML=fresh.innerHTML;[...node.querySelectorAll('details')].forEach((d,i)=>d.open=opened[i]||false);}}}}catch(e){}},15000);

(()=>{const timer=document.getElementById('tempo-restante'),deadline=Date.parse(timer.dataset.prazo),offset=Date.parse(timer.dataset.agora)-Date.now();
function tick(){if(timer.dataset.estado==='entregue'||timer.dataset.estado==='aprovado'){timer.textContent=timer.dataset.situacaoAnalise;return;}const seconds=Math.max(0,Math.floor((deadline-Date.now()-offset)/1000));if(seconds===0){timer.textContent='Prazo encerrado · seu trabalho e arquivos continuam disponíveis';return;}const days=Math.floor(seconds/86400),hours=Math.floor(seconds%86400/3600),minutes=Math.floor(seconds%3600/60),sec=seconds%60;timer.textContent=(days?days+'d ':'')+[hours,minutes,sec].map(n=>String(n).padStart(2,'0')).join(':')+' restantes';}tick();setInterval(tick,1000);
const form=document.getElementById('entrega-form');if(!form)return;const dialog=document.getElementById('confirmar-entrega');let confirmed=false;
form.addEventListener('submit',event=>{if(confirmed)return;event.preventDefault();const files=[...form.querySelectorAll('input[name="arquivos"]:checked')];if(!files.length){let message=document.getElementById('erro-entrega');if(!message){message=document.createElement('p');message.id='erro-entrega';message.setAttribute('role','alert');form.append(message);}message.textContent='Guarde ao menos um arquivo acima e selecione-o para entregar.';return;}const list=document.getElementById('arquivos-entrega');list.replaceChildren();files.forEach(file=>{const item=document.createElement('li');item.textContent=file.closest('label').textContent.trim();list.append(item);});dialog.showModal();});
document.getElementById('voltar-entrega').addEventListener('click',()=>dialog.close());document.getElementById('enviar-confirmado').addEventListener('click',()=>{confirmed=true;dialog.close();form.requestSubmit();document.getElementById('enviar-confirmado').disabled=true;});
})();
</script>{% endblock %}
