{% load sandbox_moeda catalogo_visual %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Escolha seu próximo projeto · Meshcraft Academy</title>{% include 'sandbox/_guia_style.html' %}<link rel="stylesheet" href="/cursos/static/cursos/suporte.css?v=20261014-publico24h2">
</head><body>
<header class="guided-header"><a class="brand" href="{% url 'sandbox_catalogo' %}">meshcraft <small>ACADEMY</small></a><p class="header-motto">Prática hoje.<br>Grandes mundos amanhã.</p><div class="header-scene" aria-hidden="true"></div></header>
<main class="guided-main">{% include "sandbox/catalogo_conteudo.html" %}</main>
<script>
(()=>{const tiles=[...document.querySelectorAll('[data-projeto]')],panels=[...document.querySelectorAll('[data-summary]')],select=document.getElementById('reference-project'),figures=[...document.querySelectorAll('[data-reference-project]')];
function references(slug){select.value=slug;figures.forEach(f=>f.hidden=Boolean(slug&&f.dataset.referenceProject!==slug));}
function choose(slug){tiles.forEach(t=>{const active=t.dataset.projeto===slug;t.classList.toggle('selected',active);t.querySelector('.choose-project').setAttribute('aria-pressed',String(active));});panels.forEach(p=>p.hidden=p.dataset.summary!==slug);references(slug);}
document.querySelectorAll('[data-escolher]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.escolher)));
document.querySelectorAll('[data-brief]').forEach(b=>b.addEventListener('click',()=>{choose(b.dataset.brief);document.getElementById('brief-'+b.dataset.brief).showModal();}));
document.querySelectorAll('.dialog-close').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('[data-confirmar]').forEach(b=>b.addEventListener('click',()=>{choose(b.dataset.confirmar);b.closest('dialog').close();document.querySelector('.selection-dock').scrollIntoView({behavior:'smooth',block:'nearest'});}));
document.querySelectorAll('[data-referencia]').forEach(a=>a.addEventListener('click',()=>{choose(a.dataset.referencia);a.closest('dialog').close();document.getElementById('exemplos').open=true;}));
select.addEventListener('change',()=>references(select.value));document.querySelectorAll('a[href="#exemplos"]').forEach(a=>a.addEventListener('click',()=>document.getElementById('exemplos').open=true));
})();
</script>
<script defer src="/cursos/static/cursos/suporte.js?v=20261014-publico24h2" data-curso="" data-aula=""></script>
</body></html>
