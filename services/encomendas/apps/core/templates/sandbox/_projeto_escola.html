{% load sandbox_moeda %}
<section class="card"><details><summary>{{ projeto.titulo }} {% if not projeto.ativo %}· Oculto{% elif projeto.recompensa == None %}· Configuração da escola{% else %}· Condições configuradas{% endif %}</summary><form method="post" action="{% url 'sandbox_salvar_projeto' projeto.pk %}">{% csrf_token %}<label>Título<input name="titulo" value="{{ projeto.titulo }}" required maxlength="200"></label><label>Identificador<input name="slug" value="{{ projeto.slug }}" required maxlength="100"></label><label>Categoria<select name="categoria" required>{% for chave, nome in categorias %}<option value="{{ chave }}" {% if projeto.categoria == chave %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select></label><label>Briefing<textarea name="briefing">{{ projeto.briefing }}</textarea></label><label>Referências · uma por linha<textarea name="referencias">{% for item in projeto.referencias %}{{ item }}{% if not forloop.last %}
{% endif %}{% endfor %}</textarea></label><label>Entregáveis · um por linha<textarea name="entregaveis">{% for item in projeto.entregaveis %}{{ item }}{% if not forloop.last %}
{% endif %}{% endfor %}</textarea></label><label>Critérios de aprovação<textarea name="criterios">{{ projeto.criterios }}</textarea></label><div class="fields"><label>Prazo em dias<input type="number" min="0" name="prazo_dias" value="{{ projeto.prazo_dias|default_if_none:'' }}"></label><label>Ajustes previstos<input type="number" min="0" name="ajustes_previstos" value="{{ projeto.ajustes_previstos|default_if_none:'' }}"></label><label>Recompensa em Meshcoins<input type="number" min="0" step="0.01" name="recompensa" value="{{ projeto.recompensa|default_if_none:'' }}"></label></div><label><input type="checkbox" name="ativo" value="sim" {% if projeto.ativo %}checked{% endif %}> Projeto visível</label><div class="actions"><button>Salvar projeto</button></div></form></details></section>
