{% extends 'fila_real_base.html' %}{% block title %}{{ pedido.titulo }}{% endblock %}{% block body %}{% include "fila_real_trabalho_conteudo.html" %}<script>(()=>{const el=document.getElementById('tempo-restante');if(!el)return;const prazo=Date.parse(el.dataset.prazo),offset=Date.parse(el.dataset.agora)-Date.now();function tick(){if(['entregue','aprovado'].includes(el.dataset.estado)){el.textContent=el.dataset.estado==='aprovado'?'Trabalho aprovado':'Entrega enviada · aguardando cliente';return}if(!Number.isFinite(prazo)){el.textContent='Prazo ainda não iniciado';return}const total=Math.max(0,Math.floor((prazo-Date.now()-offset)/1000));if(!total){el.textContent='Prazo encerrado';return}const h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;el.textContent=[h,m,s].map(n=>String(n).padStart(2,'0')).join(':')+' restantes'}tick();setInterval(tick,1000)})();</script>{% endblock %}
