<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{% block title %}Fila do Dólar{% endblock %} · Meshcraft Academy</title>{% include 'sandbox/_guia_style.html' %}<style>.real-card{background:#fff;border:1px solid #dce9ee;border-radius:16px;padding:20px;margin:15px 0}.real-card h2{font-size:23px}.real-card p{margin:8px 0;white-space:pre-wrap}.real-form textarea,.real-form input[type=file]{width:100%;font:inherit;padding:10px;border:1px solid #c8d8e0;border-radius:9px;margin:6px 0 12px}.real-form textarea{min-height:105px}.real-form label{display:block;font-weight:700;margin-top:12px}.real-form button{border:0;border-radius:10px;background:#008f91;color:#fff;font-weight:700;padding:11px 18px}.real-message{border-left:4px solid #008f91;padding:9px 15px;margin:10px 0;background:#f5fafb}.real-message p{white-space:pre-wrap}.real-split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:18px}.real-timer{font-size:27px;font-weight:800;color:#087989}.real-small{font-size:13px;color:#526f82}.real-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.real-actions a{display:inline-block;padding:11px 18px}.real-dl{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid #e1ebef;padding:9px 0}.real-warning{background:#fff6dd;padding:13px;border-radius:9px}@media(max-width:800px){.real-split{display:block}}</style></head><body><header class="guided-header"><a class="brand" href="{% url 'fila_real_catalogo' %}">meshcraft <small>ACADEMY</small></a><p class="header-motto">Projetos reais.<br>Grandes mundos amanhã.</p><div class="header-scene" aria-hidden="true"></div></header><main class="guided-main">{% if recado %}<div class="notice" role="status">{{ recado }}</div>{% endif %}{% block body %}{% endblock %}</main></body></html>
