{% extends 'fila_real_base.html' %}{% load catalogo_visual %}{% block title %}Escolha seu próximo trabalho{% endblock %}{% block body %}{% include "fila_real_catalogo_conteudo.html" %}<script>(()=>{const tiles=[...document.querySelectorAll('[data-pedido]')],panels=[...document.querySelectorAll('[data-summary]')];function choose(id){tiles.forEach(t=>{const active=t.dataset.pedido===id;t.classList.toggle('selected',active);t.querySelector('.choose-project').setAttribute('aria-pressed',String(active))});panels.forEach(p=>p.hidden=p.dataset.summary!==id)}document.querySelectorAll('[data-escolher]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.escolher)));document.querySelectorAll('[data-brief]').forEach(b=>b.addEventListener('click',()=>{choose(b.dataset.brief);document.getElementById('brief-'+b.dataset.brief).showModal()}));document.querySelectorAll('[data-brief-curso]').forEach(b=>b.addEventListener('click',()=>document.getElementById('curso-'+b.dataset.briefCurso).showModal()));document.querySelectorAll('.dialog-close').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()))})();</script>{% endblock %}
