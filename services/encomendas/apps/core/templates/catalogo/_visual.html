{% if arte %}<svg class="course-visual" viewBox="{{ arte.janela }}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="{{ titulo }} em low poly"><svg width="{{ arte.recorte_largura }}" height="{{ arte.recorte_altura }}" viewBox="{{ arte.enquadramento }}" overflow="hidden"><image href="{% url 'sandbox_ilustracao' arte.arquivo %}" width="{{ arte.largura }}" height="{{ arte.altura }}" /></svg></svg>{% else %}<span class="course-free" aria-hidden="true">✦</span>{% endif %}
