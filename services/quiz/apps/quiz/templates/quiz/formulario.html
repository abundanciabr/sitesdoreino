<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ quiz.title }}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
  main { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem; }
  fieldset { border: none; padding: 0; margin: 0 0 1.5rem; }
  legend { font-weight: 600; margin-bottom: .5rem; padding: 0; }
  label { display: block; padding: .6rem .8rem; margin-bottom: .4rem; background: #fff;
          border-radius: 8px; border: 1px solid #ddd; }
  input[type="email"], input[type="text"], input[type="tel"] {
    width: 100%; box-sizing: border-box; padding: .6rem .8rem; margin-bottom: .8rem;
    border-radius: 8px; border: 1px solid #ddd;
  }
  button { width: 100%; padding: .8rem; font-size: 1rem; border-radius: 8px; border: none;
           background: #111; color: #fff; }
  .erro { color: #b00020; }
</style>
</head>
<body>
<main>
  <h1>{{ quiz.title }}</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {% for question in questions %}
    <fieldset>
      <legend>{{ question.text }}</legend>
      {% for option in question.options.all %}
      <label>
        <input type="radio" name="pergunta_{{ question.id }}" value="{{ option.id }}" required>
        {{ option.text }}
      </label>
      {% endfor %}
    </fieldset>
    {% endfor %}
    <label>
      E-mail
      <input type="email" name="email" required>
    </label>
    <label>
      Nome
      <input type="text" name="nome">
    </label>
    <label>
      Telefone
      <input type="tel" name="telefone">
    </label>
    <button type="submit">Ver resultado</button>
  </form>
</main>
</body>
</html>
