# =============================================================================
# DEV DA CÉLULA, ISOLADA: só ela e seu banco. O agente sobe ISTO — nunca a
# plataforma inteira. As outras células nem existem aqui.
# =============================================================================
name: dev-celula
services:
  app:
    build: .
    env_file: .env.dev
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on: [db]
    command: sh -c "python manage.py migrate --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev_db
    ports: ["5432:5432"]
