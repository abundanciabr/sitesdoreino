# =============================================================================
# DEV DA CÉLULA, ISOLADA: só ela e seu banco. O agente sobe ISTO — nunca a
# plataforma inteira. As outras células nem existem aqui.
#
# Mesmas duas escolhas fora do molde que a `sugestoes` (ver o LICOES.md dela):
#   - `name: dev-identidade`: o nome do projeto é o namespace dos containers;
#     com o mesmo nome em todas as células, duas sessões paralelas colidem.
#   - `55441` no host: porta pré-atribuída a esta célula, para não brigar com o
#     `55432` da partida rápida do ARMADILHAS §2 nem com o `55440` da Caixa.
# =============================================================================
name: dev-identidade
services:
  app:
    build: .
    env_file: .env.dev
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on: [db]
    command: sh -c "python manage.py migrate --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:17
    container_name: identidade-pg-dev
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: identidade_db
    ports: ["55441:5432"]
