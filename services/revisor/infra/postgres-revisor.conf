# CANDIDATE ONLY. Prepend before existing trust and broad host rules.
# Revalidate reserved relay IP before applying. Preserve all other HBA lines.
# Own DB through the dedicated relay; SCRAM is checked by PostgreSQL itself.
host    revisor       revisor    172.16.2.250/32    scram-sha-256
# Relay must not be a path to other accounts/databases/physical replication.
host    all           all        172.16.2.250/32    reject
host    replication   all        172.16.2.250/32    reject
# Administrative proof can use own DB via TCP loopback with a real password.
host    revisor       revisor    127.0.0.1/32       scram-sha-256
host    revisor       revisor    ::1/128            scram-sha-256
# Never fall through to existing PUBLIC/trust rules for the Revisor account.
local   all           revisor                       reject
local   replication   revisor                       reject
host    all           revisor    0.0.0.0/0          reject
host    all           revisor    ::/0               reject
host    replication   revisor    0.0.0.0/0          reject
host    replication   revisor    ::/0               reject
