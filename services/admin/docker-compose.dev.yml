# =============================================================================
# DEV DA CÉLULA, ISOLADA: só ela e seu banco. O agente sobe ISTO — nunca a
# plataforma inteira. As outras células nem existem aqui.
#
# Duas escolhas herdadas da `sugestoes` (ver LICOES.md dela), e o motivo:
#   - `name: dev-admin` (e não `dev-celula`): o nome do projeto é o namespace
#     dos containers. Com o mesmo nome em todas, duas sessões paralelas
#     colidem no `dev-celula-db-1`.
#   - `55441` no host: porta pré-atribuída a esta célula, para não brigar com o
#     `55432` da partida rápida (`ARMADILHAS.md` §2) nem com o `55440` da
#     `sugestoes`.
# =============================================================================
name: dev-admin
services:
  app:
    build: .
    env_file: .env.dev
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on: [db]
    command: sh -c "python manage.py migrate --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:17
    container_name: admin-pg-dev
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: admin_db
    ports: ["55441:5432"]
