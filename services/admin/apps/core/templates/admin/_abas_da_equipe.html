{% comment %}
As abas do painel da equipe. Moram aqui, e não em cada tela, para que as seis
visões ofereçam sempre as mesmas portas na mesma ordem. `visao` diz qual acende.
{% endcomment %}
<nav class="abas" aria-label="Visões do painel">
  <a class="aba{% if visao == 'minhas' %} ativa{% endif %}" href="{% url 'painel_da_equipe' %}?visao=minhas">Minhas tarefas</a>
  <a class="aba{% if visao == 'equipe' %} ativa{% endif %}" href="{% url 'painel_da_equipe' %}?visao=equipe">Equipe</a>
  <a class="aba{% if visao == 'semana' %} ativa{% endif %}" href="{% url 'semana_da_equipe' %}">Esta semana</a>
  <a class="aba{% if visao == 'objetivos' %} ativa{% endif %}" href="{% url 'objetivos_da_equipe' %}">Objetivos</a>
  <a class="aba{% if visao == 'placar' %} ativa{% endif %}" href="{% url 'placar_da_equipe' %}">Placar</a>
  <a class="aba{% if visao == 'robo' %} ativa{% endif %}" href="{% url 'robo_da_pessoa' %}">Meu robô</a>
  <a class="aba{% if visao == 'avisos' %} ativa{% endif %}" href="{% url 'avisos_da_equipe' %}">Avisos</a>
</nav>
