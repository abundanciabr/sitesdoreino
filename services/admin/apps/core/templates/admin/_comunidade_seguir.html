{% if aluno.sou_eu %}<span class="seguir-eu">Você</span>{% elif aluno.seguir_chave %}<form class="seguir-form" action="/comunidade/seguidores/solicitar" method="post">{% csrf_token %}<input type="hidden" name="alvo" value="{{ aluno.seguir_chave }}"><button class="seguir-botao" type="submit" data-seguir="{{ aluno.seguir_chave }}" {% if aluno.seguir_estado %}disabled{% endif %}>{{ aluno.seguir_rotulo|default:"Seguir" }}</button></form>{% endif %}
