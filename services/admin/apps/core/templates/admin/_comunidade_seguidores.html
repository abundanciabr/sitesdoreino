<section class="seguidores-caixa" aria-labelledby="seguidores-titulo" data-seguidores>
<h2 id="seguidores-titulo">Notificações · seguidores</h2>
<p class="seguidores-resumo" role="status">Consultando solicitações…</p>
<div class="seguidores-itens"></div>
<p class="seguidores-retorno" role="status"></p>
<button class="seguidores-atualizar" type="button">Atualizar notificações</button>
<form hidden class="seguidores-token">{% csrf_token %}</form>
<noscript>Ative o JavaScript para receber e responder às solicitações de seguidores.</noscript>
</section>
