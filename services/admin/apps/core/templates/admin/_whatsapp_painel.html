<style>
.wa-chamar,.cartao button.wa-chamar{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#062e16!important;border:1px solid #25d366;border-radius:8px;padding:10px 14px;font:600 14px/1.3 system-ui;cursor:pointer;margin:8px 0;text-decoration:none}.wa-chamar:hover,.cartao button.wa-chamar:hover{background:#1fbe5b;border-color:#1fbe5b}.wa-chamar:focus-visible,.wa-painel button:focus-visible,.wa-painel a:focus-visible{outline:3px solid #58b5ff;outline-offset:3px}.wa-painel[hidden]{display:none!important}.wa-painel{position:fixed;right:0;top:0;bottom:0;width:410px;z-index:1000;display:flex;flex-direction:column;background:#121c21;color:#e8f1f3;border-left:1px solid #35464d;box-shadow:-8px 0 24px #0003;font:14px/1.5 system-ui;box-sizing:border-box}.wa-painel *{box-sizing:border-box}.wa-painel header{padding:18px;background:#1c3036;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.wa-painel h2{font-size:18px;color:#fff;margin:0}.wa-painel p{margin:4px 0;overflow-wrap:anywhere}.wa-painel button{font:inherit;cursor:pointer;border:1px solid #50636a;border-radius:7px;background:#22383e;color:#e8f1f3;padding:8px 12px}.wa-painel button:disabled{opacity:.5;cursor:default}.wa-painel .wa-fechar{font-size:24px;line-height:1;padding:6px 10px}.wa-acoes{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.wa-painel a{color:#81e2bd}.wa-estado{color:#b4c9ce;font-size:12px}.wa-mensagens{flex:1;min-height:80px;overflow:auto;padding:16px;background:#101b20}.wa-mensagem{max-width:90%;padding:10px 12px;margin:0 0 12px;background:#24363d;border-radius:10px;overflow-wrap:anywhere;white-space:pre-wrap}.wa-mensagem.saida{margin-left:auto;background:#174c40}.wa-mensagem small{display:block;text-align:right;font-size:11px;color:#b4c9ce;margin-top:5px;white-space:normal}.wa-vazio{color:#b4c9ce}.wa-recado{padding:0 16px;color:#ffdc9b;font-size:13px;max-height:120px;overflow:auto}.wa-form{padding:12px 16px 16px;border-top:1px solid #35464d}.wa-form label{display:block;margin:0 0 6px}.wa-form textarea,.wa-form input{display:block;width:100%;border:1px solid #607880;border-radius:8px;padding:10px;background:#1c2c33;color:#fff;font:inherit;resize:vertical}.wa-form textarea{min-height:76px;max-height:160px}.wa-form .wa-enviar{display:block;width:100%;margin-top:10px;background:#187957;border-color:#2c9870;font-weight:600}.wa-form .wa-modelo{font-size:12px;margin-bottom:10px}.wa-form .wa-modelo[hidden],.wa-painel [hidden]{display:none!important}body.wa-aberto{padding-right:410px}body.wa-aberto .envolucro{width:100%;box-sizing:border-box}
@media(max-width:1050px){body.wa-aberto{padding-right:0}.wa-painel{width:min(410px,100vw)}}
@media(min-width:1051px) and (max-width:1550px){body.wa-aberto .leitura{grid-template-columns:minmax(0,1fr)}body.wa-aberto .cabecalho-aluno{flex-wrap:wrap}body.wa-aberto .acoes{flex-wrap:wrap}body.wa-aberto .botoes{white-space:normal}body.wa-aberto .retrato{flex-wrap:wrap}body.wa-aberto .retrato h2{font-size:24px}body.wa-aberto .nota{min-width:140px;padding-left:18px}}
</style>
<aside id="wa-painel" class="wa-painel" aria-labelledby="wa-titulo" hidden>
  <header><div><h2 id="wa-titulo">WhatsApp</h2><p id="wa-nome"></p><p id="wa-telefone" class="wa-estado"></p><p id="wa-estado" class="wa-estado"></p></div><button type="button" class="wa-fechar" aria-label="Fechar conversa">×</button></header>
  <div class="wa-acoes"><button type="button" id="wa-atualizar">Atualizar</button><button type="button" id="wa-devolver" hidden>Devolver ao assistente</button><a id="wa-aplicativo" target="_blank" rel="noopener noreferrer" hidden>Abrir no aplicativo ↗</a></div>
  <div id="wa-mensagens" class="wa-mensagens" role="log" aria-label="Mensagens de WhatsApp" aria-live="polite"></div>
  <p id="wa-recado" class="wa-recado" role="status"></p>
  <form id="wa-form" class="wa-form" method="post">{% csrf_token %}
    <div id="wa-modelo" class="wa-modelo" hidden><p>A conexão exige um modelo aprovado para iniciar ou retomar esta conversa.</p><label for="wa-modelo-nome">Nome do modelo aprovado</label><input id="wa-modelo-nome" name="modelo" maxlength="200"></div>
    <label for="wa-texto">Mensagem</label><textarea id="wa-texto" name="texto" rows="3" maxlength="4000" placeholder="Escreva sua mensagem…" disabled></textarea>
    <button class="wa-enviar" type="submit" disabled>Enviar no WhatsApp</button>
  </form>
</aside>
<script src="{% url 'crm_whatsapp_javascript' %}" defer></script>
