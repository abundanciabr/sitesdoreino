# services/funil/sites_i18n.yaml — registro declarativo INTERIM de idiomas por
# site (PLANO-I18N.md §2 D3). Destino final: infra/sites.json (fase 4, Rito de
# Contrato) — este arquivo se aposenta lá.
#
# REGRAS (o validador da célula reprova o que sair disto — boot e CI):
# - Site AUSENTE deste registro = monolíngue, comportamento de hoje, intocado
#   por construção. NENHUM site real é registrado na fase 1 (a fase 2 registra
#   o meshcraft junto com a página de cadastro).
# - Todo host declarado aqui PRECISA existir em infra/sites.json (teste de
#   coerência no CI — dívida de dois-lugares-declarando só é aceitável vigiada).
# - Código de idioma: minúsculo, BCP 47 com hífen (URL); `tag` é a mesma coisa
#   na caixa canônica (pt-BR) — usada em <html lang>, hreflang e og:locale.
# - `indexavel` controla noindex + exclusão do hreflang (D5). `base` declara
#   variante regional (overlay esparso, máximo 1 nível — D4).
# - `glossario`: termos que NUNCA se traduzem (D8.1) — presença literal
#   conferida em toda tradução.
#
# Exemplo COMENTADO (não registrado — fase 2 traz o real):
#
# sites:
#   meshcraft.top:
#     i18n_mode: prefixed        # único modo: TODO idioma com prefixo na URL (D1)
#     default: en                # recebe o 302 da raiz e o x-default
#     idiomas:
#       en:    { tag: en,    dir: ltr, indexavel: true }
#       pt-br: { tag: pt-BR, dir: ltr, indexavel: true }
#       es:    { tag: es,    dir: ltr, indexavel: false }   # D5: es NASCE noindex
#       # pt-pt: { tag: pt-PT, dir: ltr, indexavel: false, base: pt-br }
#     glossario: [Meshcraft, Roblox, Roblox Studio]

sites: {}
