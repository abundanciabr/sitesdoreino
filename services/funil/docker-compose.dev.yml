# =============================================================================
# DEV DA CÉLULA, ISOLADA. funil é stateless (sem banco) — sem serviço `db`.
# O agente sobe ISTO — nunca a plataforma inteira. As outras células nem existem aqui.
# =============================================================================
name: dev-celula
services:
  app:
    build: .
    env_file: .env.dev
    ports: ["8000:8000"]
    volumes: [".:/app"]
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload

