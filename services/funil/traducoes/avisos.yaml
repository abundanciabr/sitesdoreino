# traducoes/avisos.yaml — `cartaz_*`: tela que pergunta se a pessoa quer receber avisos;
# `js.*`: texto do aviso no celular, injetado no service worker (sem uso em template).

cartaz_titulo:
  _fonte: "8a21be"
  en: "Get school notices on your screen"
  pt-br: "Receba os avisos da escola na sua tela"
  es: "Recibe los avisos de la escuela en tu pantalla"

cartaz_porque:
  # O motivo e o limite: a pessoa pode desligar quando quiser.
  _fonte: "e68746"
  en: "You get a notice when something you asked about is answered. You can turn this off whenever you want."
  pt-br: "Você recebe um aviso quando algo que você pediu for respondido. Dá para desligar quando quiser."
  es: "Recibes un aviso cuando algo que pediste sea respondido. Puedes desactivarlo cuando quieras."

cartaz_botao:
  _fonte: "c0898b"
  en: "Turn notices on"
  pt-br: "Ligar os avisos"
  es: "Activar los avisos"

cartaz_agora_nao:
  _fonte: "a0e63d"
  en: "Not now"
  pt-br: "Agora não"
  es: "Ahora no"

cartaz_ligado:
  # Confirma que deu certo, para a pessoa não apertar o botão de novo.
  _fonte: "1cbc7e"
  en: "Done. The notices will arrive on this device."
  pt-br: "Pronto. Os avisos vão chegar neste aparelho."
  es: "Listo. Los avisos van a llegar a este aparato."

cartaz_nao_deu:
  # Falha honesta: nem promete que vai chegar, nem culpa a pessoa.
  _fonte: "06c69c"
  en: "It did not work now. You can try again later."
  pt-br: "Não deu certo agora. Você pode tentar de novo mais tarde."
  es: "No funcionó ahora. Puedes intentarlo de nuevo más tarde."

cartaz_sem_servico:
  # O navegador não conseguiu registrar o aparelho no serviço de push; ao contrário de
  # `cartaz_nao_deu`, tentar de novo não resolve. A frase não cita navegador pelo nome.
  _fonte: "f9fa85"
  en: "This browser could not turn the notices on. Some browsers block push messages by default. Check its privacy settings and try again."
  pt-br: "Este navegador não conseguiu ligar os avisos. Alguns bloqueiam mensagens push de fábrica. Veja os ajustes de privacidade dele e tente de novo."
  es: "Este navegador no pudo activar los avisos. Algunos bloquean los mensajes push de fábrica. Revisa sus ajustes de privacidad y prueba de nuevo."

cartaz_recusado:
  # O aparelho negou a permissão; o caminho de volta é a configuração dele.
  _fonte: "517d9e"
  en: "Your device blocked the notices. To allow them, change the notification setting for this app on your device."
  pt-br: "Seu aparelho bloqueou os avisos. Para liberar, mude a permissão de notificações deste app nos ajustes do aparelho."
  es: "Tu aparato bloqueó los avisos. Para permitirlos, cambia el permiso de notificaciones de esta app en los ajustes."

# O texto do aviso na tela do celular: um par por assunto, mais o genérico.
js:
  sugestao_titulo:
    _fonte: "00057d"
    en: "Meshcraft"
    pt-br: "Meshcraft"
    es: "Meshcraft"

  sugestao_corpo:
    _fonte: "f8ad9c"
    en: "Your suggestion has an update."
    pt-br: "Sua sugestão teve uma novidade."
    es: "Tu sugerencia tuvo una novedad."

  portfolio_titulo:
    _fonte: "d90526"
    en: "Your portfolio was checked"
    pt-br: "Seu portfólio foi conferido"
    es: "Tu portafolio fue revisado"

  portfolio_corpo:
    _fonte: "7dd010"
    en: "The school checked your portfolio. Open your notices to see when."
    pt-br: "A escola conferiu seu portfólio. Abra os avisos para ver quando."
    es: "La escuela revisó tu portafolio. Abre tus avisos para ver cuándo."

  teste_titulo:
    _fonte: "00057d"
    en: "Meshcraft"
    pt-br: "Meshcraft"
    es: "Meshcraft"

  teste_corpo:
    # Aviso de teste, disparado de /admin/avisos/ para conferir o canal do celular.
    _fonte: "c18735"
    en: "It worked. This is the test you asked for."
    pt-br: "Deu certo. Este é o teste que você pediu."
    es: "Funcionó. Esta es la prueba que pediste."

  generico_titulo:
    _fonte: "00057d"
    en: "Meshcraft"
    pt-br: "Meshcraft"
    es: "Meshcraft"

  generico_corpo:
    _fonte: "ce26a2"
    en: "You have a new notice."
    pt-br: "Você tem um aviso novo."
    es: "Tienes un aviso nuevo."

  # Cartas de celebração da gamificação: sem parâmetros, pois o `sw.js` mostra título
  # e corpo como texto pronto; o número do nível e o nome da medalha ficam no sininho.
  nivel_titulo:
    _fonte: "656c39"
    en: "You moved up a level"
    pt-br: "Você subiu de nível"
    es: "Subiste de nivel"

  nivel_corpo:
    # O número do nível fica para o sininho.
    _fonte: "5a5bee"
    en: "Tap to see the step you reached."
    pt-br: "Toque para ver o degrau que você alcançou."
    es: "Toca para ver el escalón que alcanzaste."

  conquista_titulo:
    _fonte: "40dd6c"
    en: "You earned a medal"
    pt-br: "Você ganhou uma medalha"
    es: "Ganaste una medalla"

  conquista_corpo:
    # O nome da medalha não aparece: o aviso do celular não consulta a `gamificacao`.
    _fonte: "2e8001"
    en: "It is already saved in your profile."
    pt-br: "Ela já está guardada no seu perfil."
    es: "Ya está guardada en tu perfil."

  marco_titulo:
    _fonte: "a9961a"
    en: "Your milestone was accepted"
    pt-br: "Seu marco foi aceito"
    es: "Tu hito fue aceptado"

  marco_corpo:
    # O que a pessoa enviou e quem validou não aparecem no aviso do aparelho.
    _fonte: "c1c224"
    en: "Someone reviewed what you sent, and the milestone is yours."
    pt-br: "Alguém conferiu o que você enviou, e o marco agora é seu."
    es: "Alguien revisó lo que enviaste, y el hito ahora es tuyo."

  destaque_titulo:
    _fonte: "8b9481"
    en: "Your work was featured"
    pt-br: "Sua obra foi destaque"
    es: "Tu obra fue destacada"

  destaque_corpo:
    # "Da semana" é o nome da galeria; a semana exata fica no sininho.
    _fonte: "c5ff7d"
    en: "A teacher picked your work for the gallery of the week."
    pt-br: "Um professor escolheu o seu trabalho para a galeria da semana."
    es: "Un profesor eligió tu trabajo para la galería de la semana."

  jornada_titulo:
    en: "Meshcraft"
    pt-br: "Meshcraft"
    es: "Meshcraft"

  jornada_corpo:
    en: "You have a new message from the school."
    pt-br: "Você tem uma mensagem nova da escola."
    es: "Tienes un mensaje nuevo de la escuela."

  matricula_titulo:
    en: "Meshcraft"
    pt-br: "Meshcraft"
    es: "Meshcraft"

  matricula_corpo:
    en: "Your enrollment has an update."
    pt-br: "Sua matrícula teve uma novidade."
    es: "Tu matrícula tuvo una novedad."

  marketplace_oferta_titulo:
    pt-br: 'Nova encomenda na fila'
    en: 'New order in your queue'
    es: 'Nuevo encargo en tu fila'

  marketplace_oferta_corpo:
    pt-br: 'Confira os termos e responda à oferta.'
    en: 'Review the terms and respond to the offer.'
    es: 'Revisa los términos y responde a la oferta.'

  marketplace_acordo_titulo:
    pt-br: 'Encomenda aceita'
    en: 'Order accepted'
    es: 'Encargo aceptado'

  marketplace_acordo_corpo:
    pt-br: 'O aluno aceitou os termos e começou a produção.'
    en: 'The student accepted the terms and started work.'
    es: 'El alumno aceptó los términos y empezó el trabajo.'

  marketplace_entrega_titulo:
    pt-br: 'Entrega disponível'
    en: 'Delivery available'
    es: 'Entrega disponible'

  marketplace_entrega_corpo:
    pt-br: 'Confira os arquivos da encomenda.'
    en: 'Review the order files.'
    es: 'Revisa los archivos del encargo.'

  marketplace_ajuste_titulo:
    pt-br: 'Ajuste solicitado'
    en: 'Revision requested'
    es: 'Ajuste solicitado'

  marketplace_ajuste_corpo:
    pt-br: 'Confira o comentário do cliente na encomenda.'
    en: 'Review the customer comment on the order.'
    es: 'Revisa el comentario del cliente en el encargo.'

  marketplace_aprovacao_titulo:
    pt-br: 'Entrega aprovada'
    en: 'Delivery approved'
    es: 'Entrega aprobada'

  marketplace_aprovacao_corpo:
    pt-br: 'A aprovação registrou um recebível; confira a situação do repasse.'
    en: 'Approval registered a receivable; check the transfer status.'
    es: 'La aprobación registró un importe por cobrar; revisa el estado de la transferencia.'

  marketplace_pagamento_titulo:
    pt-br: 'Pagamento da encomenda confirmado'
    en: 'Order payment confirmed'
    es: 'Pago del encargo confirmado'

  marketplace_pagamento_corpo:
    pt-br: 'A confirmação da cobrança está registrada na encomenda.'
    en: 'The charge confirmation is recorded on the order.'
    es: 'La confirmación del cobro está registrada en el encargo.'

  marketplace_recebimento_titulo:
    pt-br: 'Repasse registrado'
    en: 'Transfer recorded'
    es: 'Transferencia registrada'

  marketplace_recebimento_corpo:
    pt-br: 'Confira o valor e a referência do repasse na encomenda.'
    en: 'Check the transfer amount and reference on the order.'
    es: 'Revisa el importe y la referencia de la transferencia en el encargo.'

  marketplace_recarga_titulo:
    pt-br: 'Créditos confirmados'
    en: 'Credits confirmed'
    es: 'Créditos confirmados'

  marketplace_recarga_corpo:
    pt-br: 'O provedor confirmou o Pix. Seus créditos estão disponíveis na carteira.'
    en: 'The provider confirmed Pix. Your credits are available in your wallet.'
    es: 'El proveedor confirmó Pix. Tus créditos están disponibles en la cartera.'

  marketplace_recarga_revertida_titulo:
    pt-br: 'Recarga atualizada pelo provedor'
    en: 'Top-up updated by provider'
    es: 'Recarga actualizada por el proveedor'

  marketplace_recarga_revertida_corpo:
    pt-br: 'O provedor informou uma reversão. Confira a situação dos créditos na carteira.'
    en: 'The provider reported a reversal. Check your credit balance in the wallet.'
    es: 'El proveedor informó una reversión. Consulta tus créditos en la cartera.'
