# traducoes/cadastro.yaml — página de cadastro do meshcraft (PLANO-I18N fase 2).
# Formato key-major (D2): todas as línguas da página lado a lado; `_fonte` é
# sha256[:6] do valor `en` no momento da tradução (D4 — anti-obsolescência).
# en é a FONTE; pt-br é tradução FIEL (janela de auditoria do mantenedor — D8.5);
# Meshcraft / Roblox / Roblox Studio nunca se traduzem (glossário, D8.1).

titulo:
  # <title> e og:title da página — inclui a marca (glossário).
  _fonte: "223837"
  en: "Sign up | Meshcraft"
  pt-br: "Cadastro | Meshcraft"
  es: "Registro | Meshcraft"

meta_descricao:
  # meta description e og:description. Escola ensina modelagem 3D/UGC para o
  # Roblox, não criação de jogos (correção do mantenedor em 30/08/2026).
  _fonte: "a69d0d"
  en: "Sign up to learn 3D modeling for Roblox, from scratch to your portfolio."
  pt-br: "Cadastre-se para aprender modelagem 3D para o Roblox, do zero ao portfólio."
  es: "Regístrate para aprender modelado 3D para Roblox, desde cero hasta tu portafolio."

titulo_pagina:
  # <h1> visível da página.
  _fonte: "f1682f"
  en: "Sign up for Meshcraft"
  pt-br: "Cadastre-se no Meshcraft"
  es: "Regístrate en Meshcraft"

subtitulo:
  # Até 30/08/2026 esta página era captura de lead ("acompanhar as
  # novidades"). Decisão do mantenedor em 31/08/2026: uma escola tem aluno ou
  # não tem, então o texto passou a pedir a vaga, não a inscrição num boletim.
  _fonte: "a079b1"
  en: "Request a spot at Meshcraft. Our team reviews every request and replies through WhatsApp."
  pt-br: "Peça sua vaga no Meshcraft. Nossa equipe analisa cada pedido e responde pelo WhatsApp."
  es: "Pide tu lugar en Meshcraft. Nuestro equipo revisa cada solicitud y responde por WhatsApp."

campo_nome:
  _fonte: "dcd1d5"
  en: "Name"
  pt-br: "Nome"
  es: "Nombre"

campo_email:
  _fonte: "2550d9"
  en: "E-mail"
  pt-br: "E-mail"
  es: "Correo electrónico"

campo_whatsapp:
  # WhatsApp é nome de produto, não se traduz (mesmo espírito do glossário).
  # Desde 31/08/2026 o campo é OBRIGATÓRIO (era opcional na versão de
  # captura de lead): sem WhatsApp o mantenedor não tem como avisar a decisão
  # (`POST /pre-matriculas` da célula alunos já recusa sem ele).
  _fonte: "6a40ed"
  en: "WhatsApp"
  pt-br: "WhatsApp"
  es: "WhatsApp"

botao_enviar:
  _fonte: "5e2b8e"
  en: "Sign up"
  pt-br: "Cadastrar"
  es: "Registrarme"

sucesso:
  # Desde 31/08/2026 o pedido vira uma linha na mesma fila "Aguardando
  # aprovação" que o admin gerencia em /admin/escola/alunos/.
  _fonte: "2021cf"
  en: "Done! Your request is awaiting approval. We will reach out on WhatsApp."
  pt-br: "Pronto! Seu pedido está aguardando aprovação. Vamos entrar em contato pelo WhatsApp."
  es: "¡Listo! Tu solicitud está esperando aprobación. Te contactaremos por WhatsApp."

erro_envio:
  # Falha ao repassar o pedido de entrada à célula alunos (a página responde
  # 502 e mantém o que a pessoa digitou — nunca perde o formulário em
  # silêncio).
  _fonte: "a496fc"
  en: "We could not send your request. Try again."
  pt-br: "Não foi possível enviar seu pedido. Tente de novo."
  es: "No pudimos enviar tu solicitud. Inténtalo de nuevo."

erro_ja_matriculado:
  # 409 da alunos: este e-mail já está na fila, já é aluno, ou foi
  # reembolsado (a porta não distingue os três — DECISAO-reembolso-tira-o-
  # acesso.md). Não é erro de envio: o pedido chegou, só que esta pessoa já
  # está na plataforma.
  _fonte: "04a21b"
  en: "This e-mail is already registered with us. If you already have a Google account, sign in instead."
  pt-br: "Este e-mail já está cadastrado com a gente. Se você já tem conta do Google, entre por ela em vez de se cadastrar de novo."
  es: "Este correo ya está registrado con nosotros. Si ya tienes cuenta de Google, inicia sesión en lugar de registrarte de nuevo."

tem_conta_google:
  # Metade 1 do convite reciproco com login.html (login.yaml tem a metade
  # simétrica, "nao_tem_conta_google"): quem chega aqui sem saber que já tem
  # conta do Google não devia duplicar o cadastro.
  _fonte: "4cc13d"
  en: "Already have a Google account?"
  pt-br: "Já tem conta do Google?"
  es: "¿Ya tienes cuenta de Google?"

link_entrar:
  # Texto do link para {% url_i18n 'entrar' %}, ao lado de "tem_conta_google".
  _fonte: "bfd402"
  en: "Sign in"
  pt-br: "Entrar"
  es: "Iniciar sesión"
