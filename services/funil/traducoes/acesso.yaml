  pt-br: Seu cadastro está preservado. O acesso volta quando a equipe religar; não
    precisa enviar outro pedido.
  es: Tu matrícula se conserva. El acceso vuelve cuando el equipo lo reactive; no
    necesitas enviar otra solicitud.
reembolsado:
  _fonte: 42bc32
  en: Your access ended with the refund
  pt-br: Seu acesso terminou com o reembolso
  es: Tu acceso terminó con el reembolso
indisponivel:
