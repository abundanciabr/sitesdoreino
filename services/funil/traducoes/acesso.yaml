  en: We could not check your enrollment now
  pt-br: Não conseguimos conferir sua matrícula agora
  es: No pudimos comprobar tu matrícula ahora
tente_novamente:
  _fonte: 9ffa94
  en: Your enrollment is preserved. Try again shortly; no request was registered on
    this screen.
  pt-br: Sua matrícula está preservada. Tente novamente em instantes; nenhum pedido
    foi registrado nesta tela.
  es: Tu matrícula se conserva. Inténtalo de nuevo en unos momentos; no se registró
    ninguna solicitud en esta pantalla.
trocar:
  _fonte: d55f33
  en: Switch accounts
  pt-br: Entrar com outra conta
  es: Entrar con otra cuenta
sair:
