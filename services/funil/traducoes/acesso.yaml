titulo:
  _fonte: 65240a
  en: Student access
  pt-br: Acesso do aluno
  es: Acceso del alumno
subtitulo:
  _fonte: ca09f7
  en: Sign-in, enrollment and access requests in one place.
  pt-br: Entrada, matrícula e pedidos de acesso em um só lugar.
  es: Entrada, matrícula y solicitudes de acceso en un solo lugar.
conta:
  _fonte: e3f757
  en: 'Your account:'
  pt-br: 'Sua conta:'
  es: 'Tu cuenta:'
recebido:
  _fonte: e3c0f2
  en: We have received your request
  pt-br: Seu pedido já está com a gente
  es: Ya recibimos tu solicitud
espera:
  _fonte: f12573
  en: Our team will check your enrollment. This page updates automatically and takes
    you to the site when access is released. You do not need to request again.
  pt-br: A equipe vai conferir sua matrícula. Esta página se atualiza sozinha e leva
    você para o site assim que o acesso for liberado. Não precisa pedir novamente.
  es: El equipo revisará tu matrícula. Esta página se actualiza sola y te lleva al
    sitio cuando se habilite el acceso. No necesitas volver a solicitarlo.
recusado:
  _fonte: ed533c
  en: Your request was not approved
  pt-br: Seu pedido não foi aprovado
  es: Tu solicitud no fue aprobada
fale_escola:
  _fonte: bd641d
  en: Contact the school if you need help with your enrollment.
  pt-br: Fale com a escola se precisar de ajuda com sua matrícula.
  es: Contacta con la escuela si necesitas ayuda con tu matrícula.
voltar:
  _fonte: 43cb5e
  en: Your student access has ended
  pt-br: Seu acesso de aluno foi encerrado
  es: Tu acceso de alumno ha terminado
sem_matricula:
  _fonte: f58b92
  en: We could not find an enrollment for this account
  pt-br: Não encontramos matrícula para esta conta
  es: No encontramos una matrícula para esta cuenta
explicacao:
  _fonte: efb80f
  en: Already purchased? Send your details below so our team can check and release
    your access. If you used a different account for your purchase, switch accounts
    below.
  pt-br: Já comprou? Preencha seus dados abaixo para a equipe conferir e liberar seu
    acesso. Se usou outra conta na compra, você pode trocar de conta abaixo.
  es: ¿Ya compraste? Completa tus datos para que el equipo los revise y habilite tu
    acceso. Si usaste otra cuenta para comprar, puedes cambiar de cuenta abajo.
corrija:
  _fonte: 22aee7
  en: Check the required name, phone number with area code, and any purchase date
    entered.
  pt-br: Confira o nome, o WhatsApp com DDD e a data da compra, se preenchida.
  es: Revisa el nombre, el teléfono con código de área y la fecha de compra, si la
    indicaste.
falha_envio:
  _fonte: 942e51
  en: We could not confirm your request. Your details are still here; try again shortly.
  pt-br: Não conseguimos confirmar o registro do pedido. Seus dados continuam aqui;
    tente novamente em instantes.
  es: No pudimos confirmar el registro de la solicitud. Tus datos siguen aquí; inténtalo
    de nuevo en unos momentos.
