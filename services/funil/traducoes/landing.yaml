# traducoes/landing.yaml — a HOME do site multilíngue (template
# funil/landing_i18n.html). Formato key-major (D2): todas as línguas da
# página lado a lado; `_fonte` é sha256[:6] do valor `en` no momento da
# tradução (D4 — anti-obsolescência). en é a FONTE; Meshcraft nunca se
# traduz (glossário, D8.1).
#
# REESCRITO em 27/08/2026, por decisão do mantenedor: a raiz do site deixou
# de ser vitrine de oferta e virou porta. Saíram daqui as chaves do preço, do
# "Quero comprar" e do formulário de captura (`preco`, `cta_comprar`,
# `novidades_titulo`, `campo_*`, `sucesso` e a subárvore `js.*` da ilha
# Alpine) — a página que as usava não existe mais nesta forma, e chave
# definida e não usada REPROVA no validador. O formulário de lead continua
# inteiro em `/cadastro`, com catálogo próprio (`cadastro.yaml`).

titulo:
  # Serve ao <title> E ao <h1> da página — a mesma chave nos dois lugares, de
  # propósito: a home é a porta da marca, e duas chaves com o mesmo valor
  # seriam duas coisas para manter em sincronia à mão. Nome protegido pelo
  # glossário (D8.1): idêntico nas três línguas por definição.
  _fonte: "00057d"
  en: "Meshcraft"
  pt-br: "Meshcraft"
  es: "Meshcraft"

novidades:
  # O aviso que quem já entrou vê. As palavras do pt-br são as do mantenedor,
  # ao pedir a mudança em 27/08/2026 — não as reescreva sem ele.
  _fonte: "bc56fc"
  en: "Lots of news coming soon."
  pt-br: "Em breve teremos muitas novidades."
  es: "Pronto tendremos muchas novedades."

ir_para_a_prancheta:
  # O rótulo do caminho para a Prancheta do portfólio, célula `pages` (degrau
  # 18 do PLANO-PORTFOLIO-DO-ALUNO, o último da escada, 06/09/2026). O DESTINO
  # (`/pages/`) não mora aqui: é endereço, não copy, e vive em
  # apps/core/enderecos.py. Só o `aluno` vê este botão — ver o comentário
  # [PRANCHETA] no template.
  _fonte: "1594cf"
  en: "Go to my Portfolio Board"
  pt-br: "Acessar minha Prancheta"
  es: "Ir a mi Tablero de Portafolio"

ir_para_a_caixa:
  # O rótulo do caminho para a Caixa de Sugestões — a única área logada do
  # site até a escola nascer. O DESTINO (`/forms/sugestoes/`) não mora aqui:
  # é endereço, não copy, e vive em apps/core/enderecos.py.
  _fonte: "e19e69"
  en: "Go to the Suggestion Box"
  pt-br: "Acessar a Caixa de Sugestões"
  es: "Ir al Buzón de Sugerencias"

entrar:
  # O convite de quem ainda não entrou — botão largo, no corpo da página. Não
  # é o mesmo texto de `sessao.entrar`, e não deve ser: aquele é o link curto
  # do cabeçalho, que divide a linha com o seletor de idiomas; este é a única
  # coisa que a home oferece a quem chega, e pode dizer aonde leva.
  _fonte: "9c729e"
  en: "Sign in to Meshcraft"
  pt-br: "Entrar no Meshcraft"
  es: "Entrar en Meshcraft"

# ---------------------------------------------------------------------------
# O ANDAMENTO do pedido de entrada (DECISAO-categorias-de-usuario, 28/08/2026).
# O mantenedor escolheu, entre três opções, "só o andamento, sem convite":
# quem nunca pediu nada não vê NADA sobre a escola na home, e quem pediu
# acompanha aqui. Por isso não existe chave de convite — a ausência é a
# decisão, e não uma tradução esquecida.
# ---------------------------------------------------------------------------
pedido_em_analise:
  # Plural de verdade (CLDR, via babel): "há 1 dia" e "há 2 dias" são frases
  # diferentes em todas as três línguas, e concatenar número com texto fixo
  # produz "há 1 dias" — o tipo de erro que só o falante nativo vê e que
  # ninguém volta para consertar.
  #
  # Zero cai em `other` nas três línguas ("há 0 dias"), e é por isso que quem
  # pediu HOJE vê `pedido_de_hoje` — o template escolhe entre as duas chaves.
  #
  # A forma `many` de pt-br e es existe porque o CLDR a exige nessas línguas
  # (é a de "1 milhão DE dias"), e o validador cobra as categorias EXATAS do
  # idioma — não as que o autor achou que bastavam. Ninguém vai ver esta
  # frase; ela está certa mesmo assim, porque uma forma inventada só para
  # calar o validador seria pior que a ausência: passaria a existir, errada,
  # esperando o dia de aparecer.
  _fonte: "048f41"
  en:
    one: "Your request to join has been under review for {dias} day."
    other: "Your request to join has been under review for {dias} days."
  pt-br:
    one: "Seu pedido de entrada está em análise há {dias} dia."
    many: "Seu pedido de entrada está em análise há {dias} de dias."
    other: "Seu pedido de entrada está em análise há {dias} dias."
  es:
    one: "Tu solicitud de acceso está en revisión desde hace {dias} día."
    many: "Tu solicitud de acceso está en revisión desde hace {dias} de días."
    other: "Tu solicitud de acceso está en revisión desde hace {dias} días."

pedido_de_hoje:
  # Quem acabou de pedir NÃO vê um contador. "Em análise há 0 dias" é o que a
  # forma plural produziria (zero cai em `other` nas três línguas), e soa a
  # descaso justamente com quem está no pico da expectativa. Chave própria em
  # vez de um `if` no meio da frase: frase montada por pedaço não sobrevive à
  # tradução — a ordem das palavras muda entre idiomas.
  _fonte: "e693b2"
  en: "Your request to join is under review. You asked today."
  pt-br: "Seu pedido de entrada está em análise. Você pediu hoje."
  es: "Tu solicitud de acceso está en revisión. La enviaste hoy."

pedido_recusado:
  # Diz o "não" E o caminho de volta na mesma frase. A lei da fila §7 define o
  # reenvio como a forma de corrigir um dado errado — sem esta segunda metade,
  # quem errou o próprio telefone fica sem saber que pode consertar.
  _fonte: "cc8916"
  en: "Your request to join was not approved. You can ask again."
  pt-br: "Seu pedido de entrada não foi aprovado. Você pode pedir de novo."
  es: "Tu solicitud de acceso no fue aprobada. Puedes pedirla de nuevo."

pedido_recusado_motivo:
  # Rótulo do motivo escrito por quem recusou. Fica em chave própria porque o
  # motivo em si é texto de pessoa, não de catálogo — e texto de pessoa nunca
  # entra em arquivo de tradução.
  _fonte: "738015"
  en: "Reason given:"
  pt-br: "Motivo:"
  es: "Motivo:"

# ---------------------------------------------------------------------------
# Quem PERDEU o acesso (DECISAO-ex-aluno-e-a-porta-que-explica, 28/08/2026).
# Duas frases e não uma: "acabou" e "está pausado" são respostas opostas para
# quem lê, e a diferença é a única coisa que a pessoa quer saber.
# ---------------------------------------------------------------------------
acesso_encerrado:
  # MUDOU EM 29/08/2026 (DECISAO-a-ficha-nao-se-apaga.md §3), e a mudança é uma
  # reversão: a versão anterior dizia "fale com a escola" e evitava de propósito
  # convidar a pessoa a pedir de novo. O mantenedor decidiu o contrário — a
  # escola é um lugar de onde se sai e para onde se volta, e quem quer o curso
  # do semestre seguinte não está insistindo contra nada.
  #
  # A frase precisou mudar aqui TAMBÉM porque a Caixa já mudou: lá o ex-aluno vê
  # o formulário e o botão "Pedir para voltar". Uma home que continuasse dizendo
  # "fale com a escola" mandaria a mesma pessoa para dois lugares diferentes.
  _fonte: "2d381b"
  en: "Your access to the school has ended. If you want to come back, ask again on the Suggestion Box page, and the team decides."
  pt-br: "Seu acesso à escola foi encerrado. Se você quiser voltar, é só pedir de novo, e a equipe decide."
  es: "Tu acceso a la escuela terminó. Si quieres volver, solo pídelo de nuevo, y el equipo decide."

pedir_para_voltar:
  # O botão que acompanha `acesso_encerrado` desde 29/08/2026. Ele leva à Caixa,
  # onde já mora o formulário da fila — nenhum caminho novo, porque duas portas
  # para o mesmo pedido discordariam na primeira mudança de regra.
  _fonte: "4410a6"
  en: "Ask to come back"
  pt-br: "Pedir para voltar"
  es: "Pedir volver"

acesso_pausado:
  # A palavra que importa aqui é "volta": a pessoa precisa saber que não
  # precisa fazer nada.
  _fonte: "76afac"
  en: "Your access is paused right now. It comes back as soon as the team turns it on again."
  pt-br: "Seu acesso está pausado no momento. Ele volta assim que a equipe religar."
  es: "Tu acceso está pausado por ahora. Vuelve en cuanto el equipo lo reactive."

# ---------------------------------------------------------------------------
# O CONVITE de quem entrou e nunca pediu nada
# (DECISAO-o-beco-de-quem-entrou-e-nunca-pediu.md, 29/08/2026).
#
# ESTA SEÇÃO REVERTE, NOMINALMENTE, A DECISÃO DE 28/08/2026 registrada mais
# acima — a de que "quem nunca pediu nada não vê NADA sobre a escola na home".
# Quem a revogou foi o mesmo mantenedor que a tomou, no dia em que caiu no
# próprio beco: entrou com a conta dele, leu "em breve teremos novidades" e
# não tinha para onde ir. O formulário de pedir entrada existia o tempo todo,
# na Caixa — só que ninguém chega a um endereço que a tela não mostra.
#
# O convite só aparece para quem a `alunos` CONFIRMOU ser `cadastrado`. Quando
# ela não responde, a home continua exatamente como era: sem convite e sem
# atalho. A regra antiga não morreu, ela encolheu para o caso em que ainda é
# verdadeira — não saber não é motivo para oferecer nada a ninguém.
# ---------------------------------------------------------------------------
quer_estudar_aqui:
  # Diz o que a escola é E quem decide, na mesma frase. A segunda metade não é
  # enfeite: sem ela, quem pede fica esperando uma porta automática que não
  # existe — e a fila de liberação é humana de propósito.
  _fonte: "334b1a"
  en: "Want to study at Meshcraft? Ask to join, and the team decides who comes in."
  pt-br: "Quer estudar no Meshcraft? Peça sua entrada, e a equipe decide quem entra."
  es: "¿Quieres estudiar en Meshcraft? Pide tu acceso, y el equipo decide quién entra."

pedir_entrada:
  # NÃO é o mesmo rótulo de `pedir_para_voltar`, e não deve ser: um é a
  # primeira vez, o outro é o retorno de quem já esteve aqui. O botão leva ao
  # mesmo lugar — a Caixa, onde mora o formulário —, e o destino continua fora
  # do catálogo (é endereço, não copy: apps/core/enderecos.py).
  _fonte: "461bd7"
  en: "Ask to join"
  pt-br: "Pedir entrada"
  es: "Pedir acceso"

# ---------------------------------------------------------------------------
# O QUADRINHO DE PROGRESSO (degrau 20 do PLANO-CELULA-GAMIFICACAO, 01/09/2026).
# A home é a primeira tela depois do login, e até aqui o progresso do aluno só
# aparecia para quem abrisse `/conquistas` de propósito.
#
# O QUE ESTAS FRASES NÃO DIZEM, e a ausência é decisão: o TÍTULO do degrau
# ("Aprendiz", "Modelador") não está aqui. Ele é do fórum e da gamificação, e
# `getMyStatus` não o devolve. Inventar um rótulo nesta célula faria a home e a
# trilha chamarem o mesmo degrau por nomes diferentes no dia em que um dos dois
# mudasse. O quadrinho mostra o NÚMERO do degrau e o quanto falta.
#
# E o XP cru não aparece em frase nenhuma: a regra de tela da gamificação é
# "XP nunca maior que a imagem da obra". Aqui isso vira o degrau em destaque, o
# quanto falta em letra pequena, e o total nunca escrito.
# ---------------------------------------------------------------------------
progresso_nivel:
  # O rótulo do degrau. "Nível" e não "degrau" porque é a palavra que a própria
  # trilha usa; a metáfora do degrau vive nos documentos, não na tela.
  _fonte: "0c6341"
  en: "Level {nivel}"
  pt-br: "Nível {nivel}"
  es: "Nivel {nivel}"

progresso_falta:
  # Plural de verdade (CLDR, via babel), pelo mesmo motivo de
  # `pedido_em_analise` acima: "falta 1 ponto" e "faltam 2 pontos" são frases
  # diferentes nas três línguas, e concatenar número com texto fixo produz
  # "falta 1 pontos".
  #
  # A forma `many` de pt-br e es existe porque o CLDR a exige nessas línguas (é
  # a de "1 milhão DE pontos"), e o validador cobra as categorias EXATAS do
  # idioma. Zero NUNCA chega aqui: quando não falta nada, o template escolhe
  # `progresso_no_proximo`, que é uma frase diferente e não um contador em zero.
  _fonte: "33154f"
  en:
    one: "{falta} point to go until level {proximo}."
    other: "{falta} points to go until level {proximo}."
  pt-br:
    one: "Falta {falta} ponto para o nível {proximo}."
    many: "Faltam {falta} de pontos para o nível {proximo}."
    other: "Faltam {falta} pontos para o nível {proximo}."
  es:
    one: "Falta {falta} punto para el nivel {proximo}."
    many: "Faltan {falta} de puntos para el nivel {proximo}."
    other: "Faltan {falta} puntos para el nivel {proximo}."

progresso_no_proximo:
  # Falta ZERO tem chave própria, e não é preciosismo: "faltam 0 pontos" soa a
  # defeito da tela justamente para quem está no melhor momento da trilha. Mesma
  # escolha de `pedido_de_hoje` logo acima, e pelo mesmo motivo — frase montada
  # por pedaço não sobrevive à tradução.
  _fonte: "4c1ab2"
  en: "You already have the points for the next level."
  pt-br: "Você já tem os pontos do próximo degrau."
  es: "Ya tienes los puntos del siguiente nivel."

progresso_no_topo:
  # O fim da escada: `xp_para_proximo` vem `null` quando não há próximo degrau
  # definido. Aqui a tela não desenha barra nenhuma, e esta frase ocupa o lugar
  # dela — uma barra cheia que nunca vira nada seria promessa sem destino.
  _fonte: "a1d5ba"
  en: "You are on the last level of the trail."
  pt-br: "Você chegou ao último degrau da trilha."
  es: "Llegaste al último nivel del camino."
