  # emitidas com |json_script; proibido catálogo de tradução em JS (D2.6).
  enviando:
    _fonte: "b8ed52"
    en: "Sending…"
    pt-br: "Enviando…"
    es: "Enviando…"
  cta_receber:
    _fonte: "2f3f4a"
    en: "I want to receive"
    pt-br: "Quero receber"
    es: "Quiero recibir"
  erro:
