# traducoes/landing.yaml — landing de site REGISTRADO no i18n (PLANO-I18N
# fase 2; template funil/landing_i18n.html). O conteúdo é o placeholder de
# teste da landing atual, traduzido fiel — en é a fonte, pt-br espelha o copy
# PT-BR que a landing monolíngue já serve hoje.
# A subárvore js.* alimenta a ilha Alpine via json_script (D2.6).

preco:
  # Moeda é DADO (BRL da oferta), não copy — igual nas três línguas até a
  # fase que separar idioma de moeda (D9: es não implica EUR).
  _fonte: "bd992a"
  en: "R$ {preco}"
  pt-br: "R$ {preco}"
  es: "R$ {preco}"

cta_comprar:
  _fonte: "ddac15"
  en: "I want to buy"
  pt-br: "Quero comprar"
  es: "Quiero comprar"

novidades_titulo:
  _fonte: "aa2139"
  en: "Receive news"
  pt-br: "Receba novidades"
  es: "Recibe novedades"

campo_nome:
  _fonte: "dcd1d5"
  en: "Name"
  pt-br: "Nome"
  es: "Nombre"

campo_email:
  _fonte: "2550d9"
  en: "E-mail"
  pt-br: "E-mail"
  es: "Correo electrónico"

campo_whatsapp:
  _fonte: "1e9e69"
  en: "WhatsApp (optional)"
  pt-br: "WhatsApp (opcional)"
  es: "WhatsApp (opcional)"

sucesso:
