# =============================================================================
# GATEWAY DA PLATAFORMA — Traefik v3, file provider.
# Docker provider OFF por decisão: rotas declaradas em arquivo, revisáveis em PR
# e protegidas por CODEOWNERS.
# =============================================================================
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false

log:
  level: INFO
accessLog: {}

# --- TLS: os dois modos COEXISTEM, decididos POR DOMÍNIO ----------------------
# MODO A (Cloudflare na frente) — o padrão para dezenas de domínios:
#   O domínio entra no Cloudflare (plano gratuito), registro A apontando para
#   esta VPS, SSL mode "Full". O Cloudflare faz o TLS público; na origem o
#   Traefik serve o certificado padrão autoassinado, que o Full aceita.
#   Domínio novo Modo A = ZERO mudança neste servidor (ex.: basileiatoutheou.org).
# MODO B (Let's Encrypt direto, sem Cloudflare) — ATIVO desde 23/08/2026
#   (decisão do mantenedor para o meshcraft.top): o resolver abaixo emite
#   certificado para os domínios listados em `tls.domains` do router "funil"
#   (dynamic/plataforma.yml) — domínio novo direto = uma linha lá. O ACME só
#   emite DEPOIS de o DNS do domínio apontar para esta VPS (httpChallenge na
#   porta 80); até lá o Traefik serve o autoassinado e re-tenta sozinho. O
#   storage persiste no volume `letsencrypt` do compose — NUNCA dentro de
#   ./traefik/, que o deploy-infra substitui inteiro a cada sync.
certificatesResolvers:
  le:
    acme:
      email: abundanciabr@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
