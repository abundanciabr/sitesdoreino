# =============================================================================
# ROTAS DA PLATAFORMA — MULTISSÍTIO.
# Um deploy, N domínios: as rotas casam por CAMINHO em QUALQUER host apontado
# para esta VPS. Domínio novo Modo A (Cloudflare) NÃO toca este arquivo — só
# DNS/Cloudflare + entrada no infra/sites.json (R11 mecanizada). Domínio novo
# Modo B (direto, Let's Encrypt) acrescenta UMA linha na lista `tls.domains`
# do router "funil" abaixo. Host não cadastrado recebe 404 da própria
# plataforma (middleware CONV-SITE — INV-P11), nunca um site padrão.
# Única exceção presa a UM host: os webhooks do Mercado Pago, no DOMÍNIO DE
# OPERAÇÕES (basileiatoutheou.org = o seu domínio principal/da operação).
# =============================================================================
http:
  middlewares:
    seguranca:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true

    # Cadeia PRÓPRIA da área administrativa. Idêntica à `seguranca` em tudo,
    # menos numa linha — e a cadeia separada existe justamente para que essa
    # linha não precise mudar na cadeia compartilhada.
    #
    # `frameDeny: true` emite `X-Frame-Options: DENY`, que proíbe enquadramento
    # **inclusive de mesma origem**. A galeria de painéis (DECISAO-celula-admin,
    # plano §4.3) serve painel histórico em iframe a partir da própria área
    # admin: sob `DENY` ela não renderiza, e só em produção — em `make dev` não
    # há Traefik (mesma forma de `armadilhas/083` e `/029`).
    #
    # O conserto tentador seria trocar `frameDeny` por `SAMEORIGIN` na cadeia
    # `seguranca` — que é compartilhada por TODAS as células, `checkout` e
    # `pagamentos` inclusive. Afrouxar a proteção da plataforma inteira para
    # atender uma célula é o oposto do raio de explosão de 1 célula (Lei 2).
    #
    # A defesa moderna equivalente (CSP `frame-ancestors 'self'`) vem do Django,
    # na própria célula (PR 3). As duas precisam concordar: `X-Frame-Options`
    # aqui, CSP lá — se qualquer uma disser DENY/none, o iframe não abre.
    seguranca-admin:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN

    # Desvio do `www.` para o domínio nu. Existe por um motivo de CADEADO, não
    # de estética: sem router próprio, `www.<dominio>` cai no default do
    # Traefik e o visitante recebe `TRAEFIK DEFAULT CERT` — a tela vermelha
    # NET::ERR_CERT_AUTHORITY_INVALID, que é o pior primeiro contato possível
    # com um site. E, passando por cima do aviso, ainda pegava o 404 do
    # CONV-SITE (host não cadastrado), porque `www.` não está — e não deve
    # estar — no `infra/sites.json`: o smoke do deploy-infra exige 200 na raiz
    # de todo host listado, e a raiz do `www.` responde 301 de propósito.
    # Medido em produção em 29/08/2026, antes do conserto.
    www-para-nu:
      redirectRegex:
        regex: '^https?://www\.meshcraft\.top/(.*)'
        replacement: 'https://meshcraft.top/${1}'
        permanent: true

  routers:
    mp-webhooks:
      # ÚNICA rota amarrada a um host: o MP precisa de um endereço estável.
      rule: "Host(`basileiatoutheou.org`) && PathPrefix(`/api/pagamentos/webhooks`)"
      priority: 100
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: pagamentos
      tls: {}

    checkout-api:
      # API do checkout (POST /api/checkout/sessions, /orders…): sem esta rota
      # o caminho cai no catch-all do funil e vira 404 — ninguém compra.
      # priority 20 > 10 (prefixos de página) e > 1 (funil); não colide com
      # mp-webhooks (100), que casa só /api/pagamentos/webhooks.
      rule: "PathPrefix(`/api/checkout`)"
      priority: 20
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: checkout
      tls: {}

    quiz:
      rule: "PathPrefix(`/quiz`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: quiz
      tls: {}

    checkout:
      rule: "PathPrefix(`/checkout`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: checkout
      tls: {}

    alunos:
      rule: "PathPrefix(`/alunos`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: alunos
      tls: {}

    sugestoes:
      # A Caixa de Sugestões (docs/caixa-de-sugestoes/DECISAO-EVO-01-identidade.md
      # §2): meshcraft.top/forms/sugestoes/. O Traefik NÃO remove o prefixo — a
      # célula o conhece por SCRIPT_NAME=/forms/sugestoes no env dela.
      #
      # POR QUE ESTA REGRA GANHA DO CURINGA DO FUNIL, e não por sorte:
      # o `funil` casa `PathPrefix(`/`)`, ou seja casa TAMBÉM /forms/sugestoes.
      # Quem decide entre dois routers que casam é a PRIORIDADE, e ela está
      # DECLARADA nos dois lados: 10 aqui contra 1 no funil. Só quando a
      # prioridade é omitida é que o Traefik a calcula do comprimento da regra
      # (v3: `len(rule)`) — desempate implícito que este arquivo nunca usa,
      # porque a rota que decide qual célula responde não pode depender de
      # contagem de caracteres. Mesma escala do resto: 1 = catch-all,
      # 10 = prefixo de página, 20 = API, 100 = webhook amarrado a host.
      rule: "PathPrefix(`/forms/sugestoes`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: sugestoes
      tls: {}

    identidade:
      # O login do site (DECISAO-celula-de-identidade, 25/08/2026): a dança com
      # o Google e a saída. `/entrar/google/retorno` é o endereço EXATO
      # cadastrado no console do Google em 24/08/2026 — por isso o prefixo é
      # `/entrar`, sem SCRIPT_NAME: a célula declara os caminhos por extenso.
      # A superfície de máquina (`/interno`) NÃO tem rota aqui, de propósito:
      # quem pergunta "quem é este?" o faz pela rede interna do Docker.
      # Mesma escala de prioridade do resto: 10 = prefixo de página, contra o
      # 1 do catch-all do funil.
      # `Host(...)` explicito, ao contrario das outras rotas de pagina: o
      # `redirect_uri` que vai ao Google e montado a partir do Host da
      # REQUISICAO (Lei 9, multissitio) e o Google so aceita o endereco
      # cadastrado no console — que hoje existe para `meshcraft.top` e mais
      # nenhum. Sem esta clausula, qualquer dominio apontado para esta VPS
      # serviria a tela de login da plataforma (o login falharia no Google,
      # mas a pagina apareceria: materia-prima de golpe). Dominio novo com
      # login = uma linha aqui + o retorno dele cadastrado no console.
      # Achado da cadeira de IAM, auditoria de 25/08/2026.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/entrar`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: identidade
      tls: {}

    admin:
      # A área administrativa (DECISAO-celula-admin, 25/08/2026): painéis,
      # métricas e configuração. A célula conhece o prefixo por
      # `SCRIPT_NAME=/admin` no env dela — o Traefik NÃO o remove.
      #
      # `Host(...)` explícito, e aqui a razão é ainda mais direta do que na
      # `identidade`: sem ele, QUALQUER domínio apontado para esta VPS serviria
      # a porta administrativa da plataforma. A porta é fail-closed e recusa
      # quem não está em `ADMIN_EMAILS`, mas oferecer a tela de operação em
      # domínio alheio é matéria-prima de golpe — e o custo de evitar é uma
      # cláusula. **Domínio novo com área administrativa é DECISÃO nova** (§8.7
      # da lei), nunca uma linha a menos aqui.
      #
      # Cadeia de middleware PRÓPRIA (`seguranca-admin`, no topo do arquivo):
      # mesmos cabeçalhos da `seguranca`, com `SAMEORIGIN` no lugar de `DENY`
      # para o iframe da galeria de painéis. A cadeia é separada para que a
      # compartilhada — que protege `checkout` e `pagamentos` — não precise
      # afrouxar por causa desta célula.
      #
      # Mesma escala de prioridade do resto: 10 = prefixo de página, contra o
      # 1 do catch-all do funil.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/admin`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca-admin]
      service: admin
      tls: {}

    mapa-ia:
      # O mapa técnico do projeto para IA (`painel/ia/`), pedido do
      # mantenedor em 28/08/2026 para poder mandar o link a IAs externas sem
      # exigir login. MESMO backend da área administrativa — a pasta
      # `painel/ia/` já vem embutida na imagem dela (é filha de `painel/`,
      # que o passo "Embutir o painel do dono" copia inteira) — mas os
      # caminhos exatos que respondem sem sessão são só os de
      # `CAMINHOS_ISENTOS` em `apps/core/porta.py` (INV-P14): a porta
      # continua fail-closed para todo o resto de `/mapa-ia` que não estiver
      # nomeado lá, e para toda a área administrativa de sempre.
      #
      # Prefixo PRÓPRIO (fora de `/admin`) de propósito: nada sob `/admin`
      # neste arquivo é público hoje, e misturar os dois criaria a
      # expectativa errada para quem só ler as regras de roteamento.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/mapa-ia`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca-admin]
      service: admin
      tls: {}

    docs:
      # A área PÚBLICA de documentos (`DECISAO-a-area-de-documentos.md`,
      # 29/08/2026). MESMO backend da área administrativa — a pasta
      # `documentos/` já vem embutida na imagem dela pelo passo "Embutir os
      # documentos do site" —, e é a célula que decide o que sai: só os
      # arquivos com `publico: true` no cabeçalho respondem aqui, e a isenção
      # da porta alcança exatamente este prefixo (`porta.py`,
      # `PREFIXO_PUBLICO_DOS_DOCUMENTOS`).
      #
      # Prefixo PRÓPRIO, fora de `/admin`, pelo mesmo motivo do `/mapa-ia`: um
      # endereço público não se esconde debaixo do prefixo da área
      # administrativa. E há um motivo a mais aqui, que é mecânico: a célula
      # roda sob `SCRIPT_NAME=/admin`, e o Django TIRA esse prefixo do
      # `path_info` — `/admin/docs/x` e `/docs/x` chegariam com o mesmo caminho
      # interno. Por isso a tela fechada se chama `/admin/documentos/`, e não
      # `/admin/docs/`.
      #
      # Mesma escala de prioridade do resto: 10 = prefixo de página, contra o
      # 1 do catch-all do funil.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/docs`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca-admin]
      service: admin
      tls: {}

    forum:
      # O forum da escola (DECISAO-forum-da-escola.md, 28/08/2026).
      #
      # POR CAMINHO, NUNCA POR SUBDOMINIO, e a razao nao e estetica: o cookie
      # `meshcraft_sessao` e de HOST (`SESSION_COOKIE_PATH=/`, e
      # deliberadamente SEM `SESSION_COOKIE_DOMAIN`). Em `forum.meshcraft.top`
      # o cracha nao viajaria, e o forum passaria a exigir um SEGUNDO login —
      # exatamente o que o mantenedor pediu para nao ter, e o que a §2 da lei
      # proibe nominalmente. Mover esta linha para um subdominio quebra o login
      # unico do site inteiro.
      #
      # A celula conhece o prefixo por `SCRIPT_NAME=/forum` no env dela; o
      # Traefik NAO o remove (`armadilhas/029`).
      #
      # `Host(...)` explicito, como na `identidade` e na `admin`: sem ele,
      # qualquer dominio apontado para esta VPS serviria o forum da escola.
      #
      # Cadeia `seguranca` (a compartilhada), e NAO a `seguranca-admin`: o
      # forum tem areas PUBLICAS de proposito — visitante le e o Google indexa
      # (lei §5). Quem pode ler o que e decidido DENTRO da celula, por dado e
      # fail-closed (`apps/core/permissoes.py`), nunca aqui no roteador.
      #
      # Mesma escala do resto: 10 = prefixo de pagina, contra o 1 do catch-all
      # do funil.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/forum`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: forum
      tls: {}

    gamificacao:
      # O progresso do aluno (DECISAO-gamificacao.md, 30/08/2026). O endereco e
      # LEI na propria decisao (§4): `/conquistas`, e nao `/gamificacao` — a
      # palavra que o aluno le e o que ele ganhou, nunca o nome do mecanismo.
      #
      # POR CAMINHO, NUNCA POR SUBDOMINIO, pela mesma razao do forum acima: o
      # cookie `meshcraft_sessao` e de HOST, e em `conquistas.meshcraft.top` o
      # cracha nao viajaria. Aqui isso e ainda mais grave — esta celula NAO
      # assina sessao ([INV-P12]) e depende inteiramente de o cookie chegar
      # para saber de quem e o XP.
      #
      # A celula conhece o prefixo por `SCRIPT_NAME=/conquistas` no env dela; o
      # Traefik NAO o remove (`armadilhas/029`).
      #
      # `Host(...)` explicito, como nas outras: sem ele, qualquer dominio
      # apontado para esta VPS serviria as conquistas da escola.
      #
      # Cadeia `seguranca` (a compartilhada), e NAO a `seguranca-admin`: quem
      # pode ver o que e decidido DENTRO da celula. A porta de MAQUINA, que
      # responde sob este mesmo prefixo, tem cadeado proprio — o conjunto
      # `TOKENS_ACEITOS_*`, hoje VAZIO, que recusa todo mundo por construcao
      # (`armadilhas/186`, e esta escrito no `config/settings.py` da celula).
      rule: "Host(`meshcraft.top`) && PathPrefix(`/conquistas`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: gamificacao
      tls: {}

    cursos:
      # A sala de aula (DECISAO-celula-de-cursos.md, 04/09/2026; degrau 1.7
      # de PLANO-CELULA-CURSOS.md §10). O texto das aulas e obra nao lancada
      # do mantenedor e mora so no banco desta celula.
      #
      # POR CAMINHO, NUNCA POR SUBDOMINIO, pela mesma razao do forum e da
      # gamificacao acima: o cookie `meshcraft_sessao` e de HOST, e a sala
      # depende do cracha da identidade chegar ate ela (getSessionFull).
      #
      # A celula conhece o prefixo por `SCRIPT_NAME=/cursos` no env dela; o
      # Traefik NAO o remove (`armadilhas/029`).
      #
      # `Host(...)` explicito, como nas outras: sem ele, qualquer dominio
      # apontado para esta VPS serviria a sala de aula.
      #
      # Cadeia `seguranca` (a compartilhada), e NAO a `seguranca-admin`: quem
      # pode ver o que e decidido DENTRO da celula, por matricula ativa
      # (fail-closed em apps/core/permissoes.py). A porta de MAQUINA, que
      # responde sob este mesmo prefixo, tem cadeado proprio — o conjunto
      # `TOKENS_ACEITOS_*` (`armadilhas/186`).
      rule: "Host(`meshcraft.top`) && PathPrefix(`/cursos`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: cursos
      tls: {}

    pages:
      # A casa das Paginas do aluno: a Prancheta do portfolio, para quem esta
      # logado (corredor CS-PAGES-0001; PLANO-PORTFOLIO-DO-ALUNO.md secao 4).
      #
      # POR CAMINHO, NUNCA POR SUBDOMINIO, pela mesma razao do forum, da
      # gamificacao e da sala de aula acima: o cookie `meshcraft_sessao` e de
      # HOST. Aqui isso e ainda mais grave do que nas vizinhas, porque esta
      # celula NAO assina sessao ([INV-P12]) e depende inteiramente de o
      # cracha da `identidade` chegar ate ela.
      #
      # A celula conhece o prefixo por `SCRIPT_NAME=/pages` no env dela; o
      # Traefik NAO o remove (`armadilhas/029`).
      #
      # `Host(...)` explicito, como nas outras: sem ele, qualquer dominio
      # apontado para esta VPS serviria o portfolio dos alunos da escola.
      #
      # Cadeia `seguranca` (a compartilhada), e NAO a `seguranca-admin`: quem
      # pode ver o que e decidido DENTRO da celula, pela porta fail-closed do
      # degrau 06 (criterio AC-05). A porta de MAQUINA (`/pages/interno/`)
      # responde debaixo deste mesmo prefixo e fica alcancavel pela internet a
      # partir deste merge, porque o corte do prefixo e do Django e nao do
      # Traefik (`armadilhas/186`). Quem a fecha e o Bearer do par, hoje um
      # conjunto VAZIO que recusa todo mundo por construcao, e o guarda que
      # importa e o teste de 401 em
      # services/pages/tests/test_porta_de_maquina.py (`ci-celula (pages)`
      # verde no PR #1151). A topologia nao fecha nada aqui, e escrever o
      # contrario seria ensinar errado quem chegar depois.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/pages`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: pages
      tls: {}

    estudio:
      # A vitrine publica do aluno: o link que ele manda ao cliente pagante,
      # `meshcraft.top/estudio/<apelido>` (plano secao 4, criterio AC-13).
      # MESMO backend de `/pages`, porque e a mesma celula: a peca mora em uma
      # casa so, e guardar a peca em duas celulas e proibido pelo corredor.
      #
      # AQUI ESTA A DECISAO QUE O DEGRAU 05 DEVIA TOMAR, e que a genese deixou
      # em aberto de proposito (`services/pages/config/settings.py`, secao O
      # PREFIXO): `FORCE_SCRIPT_NAME` carrega UM prefixo so, e esta casa tem
      # DOIS enderecos publicos. A escolha: o prefixo e `/pages`, e este
      # segundo roteador NAO remove nada. O molde nao e invencao deste PR, e
      # sim o `/docs` e o `/mapa-ia` da celula `admin`, que servem um segundo
      # prefixo pelo mesmo backend desde 29 e 30/08/2026, e que
      # `ci/mapa_do_site.py` ja sabe medir (o candidato B do
      # `alcance_da_rota`).
      #
      # A MECANICA DESCARTADA era remover `/estudio` com `StripPrefix`, para a
      # vitrine chegar ao Django na raiz do urlconf. Medida com o ASGI real
      # desta celula, com `SCRIPT_NAME=/pages`:
      #
      #   COM StripPrefix  /pages/joao  e /estudio/joao  => path_info `/joao`
      #                    /estudio/healthz => path_info `/healthz`, HTTP 200
      #   SEM remocao      /pages/joao      => path_info `/joao`
      #                    /estudio/joao    => path_info `/estudio/joao`
      #                    /estudio/healthz => HTTP 404
      #
      # Com a remocao, os DOIS enderecos publicos chegam ao Django com o MESMO
      # `path_info`, e a porta fail-closed do degrau 06 fica sem como
      # distinguir a area do aluno logado da vitrine aberta a quem tem o link:
      # a informacao nao existe dentro do processo. Isso obrigaria a isentar a
      # raiz inteira do urlconf, que e a forma fail-OPEN de uma celula cujo
      # criterio AC-05 e fail-closed. De quebra, a sonda de maquina passaria a
      # responder 200 debaixo do endereco da vitrine.
      #
      # Sem remocao, a vitrine tem namespace proprio (`/estudio/...` no
      # `path_info`) e a porta a isenta por prefixo nomeado, exatamente como a
      # `admin` ja faz com `PREFIXO_PUBLICO_DOS_DOCUMENTOS`.
      #
      # E ISTO NAO CONTRARIA `armadilhas/029`, que e o que reprova a outra
      # mecanica nomeada na genese (`SCRIPT_NAME` vazio e os dois prefixos
      # declarados no urlconf). O que a 029 proibe e o urlconf conhecer o
      # PROPRIO ponto de montagem: mudar `/pages` continua sendo editar env e
      # Traefik, sem cirurgia em codigo. `/estudio` nao e ponto de montagem
      # desta celula, e sim um caminho que o Django serve por extenso, do
      # mesmo jeito que a `admin` serve `docs/` e `mapa-ia/`.
      #
      # `SCRIPT_NAME` fica como o provisionamento ja o escreveu na VPS em
      # 05/09/2026 (`/pages`, primeira escrita), entao este degrau NAO pendura
      # nenhum segundo passo manual no mantenedor.
      #
      # `Host(...)` explicito, como nas outras: sem ele, qualquer dominio
      # apontado para esta VPS serviria a vitrine dos alunos.
      #
      # Cadeia `seguranca` (a compartilhada): a vitrine e publica de proposito,
      # para um cliente que nunca vai entrar na plataforma. Quem decide se ela
      # existe e o aluno, por opt-in, DENTRO da celula (AC-13), e o `noindex`
      # sai do Django, nunca daqui.
      #
      # Mesma escala do resto: 1 = curinga, 10 = prefixo de pagina, 20 = API,
      # 100 = webhook amarrado a host.
      rule: "Host(`meshcraft.top`) && PathPrefix(`/estudio`)"
      priority: 10
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: pages
      tls: {}

    www-meshcraft:
      # No host `www.` nenhuma PÁGINA é servida: tudo é desviado para o
      # endereço canônico. Dois endereços servindo o mesmo conteúdo rendem
      # sessão perdida na troca e conteúdo duplicado para busca.
      #
      # A priority 15 é a única faixa correta, e as duas bordas doem:
      #   > 10 (prefixos de página) — sem isso, /checkout, /entrar, /admin,
      #     /quiz e /forms/sugestoes seriam SERVIDOS no `www.` em vez de
      #     desviados, que é o problema que este router existe para fechar.
      #   < 20 (checkout-api) — a compra NUNCA pode ser desviada: 301 num POST
      #     faz o navegador reemitir como GET e o pedido morre no caminho. É a
      #     escala "curinga < página < API" que `ci/tests/
      #     test_rota_da_compra_existe.py` exige, escrita depois do incidente
      #     de 22/08/2026 ("tudo mergeado e ninguém conseguia comprar"). O
      #     guarda pegou este router com priority 200 antes do merge.
      # O `!PathPrefix(/api)` é o cinto além do suspensório: mesmo que alguém
      # um dia mexa nesses números, caminho de máquina não se desvia.
      #
      # O `service` é exigido pelo Traefik mesmo quando o middleware responde
      # antes: o redirectRegex encerra a requisição com 301 e o funil nunca é
      # chamado.
      rule: "Host(`www.meshcraft.top`) && !PathPrefix(`/api`)"
      priority: 15
      entryPoints: [websecure]
      middlewares: [seguranca, www-para-nu]
      service: funil
      tls: {}

    funil:
      # Catch-all: a raiz e tudo que nenhum prefixo pegou, em QUALQUER domínio.
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: [websecure]
      middlewares: [seguranca]
      service: funil
      # TLS misto, decidido POR DOMÍNIO (traefik.yml explica os dois modos):
      # - Modo A (Cloudflare): o domínio NÃO entra na lista — a borda faz o
      #   TLS público e aceita o autoassinado da origem (SSL mode Full).
      # - Modo B (direto): o domínio entra em `domains` — o resolver `le`
      #   emite Let's Encrypt para ele. A emissão só acontece DEPOIS de o DNS
      #   apontar para a VPS; o cert emitido serve QUALQUER router (a escolha
      #   é por SNI), então a lista vive só aqui no catch-all.
      #   Se a 1ª tentativa falhar (DNS ainda no lugar antigo), o Traefik NÃO
      #   re-tenta a cada acesso — só ao recarregar a config (ou no ciclo de
      #   renovação, ~24h). O empurrão: qualquer mudança neste arquivo (até
      #   comentário) faz o deploy-infra recriar o traefik ⇒ tentativa nova
      #   na hora. Medido em 23/08/2026, no primeiro cert do meshcraft.top.
      # ATENÇÃO (ARMADILHAS-OPERACAO.md §1/H15): domínio direto MORRE se a VPS um dia só
      # aceitar web das faixas do Cloudflare — confira esta lista antes de
      # aplicar aquele endurecimento.
      tls:
        certResolver: le
        domains:
          - main: meshcraft.top
            # O `www.` entra como SAN do MESMO certificado (não como entrada
            # nova): é um endereço do mesmo site, e o desvio acima só consegue
            # responder 301 depois de o TLS fechar — desviar exige cadeado
            # válido ANTES. O DNS do `www.` já aponta para a VPS (CNAME),
            # então o httpChallenge fecha na primeira tentativa.
            # Mudar esta lista muda o CONJUNTO de domínios do certificado ⇒ o
            # ACME pede um certificado NOVO ao recarregar a config. Vale a
            # armadilha 018 inteira: a emissão acontece na RECARGA, nunca por
            # acesso — se falhar, o `TRAEFIK DEFAULT CERT` fica servindo por
            # ~24h. Como todo diff em `infra/traefik/**` faz o deploy-infra
            # recriar o container, o merge deste PR já é o empurrão.
            sans:
              - www.meshcraft.top

