# =============================================================================
# /opt/plataforma/docker-compose.yml — PRODUÇÃO
# Uma aplicação (services/aplicacao) com os 17 bancos, mais traefik, postgres e redis.
# O publicador da VPS (infra/publicar.py) fixa a versão em publicacoes/imagens.json
# e roda `docker compose up -d --wait aplicacao`.
# Segredos de runtime vivem só em ./env/*.env, fora do Git.
# =============================================================================
name: plataforma

x-celula: &celula
  restart: unless-stopped
  networks: [edge, interna]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  # /healthz respondendo é o sinal de que a partida (migrate e servidor) chegou
  # ao fim; o `up -d --wait` da publicação espera por ele.
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  aplicacao:
    <<: *celula
    image: ${APLICACAO_IMAGEM:-ghcr.io/abundanciabr/plataforma-aplicacao:main}
    environment:
      APLICACAO_ENV_DIR: /run/plataforma-env
    volumes:
      - ${APLICACAO_CODIGO:?defina APLICACAO_CODIGO}:/app:ro
      - /opt/plataforma/env:/run/plataforma-env:ro
      - /opt/plataforma/admin-dados:/opt/plataforma/admin-dados:ro
      - /opt/plataforma/admin-midia:/opt/plataforma/admin-midia

  traefik:
    image: traefik:v3.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # A entrada privada fica presa ao loopback do HOST: nenhuma outra máquina
      # da rede alcança 8443, nem por IPv4 nem por IPv6. Quem entra vem pelo
      # túnel SSH da fase 3, que desemboca aqui dentro da própria VPS.
      - "127.0.0.1:8443:8443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    # O gateway recebe DOIS valores, e só eles: os tokens que os roteadores da
    # entrada privada injetam. Ele nunca recebe o `admin.env` inteiro. Quem os
    # exporta é `ativar-aplicacao.py`, lendo o env real da VPS. Sem eles, a
    # entrada privada recusa e o resto do site segue no ar.
    environment:
      ALUNOS_API_TOKEN: ${ALUNOS_API_TOKEN:-}
      TOKEN_CATALOGO: ${TOKEN_CATALOGO:-}
    networks: [edge]

  postgres:
    image: postgres:17
    restart: unless-stopped
    # POSTGRES_SUPER_PASSWORD: NUNCA passe isso na linha de comando ou em chat
    # com um agente. Crie, uma única vez, o arquivo /opt/plataforma/.env (fora
    # do Git) contendo a linha "POSTGRES_SUPER_PASSWORD=<senha>" — o Docker
    # Compose lê esse arquivo sozinho, sem precisar exportar nada toda vez.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?defina em /opt/plataforma/.env (fora do Git), nunca inline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [interna]

volumes:
  pgdata: {}
  redisdata: {}
  letsencrypt: {}

networks:
  edge:
    external: true
  interna:
    external: true
