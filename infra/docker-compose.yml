# =============================================================================
# /opt/plataforma/docker-compose.yml — PRODUÇÃO
# Deploy por célula: o CI faz `docker compose pull <celula> && up -d <celula>`.
# ROLLBACK (Lei das 2h — RITOS.md §4), ex.:
#   PAGAMENTOS_TAG=<sha-anterior> docker compose up -d pagamentos
# Cada célula tem sua variável *_TAG; default = main.
# Segredos de runtime vivem SÓ em ./env/*.env (escritos pelo mantenedor — INV-P8).
#
# DOIS TIPOS DE PROCESSO POR CÉLULA:
#   <celula>          servidor HTTP — roda `migrate` no boot (CMD do Dockerfile)
#   <celula>-<papel>  processo auxiliar (consumer de evento, worker Huey):
#                     MESMA imagem, MESMA *_TAG, MESMO env_file, `command:`
#                     sobrescrito e SEM `migrate` (ARMADILHAS.md §3.13)
#
# O nome do auxiliar SEMPRE começa com "<celula>-". Não é estética: é assim que
# .github/workflows/deploy-celula.yml descobre, lendo o próprio compose, o que
# subir junto com a célula — sem lista fixa que envelhece em silêncio. Auxiliar
# batizado fora desse padrão fica rodando a imagem antiga depois de um deploy.
# =============================================================================
name: plataforma

x-celula: &celula
  restart: unless-stopped
  networks: [edge, interna]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  # [ARMADILHAS §3.13] Sem healthcheck aqui, o processo auxiliar não tem como
  # esperar o `migrate` do servidor HTTP terminar: os dois migram em paralelo
  # contra o mesmo banco e um morre com IntegrityError. /healthz respondendo é
  # o sinal de que o `migrate --noinput && uvicorn` do CMD chegou ao fim.
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

# Processo auxiliar de célula. Não serve HTTP e não tem rota pública: fica só na
# rede `interna` (Lei 2, muralha de execução). Sem healthcheck — o que ele tem a
# provar é que não morreu, e disso o `up -d --wait` do deploy já cuida.
x-processo: &processo
  restart: unless-stopped
  networks: [interna]

services:
  traefik:
    image: traefik:v3.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks: [edge]

  postgres:
    image: postgres:17
    restart: unless-stopped
    # POSTGRES_SUPER_PASSWORD: NUNCA passe isso na linha de comando ou em chat
    # com um agente. Crie, uma única vez, o arquivo /opt/plataforma/.env (fora
    # do Git) contendo a linha "POSTGRES_SUPER_PASSWORD=<senha>" — o Docker
    # Compose lê esse arquivo sozinho, sem precisar exportar nada toda vez.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?defina em /opt/plataforma/.env (fora do Git), nunca inline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [interna]

  catalogo:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-catalogo:${CATALOGO_TAG:-main}
    env_file: [env/catalogo.env]

  funil:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-funil:${FUNIL_TAG:-main}
    env_file: [env/funil.env]
    depends_on:
      redis:
        condition: service_started

  # O login do site (DECISAO-celula-de-identidade, 25/08/2026): Google, cookie
  # de sessão e a resposta "quem é o dono desta sessão?". Sem auxiliar — não
  # publica evento e não tem worker.
  identidade:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-identidade:${IDENTIDADE_TAG:-main}
    env_file: [env/identidade.env]

  # ORDEM DE ENTREGA — a lição que este bloco custou, escrita onde o próximo
  # agente vai olhar. Uma célula NOVA cujo PR traz o código E este compose
  # juntos entra num impasse dos dois portões, e os dois estão certos:
  #   1. o merge dispara `deploy-celula` e `deploy-infra` no MESMO commit;
  #   2. o `deploy-celula` corre primeiro, procura os serviços da célula no
  #      compose que está NA VPS — que ainda é o antigo — e aborta de propósito
  #      ("não tem serviço algum… 'up -d' sem argumento subiria a plataforma
  #      inteira");
  #   3. e aí o portão do `deploy-infra` vê um workflow vermelho no mesmo SHA e
  #      recusa entregar o compose novo — que era exatamente o que destravaria
  #      o passo 2.
  # Nenhum rerun sai disso: o vermelho e a cura estão no mesmo commit.
  # A REGRA: o compose de uma célula nova entra em PR PRÓPRIO, sozinho.
  # `deploy-infra` sozinho fica verde, entrega o arquivo, e só então o
  # `deploy-celula` tem onde subir. Caminho de volta: armadilhas/134.
  #
  # A caixa central de avisos (DECISAO-notificacoes, 25/08/2026; gênese em
  # 26/08/2026). NÃO tem rota pública: não aparece no Traefik e nasce sem tela e
  # sem superfície de máquina — quem vai perguntar "quantos avisos eu tenho" é o
  # `funil`, na Fase 4, que é Rito de Contrato. O que ela expõe hoje, e só na
  # rede interna, é o `/healthz` que o healthcheck do `x-celula` bate.
  notificacoes:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-notificacoes:${NOTIFICACOES_TAG:-main}
    env_file: [env/notificacoes.env]

  # Consome as CARTAS do fio (`eventos.notificacao.devida`) e escreve uma linha
  # por carta. É o único jeito de entrar dado nesta célula — ela não tem porta de
  # escrita pública, e é isso que a mantém impossível de corromper de fora.
  notificacoes-consumer:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-notificacoes:${NOTIFICACOES_TAG:-main}
    env_file: [env/notificacoes.env]
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      notificacoes:
        condition: service_healthy

  # A área administrativa (DECISAO-celula-admin, 25/08/2026): painéis, métricas
  # e configuração, atrás do login do site e de uma lista própria de e-mails.
  # Sem auxiliar — não publica evento e não consome fila: ela pergunta e mostra.
  admin:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-admin:${ADMIN_TAG:-main}
    env_file: [env/admin.env]

  quiz:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-quiz:${QUIZ_TAG:-main}
    env_file: [env/quiz.env]

  # Relay de outbox (Huey): publica no Redis Streams os eventos que a célula
  # gravou na outbox (ex.: quiz concluído → lead).
  quiz-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-quiz:${QUIZ_TAG:-main}
    env_file: [env/quiz.env]
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      quiz:
        condition: service_healthy

  leads:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-leads:${LEADS_TAG:-main}
    env_file: [env/leads.env]

  # Consome os eventos de pagamento para a linha do tempo do lead.
  leads-consumer:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-leads:${LEADS_TAG:-main}
    env_file: [env/leads.env]
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      leads:
        condition: service_healthy

  checkout:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-checkout:${CHECKOUT_TAG:-main}
    env_file: [env/checkout.env]

  # Relay de outbox (Huey): publica no Redis Streams os eventos que a célula
  # gravou na outbox. Sem ele, pedido pago não vira evento — nada downstream.
  checkout-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-checkout:${CHECKOUT_TAG:-main}
    env_file: [env/checkout.env]
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      checkout:
        condition: service_healthy

  # Consome eventos.pagamento.aprovado e tira o pedido de `aguardando_pagamento`.
  checkout-consumer:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-checkout:${CHECKOUT_TAG:-main}
    env_file: [env/checkout.env]
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      checkout:
        condition: service_healthy

  pagamentos:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-pagamentos:${PAGAMENTOS_TAG:-main}
    env_file: [env/pagamentos.env]

  alunos:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-alunos:${ALUNOS_TAG:-main}
    env_file: [env/alunos.env]

  # Consome eventos.pagamento.aprovado e cria a Matrícula (R4).
  alunos-consumer:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-alunos:${ALUNOS_TAG:-main}
    env_file: [env/alunos.env]
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      alunos:
        condition: service_healthy

  # A REDE DE SEGURANÇA da caixa de saída da `alunos` (29/08/2026, o aviso de
  # liberação). Ela ganhou voz nesse dia: a carta é publicada na hora, pelo
  # `on_commit` do próprio processo web, e é ele que dá a latência de segundos.
  # ESTE processo é o que republica o que aquele não conseguiu — Redis fora do
  # ar no instante exato da liberação, por exemplo. Sem ele, essa carta ficaria
  # pendente para sempre, e a promessa "você é avisado quando eu te liberar"
  # falharia em silêncio, no caso raro em que mais importa.
  #
  # Irmão idêntico do `sugestoes-relay` logo abaixo, e de propósito: um relay
  # por célula com desenho próprio seriam N modos de falha para o mesmo
  # problema.
  #
  # `condition: service_healthy` em `alunos` é o que impede este processo de
  # migrar em paralelo com o CMD do servidor HTTP contra o mesmo banco — um dos
  # dois morreria com IntegrityError (`armadilhas/013`).
  alunos-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-alunos:${ALUNOS_TAG:-main}
    env_file: [env/alunos.env]
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      alunos:
        condition: service_healthy

  mensageria:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-mensageria:${MENSAGERIA_TAG:-main}
    env_file: [env/mensageria.env]

  # Consome os eventos e REGISTRA o envio, enfileirando a task no Huey.
  # Quem entrega de fato é o mensageria-huey logo abaixo.
  mensageria-consumer:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-mensageria:${MENSAGERIA_TAG:-main}
    env_file: [env/mensageria.env]
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mensageria:
        condition: service_healthy

  # Worker Huey da mensageria (services/mensageria/config/huey.py). Sem este
  # worker a R8 nunca executa: o handler enfileira `enviar_notificacao` e ninguém
  # tira da fila — nenhum e-mail sai, e o retry de 5 tentativas é decorativo.
  mensageria-huey:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-mensageria:${MENSAGERIA_TAG:-main}
    env_file: [env/mensageria.env]
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mensageria:
        condition: service_healthy

  # A Caixa de Sugestões (docs/caixa-de-sugestoes/DECISAO-EVO-01-identidade.md).
  # Serve sob o prefixo público /forms/sugestoes — quem conhece o prefixo é
  # SCRIPT_NAME no env/sugestoes.env, nunca o urls.py da célula.
  # O healthcheck herdado do x-celula bate em http://localhost:8000/healthz SEM
  # prefixo, e está certo assim: a sonda interna não passa pelo Traefik, então a
  # request line chega crua (armadilhas/029). Os DOIS caminhos — o interno
  # `/healthz` e o público `/forms/sugestoes/healthz` — estão travados por
  # services/sugestoes/tests/test_healthz_script_name.py.
  sugestoes:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-sugestoes:${SUGESTOES_TAG:-main}
    env_file: [env/sugestoes.env]

  # Relay de outbox (Huey): publica no Redis Streams o que a Caixa gravou na
  # outbox (contracts/eventos/sugestao.criada.v1.json e irmãos). Sem ele,
  # sugestão que muda de status não vira evento e ninguém é avisado.
  # [ARMADILHAS §3.13] O `condition: service_healthy` em `sugestoes` é o que
  # impede este processo de migrar em paralelo com o CMD do servidor HTTP
  # contra o mesmo banco — um dos dois morreria com IntegrityError.
  sugestoes-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-sugestoes:${SUGESTOES_TAG:-main}
    env_file: [env/sugestoes.env]
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sugestoes:
        condition: service_healthy

  # O forum da escola (DECISAO-forum-da-escola.md, 28/08/2026). Celula de
  # PAGINA, como a `admin`: serve HTML sob o prefixo `/forum`, que ela conhece
  # por `SCRIPT_NAME=/forum` no env dela — o Traefik NAO remove o prefixo.
  #
  # Sem processo auxiliar, e isso e o estado de HOJE, nao uma decisao
  # permanente: o forum ainda e SO DE LEITURA. Quando escrever nascer, a lei
  # §4.6 preve fila de moderacao e a §5 preve o sininho — e ai um auxiliar
  # entra aqui, no molde do `sugestoes-relay`, com `<<: *processo`.
  #
  # O banco `forum_db` e o par `forum_user` NAO nascem daqui: quem os cria e
  # `infra/provisionar-forum.sh`, rodado pelo mantenedor DENTRO da VPS antes
  # desta entrega. Sem ele este servico sobe e morre em crashloop no `migrate`
  # do CMD (licao H18) — e e por isso que aquele passo vem antes deste PR na
  # escada da §7 da lei.
  forum:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-forum:${FORUM_TAG:-main}
    env_file: [env/forum.env]

  # A VOZ do forum (degrau 17, 01/09/2026): publica no fio os quatro fatos que
  # ele afirma — topico criado, mensagem criada, resposta aceita e mensagem
  # removida. Ate aqui o forum era MUDO, e a medalha "Mao amiga" nao tinha como
  # cair porque ninguem contava as respostas aceitas.
  #
  # Como o `gamificacao-relay`, ele NAO e o caminho rapido: quem publica em
  # segundos e o proprio processo web, por `transaction.on_commit`. Este servico
  # e a rede de seguranca que republica o que ficou para tras (Redis fora do ar
  # no instante do commit, processo morto no meio).
  #
  # As duas variaveis vem daqui e nao do env da celula pela mesma razao ja
  # escrita no `gamificacao-consumer`: endereco de Redis nao e segredo, vale
  # igual em toda a plataforma, e e topologia deste compose. O banco 1 e a fila
  # intra-celula, o banco 0 e o fio entre celulas: dividir o mesmo faria uma
  # varredura de chaves de uma passar pelas da outra.
  forum-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-forum:${FORUM_TAG:-main}
    env_file: [env/forum.env]
    environment:
      REDIS_STREAMS_URL: redis://redis:6379/0
      HUEY_REDIS_URL: redis://redis:6379/1
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      forum:
        condition: service_healthy

  # O progresso do aluno (DECISAO-gamificacao.md, 30/08/2026). Celula de PAGINA,
  # como a `admin` e o `forum`: serve HTML sob o prefixo `/conquistas`, que ela
  # conhece por `SCRIPT_NAME=/conquistas` no env dela — o Traefik NAO remove o
  # prefixo (armadilhas/029).
  #
  # O consumidor de eventos entrou logo abaixo, com o motor (degrau 8), e o
  # relay das cartas de celebracao entrou em 01/09/2026 (degrau 9), no molde do
  # `alunos-relay`. Com os dois, a celula OUVE e FALA.
  #
  # O banco `gamificacao_db` e o par `gamificacao_user` NAO nascem daqui: quem os
  # cria e `infra/provisionar-gamificacao.sh`, rodado pelo mantenedor DENTRO da
  # VPS antes desta entrega. Sem ele este servico sobe e morre em crashloop no
  # `migrate` do CMD (licao H18) — e e por isso que aquele passo vem antes deste
  # PR na escada do §6 do plano.
  #
  # E ha um segundo motivo para a ordem, so desta celula: o env que aquele script
  # escreve carrega o `SITE_ID`. Sem ele a celula SOBE e responde, e apenas a
  # etiqueta de todo aluno some — falha aberta, sem tela quebrada e sem alarme.
  # O script se recusa a terminar sem esse campo justamente para que este
  # servico nunca encoste na producao sem ele.
  gamificacao:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-gamificacao:${GAMIFICACAO_TAG:-main}
    env_file: [env/gamificacao.env]

  # Consome os quatro assuntos que a economia semeada conhece e transforma cada
  # um em XP, pelas regras que estao no BANCO (R4). Nenhuma regra esta ligada
  # hoje: este processo sobe, escuta e nao credita ninguem ate o mantenedor
  # ligar a primeira.
  #
  # ESTE SERVICO LEVOU DOIS DEPLOYS PARA CHEGAR AQUI, e a licao vale a linha.
  # O merge que o criou (PR #719, 31/08/2026) teve o `deploy-infra` CANCELADO
  # pela cadeira musical e depois VERMELHO com `i/o timeout` na porta 22, com a
  # VPS viva (`armadilhas/127`). Tres reruns depois, todos cancelados por novos
  # merges chegando, ficou claro o que a 127 nao diz: num repositorio movimentado
  # o rerun NAO e o caminho, porque ele revive um run de SHA velho e a
  # concorrencia o mata de novo. O que funciona e um commit NOVO tocando
  # `infra/`, que cria uma publicacao propria com o topo da main.
  #
  # [ARMADILHAS §3.13] O `condition: service_healthy` em `gamificacao` e o que
  # impede este processo de migrar em paralelo com o CMD do servidor HTTP
  # contra o mesmo banco — um dos dois morreria com IntegrityError.
  #
  # REDIS_STREAMS_URL VEM DAQUI, E NAO DO ENV DA CELULA, e a diferenca em
  # relacao as outras celulas consumidoras e deliberada. Naquelas o valor esta
  # no `env/<celula>.env`, escrito pelo provisionamento. Aqui o provisionamento
  # JA RODOU, na mao do mantenedor, em 31/08/2026 — e o script nao escreveu esta
  # chave porque a celula ainda nao consumia evento nenhum. Acrescenta-la la
  # agora custaria um SEGUNDO passo manual dele, para uma variavel que nao e
  # segredo e vale igual em toda a plataforma: e topologia deste compose, nao
  # configuracao desta celula. O `infra/env/gamificacao.env.exemplo` diz isso
  # por escrito, para ninguem procurar a chave la e concluir que ela sumiu.
  gamificacao-consumer:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-gamificacao:${GAMIFICACAO_TAG:-main}
    env_file: [env/gamificacao.env]
    environment:
      REDIS_STREAMS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gamificacao:
        condition: service_healthy

  # A VOZ da celula (degrau 9, 01/09/2026): publica no fio as cartas de
  # celebracao que a outbox guardou. Hoje sai uma so — "voce subiu de nivel" —,
  # e as outras tres da Sessao B (medalha, marco validado, destaque da semana)
  # entram sem tocar neste arquivo, porque o que falta a elas e o FATO, nao o
  # caminho.
  #
  # ELE NAO E O CAMINHO PRINCIPAL, E ISSO E DE PROPOSITO. Quem publica em
  # segundos e o proprio processo que creditou o XP, por `transaction.on_commit`
  # — dentro do `gamificacao-consumer`, logo acima. Este servico e a REDE DE
  # SEGURANCA: a cada minuto ele republica o que ficou para tras (Redis fora do
  # ar no instante do commit, processo morto no meio). Sem ele nada se perde
  # HOJE, mas a carta ficaria pendente para sempre no dia em que o publish
  # falhasse, e ninguem acusaria.
  #
  # As duas variaveis vem DAQUI e nao do env da celula, pela mesma razao ja
  # escrita no `gamificacao-consumer`: o `infra/provisionar-gamificacao.sh`
  # rodou em 31/08/2026, quando esta celula nao consumia nem publicava evento
  # nenhum, e voltar a escrever nele custaria um passo manual do mantenedor por
  # valores que nao sao segredo e valem igual em toda a plataforma. Sao
  # topologia deste compose, nao configuracao da celula.
  #
  # `HUEY_REDIS_URL` aponta para o banco 1 do Redis e `REDIS_STREAMS_URL` para o
  # 0, exatamente como nas outras celulas: a fila intra-celula e o fio entre
  # celulas sao coisas diferentes, e dividir o mesmo banco faria uma varredura
  # de chaves de uma passar pelas da outra.
  gamificacao-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-gamificacao:${GAMIFICACAO_TAG:-main}
    env_file: [env/gamificacao.env]
    environment:
      REDIS_STREAMS_URL: redis://redis:6379/0
      HUEY_REDIS_URL: redis://redis:6379/1
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gamificacao:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # A MEDICAO (`metricas`) — o livro de fatos da plataforma.
  # `PLANO-PAINEL-DE-GESTAO.md` §6.2, degrau 7.5. Ela nao tem tela e nao tem
  # rota publica: nenhum `labels:` de Traefik aqui, e nao e esquecimento. Quem
  # mostra numero nesta casa e a `admin`, que ja tem porta e cracha; esta celula
  # so fala com quem esta na rede interna, e hoje nem isso (a porta de leitura
  # nasce no degrau 7.4).
  #
  # O servico web existe mesmo sem porta publica por um motivo pratico: e o
  # `/healthz` dele que o `x-celula` bate, e e o CMD dele que roda o `migrate`.
  # Sem ele, o processo auxiliar migraria sozinho e nada provaria que a celula
  # subiu (ARMADILHAS §3.13).
  metricas:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-metricas:${METRICAS_TAG:-main}
    env_file: [env/metricas.env]

  # O que de fato trabalha nesta celula: escuta os dez assuntos com contrato
  # congelado e guarda cada fato. Envelope torto nao derruba nada e nao some —
  # vira linha na fila de eventos mortos, que o painel mostra.
  metricas-eventos:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-metricas:${METRICAS_TAG:-main}
    env_file: [env/metricas.env]
    environment:
      REDIS_STREAMS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "consume_eventos"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      metricas:
        condition: service_healthy

  # A sala de aula (DECISAO-celula-de-cursos.md, 04/09/2026). Degrau 1.7 da
  # escada de PLANO-CELULA-CURSOS.md §10: o passo H do mantenedor
  # (infra/provisionar-cursos.sh) já rodou na VPS antes deste PR — é o
  # PORTÃO deste degrau, e é o que faz `env/cursos.env` existir com
  # `SITE_ID` preenchido antes de o container tentar subir.
  #
  # ORDEM DE ENTREGA: este compose entra sozinho, em PR próprio, pela mesma
  # razão gravada no bloco `identidade` acima — uma célula nova cujo PR traz
  # código E compose juntos trava os dois deploys no mesmo commit
  # (`armadilhas/134`). O código da célula já está na `main` desde os PRs
  # #1046 a #1067; só faltava este arquivo.
  #
  cursos:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-cursos:${CURSOS_TAG:-main}
    env_file: [env/cursos.env]

  # O relay do checkpoint (degrau 2.1, PR #1071): publica envio.recebido.v1 e
  # revisao.prazo-estourado.v1 (outbox + Huey, molde byte a byte de
  # `sugestoes`) e roda o tique periodico que registra o estouro do prazo de
  # 24h. Sem este servico o Envio grava normalmente (a entrega do aluno nao
  # quebra), mas os dois eventos ficam pendentes para sempre e o relogio de
  # prazo nunca roda sozinho — foi assim que o PR #1071 o deixou, de proposito
  # (relay e topologia de infra, nao codigo de celula).
  #
  # AS DUAS VARIAVEIS VEM DAQUI, e nao de `env/cursos.env`, pela MESMA razao
  # gravada no bloco `gamificacao-consumer`: o provisionamento
  # (`infra/provisionar-cursos.sh`) ja rodou, em 05/09/2026, antes de a
  # celula consumir ou emitir evento nenhum, e escrever isto exigiria um
  # SEGUNDO passo manual do mantenedor para duas variaveis que nao sao
  # segredo e valem igual em toda a plataforma. `infra/env/cursos.env.exemplo`
  # ja diz isto por escrito, para ninguem procurar a chave la.
  #
  # HUEY_REDIS_URL usa o banco 9: os bancos 1 a 8 do Redis ja sao de outras
  # celulas (`infra/env/*.env.exemplo`), e cada fila Huey precisa do PROPRIO
  # banco — dividir um banco entre duas celulas misturaria as tarefas de uma
  # com a outra.
  cursos-relay:
    <<: *processo
    image: ghcr.io/abundanciabr/plataforma-cursos:${CURSOS_TAG:-main}
    env_file: [env/cursos.env]
    environment:
      HUEY_REDIS_URL: redis://redis:6379/9
      REDIS_STREAMS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "run_huey"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      cursos:
        condition: service_healthy

  # A casa das Paginas do aluno e do portfolio (corredor CS-PAGES-0001, degrau
  # 05 da escada de PLANO-PORTFOLIO-DO-ALUNO.md secao 5). O passo manual do
  # mantenedor (infra/provisionar-pages.sh) ja rodou na VPS antes deste PR: e o
  # PORTAO deste degrau, e e ele que faz `env/pages.env` existir com
  # `DATABASE_URL` e `SCRIPT_NAME=/pages` antes de o container tentar subir.
  # Sem banco, `DATABASE_URL` e fail-hard e o container entra em crashloop
  # (`armadilhas/088`, passo 2).
  #
  # ORDEM DE ENTREGA: este compose entra sozinho, sem tocar `services/`, pela
  # mesma razao gravada no bloco `identidade` acima. PR de celula nova com
  # codigo E compose juntos trava os DOIS deploys no mesmo commit, e nenhum
  # rerun sai disso porque o vermelho e a cura moram no mesmo SHA
  # (`armadilhas/134`). O codigo desta celula ja esta na `main` desde os PRs
  # #1117 a #1151, e o `deploy-celula` dela vem vermelho desde entao de
  # proposito (`armadilhas/088`): e ESTE arquivo que faltava.
  #
  # SEM PROCESSO AUXILIAR, e a ausencia e o desenho de hoje, nao esquecimento:
  # esta celula nao tem `management/commands/` nenhum, e o relay dos eventos
  # `pages.portfolio.*` nasce junto com o degrau que os publicar. Auxiliar
  # declarado com um `command:` que a imagem ainda nao tem sai do ar como
  # `Unknown command`, e o passo de verificacao do `deploy-infra` exige TODOS
  # os servicos declarados em `running`: um so que nao suba derruba a
  # verificacao da plataforma inteira (`armadilhas/088`, passo 4).
  pages:
    <<: *celula
    image: ghcr.io/abundanciabr/plataforma-pages:${PAGES_TAG:-main}
    env_file: [env/pages.env]

volumes:
  pgdata: {}
  redisdata: {}
  letsencrypt: {}

networks:
  edge:
    external: true
  interna:
    external: true
