services:
  ajustar:
    image: "python@sha256:2055081c860db8c842b663415b795b026e7e5cc63b59c5193fcc9997713ea5b8"
    user: "0:0"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "128m"
    cpus: "0.25"
    pids_limit: 32
