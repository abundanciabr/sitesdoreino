    entrypoint: ["python3","-B","-I","-c","import base64,hashlib,json,lzma,pathlib,runpy;d=lzma.decompress(base64.b64decode(''));assert hashlib.sha256(d).hexdigest()=='c44d94b035629296f74367b30e900d9980ef581d1629a127d8769eec31246a85';f=json.loads(d);assert set(f)=={\"aplicar.py\",\"mudancas.json\"};p=pathlib.Path(\"/tmp/pacote\");p.mkdir();[(p/n).write_text(v,encoding=\"utf-8\") for n,v in f.items()];runpy.run_path(str(p/\"aplicar.py\"),run_name=\"__main__\")"]
