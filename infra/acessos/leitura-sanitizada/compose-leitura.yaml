services:
  leitura:
    image: "python@sha256:2055081c860db8c842b663415b795b026e7e5cc63b59c5193fcc9997713ea5b8"
    user: "0:0"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "128m"
    cpus: "0.25"
    pids_limit: 32
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    entrypoint: ["python3","-B","-I","-c","import base64,hashlib,lzma;d=lzma.decompress(base64.b64decode(''));assert hashlib.sha256(d).hexdigest()=='b7471e54b0c5653762e9cd3fd2d6060127fd9791bb5adb62f1ad0adf7495a2a7';exec(compile(d,\"leitura.py\",\"exec\"))"]
    command: ["ler"]
    restart: "unless-stopped"
    cap_add: ["DAC_READ_SEARCH"]
    volumes: [{"type":"bind","source":"/usr/local/lib/meshcraft-acessos/leituras-sanitizadas","target":"/usr/local/lib/meshcraft-acessos/leituras-sanitizadas","read_only":false,"bind":{"create_host_path":false}},{"type":"bind","source":"/var/lib/meshcraft-integrador/entregas/fases","target":"/entrada/fases","read_only":true,"bind":{"create_host_path":false}},{"type":"bind","source":"/opt/plataforma/ensaios/selecionadas","target":"/entrada/selecionadas","read_only":true,"bind":{"create_host_path":false}},{"type":"bind","source":"/opt/plataforma/ensaios/execucoes","target":"/entrada/execucoes","read_only":true,"bind":{"create_host_path":false}},{"type":"bind","source":"/usr/local/lib/meshcraft-publicador/atual/provas-funil/tests","target":"/referencia/provas-funil/tests","read_only":true,"bind":{"create_host_path":false}}]
    logging: {"driver":"json-file","options":{"max-size":"1m","max-file":"1"}}
