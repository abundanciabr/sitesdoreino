[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "outbox-relay"
version = "0.3.0"
description = "Relay comum de outbox para Redis Streams nas celulas da plataforma."
requires-python = ">=3.12"
dependencies = [
  "redis==5.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
