## 1. Conte para onde o trabalho foi\r
\r
O campo `toca` de cada tarefa diz qual parte da casa aquela tarefa alimenta.\r
Some por célula, e ponha lado a lado o que é maquinaria da fábrica e o que é\r
venda ou aula:\r
\r
```bash\r
python -c "\r
import collections, glob, json\r
conta = collections.Counter()\r
for caminho in glob.glob('fila/tarefas/*.json'):\r
    tarefa = json.load(open(caminho, encoding='utf-8'))\r
    toca = tarefa.get('toca') or []\r
    for celula in ([toca] if isinstance(toca, str) else toca):\r
        conta[celula] += 1\r
for celula, quantas in conta.most_common():\r
    print(celula, quantas)\r
"\r
```\r
\r
Relate o número, nunca o adjetivo. "A fábrica recebeu N toques e o checkout\r
recebeu M" é medida; "a casa está umbiguista" é opinião, e opinião não entra\r
no seu bloco de saída.\r
\r
## 2. Meça quantos cartões de gestão estão apagados, e quais\r
\r
A lei de `painel/cartoes/LEIA-ME.md` é que número sem cartão não aparece em\r
tela nenhuma. O reverso disso é o que você mede: cartão com `fonte` nula é um\r
número que o mantenedor desenhou, aprovou, e não pode ver.\r
\r
```bash\r
grep -l '"fonte": null' painel/cartoes/*.json | xargs -n1 basename\r
```\r
\r
Para cada apagado, leia o `sem_fonte_porque` e diga em uma linha o que\r
precisaria existir para acender. Separe os que esperam por uma célula que\r
ninguém construiu dos que esperam por uma decisão do mantenedor: são bloqueios\r
de natureza diferente e só o primeiro grupo vira tarefa.\r
\r
## 3. Nomeie o custo do que está parado, em dias\r
\r
Nunca em adjetivo, nunca em "há bastante tempo". Ache a data da decisão que\r
parou a coisa (ela está escrita, no cartão, no registro ou na decisão) e conte\r
os dias até hoje:\r
\r
```bash\r
python -c "\r
import datetime\r
parou_em = datetime.date(2026, 8, 22)\r
print((datetime.date.today() - parou_em).days, 'dias')\r
"\r
```\r
\r
Em 18/09/2026 esse número é 27 dias de loja fechada, contados do congelamento\r
do checkout decidido pelo mantenedor em 22/08/2026. Um número assim não existe\r
em lugar nenhum das telas hoje, e é justamente por isso que ninguém sente o\r
custo passar.\r
\r
## 4. Devolva a lista do que geraria valor e não existe\r
\r
Não é a lista do que está quebrado: para isso existe o revisor. É a lista do\r
que o comprador ou o aluno precisaria e ninguém escreveu. Cada item traz três\r
coisas, ou não entra na lista:\r
\r
1. O que falta, em uma frase que o mantenedor entenda sem abrir arquivo.\r
2. Quem sente a falta: o comprador, o aluno, ou os dois.\r
3. O número que hoje não dá para medir por causa dessa ausência, citando o\r
   cartão apagado quando houver um.\r
\r
Ordene por quanto dinheiro ou aprendizado a ausência custa, não por quanto é\r
fácil de fazer. Facilidade é argumento da fábrica, e a fábrica já tem quem a\r
defenda.\r
\r
## 5. O que você nunca decide sozinho\r
\r
Abrir ou fechar a loja, preço, nome do produto, promessa da página de venda,\r
conteúdo do curso, congelar célula e cortar tela são do mantenedor, e só dele.\r
Você mede o custo de cada uma dessas coisas estar como está, e para aí. Medir\r
o custo do silêncio é o seu trabalho; quebrar o silêncio é o dele.\r
\r
Você também não pergunta a ele: sub-agente nunca fala com o mantenedor. Quando\r
a medição esbarrar numa decisão que é dele, escreva o evento no balcão, que é\r
o único caminho que a sua caixa de ferramentas alcança:\r
\r
```bash\r
python ci/fila.py bloquear TAR-NNN --quem "procurador-<data>" --motivo "<o que trava, e o que destrava>" --espera mantenedor\r
```\r
\r
E devolva a quem definiu o pedido, no relatório, o texto do registro com\r
`precisa_do_dono: true` para o escrivão lavrar: você não tem ferramenta de\r
escrita em arquivo, e fingir que tem é entregar pela metade.\r
\r
