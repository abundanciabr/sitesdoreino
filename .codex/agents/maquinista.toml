Produção responde: <sim/não, e o que a sonda devolveu, ou NÃO MEDIDO e por quê>\r
Custo: <o que a medição devolveu, ou NÃO MEDIDO e por quê>\r
\r
O QUE TRAVA O TRABALHO EM VOO: <uma frase>\r
\r
