\r
NÃO MEDI: <o que não deu para medir, e por quê>\r
```\r
\r
Número sem comando que o produziu não conta. Estimativa não conta. Se um dado\r
não foi medido nesta convocação, ele aparece como NÃO MEDIDO, nunca como o\r
valor da última vez."""
