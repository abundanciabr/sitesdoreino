<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Evolução v2 — Profissão Desenvolver Roblox 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15161c; --ink-2:#1b1d25; --panel:#1e202b; --panel-hover:#262838;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --orange:#ff7a33; --orange-dim:rgba(255,122,51,.14);
    --blue:#4c8dff; --blue-dim:rgba(76,141,255,.14);
    --green:#34d399; --green-dim:rgba(52,211,153,.14);
    --text:#edeef2; --text-dim:#9a9db0; --text-faint:#5c5f70;
    --f-display:'Space Grotesk',sans-serif; --f-body:'Manrope',sans-serif; --f-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--text); font-family:var(--f-body);
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px; background-position:center -1px; background-attachment:fixed;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:32px 24px 72px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 18px;border-bottom:1px solid var(--line);margin-bottom:24px;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .gizmo-sm{width:30px;height:30px;flex-shrink:0;}
  .gizmo-spin{transform-box:view-box;transform-origin:20px 20px;animation:spin 24s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.gizmo-spin{animation:none;}}
  .brand-name{font-family:var(--f-display);font-weight:600;font-size:17px;}
  .crumb{color:var(--text-faint);font-size:13px;}
  .crumb::before{content:'/';margin-right:8px;color:var(--text-faint);}
  .stats-mini{font-family:var(--f-mono);font-size:12px;color:var(--text-faint);display:flex;gap:16px;}
  .stats-mini b{color:var(--text-dim);font-weight:500;}

  .workspace{display:flex;gap:20px;align-items:flex-start;}
  .rail{display:flex;flex-direction:column;align-items:center;gap:8px;width:52px;flex-shrink:0;padding:2px 0;}
  .rail-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
  .rail-btn:hover{border-color:var(--line-strong);color:var(--text);}
  .rail-btn.active{border-color:var(--orange);color:var(--orange);background:var(--orange-dim);}
  .rail-icon{width:17px;height:17px;}
  .rail-spacer{flex:1;}

  .main{flex:1;min-width:0;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tabs button{font-family:var(--f-body);font-size:13px;color:var(--text-dim);background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:7px;cursor:pointer;}
  .tabs button.active{color:var(--text);border-color:var(--line-strong);background:var(--panel-hover);box-shadow:inset 0 -2px 0 var(--orange);}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
  .tile:hover{border-color:var(--line-strong);}
  .tile.selected{border-color:var(--orange);}
  .tile-swatch{position:relative;padding:20px 12px 12px;display:flex;align-items:flex-start;justify-content:space-between;}
  .tile-icon{width:24px;height:24px;color:var(--text-faint);}
  .tile-vote{display:flex;align-items:center;gap:4px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-family:var(--f-mono);font-size:11px;color:var(--text-dim);}
  .tile.selected .tile-vote{border-color:var(--orange);color:var(--orange);}
  .tile-vote-arrow{font-size:9px;}
  .tile-body{padding:0 12px 12px;}
  .tile-body .status{display:inline-block;margin-bottom:8px;}
  .tile-title{font-family:var(--f-display);font-weight:600;font-size:13.5px;margin:0 0 8px;line-height:1.35;}
  .tile-foot{font-size:11px;color:var(--text-faint);}

  .swatch-ferramentas{background:#2a231e;} .swatch-blender{background:#2b2118;} .swatch-roblox{background:#2a1c1c;}
  .swatch-curso{background:#1a222b;} .swatch-carreira{background:#182a26;} .swatch-plataforma{background:#221c2b;}

  .status{font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;}
  .status-analise{color:#a9acc0;background:rgba(255,255,255,.06);}
  .status-planejado{color:var(--blue);background:var(--blue-dim);}
  .status-desenvolvimento{color:var(--orange);background:var(--orange-dim);}
  .status-implementado{color:var(--green);background:var(--green-dim);}

  .inspector{width:288px;flex-shrink:0;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:20px;position:sticky;top:20px;}
  .detail-id{font-family:var(--f-mono);font-size:11px;color:var(--text-faint);margin-bottom:12px;line-height:1.5;}
  .card-title{font-family:var(--f-display);font-weight:600;margin:0 0 14px;}
  .detail-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:18px;}
  .detail-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:0 0 5px;font-weight:500;}
  .detail-block p{font-size:13px;color:var(--text-dim);margin:0;line-height:1.55;}

  .timeline{display:flex;align-items:flex-start;margin:18px 0;}
  .timeline-step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;flex:1;}
  .timeline-step .dot{width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--text-faint);z-index:1;}
  .timeline-step.done .dot{border-color:var(--orange);background:var(--orange);}
  .timeline-step .line{position:absolute;top:3.5px;left:50%;width:100%;height:2px;background:var(--line-strong);}
  .timeline-step:last-child .line{display:none;}
  .timeline-step span{font-family:var(--f-mono);font-size:10px;color:var(--text-faint);text-align:center;}

  .comments{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .comment{display:flex;gap:8px;}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--ink-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;color:var(--text-dim);flex-shrink:0;}
  .comment p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .card-foot{font-size:12px;color:var(--text-faint);margin:4px 0 0;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .field input,.field textarea{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:var(--f-body);font-size:13px;padding:9px 10px;}
  .field textarea{resize:vertical;min-height:58px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;}
  .chip.selected{color:var(--orange);border-color:var(--orange);background:var(--orange-dim);}
  .tag-icon{width:12px;height:12px;}
  .submit{width:100%;font-weight:600;font-size:13.5px;color:var(--ink);background:var(--orange);border:none;border-radius:7px;padding:11px;cursor:pointer;margin-top:4px;}
  .submit:hover{filter:brightness(1.08);}

  .impact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .impact-stat{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .impact-stat b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;}
  .impact-stat span{font-size:11px;color:var(--text-dim);}

  .section-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;margin:44px 0 14px;}
  .tl-strip{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .tl-zone{flex:1;padding:14px 16px;position:relative;min-width:0;}
  .tl-zone + .tl-zone{border-left:1px solid var(--line);}
  .tl-zone-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-bottom:16px;}
  .tl-zone-label .dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);}
  .tl-zone[data-zone="planejado"] .dot{background:var(--blue);}
  .tl-zone[data-zone="desenvolvimento"] .dot{background:var(--orange);}
  .tl-zone[data-zone="implementado"] .dot{background:var(--green);}
  .tl-track{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;min-height:30px;}
  .tl-marker{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .tl-diamond{width:9px;height:9px;background:var(--text-faint);transform:rotate(45deg);}
  .tl-zone[data-zone="planejado"] .tl-diamond{background:var(--blue);}
  .tl-zone[data-zone="desenvolvimento"] .tl-diamond{background:var(--orange);}
  .tl-zone[data-zone="implementado"] .tl-diamond{background:var(--green);}
  .tl-v{font-family:var(--f-mono);font-size:10px;color:var(--text-faint);}

  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--text-faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  @media (max-width:820px){
    .workspace{flex-direction:column;}
    .rail{flex-direction:row;width:100%;}
    .rail-spacer{display:none;}
    .inspector{width:100%;position:static;}
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:480px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-cube" viewBox="0 0 20 20"><path d="M10 2 17 5.5 17 13.5 10 17 3 13.5 3 5.5 Z M10 9.5 10 2 M10 9.5 17 13.5 M10 9.5 3 13.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 20 20"><path d="M13.5 3.5a3 3 0 00-4.2 3.8L4 12.6V16h3.4l5.3-5.3a3 3 0 003.8-4.2l-2.1 2.1-1.9-.5-.5-1.9 2.1-2.1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-blocks" viewBox="0 0 20 20"><rect x="3" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="5" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6" y="12.3" width="6" height="4.7" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="i-book" viewBox="0 0 20 20"><path d="M10 5c-1.5-1-4-1.3-6-1v11c2 0 4.3.4 6 1.4 1.7-1 4-1.4 6-1.4V4c-2-.3-4.5 0-6 1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M10 5v11.4" stroke="currentColor" stroke-width="1.3" fill="none"/></symbol>
  <symbol id="i-case" viewBox="0 0 20 20"><rect x="3" y="7.5" width="14" height="9" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 7.5V6a2 2 0 012-2h1a2 2 0 012 2v1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 11.5h14" stroke="currentColor" stroke-width="1.3" fill="none"/></symbol>

  <symbol id="i-grid" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="3" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="11" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="11" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="i-bars" viewBox="0 0 20 20"><line x1="3" y1="6" x2="17" y2="6" stroke="currentColor" stroke-width="1.3"/><line x1="3" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.3"/><line x1="3" y1="14" x2="15" y2="14" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 17c1-3.5 4-5 6-5s5 1.5 6 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
</svg>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <svg class="gizmo-sm" viewBox="0 0 40 40" aria-hidden="true">
        <g class="gizmo-spin">
          <line x1="20" y1="20" x2="32" y2="24" stroke="#ff5c5c" stroke-width="1.6"/><circle cx="32" cy="24" r="3.2" fill="#ff5c5c"/>
          <line x1="20" y1="20" x2="10" y2="10" stroke="#34d399" stroke-width="1.6"/><circle cx="10" cy="10" r="3.2" fill="#34d399"/>
          <line x1="20" y1="20" x2="20" y2="6" stroke="#4c8dff" stroke-width="1.6"/><circle cx="20" cy="6" r="3.2" fill="#4c8dff"/>
          <circle cx="20" cy="20" r="2.2" fill="#edeef2"/>
        </g>
      </svg>
      <span class="brand-name">Central de Evolução</span>
      <span class="crumb" id="crumb">Quadro</span>
    </div>
    <div class="stats-mini"><span><b>312</b> sugestões</span><span><b>14.028</b> votos</span><span><b>41</b> implementadas</span></div>
  </div>

  <div class="workspace">
    <div class="rail">
      <button class="rail-btn active" id="nav-quadro" title="Quadro" aria-label="Quadro"><svg class="rail-icon"><use href="#i-grid"/></svg></button>
      <button class="rail-btn" id="nav-roadmap" title="Roadmap" aria-label="Roadmap"><svg class="rail-icon"><use href="#i-bars"/></svg></button>
      <button class="rail-btn" id="nav-nova" title="Nova ideia" aria-label="Nova ideia"><svg class="rail-icon"><use href="#i-plus"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="nav-perfil" title="Meu impacto" aria-label="Meu impacto"><svg class="rail-icon"><use href="#i-user"/></svg></button>
    </div>

    <div class="main">
      <div class="tabs">
        <button class="active">Em alta</button>
        <button>Mais votadas</button>
        <button>Novas</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="inspector" id="inspector"></div>
  </div>

  <p class="section-label">Roadmap</p>
  <div class="tl-strip" id="roadmap-strip">
    <div class="tl-zone" data-zone="analise"><div class="tl-zone-label"><span class="dot"></span>Em análise</div><div class="tl-track"></div></div>
    <div class="tl-zone" data-zone="planejado"><div class="tl-zone-label"><span class="dot"></span>Planejado</div><div class="tl-track"></div></div>
    <div class="tl-zone" data-zone="desenvolvimento"><div class="tl-zone-label"><span class="dot"></span>Em desenvolvimento</div><div class="tl-track"></div></div>
    <div class="tl-zone" data-zone="implementado"><div class="tl-zone-label"><span class="dot"></span>Implementado</div><div class="tl-track"></div></div>
  </div>

  <footer><span>Central de Evolução — v2</span><span>Profissão Desenvolver Roblox 3D</span></footer>
</div>

<script>
  var CATS = {
    ferramentas:{label:'Ferramentas', icon:'i-wrench'},
    blender:{label:'Blender e modelagem 3D', icon:'i-cube'},
    roblox:{label:'Roblox Studio', icon:'i-blocks'},
    curso:{label:'Curso e aulas', icon:'i-book'},
    carreira:{label:'Carreira e clientes', icon:'i-case'},
    plataforma:{label:'Plataforma', icon:'i-layers'}
  };
  var STATUS_ORDER = ['analise','planejado','desenvolvimento','implementado'];
  var STATUS_LABEL = {analise:'Em análise', planejado:'Planejado', desenvolvimento:'Em desenvolvimento', implementado:'Implementado'};

  var SUGGESTIONS = [
    {id:728, title:'Gerador de portfólio profissional', cat:'carreira', status:'desenvolvimento', votes:218, authors:176, commentCount:31,
     problem:'Termino os projetos do curso mas não tenho onde reunir tudo numa página que eu possa mandar pra um cliente ou vaga.',
     solution:'Uma página tipo portfólio, só com os projetos que eu quiser mostrar publicamente.',
     dates:['12 mai','2 jun','19 jul',''],
     comments:[{who:'L.',text:'Isso ia ajudar demais na hora de procurar freela.'},{who:'R.',text:'Voto muito nisso — já perdi contato de cliente por não ter onde mostrar meu trabalho.'}]},
    {id:731, title:'Biblioteca de materiais e texturas Blender', cat:'blender', status:'planejado', votes:143, authors:118, commentCount:17,
     problem:'Não tenho onde encontrar materiais e texturas prontos pra usar direto nos projetos do curso.',
     solution:'Uma biblioteca com pacotes de materiais testados pelo próprio curso.', dates:['4 jun','22 jun','','']},
    {id:745, title:'Desafios semanais de modelagem', cat:'curso', status:'planejado', votes:96, authors:81, commentCount:9,
     problem:'Termino a aula e não sei o que praticar até a próxima semana.',
     solution:'Um desafio curto toda semana, com prazo e galeria de respostas dos colegas.', dates:['15 jun','30 jun','','']},
    {id:702, title:'Modo escuro no player de aulas', cat:'plataforma', status:'analise', votes:58, authors:52, commentCount:4,
     problem:'Assisto às aulas de noite e a tela branca do player cansa a vista depois de um tempo.',
     solution:'', dates:['3 ago','','','']},
    {id:611, title:'Calculadora de preço para modelos Roblox', cat:'carreira', status:'implementado', votes:304, authors:261, commentCount:48,
     problem:'Não sei quanto cobrar por um modelo ou mapa pro Roblox quando um cliente pede.',
     solution:'Uma calculadora com base no tempo de produção, complexidade e uso comercial.', dates:['2 fev','20 fev','15 mar','30 abr']},
    {id:719, title:'Conversor FBX para Roblox', cat:'ferramentas', status:'analise', votes:121, authors:97, commentCount:12,
     problem:'Exportar do Blender pro Roblox tem muitos passos manuais e a escala sempre sai errada.',
     solution:'Um plugin que ajusta escala e materiais automaticamente na exportação.', dates:['30 jul','','','']}
  ];

  var selected = SUGGESTIONS[0];
  var gridEl = document.getElementById('grid');
  var inspectorEl = document.getElementById('inspector');
  var crumbEl = document.getElementById('crumb');

  function renderGrid(){
    gridEl.innerHTML = SUGGESTIONS.map(function(s){
      var cat = CATS[s.cat];
      var sel = s.id === selected.id ? ' selected' : '';
      return '<article class="tile'+sel+'" data-id="'+s.id+'" tabindex="0">'
        + '<div class="tile-swatch swatch-'+s.cat+'">'
        + '<svg class="tile-icon"><use href="#'+cat.icon+'"/></svg>'
        + '<span class="tile-vote"><span class="tile-vote-arrow">▲</span>'+s.votes+'</span>'
        + '</div><div class="tile-body">'
        + '<span class="status status-'+s.status+'">'+STATUS_LABEL[s.status]+'</span>'
        + '<h4 class="tile-title">'+s.title+'</h4>'
        + '<span class="tile-foot">'+s.commentCount+' comentários</span>'
        + '</div></article>';
    }).join('');
    gridEl.querySelectorAll('.tile').forEach(function(tile){
      tile.addEventListener('click', function(){
        selected = SUGGESTIONS.find(function(x){ return x.id == tile.dataset.id; });
        renderGrid();
        showDetailPanel();
        setActiveRail('nav-quadro');
      });
    });
  }

  function renderInspectorDetail(s){
    var cat = CATS[s.cat];
    var idx = STATUS_ORDER.indexOf(s.status);
    var timelineHtml = STATUS_ORDER.map(function(key,i){
      var done = i <= idx;
      var date = s.dates[i];
      return '<div class="timeline-step'+(done?' done':'')+'"><div class="line"></div><div class="dot"></div><span>'+STATUS_LABEL[key]+'<br>'+(date||'—')+'</span></div>';
    }).join('');
    var commentsHtml;
    if(s.comments){
      commentsHtml = '<div class="comments">'+s.comments.map(function(c){
        return '<div class="comment"><div class="avatar">'+c.who+'</div><p>'+c.text+'</p></div>';
      }).join('')+'</div>';
    } else {
      commentsHtml = '<p class="card-foot">'+s.commentCount+' comentários</p>';
    }
    inspectorEl.innerHTML =
      '<div class="detail-id">#'+s.id+' · '+cat.label+' · '+s.votes+' votos · '+s.authors+' autores únicos</div>'
      + '<h3 class="card-title" style="font-size:17px;">'+s.title+'</h3>'
      + '<div class="detail-grid">'
      + '<div class="detail-block"><h4>Problema</h4><p>'+s.problem+'</p></div>'
      + '<div class="detail-block"><h4>Solução proposta</h4><p>'+(s.solution || 'O aluno não sugeriu uma solução específica.')+'</p></div>'
      + '</div><div class="timeline">'+timelineHtml+'</div>'
      + commentsHtml;
  }

  function showDetailPanel(){ crumbEl.textContent = 'Quadro'; renderInspectorDetail(selected); }

  function showComposerPanel(){
    crumbEl.textContent = 'Nova ideia';
    inspectorEl.innerHTML =
      '<div class="detail-id">Nova ideia</div>'
      + '<div class="field"><label>O que você gostaria que existisse?</label><input type="text" placeholder="Ex: gerador de portfólio"></div>'
      + '<div class="field"><label>Que problema isso resolveria pra você?</label><textarea placeholder="Conte a situação real, não só a solução."></textarea></div>'
      + '<div class="field"><label>Categoria</label><div class="chips" id="composer-chips"></div></div>'
      + '<button class="submit">Publicar sugestão</button>';
    var chipsEl = document.getElementById('composer-chips');
    chipsEl.innerHTML = Object.keys(CATS).map(function(key,i){
      return '<span class="chip'+(i===1?' selected':'')+'" data-cat="'+key+'"><svg class="tag-icon"><use href="#'+CATS[key].icon+'"/></svg>'+CATS[key].label.split(' ')[0]+'</span>';
    }).join('');
    chipsEl.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        chipsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('selected'); });
        chip.classList.add('selected');
      });
    });
  }

  function showImpactPanel(){
    crumbEl.textContent = 'Meu impacto';
    inspectorEl.innerHTML =
      '<div class="detail-id">Meu impacto</div>'
      + '<div class="impact-grid">'
      + '<div class="impact-stat"><b>12</b><span>ideias sugeridas</span></div>'
      + '<div class="impact-stat"><b>31</b><span>ideias apoiadas</span></div>'
      + '<div class="impact-stat"><b>3</b><span>entraram no roadmap</span></div>'
      + '<div class="impact-stat"><b>847</b><span>alunos votaram nas suas ideias</span></div>'
      + '</div>';
  }

  function setActiveRail(id){
    document.querySelectorAll('.rail-btn').forEach(function(b){ b.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  function renderTimelineStrip(){
    STATUS_ORDER.forEach(function(key){
      var track = document.querySelector('.tl-zone[data-zone="'+key+'"] .tl-track');
      var items = SUGGESTIONS.filter(function(s){ return s.status === key; });
      track.innerHTML = items.map(function(s){
        return '<div class="tl-marker" title="'+s.title+'"><span class="tl-diamond"></span><span class="tl-v">'+s.votes+'</span></div>';
      }).join('');
    });
  }

  document.getElementById('nav-quadro').addEventListener('click', function(){ showDetailPanel(); setActiveRail('nav-quadro'); });
  document.getElementById('nav-roadmap').addEventListener('click', function(){
    setActiveRail('nav-roadmap'); crumbEl.textContent = 'Roadmap';
    document.getElementById('roadmap-strip').scrollIntoView({behavior:'smooth', block:'center'});
  });
  document.getElementById('nav-nova').addEventListener('click', function(){ showComposerPanel(); setActiveRail('nav-nova'); });
  document.getElementById('nav-perfil').addEventListener('click', function(){ showImpactPanel(); setActiveRail('nav-perfil'); });

  document.querySelectorAll('.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

  renderGrid();
  renderTimelineStrip();
  showDetailPanel();
</script>
</body>
</html>
